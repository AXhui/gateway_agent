<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    color-scheme: dark;
    --bg:#1e1e1e; --card:#2c2c2c; --card2:#333; --line:#3d3d3d;
    --acc:#2196f3; --acc-dim:#1769aa; --txt:#fff; --sub:#b3b3b3; --dim:#8a8a8a;
    --ok:#4caf50; --err:#ef5350; --warn:#ffb74d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:12px/1.6 -apple-system,"Helvetica Neue","PingFang SC",sans-serif;color:var(--txt);background:var(--bg)}

  /* 顶部进度条：busy 时显示 */
  #busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9;display:none;
    background:linear-gradient(90deg,transparent,var(--acc),transparent);
    background-size:200% 100%;animation:sweep 1.1s linear infinite}
  body.busy #busybar{display:block}
  @keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}

  header{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
  .logo{width:28px;height:28px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2196f3,#21cbf3 60%,#4caf50);color:#fff}
  header .ht{flex:1;min-width:0}
  header .ht b{display:block;font-size:13px;line-height:1.35}
  header .ht span{font-size:10.5px;color:var(--dim)}

  .wrap{padding:2px 16px 8px}

  .sec{display:flex;align-items:center;gap:7px;margin:15px 0 7px;
    font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--sub);text-transform:uppercase}
  .sec .n{width:15px;height:15px;flex:none;border-radius:50%;background:var(--acc);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
  .sec .hint{font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec button{flex:none}

  .row{display:flex;gap:7px;margin:0 0 8px}
  .row>*{margin:0;width:auto}
  select,input[type=text]{flex:1;min-width:0;padding:8px 10px;font-size:11.5px;
    border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--txt);outline:none}
  select:focus,input[type=text]:focus{border-color:var(--acc)}
  input::placeholder,textarea::placeholder{color:var(--dim)}

  /* 链接框（textarea 形态，可多行批量）：视觉与单行输入一致，自动长高 */
  #urlIn{flex:1;min-width:0;padding:8px 10px;font:11.5px/1.4 inherit;
    border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--txt);outline:none;
    resize:none;height:34px;min-height:34px;max-height:96px;overflow-y:auto}
  #urlIn:focus{border-color:var(--acc)}
  .vpchk{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);cursor:pointer;user-select:none}
  .vpchk input{accent-color:var(--acc);margin:0}

  /* 历史一键重导（clientStorage 持久化） */
  .hlist{display:flex;flex-direction:column;gap:4px;margin:6px 0 4px}
  .hbtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:500;color:var(--sub)}
  .hbtn:hover:not(:disabled){background:var(--card);border-color:var(--acc);color:var(--txt)}
  .hbtn .hv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbtn .ht2{flex:none;color:var(--dim);font-size:9.5px;font-weight:400}

  button{border:0;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;
    padding:8px 12px;background:var(--card2);color:var(--sub)}
  button:hover:not(:disabled){background:#3a3a3a;color:var(--txt)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ico{padding:8px;display:inline-flex;align-items:center;justify-content:center}
  button.link{background:none;padding:2px 4px;font-size:10.5px;font-weight:500;color:var(--acc)}
  button.link:hover:not(:disabled){background:none;color:#64b5f6}
  button.primary{display:block;width:100%;margin:12px 0 8px;padding:11px 0;
    background:var(--acc);color:#fff;font-size:12.5px}
  button.primary:hover:not(:disabled){background:#1976d2;color:#fff}
  button.mini{white-space:nowrap;background:var(--acc-dim);color:#fff}
  button.mini:hover:not(:disabled){background:var(--acc)}

  .dropbox{margin:2px 0 0;padding:14px 10px;border:1.5px dashed var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:11.5px;
    transition:border-color .15s,background .15s,color .15s}
  .dropbox b{color:var(--sub);font-weight:600}
  .dropbox.on{border-color:var(--acc);background:rgba(33,150,243,.1);color:var(--acc)}
  .dropbox.on b{color:var(--acc)}

  .card{margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
  .crow{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:11px;border-bottom:1px solid #333}
  .crow:last-child{border-bottom:0}
  .crow svg{flex:none;color:var(--dim)}
  .crow .k{color:var(--dim);flex:none;width:52px}
  .crow .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.warn{background:var(--warn)}

  #st{min-height:34px;margin:2px 0 4px;color:var(--sub);font-size:11px;word-break:break-all;line-height:1.5}
  #st.err{color:var(--err)} #st.ok{color:#81c784}

  details{margin:4px 0 0}
  summary{font-size:11px;color:var(--dim);cursor:pointer;padding:4px 0;user-select:none}
  summary:hover{color:var(--sub)}
  details .dgrid{display:flex;flex-direction:column;gap:7px;margin:6px 0 4px}
  textarea{width:100%;height:60px;font-size:10px;font-family:ui-monospace,Menlo,monospace;
    border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--card2);color:var(--txt);outline:none}

  footer{margin-top:10px;padding:9px 16px 11px;border-top:1px solid var(--line);
    font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="busybar"></div>

<header>
  <div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c6-3.5 10-3.5 16 0"/><path d="M12 3.5V14"/><path d="M8.5 11L12 14.5 15.5 11"/><rect x="4" y="17" width="16" height="4" rx="1"/></svg></div>
  <div class="ht"><b>HTML → Figma</b><span>Milesight 内部 · 原生可编辑图层</span></div>
</header>

<div class="wrap">

  <div class="sec"><span class="n">1</span>选择 HTML<span class="hint">列表 / 链接 / 拖入文件</span></div>
  <div class="row">
    <select id="htmlSel"></select>
    <button class="ico" id="listBtn" title="刷新 HTML 列表"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
  </div>
  <div class="row">
    <textarea id="urlIn" rows="1" placeholder="粘贴 http 链接（可多行/逗号分隔批量）或本地绝对路径" spellcheck="false"></textarea>
    <button id="urlBtn" class="mini">导入链接</button>
  </div>
  <div class="row" style="margin-top:-2px">
    <label class="vpchk"><input type="checkbox" id="vpChk">多视口 1440+390（链接导入出桌面+移动两帧）</label>
  </div>
  <div class="dropbox" id="dropbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <b>拖入 .html 文件</b><span>或</span><button id="browseBtn" class="link">浏览…</button>
    <input id="fileIn" type="file" accept=".html,.htm" hidden>
  </div>
  <details id="histWrap" style="display:none">
    <summary>最近导入（点击重导）</summary>
    <div class="hlist" id="histList"></div>
  </details>

  <div class="card">
    <div class="crow">
      <span class="dot" id="dotSrv"></span><span class="k">后台</span><span class="v" id="cardSrv">检测中…</span>
    </div>
    <div class="crow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13.5l9 5 9-5"/></svg>
      <span class="k">scene</span><span class="v" id="cardScene">未生成</span>
    </div>
    <div class="crow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      <span class="k">库</span><span class="v" id="cardLib">待生成 HTML</span>
    </div>
  </div>

  <button id="buildBtn" class="primary">生成 scene.json 并导入</button>
  <div id="st"></div>

  <details>
    <summary>高级：直接导入 / 粘贴 JSON</summary>
    <div class="dgrid">
      <button id="importBtn">导入当前 scene.json</button>
      <textarea id="ta" placeholder="或把 scene.json 内容粘贴到这里"></textarea>
      <button id="pasteBtn">导入粘贴的 JSON</button>
    </div>
  </details>

</div>

<footer><span>Milesight 内部工具</span><span>127.0.0.1:8124</span></footer>

<script>
var scene = null;     // 待导入 scene.json
var needLibs = [];    // scene.libs：本页命中的库需求
var libsUnavailable = false;
var libRefreshTimer = null;
var avail = [];       // getAvailableLibrariesAsync 结果 {id,name,enabled}（仅状态展示，不设门禁）
var busy = false;     // 构建进行中（三个入口互斥，一次只跑一个）
var serverOk = null;  // 后台连通性：null 未知 / true / false
var hist = [];        // 导入历史（PRO 一键重导）：clientStorage 持久化，code.js 代理读写

function $(id){return document.getElementById(id);}
function status(m, cls){
  var el = $('st');
  el.textContent = m;
  el.className = cls || '';
}
function nn(s){return String(s||'').toLowerCase().replace(/[\s（）()_-]+/g,'');}
function send(json){
  parent.postMessage({pluginMessage:{type:'scene', json:json}},'*');
}
window.onmessage = function(e){
  var m = e.data && e.data.pluginMessage;
  if (m && m.type === 'status') status(m.text);
  if (m && m.type === 'history') { hist = Array.isArray(m.list) ? m.list : []; renderHist(); }
  if (m && m.type === 'libs') {
    clearTimeout(libRefreshTimer);
    libsUnavailable = !!m.unavailable;
    avail = m.list || [];
    updateGate(); renderCard();
  }
};

// 状态摘要卡
function renderCard(){
  var dot = $('dotSrv');
  if (serverOk === null){ dot.className = 'dot'; $('cardSrv').textContent = '检测中…'; }
  else if (serverOk){ dot.className = 'dot ok'; $('cardSrv').textContent = '已连接 · 127.0.0.1:8124'; }
  else { dot.className = 'dot err'; $('cardSrv').textContent = '未连接——终端跑 python3 serve.py（构建时也会自动拉起）'; }

  if (scene && scene.cells){
    var nm = scene.name ? scene.name + ' · ' : '';
    $('cardScene').textContent = nm + scene.cells.length + ' 屏';
  } else $('cardScene').textContent = '未生成';

  if (libsUnavailable){
    $('cardLib').textContent = '自动匹配 · 按 key 直载（失败自动回退重绘）';
  } else if (!needLibs.length){
    $('cardLib').textContent = scene ? '本页无库需求' : '待生成 HTML';
  } else {
    var on = needLibs.filter(function(n){ var m = matchLib(n); return m && m.enabled; }).length;
    $('cardLib').textContent = '需求 ' + needLibs.length + ' 库 · ' + on + ' 已启用' +
      (on < needLibs.length ? '（其余按 key 直载）' : ' ✓');
  }
}

// 库匹配：id（libraryKey）相等或名称互相包含（含未启用的库，用于状态展示）
function matchLib(need){
  for (var i=0;i<avail.length;i++){
    var a = avail[i];
    if (need.key && a.id === need.key) return a;
    if (nn(a.name).indexOf(nn(need.name))>=0 || nn(need.name).indexOf(nn(a.name))>=0) return a;
  }
  return null;
}

function updateGate(){
  $('buildBtn').disabled = busy || !$('htmlSel').value;
  $('importBtn').disabled = busy;
  $('urlBtn').disabled = busy;
  $('listBtn').disabled = busy;
  $('browseBtn').disabled = busy;
  document.body.classList.toggle('busy', !!busy);
}

function adoptScene(j){
  scene = j;
  needLibs = Array.isArray(scene.libs) ? scene.libs : [];
  updateGate(); renderCard();
}

async function fetchScene(autoImport){
  var r = await fetch('http://127.0.0.1:8124/scene.json', {cache:'no-store'});
  var j = await r.json();
  if (!j || !j.cells) { status('scene.json 无效或不存在——先生成一次', 'err'); return; }
  adoptScene(j);
  if (autoImport){ status('生成完成：' + scene.cells.length + ' 屏，库组件自动匹配导入中…', 'ok'); send(scene); }
  else status('scene.json 就绪：' + scene.cells.length + ' 屏，点「导入当前 scene.json」', 'ok');
}

async function loadList(){
  try{
    var r = await fetch('http://127.0.0.1:8124/api/list');
    var j = await r.json();
    serverOk = true;
    var sel = $('htmlSel');
    sel.innerHTML = '';
    (j.htmls || []).forEach(function(h){
      var o = document.createElement('option');
      var d = new Date(h.mtime*1000);
      var pad = function(x){return (x<10?'0':'')+x;};
      o.value = h.path;
      o.textContent = pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+' · '+h.rel;
      sel.appendChild(o);
    });
    if (!(j.htmls||[]).length) status('没扫到 HTML——确认 05_release / output / 桌面有 demo，或先跑 python3 serve.py', 'err');
    updateGate();
  }catch(e){
    serverOk = false;
    status('后台未连接：' + e.message + ' —— 终端跑 python3 serve.py（或先用「高级 → 导入粘贴的 JSON」）', 'err');
  }
  renderCard();
}

$('listBtn').onclick = function(){ loadList(); };

// 统一构建入口：payload = {path} | {name, content} | {url} | {urls:[...]}（可选 {viewports}），serve.py 四分支
async function runBuild(payload, label){
  if (busy) return;
  busy = true; updateGate();
  status(label + '（无头 Chrome 渲染，约 10–60s）…');
  try{
    var r = await fetch('http://127.0.0.1:8124/api/build', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    serverOk = true;
    var j = await r.json();
    if (!j.ok){
      status('生成失败：' + ((j.error||'') + ' ' + (j.log||[]).join(' ⏎ ')).slice(0,280), 'err');
      return;
    }
    pushHist(payload);
    await fetchScene(true);
  }catch(e){
    serverOk = false;
    status('生成失败：' + e.message + ' —— 确认 serve.py 已跑（新版本含 /api/build）', 'err');
  }finally{ busy = false; updateGate(); renderCard(); }
}

$('buildBtn').onclick = function(){
  var p = $('htmlSel').value;
  if (!p){ status('先选择一个 HTML', 'err'); return; }
  runBuild({path:p}, '生成 scene.json 中');
};

// 拖拽导入：面板全域为放置区，.html 落地即上传内容走 build
document.addEventListener('dragover', function(e){ e.preventDefault(); $('dropbox').classList.add('on'); });
document.addEventListener('dragleave', function(){ $('dropbox').classList.remove('on'); });
document.addEventListener('drop', function(e){
  e.preventDefault();
  $('dropbox').classList.remove('on');
  var fs = e.dataTransfer && e.dataTransfer.files;
  if (!fs || !fs.length) return;
  var f = null;
  for (var i=0;i<fs.length;i++){ if (/\.html?$/i.test(fs[i].name)){ f = fs[i]; break; } }
  if (!f){ status('只接受 .html 文件（收到 ' + fs[0].name + '）', 'err'); return; }
  importFile(f);
});

// 浏览按钮（拖放的等价入口）
$('browseBtn').onclick = function(){ if (!busy) $('fileIn').click(); };
$('fileIn').onchange = function(){
  var f = this.files && this.files[0];
  if (f) importFile(f);
  this.value = '';
};
function importFile(f){
  f.text().then(function(txt){
    runBuild({name:f.name, content:txt}, '导入 ' + f.name);
  }, function(err){ status('文件读取失败：' + err.message, 'err'); });
}

// 链接导入：http(s) 由 serve.py 下载后构建；本地绝对路径仍走白名单。
// 多个 http(s)（空格/逗号/换行分隔）→ {urls} 批量导入（PRO bulk imports）；勾选多视口 → {viewports}
function importLink(){
  var v = ($('urlIn').value || '').trim();
  if (!v){ status('先粘贴链接或路径', 'err'); return; }
  var parts = v.split(/[\s,]+/).filter(Boolean);
  var vp = $('vpChk').checked ? '1440,390' : '';
  if (parts.length > 20){ status('批量上限 20 个链接', 'err'); return; }
  if (parts.length > 1){
    if (!parts.every(function(x){ return /^https?:\/\//i.test(x); })){
      status('批量导入仅支持多个 http(s) 链接（空格/逗号/换行分隔）', 'err'); return;
    }
    var plm = {urls:parts}; if (vp) plm.viewports = vp;
    runBuild(plm, '批量抓取 ' + parts.length + ' 个链接');
    return;
  }
  if (/^https?:\/\//i.test(v)){
    var pl = {url:v}; if (vp) pl.viewports = vp;
    runBuild(pl, '抓取链接并生成 scene.json');
  }
  else if (v.charAt(0) === '/') runBuild({path:v}, '按路径生成 scene.json');
  else status('只支持 http(s) 链接或以 / 开头的本地绝对路径', 'err');
}
$('urlBtn').onclick = importLink;
// 链接框（textarea）：Enter 触发导入（Shift+Enter 换行可贴多行），输入自动长高
$('urlIn').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); importLink(); } });
$('urlIn').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(96, this.scrollHeight) + 'px';
});

// ===== 导入历史一键重导（PRO shortcut to re-import）：clientStorage 持久化，code.js 代理 =====
function hostOf(u){ try{ return new URL(u).host + new URL(u).pathname; }catch(e){ return u; } }
function histLabel(pl){
  if (pl.urls) return pl.urls.length + ' 个链接 · ' + hostOf(pl.urls[0]) + (pl.urls.length > 1 ? ' …' : '');
  if (pl.url) return hostOf(pl.url);
  if (pl.path){ var s = String(pl.path).split('/'); return s[s.length - 1]; }
  return '';
}
function saveHist(){ parent.postMessage({pluginMessage:{type:'history-save', list:hist}}, '*'); }
function pushHist(pl){
  if (!pl || (!pl.path && !pl.url && !pl.urls)) return; // 拖拽全文无持久负载，不进历史
  var key = JSON.stringify(pl);
  hist = hist.filter(function(h){ return JSON.stringify(h.payload) !== key; });
  var d = new Date(), pad = function(x){ return (x < 10 ? '0' : '') + x; };
  hist.unshift({payload:pl, label:histLabel(pl), time:pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())});
  if (hist.length > 12) hist.length = 12;
  saveHist(); renderHist();
}
function renderHist(){
  var w = $('histWrap'), list = $('histList');
  if (!hist.length){ w.style.display = 'none'; return; }
  w.style.display = '';
  list.innerHTML = '';
  hist.forEach(function(h){
    var b = document.createElement('button');
    b.className = 'hbtn';
    var hv = document.createElement('span'); hv.className = 'hv';
    var ht2 = document.createElement('span'); ht2.className = 'ht2';
    hv.textContent = h.label || '';
    ht2.textContent = h.time || '';
    b.appendChild(hv); b.appendChild(ht2);
    b.onclick = function(){ if (!busy) runBuild(h.payload, '重导 ' + (h.label || '')); };
    list.appendChild(b);
  });
  var clr = document.createElement('button');
  clr.className = 'link'; clr.textContent = '清空历史';
  clr.onclick = function(){ hist = []; saveHist(); renderHist(); };
  list.appendChild(clr);
}
parent.postMessage({pluginMessage:{type:'history-get'}}, '*');

// 粘贴捕获：焦点不在输入框时，粘进面板的纯链接（单个或多个）自动填入链接框
document.addEventListener('paste', function(e){
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  var d = ((e.clipboardData && e.clipboardData.getData('text')) || '').trim();
  var parts = d.split(/[\s,]+/).filter(Boolean);
  if (parts.length && parts.length <= 20 && parts.every(function(x){ return /^https?:\/\//i.test(x); })){
    $('urlIn').value = parts.join('\n');
    $('urlIn').dispatchEvent(new Event('input'));
    status(parts.length > 1 ? '已粘贴 ' + parts.length + ' 个链接 → 点「导入链接」批量导入' : '链接已粘贴 → 点「导入链接」或回车');
  }
});

$('importBtn').onclick = async function(){
  if (scene){ send(scene); return; }
  status('拉取本地 scene.json…');
  await fetchScene(false);
  if (scene) send(scene);
};

$('pasteBtn').onclick = function(){
  try{
    var j = JSON.parse($('ta').value);
    if (!j.cells){ status('JSON 无 cells，不是 scene.json', 'err'); return; }
    adoptScene(j); send(scene);
  }catch(e){ status('JSON 解析失败：' + e.message, 'err'); }
};

renderCard();
loadList();
// 库状态静默刷新：只喂下方状态卡「库」一行，面板不再设独立组件库区块
clearTimeout(libRefreshTimer);
parent.postMessage({pluginMessage:{type:'refresh-libs'}},'*');
</script>
</body>
</html>
