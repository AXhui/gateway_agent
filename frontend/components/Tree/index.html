<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Tree 树形控件 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, Fragment } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const collect = (n, acc=[]) => { acc.push(n.key); n.children?.forEach(c => collect(c, acc)); return acc; };

const Chevron = ({ open }) => h('svg', { width:10, height:10, viewBox:'0 0 24 24',
  fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round',
  style:{ transform:`rotate(${open?90:0}deg)`, transition:'transform var(--duration-fast)' },
  'aria-hidden':true }, h('path', { d:'M9 6l6 6-6 6' }));

const Checkbox = ({ checked, indeterminate, disabled, onChange }) => h('span', {
  onClick: e => { e.stopPropagation(); if (!disabled) onChange(); },
  style:{
    display:'inline-flex', alignItems:'center', justifyContent:'center',
    width:16, height:16,
    border:`1px solid ${checked || indeterminate ? 'var(--color-primary-normal)' : 'var(--color-border-base)'}`,
    borderRadius:2,
    background: checked || indeterminate ? 'var(--color-primary-normal)' : 'var(--color-bg-card)',
    cursor: disabled ? 'not-allowed' : 'pointer',
    opacity: disabled ? 0.5 : 1, flexShrink:0,
  }
},
  checked && !indeterminate && h('svg', { width:10, height:10, viewBox:'0 0 24 24',
    fill:'none', stroke:'white', strokeWidth:3, strokeLinecap:'round', strokeLinejoin:'round' },
    h('path', { d:'M5 12l5 5L20 7' })),
  indeterminate && h('span', { style:{ width:8, height:2, background:'white', borderRadius:1 } })
);

const Tree = ({ treeData, expandedKeys, defaultExpandedKeys=[], checkable,
  checkedKeys, defaultCheckedKeys=[], selectable=true,
  selectedKeys, defaultSelectedKeys=[],
  onExpand, onCheck, onSelect, style, className }) => {
  const [expInner, setExpInner] = useState(defaultExpandedKeys);
  const [chkInner, setChkInner] = useState(defaultCheckedKeys);
  const [selInner, setSelInner] = useState(defaultSelectedKeys);
  const exp = expandedKeys ?? expInner;
  const chk = checkedKeys ?? chkInner;
  const sel = selectedKeys ?? selInner;
  const setExp = ks => { if (!expandedKeys) setExpInner(ks); onExpand?.(ks); };
  const setChk = ks => { if (!checkedKeys) setChkInner(ks); onCheck?.(ks); };
  const setSel = ks => { if (!selectedKeys) setSelInner(ks); onSelect?.(ks); };
  const toggleExpand = k => setExp(exp.includes(k) ? exp.filter(x => x !== k) : [...exp, k]);
  const isIndeterminate = n => {
    if (!n.children?.length) return false;
    const keys = collect(n).slice(1);
    const c = keys.filter(k => chk.includes(k)).length;
    return c > 0 && c < keys.length;
  };
  const toggleCheck = n => {
    const keys = collect(n);
    const allChecked = keys.every(k => chk.includes(k));
    setChk(allChecked ? chk.filter(k => !keys.includes(k)) : [...new Set([...chk, ...keys])]);
  };

  const renderNode = (n, depth) => {
    const hasChildren = !!n.children?.length;
    const open = exp.includes(n.key);
    const selected = sel.includes(n.key);
    const checked = chk.includes(n.key);
    const indeterminate = isIndeterminate(n);
    return h(Fragment, { key:n.key },
      h('div', {
        onClick: () => selectable && !n.disabled && setSel([n.key]),
        style:{
          display:'flex', alignItems:'center', gap:6,
          padding:'4px 8px',
          cursor: selectable && !n.disabled ? 'pointer' : 'default',
          background: selected ? 'rgba(16,129,62,0.08)' : 'transparent',
          borderRadius:'var(--radius-4)',
          color: n.disabled ? 'var(--color-text-disable)' : 'var(--color-text-primary)',
          font:'400 14px/22px var(--font-sans)',
          paddingLeft: 8 + depth * 24,
        }
      },
        h('span', {
          onClick: e => { e.stopPropagation(); hasChildren && toggleExpand(n.key); },
          style:{
            display:'inline-flex', width:14, height:14,
            justifyContent:'center', alignItems:'center',
            color:'var(--color-text-auxiliary)',
            cursor: hasChildren ? 'pointer' : 'default',
            visibility: hasChildren ? 'visible' : 'hidden',
          }
        }, h(Chevron, { open })),
        checkable && h(Checkbox, { checked, indeterminate,
          disabled: n.disabled, onChange: () => toggleCheck(n) }),
        n.icon && h('span', { style:{ display:'inline-flex', color:'var(--color-text-auxiliary)' } }, n.icon),
        h('span', { style:{ flex:1, minWidth:0 } }, n.title)
      ),
      hasChildren && open && n.children.map(c => renderNode(c, depth + 1))
    );
  };

  return h('div', { className, style }, treeData.map(n => renderNode(n, 0)));
};

const Folder = () => h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true },
  h('path', { d:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z' }));

const treeData = [
  { key:'cn', title:'中国', icon:h(Folder), children:[
    { key:'east', title:'华东', children:[
      { key:'sh', title:'上海 · 可用区 A' },
      { key:'sh2', title:'上海 · 可用区 B' },
      { key:'hz', title:'杭州 · 可用区 A' },
    ] },
    { key:'north', title:'华北', children:[
      { key:'bj', title:'北京 · 可用区 A' },
      { key:'bj2', title:'北京 · 可用区 B', disabled:true },
    ] },
  ] },
  { key:'asia', title:'亚太', icon:h(Folder), children:[
    { key:'sg', title:'新加坡 · 可用区 A' },
    { key:'hk', title:'香港 · 可用区 A' },
  ] },
];

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-12)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Tree 树形控件'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' }, h(Tree, { treeData, defaultExpandedKeys:['cn'] })),
      h(Group, { title:'可勾选 — checkable' }, h(Tree, { treeData,
        defaultExpandedKeys:['cn','east','asia'], checkable:true }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
