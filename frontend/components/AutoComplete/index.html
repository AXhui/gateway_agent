<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AutoComplete 自动完成 — Milesight IOT Web v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;
const { useState, useRef, useEffect, useMemo } = React;

function AutoComplete({ options=[], value: vProp, defaultValue='', placeholder, disabled=false, filterOption, onChange, onSelect }) {
  const [internal, setInternal] = useState(defaultValue);
  const value = vProp !== undefined ? vProp : internal;
  const [open, setOpen] = useState(false);
  const [hover, setHover] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const defaultFilter = (input, opt) => opt.value.toLowerCase().includes(input.toLowerCase());
  const fn = filterOption || defaultFilter;
  const filtered = value ? options.filter(o => fn(value, o)) : options;

  const update = (next) => {
    if (vProp === undefined) setInternal(next);
    onChange && onChange(next);
  };

  return h('div', {
    ref, style:{ position:'relative', width:240 }
  },
    h('input', {
      value, disabled, placeholder,
      onChange: e => { update(e.target.value); setOpen(true); },
      onFocus: () => setOpen(true),
      onMouseEnter: () => setHover(true),
      onMouseLeave: () => setHover(false),
      style:{
        width:'100%', height:32, padding:'0 12px',
        border:`1px solid ${(hover || open) ? 'var(--color-primary-normal)' : 'var(--color-border-base)'}`,
        borderRadius:'var(--radius-4)',
        font:'400 14px/1.5 var(--font-sans)',
        color:'var(--color-text-primary)',
        background: disabled ? 'var(--color-bg-hover)' : 'var(--color-bg-card)',
        outline:'none', transition:'border-color 160ms',
      }
    }),
    open && filtered.length > 0 && h('div', {
      style:{
        position:'absolute', top:'100%', left:0, right:0, marginTop:4,
        background:'var(--color-bg-card)',
        border:'1px solid var(--color-divider-base-1)',
        borderRadius:'var(--radius-4)',
        boxShadow:'var(--shadow-2)',
        maxHeight:220, overflowY:'auto', zIndex:1000,
      }
    },
      filtered.map(opt => h('div', {
        key: opt.value,
        onClick: () => { update(opt.value); onSelect && onSelect(opt.value); setOpen(false); },
        style:{ padding:'6px 12px', cursor:'pointer',
          font:'400 14px/1.5 var(--font-sans)', color:'var(--color-text-primary)' },
        onMouseEnter: e => e.currentTarget.style.background = 'var(--color-bg-page)',
        onMouseLeave: e => e.currentTarget.style.background = 'transparent',
      }, opt.label || opt.value))
    )
  );
}

const Group = ({ title, children }) =>
  h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
    h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
    h('div', {
      style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
        border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' }
    }, children)
  );

const REGIONS = [
  { value:'cn-hangzhou', label:'华东 1 (杭州)' },
  { value:'cn-shanghai', label:'华东 2 (上海)' },
  { value:'cn-beijing', label:'华北 2 (北京)' },
  { value:'cn-shenzhen', label:'华南 1 (深圳)' },
  { value:'cn-chengdu', label:'西南 1 (成都)' },
  { value:'ap-singapore', label:'亚太东南 1 (新加坡)' },
];
const DOMAINS = ['@uink.com','@gmail.com','@qq.com','@163.com','@outlook.com'];

function App() {
  const [email, setEmail] = useState('');
  const emailOptions = useMemo(() => {
    const at = email.indexOf('@');
    const prefix = at >= 0 ? email.slice(0, at) : email;
    if (!prefix) return [];
    return DOMAINS.map(d => ({ value: prefix + d }));
  }, [email]);

  return h('div', { style:{ minHeight:'100vh', background:'var(--color-bg-page)' } },
    h('header', {
      style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)',
        padding:'var(--spacing-20) var(--spacing-24)',
        display:'flex', alignItems:'center', justifyContent:'space-between' }
    },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'AutoComplete 自动完成'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', {
      style:{ maxWidth:720, margin:'0 auto',
        padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
        display:'flex', flexDirection:'column', gap:'var(--spacing-30)' }
    },
      h(Group, { title:'基础（区域选择）' },
        h(AutoComplete, { options:REGIONS, placeholder:'输入区域名称...' })
      ),
      h(Group, { title:'邮箱自动补全' },
        h(AutoComplete, {
          options: emailOptions, value: email, onChange: setEmail,
          placeholder:'输入邮箱', filterOption: () => true,
        })
      ),
      h(Group, { title:'禁用' },
        h(AutoComplete, { options:REGIONS, defaultValue:'cn-hangzhou', disabled:true })
      )
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
