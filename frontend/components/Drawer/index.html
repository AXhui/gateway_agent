<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Drawer 抽屉 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button,input,textarea{font-family:inherit}
@keyframes uink-fade { from { opacity:0 } to { opacity:1 } }
@keyframes uink-drawer-r { from { transform: translateX(100%) } to { transform: none } }
@keyframes uink-drawer-l { from { transform: translateX(-100%) } to { transform: none } }
@keyframes uink-drawer-t { from { transform: translateY(-100%) } to { transform: none } }
@keyframes uink-drawer-b { from { transform: translateY(100%) } to { transform: none } }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useEffect, Fragment } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const panelStyle = (p, size) => {
  const horizontal = p === 'left' || p === 'right';
  const dim = horizontal ? { width:size, height:'100%' } : { width:'100%', height:size };
  const pos = p === 'right' ? { top:0, right:0 } : p === 'left' ? { top:0, left:0 }
    : p === 'top' ? { top:0, left:0 } : { bottom:0, left:0 };
  const anim = p === 'right' ? 'uink-drawer-r 240ms cubic-bezier(0.2,0,0,1)'
    : p === 'left' ? 'uink-drawer-l 240ms cubic-bezier(0.2,0,0,1)'
    : p === 'top' ? 'uink-drawer-t 240ms cubic-bezier(0.2,0,0,1)'
    : 'uink-drawer-b 240ms cubic-bezier(0.2,0,0,1)';
  return { position:'absolute', ...pos, ...dim, animation:anim };
};

const Drawer = ({ open, title, placement='right', size=480,
  closable=true, maskClosable=true, footer, extra, onClose, children }) => {
  useEffect(() => {
    if (!open) return;
    const h = e => { if (e.key === 'Escape') onClose?.(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [open, onClose]);
  if (!open) return null;
  return h('div', { role:'dialog', 'aria-modal':true, style:{
    position:'fixed', inset:0, zIndex:1400, background:'rgba(11,18,32,0.45)',
    animation:'uink-fade 200ms ease-out'
  }, onClick:() => maskClosable && onClose?.() },
    h('div', { onClick:e => e.stopPropagation(), style:{
      background:'var(--color-bg-card)', display:'flex', flexDirection:'column',
      boxShadow:'0 8px 32px rgba(11,18,32,0.16)',
      ...panelStyle(placement, size)
    } },
      (title || closable) && h('div', { style:{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'16px 24px', borderBottom:'1px solid var(--color-divider-base-1)'
      } },
        h('div', { style:{ font:'500 16px/1.5 var(--font-sans)', color:'var(--color-text-primary)' } }, title),
        h('div', { style:{ display:'inline-flex', alignItems:'center', gap:12 } },
          extra,
          closable && h('span', { onClick:onClose, style:{ cursor:'pointer',
            color:'var(--color-text-auxiliary)', display:'inline-flex', padding:4 } },
            h('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none',
              stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round' },
              h('path', { d:'M6 6l12 12M18 6L6 18' }))))
      ),
      h('div', { style:{ flex:1, padding:'20px 24px', overflow:'auto' } }, children),
      footer && h('div', { style:{ padding:'12px 24px',
        borderTop:'1px solid var(--color-divider-base-1)',
        display:'flex', justifyContent:'flex-end', gap:8 } }, footer)
    )
  );
};

const Btn = ({ onClick, children, primary }) => h('button', { onClick, style:{
  height:32, padding:'0 16px',
  border:`1px solid ${primary ? 'var(--color-primary-normal)' : 'var(--color-border-base)'}`,
  background: primary ? 'var(--color-primary-normal)' : 'var(--color-bg-card)',
  color: primary ? 'var(--color-text-constant-normal)' : 'var(--color-text-primary)',
  borderRadius:'var(--radius-4)', cursor:'pointer'
} }, children);

function App() {
  const [open, setOpen] = useState(null);
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Drawer 抽屉'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', gap:12, flexWrap:'wrap' } },
      h(Btn, { onClick:() => setOpen('right') }, '右侧打开'),
      h(Btn, { onClick:() => setOpen('left') }, '左侧打开'),
      h(Btn, { onClick:() => setOpen('top') }, '顶部打开'),
      h(Btn, { onClick:() => setOpen('bottom') }, '底部打开'),
      h(Btn, { onClick:() => setOpen('form') }, '编辑表单（带 footer）'),
      h(Drawer, { open: open==='right', placement:'right', title:'实例详情', onClose:() => setOpen(null) },
        h('p', null, '实例 ID：i-bp1234abcd'),
        h('p', null, '规格：4 vCPU / 8 GB'),
        h('p', null, '区域：华东 1（杭州）· 可用区 B')),
      h(Drawer, { open: open==='left', placement:'left', title:'左侧抽屉', onClose:() => setOpen(null) }, '左侧滑入。'),
      h(Drawer, { open: open==='top', placement:'top', size:260, title:'顶部抽屉', onClose:() => setOpen(null) }, '顶部下拉。'),
      h(Drawer, { open: open==='bottom', placement:'bottom', size:260, title:'底部抽屉', onClose:() => setOpen(null) }, '底部上滑。'),
      h(Drawer, { open: open==='form', placement:'right', title:'编辑实例', onClose:() => setOpen(null),
        footer: h(Fragment, null,
          h(Btn, { onClick:() => setOpen(null) }, '取消'),
          h(Btn, { primary:true, onClick:() => setOpen(null) }, '保存')
        ) },
        h('p', null, '名称：',
          h('input', { defaultValue:'prod-web-01', style:{ marginLeft:8, height:28, padding:'0 8px',
            border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)' } })),
        h('p', null, '描述：',
          h('textarea', { style:{ marginTop:8, width:'100%', minHeight:80, padding:8,
            border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)' } })))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
