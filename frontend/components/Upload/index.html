<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const formatSize = n => {
  if (n === undefined) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/1024/1024).toFixed(1)} MB`;
};

const UploadIcon = ({ size=24 }) => h('svg', { width:size, height:size, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true },
  h('path', { d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12' }));

const Upload = ({ variant='button', accept, multiple, disabled,
  fileList, defaultFileList, onChange, children }) => {
  const [inner, setInner] = useState(defaultFileList ?? []);
  const isControlled = fileList !== undefined;
  const list = isControlled ? fileList : inner;
  const inputRef = useRef(null);
  const [hover, setHover] = useState(false);

  const update = next => { if (!isControlled) setInner(next); onChange?.(next); };

  const handleFiles = files => {
    const items = Array.from(files).map(file => ({
      uid: String(Date.now()) + '-' + Math.random().toString(36).slice(2,8),
      name: file.name, size: file.size, status: 'uploading', progress: 0,
    }));
    const next = [...list, ...items];
    update(next);
    items.forEach(it => {
      setTimeout(() => {
        update(prev => {
          const cur = isControlled ? fileList : prev;
          return cur.map(x => x.uid === it.uid ? { ...x, status:'done', progress:100 } : x);
        });
      }, 600);
    });
    // Re-fetch fresh list to mark done since closure may stale
    setTimeout(() => {
      setInner(prev => prev.map(x => items.some(i => i.uid === x.uid) ? { ...x, status:'done', progress:100 } : x));
      onChange?.((isControlled ? fileList : list).map(x => items.some(i => i.uid === x.uid) ? { ...x, status:'done', progress:100 } : x));
    }, 600);
  };

  const onSelect = e => { if (e.target.files) handleFiles(e.target.files); e.target.value = ''; };
  const onDrop = e => {
    e.preventDefault(); setHover(false);
    if (disabled) return;
    if (e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  };
  const remove = uid => update(list.filter(x => x.uid !== uid));

  const trigger = h('input', {
    ref: inputRef, type:'file', accept, multiple, disabled,
    onChange: onSelect, style:{ display:'none' }
  });

  return h('div', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
    variant === 'drag'
      ? h('div', {
          onClick: () => !disabled && inputRef.current?.click(),
          onDragOver: e => { e.preventDefault(); !disabled && setHover(true); },
          onDragLeave: () => setHover(false),
          onDrop,
          style:{
            padding:'40px 20px',
            border:`1px dashed ${hover?'var(--color-primary-normal)':'var(--color-border-base)'}`,
            borderRadius:'var(--radius-8)',
            background: hover?'rgba(52,145,250,0.04)':'var(--color-bg-page)',
            color:'var(--color-text-secondary)',
            display:'flex', flexDirection:'column', alignItems:'center',
            gap:'var(--spacing-8)', cursor: disabled?'not-allowed':'pointer',
            opacity: disabled?0.5:1,
            transition:'all var(--duration-fast) var(--easing-standard)',
          }
        },
          h('span', { style:{ color:'var(--color-primary-normal)' } }, h(UploadIcon, { size:32 })),
          h('div', { style:{ font:'500 14px/22px var(--font-sans)' } }, '点击或拖拽文件到此区域上传'),
          h('div', { style:{ font:'400 12px/20px var(--font-sans)', color:'var(--color-text-auxiliary)' } }, '支持单个或批量文件'),
          trigger
        )
      : h('div', null,
          h('button', {
            type:'button', disabled,
            onClick: () => inputRef.current?.click(),
            style:{
              display:'inline-flex', alignItems:'center', gap:'var(--spacing-8)',
              height:32, padding:'0 var(--spacing-16)',
              background:'var(--color-bg-card)', color:'var(--color-text-primary)',
              border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
              cursor: disabled?'not-allowed':'pointer', opacity: disabled?0.5:1,
              font:'400 14px/1 var(--font-sans)',
            }
          }, h(UploadIcon, { size:16 }), h('span', null, children ?? '点击上传')),
          trigger
        ),
    list.length > 0 && h('div', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-4)' } },
      list.map(f => h('div', { key:f.uid, style:{
        display:'flex', alignItems:'center', gap:'var(--spacing-8)',
        padding:'6px 8px', background:'var(--color-bg-page)', borderRadius:'var(--radius-4)',
        font:'400 13px/20px var(--font-sans)',
      } },
        h('span', { style:{ color:'var(--color-text-auxiliary)', display:'inline-flex' } },
          h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
            stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round' },
            h('path', { d:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z' }),
            h('path', { d:'M14 2v6h6' }))),
        h('span', { style:{ flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
          color: f.status==='error'?'var(--color-error-normal)':'var(--color-text-primary)' } }, f.name),
        h('span', { style:{ color:'var(--color-text-auxiliary)', font:'400 12px/20px var(--font-sans)' } },
          f.status==='uploading' ? `${f.progress ?? 0}%` : formatSize(f.size)),
        h('span', { onClick: () => remove(f.uid),
          style:{ cursor:'pointer', color:'var(--color-text-auxiliary)', display:'inline-flex' },
          'aria-label':'remove' },
          h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
            stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
            h('path', { d:'M6 6l12 12M18 6L6 18' })))
      ))
    )
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Upload 上传'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'按钮上传' }, h(Upload, { multiple:true }, '选择文件')),
      h(Group, { title:'拖拽上传' }, h(Upload, { variant:'drag', multiple:true })),
      h(Group, { title:'禁用' }, h(Upload, { variant:'drag', disabled:true }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
