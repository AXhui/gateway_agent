<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Modal 对话框 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
@keyframes uink-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes uink-pop { from { opacity: 0; transform: translateY(-8px) scale(0.98) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useEffect, Fragment } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const ICONS = {
  info:    { color:'#1A66F2', path:'M12 8v5m0 3h.01M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  success: { color:'#3491fa', path:'M8 12.5l3 3 6-7M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  warning: { color:'#C77700', path:'M12 8v5m0 3h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.41 0Z' },
  error:   { color:'#f13535', path:'M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Zm-3-13 6 6m0-6-6 6' },
  confirm: { color:'#C77700', path:'M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3m0 4h.01M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
};

const Btn = ({ variant='default', danger, loading, onClick, children }) => {
  const primary = variant === 'primary';
  const bg = primary ? (danger ? 'var(--color-error-normal)' : 'var(--color-primary-normal)') : 'var(--color-bg-card)';
  const fg = primary ? 'var(--color-text-constant-normal)' : (danger ? 'var(--color-error-normal)' : 'var(--color-text-primary)');
  const bd = primary ? bg : (danger ? 'var(--color-error-normal)' : 'var(--color-border-base)');
  return h('button', { onClick, disabled: loading, style:{
    height:32, padding:'0 16px', background:bg, color:fg, border:`1px solid ${bd}`,
    borderRadius:'var(--radius-4)', cursor: loading ? 'wait' : 'pointer',
    font:'400 14px/1 var(--font-sans)', opacity: loading ? 0.7 : 1
  } }, loading ? '处理中...' : children);
};

const Modal = ({ open, title, type='default', width=480,
  okText='确定', cancelText='取消', okLoading, okDanger,
  closable=true, maskClosable=true, footer, onOk, onCancel, children }) => {
  useEffect(() => {
    if (!open) return;
    const h = e => { if (e.key === 'Escape') onCancel?.(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [open, onCancel]);
  if (!open) return null;
  const icon = type !== 'default' && ICONS[type];
  const defaultFooter = footer === null ? null : footer ?? h(Fragment, null,
    h(Btn, { onClick:onCancel }, cancelText),
    h(Btn, { variant:'primary', danger: okDanger || type === 'error', loading: okLoading, onClick:onOk }, okText)
  );
  return h('div', { role:'dialog', 'aria-modal':true,
    style:{ position:'fixed', inset:0, zIndex:1300, display:'flex',
      alignItems:'flex-start', justifyContent:'center',
      padding:'100px 16px', background:'rgba(11,18,32,0.45)',
      animation:'uink-fade 160ms ease-out' },
    onClick:() => maskClosable && onCancel?.() },
    h('div', { onClick:e => e.stopPropagation(), style:{
      width, maxWidth:'100%', background:'var(--color-bg-card)',
      borderRadius:'var(--radius-8)', boxShadow:'0 12px 32px rgba(11,18,32,0.16)',
      animation:'uink-pop 160ms cubic-bezier(0.2,0,0,1)',
      display:'flex', flexDirection:'column', overflow:'hidden'
    } },
      h('div', { style:{ padding:'20px 24px 12px', display:'flex',
        alignItems:'flex-start', gap:12 } },
        icon && h('svg', { width:22, height:22, viewBox:'0 0 24 24', fill:'none',
          stroke:icon.color, strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round',
          style:{ flexShrink:0, marginTop:2 } }, h('path', { d:icon.path })),
        h('div', { style:{ flex:1, minWidth:0 } },
          title && h('div', { style:{ font:'500 16px/1.5 var(--font-sans)', color:'var(--color-text-primary)' } }, title),
          h('div', { style:{ marginTop: title ? 8 : 0, color:'var(--color-text-secondary)',
            font:'400 14px/22px var(--font-sans)' } }, children)),
        closable && h('span', { onClick:onCancel, style:{ cursor:'pointer', color:'var(--color-text-auxiliary)',
          display:'inline-flex', padding:4, marginRight:-4 } },
          h('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
            strokeWidth:1.5, strokeLinecap:'round' }, h('path', { d:'M6 6l12 12M18 6L6 18' })))
      ),
      defaultFooter !== null && h('div', { style:{ padding:'12px 24px 20px',
        display:'flex', justifyContent:'flex-end', gap:8 } }, defaultFooter)
    )
  );
};

const PageBtn = ({ onClick, children }) => h('button', { onClick, style:{
  height:32, padding:'0 16px', border:'1px solid var(--color-border-base)',
  borderRadius:'var(--radius-4)', background:'var(--color-bg-card)', cursor:'pointer'
} }, children);

function App() {
  const [open, setOpen] = useState(null);
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Modal 对话框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', gap:12, flexWrap:'wrap' } },
      h(PageBtn, { onClick:() => setOpen('basic') }, '基础'),
      h(PageBtn, { onClick:() => setOpen('info') }, 'Info'),
      h(PageBtn, { onClick:() => setOpen('success') }, 'Success'),
      h(PageBtn, { onClick:() => setOpen('warning') }, 'Warning'),
      h(PageBtn, { onClick:() => setOpen('error') }, 'Error'),
      h(PageBtn, { onClick:() => setOpen('confirm') }, 'Confirm'),
      h(PageBtn, { onClick:() => setOpen('danger') }, 'Danger Confirm'),
      h(Modal, { open: open==='basic', title:'实例信息',
        onOk:() => setOpen(null), onCancel:() => setOpen(null) },
        '实例 ID：i-bp1234abcd', h('br'), '当前可用区：华东 1（杭州）· 可用区 B'),
      h(Modal, { open: open==='info', type:'info', title:'提示', footer:null, onCancel:() => setOpen(null) },
        '请先完成实名认证后再创建资源。'),
      h(Modal, { open: open==='success', type:'success', title:'操作成功',
        onOk:() => setOpen(null), onCancel:() => setOpen(null) }, '实例已成功创建并启动。'),
      h(Modal, { open: open==='warning', type:'warning', title:'注意',
        onOk:() => setOpen(null), onCancel:() => setOpen(null) }, '当前余额不足，可能影响后续计费。'),
      h(Modal, { open: open==='error', type:'error', title:'操作失败',
        onOk:() => setOpen(null), onCancel:() => setOpen(null) }, '网络异常，请稍后重试。'),
      h(Modal, { open: open==='confirm', type:'confirm', title:'确认释放？',
        onOk:() => setOpen(null), onCancel:() => setOpen(null) },
        '释放后实例数据将无法恢复，请谨慎操作。'),
      h(Modal, { open: open==='danger', type:'confirm', title:'确认删除？',
        okText:'删除', okDanger:true,
        onOk:() => setOpen(null), onCancel:() => setOpen(null) }, '此操作不可撤销。')
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
