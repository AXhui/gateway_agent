<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Popconfirm 气泡确认框 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef, useEffect, cloneElement } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const offset = 8;
const placementStyle = p => ({
  top: { bottom:`calc(100% + ${offset}px)`, left:'50%', transform:'translateX(-50%)' },
  topLeft: { bottom:`calc(100% + ${offset}px)`, left:0 },
  topRight: { bottom:`calc(100% + ${offset}px)`, right:0 },
  bottom: { top:`calc(100% + ${offset}px)`, left:'50%', transform:'translateX(-50%)' },
  bottomLeft: { top:`calc(100% + ${offset}px)`, left:0 },
  bottomRight: { top:`calc(100% + ${offset}px)`, right:0 },
}[p]);
const arrowStyle = p => {
  const base = { position:'absolute', width:10, height:10, background:'var(--color-bg-card)' };
  if (p.startsWith('top')) return { ...base, bottom:-5, left:'50%', transform:'translateX(-50%) rotate(45deg)' };
  return { ...base, top:-5, left:'50%', transform:'translateX(-50%) rotate(45deg)' };
};
const WarningIcon = () => h('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none',
  stroke:'#C77700', strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round',
  style:{ marginTop:2, flexShrink:0 } },
  h('path', { d:'M12 8v5m0 3h.01M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' }));

const Popconfirm = ({ title, description, placement='top',
  okText='确定', cancelText='取消', okType='primary', icon,
  onConfirm, onCancel, children }) => {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);
  const ok = () => { setOpen(false); onConfirm?.(); };
  const cancel = () => { setOpen(false); onCancel?.(); };
  const danger = okType === 'danger';
  return h('span', { ref:wrapRef, style:{ position:'relative', display:'inline-block' } },
    cloneElement(children, { onClick: () => setOpen(v => !v) }),
    open && h('span', { style:{
      position:'absolute', zIndex:1500, minWidth:220,
      background:'var(--color-bg-card)', borderRadius:'var(--radius-8)',
      boxShadow:'0 4px 16px rgba(11,18,32,0.12)', padding:'12px 16px',
      ...placementStyle(placement),
    } },
      h('span', { style: arrowStyle(placement) }),
      h('div', { style:{ display:'flex', alignItems:'flex-start', gap:8 } },
        icon ?? h(WarningIcon),
        h('div', { style:{ flex:1, minWidth:0 } },
          h('div', { style:{ font:'500 14px/22px var(--font-sans)', color:'var(--color-text-primary)' } }, title),
          description && h('div', { style:{ marginTop:4, color:'var(--color-text-secondary)',
            font:'400 13px/20px var(--font-sans)' } }, description))),
      h('div', { style:{ marginTop:8, display:'flex', justifyContent:'flex-end', gap:8 } },
        h('button', { onClick:cancel, style:{
          height:26, padding:'0 10px', font:'400 12px/1 var(--font-sans)',
          background:'var(--color-bg-card)', color:'var(--color-text-primary)',
          border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)', cursor:'pointer'
        } }, cancelText),
        h('button', { onClick:ok, style:{
          height:26, padding:'0 10px', font:'400 12px/1 var(--font-sans)',
          background: danger ? 'var(--color-error-normal)' : 'var(--color-primary-normal)',
          color:'var(--color-text-constant-normal)',
          border:`1px solid ${danger ? 'var(--color-error-normal)' : 'var(--color-primary-normal)'}`,
          borderRadius:'var(--radius-4)', cursor:'pointer'
        } }, okText))
    )
  );
};

const Btn = ({ children, danger }) => h('button', { style:{
  height:32, padding:'0 16px',
  border:`1px solid ${danger ? 'var(--color-error-normal)' : 'var(--color-border-base)'}`,
  color: danger ? 'var(--color-error-normal)' : 'var(--color-text-primary)',
  borderRadius:'var(--radius-4)', background:'var(--color-bg-card)', cursor:'pointer'
} }, children);

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-30)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', gap:'var(--spacing-20)', flexWrap:'wrap' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Popconfirm 气泡确认框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' },
        h(Popconfirm, { title:'确认释放该实例？' }, h(Btn, null, '释放')),
        h(Popconfirm, { title:'确认删除？', description:'此操作不可撤销',
          okType:'danger', okText:'删除' }, h(Btn, { danger:true }, '删除'))),
      h(Group, { title:'位置' },
        h(Popconfirm, { title:'topLeft', placement:'topLeft' }, h(Btn, null, 'topLeft')),
        h(Popconfirm, { title:'bottom', placement:'bottom' }, h(Btn, null, 'bottom')),
        h(Popconfirm, { title:'bottomRight', placement:'bottomRight' }, h(Btn, null, 'bottomRight')))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
