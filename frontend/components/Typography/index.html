<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Typography 排版 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const TYPE_COLOR = {
  default:'var(--color-text-primary)', secondary:'var(--color-text-secondary)',
  success:'var(--color-primary-normal)', warning:'#f77234', danger:'var(--color-error-normal)',
};
const TITLE_FONT = {
  1:'600 30px/40px var(--font-sans)',
  2:'600 24px/32px var(--font-sans)',
  3:'600 20px/28px var(--font-sans)',
  4:'600 16px/24px var(--font-sans)',
  5:'600 14px/22px var(--font-sans)',
};

const buildStyle = p => ({
  color: TYPE_COLOR[p.type ?? 'default'],
  fontWeight: p.strong ? 600 : undefined,
  fontStyle: p.italic ? 'italic' : undefined,
  textDecoration: p.delete ? 'line-through' : p.underline ? 'underline' : undefined,
  ...(p.ellipsis ? {
    overflow:'hidden', textOverflow:'ellipsis',
    display: typeof p.ellipsis==='object' && p.ellipsis.rows ? '-webkit-box' : 'block',
    WebkitLineClamp: typeof p.ellipsis==='object' ? p.ellipsis.rows : undefined,
    WebkitBoxOrient:'vertical',
    whiteSpace: typeof p.ellipsis==='object' ? undefined : 'nowrap',
  } : null),
  ...p.style,
});

const renderInner = p => {
  let content = p.children;
  if (p.code) content = h('code', { style:{
    padding:'0.1em 0.4em', background:'var(--color-bg-hover)',
    borderRadius:'var(--radius-2)', font:'400 0.9em/1 ui-monospace, monospace',
    color:'var(--color-text-primary)',
  } }, content);
  if (p.mark) content = h('mark', { style:{
    background:'rgba(255, 211, 23, 0.4)', padding:'0 2px',
  } }, content);
  return content;
};

const CopyBtn = ({ text }) => {
  const [done, setDone] = useState(false);
  return h('span', {
    role:'button',
    onClick: () => { navigator.clipboard?.writeText(text); setDone(true); setTimeout(()=>setDone(false), 1500); },
    style:{ marginLeft:6, cursor:'pointer',
      color: done?'var(--color-primary-normal)':'var(--color-text-auxiliary)',
      display:'inline-flex', verticalAlign:'middle' },
    'aria-label':'copy',
  }, done
    ? h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
        strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
        h('path', { d:'M5 13l4 4L19 7' }))
    : h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
        strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round' },
        h('rect', { x:9, y:9, width:13, height:13, rx:2 }),
        h('path', { d:'M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1' }))
  );
};

const wrap = (node, p) => {
  const text = typeof p.children === 'string' ? p.children
    : (typeof p.copyable === 'object' && p.copyable.text) || '';
  if (p.copyable) return [node, h(CopyBtn, { text, key:'_c' })];
  return node;
};

const Title = ({ level=1, ...rest }) => h(`h${level}`, {
  className: rest.className,
  style:{ margin:0, font: TITLE_FONT[level], ...buildStyle(rest) }
}, wrap(renderInner(rest), rest));

const Text = (p) => h('span', {
  className: p.className,
  style:{ font:'400 14px/22px var(--font-sans)', ...buildStyle(p) }
}, wrap(renderInner(p), p));

const Paragraph = (p) => h('p', {
  className: p.className,
  style:{ margin:'0 0 var(--spacing-12) 0', font:'400 14px/22px var(--font-sans)', ...buildStyle(p) }
}, wrap(renderInner(p), p));

const Link = ({ href, target, ...rest }) => h('a', {
  href, target, className: rest.className,
  style:{ color:'var(--color-primary-normal)', textDecoration:'none', cursor:'pointer',
    font:'400 14px/22px var(--font-sans)', ...buildStyle(rest) },
  onMouseEnter: e => e.currentTarget.style.textDecoration = 'underline',
  onMouseLeave: e => e.currentTarget.style.textDecoration = 'none',
}, wrap(renderInner(rest), rest));

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-24)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Typography 排版'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:800, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'标题' },
        h(Title, { level:1 }, 'H1 标题 — 30/40 600'),
        h(Title, { level:2 }, 'H2 标题 — 24/32 600'),
        h(Title, { level:3 }, 'H3 标题 — 20/28 600'),
        h(Title, { level:4 }, 'H4 标题 — 16/24 600'),
        h(Title, { level:5 }, 'H5 标题 — 14/22 600')),
      h(Group, { title:'文字类型' },
        h('div', null, h(Text, null, '默认文字')),
        h('div', null, h(Text, { type:'secondary' }, '次级文字')),
        h('div', null, h(Text, { type:'success' }, '成功文字')),
        h('div', null, h(Text, { type:'warning' }, '警告文字')),
        h('div', null, h(Text, { type:'danger' }, '危险文字'))),
      h(Group, { title:'装饰' },
        h('div', null, h(Text, { strong:true }, '粗体文字')),
        h('div', null, h(Text, { italic:true }, '斜体文字')),
        h('div', null, h(Text, { underline:true }, '下划线文字')),
        h('div', null, h(Text, { delete:true }, '删除线文字')),
        h('div', null, h(Text, { code:true }, 'const x = 42')),
        h('div', null, h(Text, { mark:true }, '标记高亮文字'))),
      h(Group, { title:'段落 / 链接 / 复制' },
        h(Paragraph, null, 'Milesight IOT Web 是一套面向IOT 控制台场景的设计系统。它以 W3C 设计 token 为基础，覆盖颜色、间距、圆角、字号等一致性度量。'),
        h('div', null, '参考资料：',
          h(Link, { href:'https://www.figma.com/design/q0i8cRsd3VWuKavW3vUGE2', target:'_blank' }, 'Figma 设计源')),
        h(Paragraph, { copyable:true }, 'i-2zegxxxx-uink-prod-01')
      ),
      h(Group, { title:'省略' },
        h('div', { style:{ width:320 } },
          h(Text, { ellipsis:true }, '这是一段非常长的文字，宽度受限时会被截断并显示省略号')),
        h('div', { style:{ width:320 } },
          h(Text, { ellipsis:{ rows:2 } },
            '多行省略示例：当行数超过设定值时，文字会在末尾添加省略号。支持任意行数，配合 max-width 使用最佳。这一段会演示 2 行省略效果。'))
      )
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
