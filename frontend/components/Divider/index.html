<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Divider 分割线 — Milesight IOT Web v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const DIVIDER_COLOR = '#E5E6EB';
const LABEL_COLOR = '#272E3B';

function Divider({ direction='horizontal', type='solid', orientation='center', orientationMargin, children, style }) {
  if (direction === 'vertical') {
    return h('span', {
      role:'separator', 'aria-orientation':'vertical',
      style: Object.assign({
        display:'inline-block', width: type==='dashed'?0:1, height:'1em', minHeight:12,
        verticalAlign:'middle',
        background: type==='solid' ? DIVIDER_COLOR : 'transparent',
        borderLeft: type==='dashed' ? `1px dashed ${DIVIDER_COLOR}` : 'none',
        margin:'0 8px',
      }, style || {})
    });
  }
  const lineStyle = type === 'solid'
    ? { height:1, background: DIVIDER_COLOR }
    : { height:0, borderTop:`1px dashed ${DIVIDER_COLOR}` };
  if (!children) {
    return h('div', {
      role:'separator',
      style: Object.assign({
        display:'flex', alignItems:'center', width:'100%', margin:'16px 0',
      }, style || {})
    }, h('div', { style: Object.assign({ flex:1 }, lineStyle) }));
  }
  const marginSize = typeof orientationMargin === 'number' ? `${orientationMargin}px` : (orientationMargin || '64px');
  const leftFlex = orientation === 'left' ? `0 0 ${marginSize}` : '1 1 auto';
  const rightFlex = orientation === 'right' ? `0 0 ${marginSize}` : '1 1 auto';
  return h('div', {
    role:'separator',
    style: Object.assign({
      display:'flex', alignItems:'center', width:'100%', gap:8, margin:'16px 0',
    }, style || {})
  },
    h('div', { style: Object.assign({ flex:leftFlex }, lineStyle) }),
    h('span', {
      style:{
        flex:'0 0 auto', padding:'4px 8px', height:24, lineHeight:'16px',
        display:'inline-flex', alignItems:'center',
        font:'400 12px/16px var(--font-sans)',
        color: LABEL_COLOR, borderRadius:'var(--radius-4)', whiteSpace:'nowrap',
      }
    }, children),
    h('div', { style: Object.assign({ flex:rightFlex }, lineStyle) })
  );
}

const Group = ({ title, children }) =>
  h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
    h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
    h('div', {
      style:{
        padding:'var(--spacing-20)', background:'var(--color-bg-card)',
        border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
      }
    }, children)
  );

const AvatarRow = ({ name, date }) =>
  h('div', { style:{ display:'flex', alignItems:'center', gap:12, padding:'8px 0' } },
    h('div', { style:{
      width:32, height:32, borderRadius:'50%',
      background:'var(--color-primary-bg)', color:'var(--color-primary-normal)',
      display:'flex', alignItems:'center', justifyContent:'center',
      font:'500 13px/1 var(--font-sans)',
    } }, name.slice(0, 1)),
    h('div', { style:{ flex:1, display:'flex', flexDirection:'column', gap:2 } },
      h('span', { style:{ font:'500 14px/1.4 var(--font-sans)', color:'var(--color-text-primary)' } }, name),
      h('span', { style:{ font:'400 12px/1.4 var(--font-sans)', color:'var(--color-text-auxiliary)' } }, date)
    )
  );

const P = (txt) => h('p', { style:{ margin:0, color:'var(--color-text-secondary)' } }, txt);

function App() {
  return h('div', { style:{ minHeight:'100vh', background:'var(--color-bg-page)' } },
    h('header', {
      style:{
        background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)',
        padding:'var(--spacing-20) var(--spacing-24)',
        display:'flex', alignItems:'center', justifyContent:'space-between',
      }
    },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Divider 分割线'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', {
      style:{
        maxWidth:720, margin:'0 auto',
        padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
        display:'flex', flexDirection:'column', gap:'var(--spacing-30)',
      }
    },
      h(Group, { title:'水平分割线' },
        P('实线（默认）'),
        h(Divider, null),
        P('虚线'),
        h(Divider, { type:'dashed' }),
        P('段落之间的视觉切断。')
      ),
      h(Group, { title:'带文字的分割线' },
        P('居中标题。'),
        h(Divider, null, 'Center Label'),
        P('左对齐标题。'),
        h(Divider, { orientation:'left' }, 'Left Label'),
        P('右对齐标题。'),
        h(Divider, { orientation:'right' }, 'Right Label')
      ),
      h(Group, { title:'垂直分割线' },
        h('div', {
          style:{
            display:'flex', alignItems:'center', gap:20, padding:'0 16px',
            font:'400 14px/1.5 var(--font-sans)', color:'var(--color-text-primary)',
          }
        },
          h('span', null, '文本'),
          h(Divider, { direction:'vertical' }),
          h('a', { href:'#', style:{ color:'var(--color-primary-normal)' } }, '链接'),
          h(Divider, { direction:'vertical' }),
          h('a', { href:'#', style:{ color:'var(--color-primary-normal)' } }, '链接'),
          h(Divider, { direction:'vertical' }),
          h('span', null, '文本')
        )
      ),
      h(Group, { title:'其他场景' },
        h('div', null,
          h(AvatarRow, { name:'陈思琪', date:'2026-05-10 14:32' }),
          h(Divider, { style:{ margin:0 } }),
          h(AvatarRow, { name:'李文博', date:'2026-05-10 09:15' }),
          h(Divider, { style:{ margin:0 } }),
          h(AvatarRow, { name:'王雨晴', date:'2026-05-09 18:47' })
        )
      )
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
