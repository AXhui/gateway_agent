<title>Cascader 级联选择 — Milesight IOT Web v1.0.0</title>
<style>

  --color-primary-disable:#87C7FF;

  --color-success-normal:#1EBA62;

  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;

  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;

*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}

<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;
const { useState, useRef, useEffect } = React;

const resolvePath = (opts, value) => {
  const out = [];
  let level = opts;
  for (const v of value) {
    const found = level.find(o => o.value === v);
    if (!found) break;
    out.push(found);
    level = found.children || [];
  }
  return out;
};

function Column({ items, activeValue, onHover, onPick }) {
  return h('div', {
    style:{
      width:140, height:200, overflowY:'auto',
      borderRight:'1px solid var(--color-divider-base-1)',
      padding:4,
    }
  },
    items.map(opt => {
      const isActive = opt.value === activeValue;
      const hasChildren = !!(opt.children && opt.children.length);
      return h('div', {
        key:opt.value,
        onMouseEnter: () => !opt.disabled && onHover(opt),
        onClick: () => !opt.disabled && onPick(opt),
        style:{
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'4px 8px', cursor: opt.disabled ? 'not-allowed' : 'pointer',
          borderRadius:'var(--radius-4)',
          background: isActive ? 'var(--color-primary-bg)' : 'transparent',
          color: opt.disabled ? 'var(--color-text-auxiliary)'
            : isActive ? 'var(--color-primary-normal)' : 'var(--color-text-primary)',
          font:'400 14px/22px var(--font-sans)',
          fontWeight: isActive ? 500 : 400,
        }
      },
        h('span', { style:{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, opt.label),
        hasChildren && h('svg', {
          width:10, height:10, viewBox:'0 0 10 10', fill:'none',
          stroke:'currentColor', strokeWidth:1.5, style:{ opacity:0.5, flexShrink:0 }
        }, h('path', { d:'M3 1.5l3.5 3.5L3 8.5', strokeLinecap:'round', strokeLinejoin:'round' }))
      );
    })
  );
}

function Cascader({ options=[], value: vProp, defaultValue=[], placeholder='请选择', disabled=false, separator=' / ', changeOnSelect=false, onChange }) {
  const [internal, setInternal] = useState(defaultValue);
  const value = vProp !== undefined ? vProp : internal;
  const [open, setOpen] = useState(false);
  const [hover, setHover] = useState(false);
  const [activePath, setActivePath] = useState(value);
  const ref = useRef(null);

  useEffect(() => { if (open) setActivePath(value); }, [open]);

  useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const selectedPath = resolvePath(options, value);
  const display = selectedPath.length === value.length && selectedPath.length > 0
    ? selectedPath.map(p => p.label).join(separator) : '';

  const columns = [options];
  let level = options;
  for (const v of activePath) {
    const found = level.find(o => o.value === v);
    if (!found || !found.children || !found.children.length) break;
    columns.push(found.children);
    level = found.children;
  }

  const commit = (path, optionPath) => {
    if (vProp === undefined) setInternal(path);
    onChange && onChange(path, optionPath);
  };

  const handleHover = (lvl, opt) => {
    setActivePath([...activePath.slice(0, lvl), opt.value]);
  };

  const handlePick = (lvl, opt) => {
    const nextPath = [...activePath.slice(0, lvl), opt.value];
    setActivePath(nextPath);
    const isLeaf = !(opt.children && opt.children.length);
    if (isLeaf) {
      commit(nextPath, resolvePath(options, nextPath));
      setOpen(false);
    } else if (changeOnSelect) {
      commit(nextPath, resolvePath(options, nextPath));
    }
  };

  return h('div', { ref, style:{ position:'relative', width:240 } },
    h('div', {
      onClick: () => !disabled && setOpen(o => !o),
      onMouseEnter: () => setHover(true),
      onMouseLeave: () => setHover(false),
      style:{
        height:32, padding:'0 12px',
        border:`1px solid ${(hover || open) ? 'var(--color-primary-normal)' : 'var(--color-border-base)'}`,
        borderRadius:'var(--radius-4)',
        font:'400 14px/30px var(--font-sans)',
        color: display ? 'var(--color-text-primary)' : 'var(--color-text-auxiliary)',
        background: disabled ? 'var(--color-bg-hover)' : 'var(--color-bg-card)',
        cursor: disabled ? 'not-allowed' : 'pointer',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        transition:'border-color 160ms',
      }
    },
      h('span', { style:{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } },
        display || placeholder
      ),
      h('svg', {
        width:10, height:10, viewBox:'0 0 10 10', fill:'none', stroke:'currentColor', strokeWidth:1.5,
        style:{ transform: open ? 'rotate(180deg)' : 'none', transition:'transform 160ms', opacity:0.6 }
      }, h('path', { d:'M1.5 3l3.5 4 3.5-4', strokeLinecap:'round', strokeLinejoin:'round' }))
    ),
    open && h('div', {
      style:{
        position:'absolute', top:'100%', left:0, marginTop:4,
        background:'var(--color-bg-card)',
        border:'1px solid var(--color-divider-base-1)',
        borderRadius:'var(--radius-4)',
        boxShadow:'var(--shadow-2)',
        zIndex:1000, display:'flex',
      }
    },
      columns.map((col, i) => h(Column, {
        key:i, items:col, activeValue:activePath[i],
        onHover: opt => handleHover(i, opt),
        onPick: opt => handlePick(i, opt),
      }))
    )
  );
}

const Group = ({ title, children }) =>
  h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
    h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
    h('div', { style:{
      padding:'var(--spacing-20)', background:'var(--color-bg-card)',
      border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
      display:'flex', gap:16, flexWrap:'wrap', alignItems:'center',
    } }, children)
  );

const REGIONS = [
  { value:'cn', label:'中国', children:[
    { value:'east', label:'华东', children:[
      { value:'hangzhou', label:'杭州' },
      { value:'shanghai', label:'上海' },
      { value:'qingdao', label:'青岛' },
    ]},
    { value:'north', label:'华北', children:[
      { value:'beijing', label:'北京' },
      { value:'zhangjiakou', label:'张家口' },
    ]},
    { value:'south', label:'华南', children:[
      { value:'shenzhen', label:'深圳' },
      { value:'guangzhou', label:'广州' },
    ]},
  ]},
  { value:'ap', label:'亚太', children:[
    { value:'se', label:'东南亚', children:[
      { value:'singapore', label:'新加坡' },
      { value:'jakarta', label:'雅加达' },
    ]},
    { value:'ne', label:'东北亚', children:[
      { value:'tokyo', label:'东京' },
      { value:'seoul', label:'首尔' },
    ]},
  ]},
];

function App() {
  const [v, setV] = useState(['cn', 'east', 'shanghai']);
  return h('div', { style:{ minHeight:'100vh', background:'var(--color-bg-page)' } },
    h('header', {
      style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)',
        padding:'var(--spacing-20) var(--spacing-24)',
        display:'flex', alignItems:'center', justifyContent:'space-between' }
    },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Cascader 级联选择'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', {
      style:{ maxWidth:720, margin:'0 auto',
        padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
        display:'flex', flexDirection:'column', gap:'var(--spacing-30)' }
    },
      h(Group, { title:'基础' }, h(Cascader, { options:REGIONS, placeholder:'请选择区域' })),
      h(Group, { title:'默认值' }, h(Cascader, { options:REGIONS, defaultValue:['cn','north','beijing'] })),
      h(Group, { title:'受控' },
        h(Cascader, { options:REGIONS, value:v, onChange:setV }),
        h('span', { style:{ color:'var(--color-text-secondary)' } }, `当前值：${v.join(' / ') || '（空）'}`)
      ),
      h(Group, { title:'选择即变更（changeOnSelect）' }, h(Cascader, { options:REGIONS, changeOnSelect:true })),
      h(Group, { title:'禁用' }, h(Cascader, { options:REGIONS, defaultValue:['cn','east','hangzhou'], disabled:true }))
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
