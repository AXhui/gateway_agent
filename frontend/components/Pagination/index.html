<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const Chevron = ({ dir }) => h('svg', {
  width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
  strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true,
}, h('path', { d: dir==='left' ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6' }));

const itemBase = {
  minWidth:32, height:32, padding:'0 var(--spacing-8)',
  display:'inline-flex', alignItems:'center', justifyContent:'center',
  border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
  background:'var(--color-bg-card)', color:'var(--color-text-primary)',
  font:'400 14px/22px var(--font-sans)', cursor:'pointer',
  transition:'all var(--duration-fast) var(--easing-standard)',
  userSelect:'none',
};

function buildPages(current, totalPages) {
  if (totalPages <= 7) return Array.from({ length: totalPages }, (_, i) => i + 1);
  const out = [1];
  if (current > 4) out.push('L');
  const start = Math.max(2, current - 2);
  const end = Math.min(totalPages - 1, current + 2);
  for (let i = start; i <= end; i++) out.push(i);
  if (current < totalPages - 3) out.push('R');
  out.push(totalPages);
  return out;
}

const Pagination = ({
  current: currentProp, defaultCurrent = 1, total,
  pageSize: pageSizeProp, defaultPageSize = 10,
  pageSizeOptions = [10, 20, 50, 100],
  showSizeChanger, showQuickJumper, showTotal, onChange, simple,
}) => {
  const [curState, setCur] = React.useState(defaultCurrent);
  const [psState, setPs] = React.useState(defaultPageSize);
  const current = currentProp ?? curState;
  const pageSize = pageSizeProp ?? psState;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const cur = Math.min(current, totalPages);
  const [jumpVal, setJumpVal] = React.useState('');

  const goto = (p, ps = pageSize) => {
    const np = Math.min(Math.max(1, p), Math.max(1, Math.ceil(total / ps)));
    if (currentProp === undefined) setCur(np);
    onChange?.(np, ps);
  };

  const Item = ({ active, disabled, onClick, children, ariaLabel }) => h('button', {
    type:'button', 'aria-label': ariaLabel,
    'aria-current': active ? 'page' : undefined,
    disabled, onClick,
    style:{
      ...itemBase,
      border: active ? '1px solid var(--color-primary-normal)' : '1px solid var(--color-border-base)',
      color: active ? 'var(--color-primary-normal)'
        : disabled ? 'var(--color-text-disable)' : 'var(--color-text-primary)',
      cursor: disabled ? 'not-allowed' : 'pointer',
    },
    onMouseEnter: e => {
      if (disabled || active) return;
      e.currentTarget.style.borderColor = 'var(--color-primary-normal)';
      e.currentTarget.style.color = 'var(--color-primary-normal)';
    },
    onMouseLeave: e => {
      if (disabled || active) return;
      e.currentTarget.style.borderColor = 'var(--color-border-base)';
      e.currentTarget.style.color = 'var(--color-text-primary)';
    },
  }, children);

  const start = total === 0 ? 0 : (cur - 1) * pageSize + 1;
  const end = Math.min(cur * pageSize, total);

  return h('nav', {
    'aria-label':'pagination',
    style:{ display:'inline-flex', alignItems:'center', gap:'var(--spacing-8)',
      font:'400 14px/22px var(--font-sans)', color:'var(--color-text-secondary)' }
  },
    showTotal && h('span', { style:{ color:'var(--color-text-auxiliary)' } }, showTotal(total, [start, end])),
    h(Item, { disabled: cur <= 1, onClick: () => goto(cur - 1), ariaLabel:'prev page' }, h(Chevron, { dir:'left' })),
    simple
      ? h('span', null,
          h('input', {
            type:'text', value: cur,
            onChange: e => { const n = parseInt(e.target.value, 10); if (!isNaN(n)) goto(n); },
            style:{ width:40, height:32, textAlign:'center',
              border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
              font:'400 14px/22px var(--font-sans)' }
          }),
          h('span', { style:{ margin:'0 var(--spacing-8)' } }, '/ ' + totalPages)
        )
      : buildPages(cur, totalPages).map((p, i) =>
          (p === 'L' || p === 'R')
            ? h('span', { key:`${p}${i}`, style:{ ...itemBase, border:'none', cursor:'default', color:'var(--color-text-auxiliary)' } }, '•••')
            : h(Item, { key:p, active: p === cur, onClick: () => goto(p), ariaLabel:`page ${p}` }, p)
        ),
    h(Item, { disabled: cur >= totalPages, onClick: () => goto(cur + 1), ariaLabel:'next page' }, h(Chevron, { dir:'right' })),
    showSizeChanger && h('select', {
      value: pageSize,
      onChange: e => {
        const ps = parseInt(e.target.value, 10);
        if (pageSizeProp === undefined) setPs(ps);
        goto(1, ps);
      },
      style:{ height:32, padding:'0 var(--spacing-8)',
        border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
        background:'var(--color-bg-card)', color:'var(--color-text-primary)',
        font:'400 14px/22px var(--font-sans)', cursor:'pointer' }
    }, pageSizeOptions.map(o => h('option', { key:o, value:o }, `${o} 条/页`))),
    showQuickJumper && h('span', { style:{ display:'inline-flex', alignItems:'center', gap:'var(--spacing-4)' } },
      '跳至',
      h('input', {
        type:'text', value: jumpVal,
        onChange: e => setJumpVal(e.target.value),
        onKeyDown: e => {
          if (e.key === 'Enter') {
            const n = parseInt(jumpVal, 10);
            if (!isNaN(n)) goto(n);
            setJumpVal('');
          }
        },
        style:{ width:48, height:32, textAlign:'center',
          border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
          font:'400 14px/22px var(--font-sans)' }
      }),
      '页'
    )
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'column', gap:'var(--spacing-16)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Pagination 分页'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:1200, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' }, h(Pagination, { total:50 })),
      h(Group, { title:'多页 — 折叠省略' }, h(Pagination, { total:500, defaultCurrent:6 })),
      h(Group, { title:'完整 — 总数 / 页大小 / 跳页' },
        h(Pagination, { total:385, defaultCurrent:3, showSizeChanger:true, showQuickJumper:true,
          showTotal: (t, [s, e]) => `第 ${s}-${e} 条 / 共 ${t} 条` })),
      h(Group, { title:'简洁 — simple' }, h(Pagination, { simple:true, total:120, defaultCurrent:3 })),
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
