<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Radio 单选框 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;
const DOT = 16;

const Radio = ({ checked, defaultChecked, disabled, onChange, children, style, className, ...rest }) => {
  const [inner, setInner] = useState(!!defaultChecked);
  const isControlled = checked !== undefined;
  const value = isControlled ? !!checked : inner;
  const borderColor = value ? 'var(--color-primary-normal)' : 'var(--color-border-base)';

  return h('label', { className, style:{
      display:'inline-flex', alignItems:'center', gap:'var(--spacing-8)',
      cursor: disabled?'not-allowed':'pointer',
      color: disabled?'var(--color-text-disable)':'var(--color-text-primary)',
      opacity: disabled?0.6:1, font:'400 14px/22px var(--font-sans)', ...style,
    } },
    h('span', { style:{ position:'relative', display:'inline-flex', flex:'none' } },
      h('input', { type:'radio', checked: value, disabled,
        onChange: e => { if (!isControlled) setInner(e.target.checked); onChange?.(e); },
        style:{ position:'absolute', inset:0, width:DOT, height:DOT, margin:0, opacity:0, cursor:'inherit' },
        ...rest,
      }),
      h('span', { 'aria-hidden':true, style:{
        width:DOT, height:DOT, borderRadius:'50%',
        border:`1px solid ${borderColor}`,
        background: disabled?'var(--color-bg-hover)':'var(--color-bg-card)',
        display:'inline-flex', alignItems:'center', justifyContent:'center',
        transition:'all var(--duration-fast) var(--easing-standard)',
      } },
        h('span', { style:{ width:8, height:8, borderRadius:'50%',
          background:'var(--color-primary-normal)',
          transform: value?'scale(1)':'scale(0)',
          transition:'transform var(--duration-fast) var(--easing-standard)' } })
      )
    ),
    children !== undefined && h('span', null, children)
  );
};

const BTN_HEIGHT = { small:24, default:28, large:32 };

const RadioGroup = ({ options, value, defaultValue, disabled, optionType='default',
  size='default', buttonStyle='outline', onChange }) => {
  const [inner, setInner] = useState(defaultValue);
  const isControlled = value !== undefined;
  const v = isControlled ? value : inner;
  const set = val => { if (!isControlled) setInner(val); onChange?.(val); };

  if (optionType === 'button' && options) {
    return h('div', { style:{ display:'inline-flex' } },
      options.map((o, i) => {
        const active = v === o.value;
        const dis = disabled || o.disabled;
        const solid = buttonStyle === 'solid';
        const isFirst = i === 0;
        const isLast = i === options.length - 1;
        return h('button', {
          key:o.value, type:'button', disabled:dis,
          onClick: () => !dis && set(o.value),
          style:{
            height: BTN_HEIGHT[size],
            padding:`0 ${size==='small'?12:16}px`,
            border:'1px solid var(--color-border-base)',
            borderLeftWidth: isFirst?1:0,
            borderTopLeftRadius: isFirst?'var(--radius-4)':0,
            borderBottomLeftRadius: isFirst?'var(--radius-4)':0,
            borderTopRightRadius: isLast?'var(--radius-4)':0,
            borderBottomRightRadius: isLast?'var(--radius-4)':0,
            background: active && solid ? 'var(--color-primary-normal)' : 'var(--color-bg-card)',
            color: active && solid ? 'var(--color-text-constant-normal)' : active ? 'var(--color-primary-normal)' : 'var(--color-text-primary)',
            borderColor: active ? 'var(--color-primary-normal)' : 'var(--color-border-base)',
            cursor: dis?'not-allowed':'pointer', opacity: dis?0.5:1,
            font:'400 14px/1 var(--font-sans)',
            transition:'all var(--duration-fast) var(--easing-standard)',
            position:'relative', zIndex: active?1:0,
          }
        }, o.label);
      })
    );
  }

  return h('div', { style:{ display:'inline-flex', gap:'var(--spacing-16)', flexWrap:'wrap' } },
    options.map(o => h(Radio, {
      key:o.value, checked: v === o.value,
      disabled: disabled || o.disabled,
      onChange: () => set(o.value),
    }, o.label))
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } }, children)
);

function App() {
  const [region, setRegion] = useState('cn-east-1');
  const [billing, setBilling] = useState('hour');
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Radio 单选框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' },
        h(Radio, null, '未选中'),
        h(Radio, { defaultChecked:true }, '已选中'),
        h(Radio, { disabled:true }, '禁用'),
        h(Radio, { disabled:true, defaultChecked:true }, '禁用已选')),
      h(Group, { title:'组 — RadioGroup' },
        h(RadioGroup, {
          value:region, onChange:setRegion,
          options:[
            { label:'华东 1', value:'cn-east-1' },
            { label:'华北 2', value:'cn-north-2' },
            { label:'华南 3', value:'cn-south-3' },
            { label:'海外（暂未开放）', value:'oversea', disabled:true },
          ]
        }),
        h('span', { style:{ color:'var(--color-text-auxiliary)' } }, '已选区域：' + region)
      ),
      h(Group, { title:'按钮样式 — outline' },
        h(RadioGroup, {
          optionType:'button', value:billing, onChange:setBilling,
          options:[
            { label:'按小时', value:'hour' },
            { label:'包月', value:'month' },
            { label:'包年', value:'year' },
          ]
        })
      ),
      h(Group, { title:'按钮样式 — solid' },
        h(RadioGroup, {
          optionType:'button', buttonStyle:'solid', defaultValue:'md',
          options:[
            { label:'小', value:'sm' },
            { label:'中', value:'md' },
            { label:'大', value:'lg' },
          ]
        })
      )
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
