*{box-sizing:border-box}html,body,#root{margin:0;padding:0}

<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const STATUS_COLOR = {
  default:'var(--color-text-disable)',
  success:'var(--color-success-normal)',
  error:'var(--color-error-normal)',
  warning:'var(--color-warm-normal)',
  processing:'var(--color-primary-normal)',
};

const Timeline = ({ items, mode='left', reverse, pending, style, className }) => {
  const list = reverse ? [...items].reverse() : items;
  const all = pending ? [...list, { key:'__pending__', status:'processing', children:pending }] : list;
  return h('ul', { className, style:{ listStyle:'none', margin:0, padding:0,
    display:'flex', flexDirection:'column', ...style } },
    all.map((it, i) => {
      const last = i === all.length - 1;
      const isAlt = mode === 'alternate';
      const onRight = mode === 'right' || (isAlt && i % 2 === 1);
      const dotColor = it.color ?? STATUS_COLOR[it.status ?? 'default'];
      return h('li', { key: it.key ?? i, style:{
        position:'relative', display:'flex',
        flexDirection: onRight ? 'row-reverse' : 'row',
        minHeight:56, paddingBottom: last ? 0 : 'var(--spacing-12)' } },
        (mode !== 'alternate' || it.label) && h('div', { style:{
          width: isAlt ? '50%' : 80,
          paddingRight: onRight ? 0 : 'var(--spacing-12)',
          paddingLeft: onRight ? 'var(--spacing-12)' : 0,
          color:'var(--color-text-auxiliary)',
          font:'400 13px/22px var(--font-sans)',
          textAlign: onRight ? 'left' : 'right',
        } }, it.label),
        h('div', { style:{ position:'relative', width:24, flexShrink:0,
          display:'flex', justifyContent:'center' } },
          !last && h('span', { style:{ position:'absolute', top:12, bottom:-12, left:'50%',
            width:1, transform:'translateX(-50%)', background:'var(--color-divider-base-1)' } }),
          h('span', { style:{
            position:'relative', width:10, height:10, borderRadius:'50%',
            marginTop:6, border:`2px solid ${dotColor}`, background:'var(--color-bg-card)',
            ...(it.status === 'processing' ? { background: dotColor } : {}),
          } }, it.dot)
        ),
        h('div', { style:{ flex:1, minWidth:0,
          padding: onRight ? '0 var(--spacing-12) 0 0' : '0 0 0 var(--spacing-12)',
          color:'var(--color-text-primary)', font:'400 14px/22px var(--font-sans)',
          textAlign: onRight ? 'right' : 'left',
        } }, it.children)
      );
    })
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Timeline 时间轴'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' },
        h(Timeline, { items:[
          { label:'14:32', status:'success', children:'工单已创建' },
          { label:'14:35', status:'success', children:'客服已分配' },
          { label:'14:40', status:'processing', children:'处理中…' },
          { label:'—', status:'default', children:'等待用户确认' },
        ] })),
      h(Group, { title:'带挂起项 — pending' },
        h(Timeline, {
          pending: h('span', { style:{ color:'var(--color-text-auxiliary)' } }, '正在重启实例…'),
          items:[
            { status:'success', children:'实例已停止' },
            { status:'success', children:'快照已创建' },
          ]
        })),
      h(Group, { title:'左右交错' },
        h(Timeline, { mode:'alternate', items:[
          { label:'2026-05-01', children:'订阅开始' },
          { label:'2026-05-09', status:'success', children:'完成实名认证' },
          { label:'2026-05-10', status:'warning', children:'余额不足提醒' },
          { label:'2026-05-11', status:'error', children:'订阅暂停' },
        ] }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
