<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — PageHeader 页头 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const ArrowLeft = () => h('svg', {
  width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
  strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true,
}, h('path', { d:'M19 12H5M12 19l-7-7 7-7' }));

const Chevron = () => h('svg', {
  width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
  strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true,
}, h('path', { d:'M9 6l6 6-6 6' }));

const Breadcrumb = ({ items }) => h('nav', {
  'aria-label':'breadcrumb',
  style:{ display:'inline-flex', alignItems:'center', gap:'var(--spacing-4)',
    font:'400 14px/22px var(--font-sans)', color:'var(--color-text-auxiliary)' }
}, items.map((it, i) => {
  const isLast = i === items.length - 1;
  return h(React.Fragment, { key:i },
    (it.href || it.onClick)
      ? h('a', { href: it.href, onClick: it.onClick,
          style:{ color: isLast?'var(--color-text-primary)':'var(--color-text-auxiliary)',
            textDecoration:'none', padding:'0 var(--spacing-4)' } }, it.title)
      : h('span', { style:{ color: isLast?'var(--color-text-primary)':'var(--color-text-auxiliary)',
          padding:'0 var(--spacing-4)' } }, it.title),
    !isLast && h('span', { 'aria-hidden':true, style:{ display:'inline-flex', color:'#c9cdd4' } }, h(Chevron))
  );
}));

const PageHeader = ({ title, subTitle, tags, breadcrumb, onBack, backText='返回',
  extra, footer, ghost=true, style }) => h('header', {
    style:{ padding:'var(--spacing-16) var(--spacing-24)',
      background: ghost?'transparent':'var(--color-bg-card)',
      borderBottom: ghost?'none':'1px solid var(--color-divider-base-1)', ...style }
  },
    breadcrumb && h('div', { style:{ marginBottom:'var(--spacing-8)' } }, breadcrumb),
    h('div', { style:{ display:'flex', alignItems:'center', gap:'var(--spacing-12)' } },
      onBack && h('button', {
        onClick:onBack, 'aria-label':'back',
        style:{ display:'inline-flex', alignItems:'center', gap:'var(--spacing-4)',
          height:28, padding:'0 var(--spacing-8)',
          border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
          background:'var(--color-bg-card)', color:'var(--color-text-secondary)',
          cursor:'pointer', font:'400 13px/1 var(--font-sans)' }
      }, h(ArrowLeft), h('span', null, backText)),
      h('h1', { style:{ margin:0, font:'600 20px/28px var(--font-sans)', color:'var(--color-text-primary)' } }, title),
      subTitle && h('span', { style:{ color:'var(--color-text-auxiliary)', font:'400 14px/22px var(--font-sans)' } }, subTitle),
      tags && h('span', { style:{ display:'inline-flex', gap:'var(--spacing-4)' } }, tags),
      extra && h('span', { style:{ marginLeft:'auto', display:'inline-flex', gap:'var(--spacing-8)', alignItems:'center' } }, extra),
    ),
    footer && h('div', { style:{ marginTop:'var(--spacing-16)' } }, footer),
  );

const Btn = ({ primary, children, onClick }) => h('button', {
  onClick,
  style:{ height:32, padding:'0 var(--spacing-16)',
    border: primary?'none':'1px solid var(--color-border-base)',
    borderRadius:'var(--radius-4)',
    background: primary?'var(--color-primary-normal)':'var(--color-bg-card)',
    color: primary?'var(--color-text-constant-normal)':'var(--color-text-primary)',
    font:'400 14px/22px var(--font-sans)', cursor:'pointer' }
}, children);

const Tag = ({ tone='info', children }) => h('span', {
  style:{ display:'inline-flex', alignItems:'center', height:22, padding:'0 var(--spacing-8)',
    borderRadius:'var(--radius-2)', font:'400 12px/22px var(--font-sans)',
    color: tone==='success'?'var(--color-success-normal)':'var(--color-primary-normal)',
    background: tone==='success'?'var(--color-success-bg)':'var(--color-primary-bg)' }
}, children);

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ background:'var(--color-bg-card)', border:'1px solid var(--color-divider-base-1)',
    borderRadius:'var(--radius-8)', overflow:'hidden' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'PageHeader 页头'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:1200, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' },
        h(PageHeader, { ghost:false, title:'云主机列表', subTitle:'华东1 区域' })),
      h(Group, { title:'返回 + 面包屑 + 标签 + 操作' },
        h(PageHeader, {
          ghost:false,
          breadcrumb: h(Breadcrumb, { items:[
            { title:'控制台', href:'#' },{ title:'云主机', href:'#' },{ title:'i-bp1abcd' }] }),
          onBack: () => alert('返回'),
          title:'i-bp1abcd',
          subTitle:'ecs.g7.large · CentOS 7.9',
          tags: h(React.Fragment, null, h(Tag, { tone:'success' }, '运行中'), h(Tag, null, '包年包月')),
          extra: h(React.Fragment, null, h(Btn, null, '重启'), h(Btn, null, '停止'), h(Btn, { primary:true }, '升级配置')),
        }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
