<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const offset = 6;

const placementStyle = p => {
  switch (p) {
    case 'top': return { bottom:`calc(100% + ${offset}px)`, left:'50%', transform:'translateX(-50%)' };
    case 'topLeft': return { bottom:`calc(100% + ${offset}px)`, left:0 };
    case 'topRight': return { bottom:`calc(100% + ${offset}px)`, right:0 };
    case 'bottom': return { top:`calc(100% + ${offset}px)`, left:'50%', transform:'translateX(-50%)' };
    case 'bottomLeft': return { top:`calc(100% + ${offset}px)`, left:0 };
    case 'bottomRight': return { top:`calc(100% + ${offset}px)`, right:0 };
    case 'left': return { right:`calc(100% + ${offset}px)`, top:'50%', transform:'translateY(-50%)' };
    case 'leftTop': return { right:`calc(100% + ${offset}px)`, top:0 };
    case 'leftBottom': return { right:`calc(100% + ${offset}px)`, bottom:0 };
    case 'right': return { left:`calc(100% + ${offset}px)`, top:'50%', transform:'translateY(-50%)' };
    case 'rightTop': return { left:`calc(100% + ${offset}px)`, top:0 };
    case 'rightBottom': return { left:`calc(100% + ${offset}px)`, bottom:0 };
  }
};

const arrowStyle = (p, color) => {
  const base = { position:'absolute', width:8, height:8, background:color };
  if (p.startsWith('top')) return { ...base, bottom:-4, left:'50%', transform:'translateX(-50%) rotate(45deg)' };
  if (p.startsWith('bottom')) return { ...base, top:-4, left:'50%', transform:'translateX(-50%) rotate(45deg)' };
  if (p.startsWith('left')) return { ...base, right:-4, top:'50%', transform:'translateY(-50%) rotate(45deg)' };
  return { ...base, left:-4, top:'50%', transform:'translateY(-50%) rotate(45deg)' };
};

const Tooltip = ({ title, placement='top', trigger='hover', open, defaultOpen,
  mouseEnterDelay=100, color='var(--color-text-primary)', arrow=true, onOpenChange, children }) => {
  const [inner, setInner] = useState(!!defaultOpen);
  const isControlled = open !== undefined;
  const isOpen = isControlled ? open : inner;
  const wrapRef = useRef(null);
  const timerRef = useRef();
  const set = next => { if (!isControlled) setInner(next); onOpenChange?.(next); };

  useEffect(() => {
    if (trigger !== 'click' || !isOpen) return;
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) set(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [trigger, isOpen]);
  useEffect(() => () => clearTimeout(timerRef.current), []);

  const showWithDelay = () => {
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => set(true), mouseEnterDelay);
  };
  const hide = () => { clearTimeout(timerRef.current); set(false); };

  const handlers = trigger === 'hover'
    ? { onMouseEnter: showWithDelay, onMouseLeave: hide }
    : trigger === 'focus'
      ? { onFocus: () => set(true), onBlur: () => set(false) }
      : { onClick: () => set(!isOpen) };

  return h('span', { ref:wrapRef, style:{ position:'relative', display:'inline-block' }, ...handlers },
    children,
    isOpen && title && h('span', { role:'tooltip', style:{
      position:'absolute', zIndex:1600,
      maxWidth:240, whiteSpace:'normal',
      background: color, color:'var(--color-text-constant-normal)',
      padding:'4px 10px', borderRadius:'var(--radius-4)',
      font:'400 12px/20px var(--font-sans)',
      boxShadow:'0 4px 12px rgba(11,18,32,0.16)',
      pointerEvents:'none',
      ...placementStyle(placement),
    } }, title, arrow && h('span', { style: arrowStyle(placement, color) }))
  );
};

const Btn = ({ children }) => h('button', { style:{
  height:32, padding:'0 16px', border:'1px solid var(--color-border-base)',
  borderRadius:'var(--radius-4)', background:'var(--color-bg-card)',
  color:'var(--color-text-primary)', cursor:'pointer',
} }, children);

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-30)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', gap:'var(--spacing-20)', flexWrap:'wrap' } }, children)
);

const placements = ['topLeft','top','topRight','leftTop','rightTop','left','right',
  'leftBottom','rightBottom','bottomLeft','bottom','bottomRight'];

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Tooltip 文字提示'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础 — hover 触发' },
        h(Tooltip, { title:'这是一段提示文案' }, h(Btn, null, '悬停查看')),
        h(Tooltip, { title:'操作成功后会刷新当前页面' }, h(Btn, null, '带较长文案'))),
      h(Group, { title:'位置 — 12 方向' },
        placements.map(p => h(Tooltip, { key:p, placement:p, title:p }, h(Btn, null, p)))),
      h(Group, { title:'自定义颜色' },
        h(Tooltip, { title:'主色调提示', color:'var(--color-primary-normal)' }, h(Btn, null, 'Primary')),
        h(Tooltip, { title:'错误提示', color:'var(--color-error-normal)' }, h(Btn, null, 'Error'))),
      h(Group, { title:'点击触发' },
        h(Tooltip, { title:'点击外部关闭', trigger:'click' }, h(Btn, null, '点击我')))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
