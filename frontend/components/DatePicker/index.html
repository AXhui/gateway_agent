*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}

<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const HEIGHT = { sm:24, md:32, lg:40 };
const FONT = {
  sm:'400 12px/20px var(--font-sans)',
  md:'400 14px/22px var(--font-sans)',
  lg:'400 16px/24px var(--font-sans)',
};
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = s => {
  if (!s) return undefined;
  const [y, m, d] = s.split('-').map(Number);
  if (!y || !m || !d) return undefined;
  return new Date(y, m - 1, d);
};
const WEEKDAYS = ['一','二','三','四','五','六','日'];

const navBtn = {
  width:24, height:24, border:'none', background:'none',
  cursor:'pointer', borderRadius:'var(--radius-4)',
  display:'inline-flex', alignItems:'center', justifyContent:'center',
  color:'var(--color-text-auxiliary)',
};

const DatePicker = ({ value, defaultValue, placeholder='请选择日期',
  size='md', status='default', disabled, allowClear, onChange, format, style, className }) => {
  const [inner, setInner] = useState(defaultValue);
  const isControlled = value !== undefined;
  const v = isControlled ? value : inner;
  const [open, setOpen] = useState(false);
  const [view, setView] = useState(() => parseIso(v) ?? new Date());
  const ref = useRef(null);

  useEffect(() => {
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const set = next => { if (!isControlled) setInner(next); onChange?.(next); };
  const display = (() => {
    const d = parseIso(v);
    if (!d) return '';
    return format ? format(d) : isoOf(d);
  })();

  const today = new Date();
  const cellsForMonth = m => {
    const first = new Date(m.getFullYear(), m.getMonth(), 1);
    const startWeekday = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) {
      cells.push({ d: new Date(m.getFullYear(), m.getMonth(), -startWeekday + i + 1), inMonth: false });
    }
    for (let i = 1; i <= daysInMonth; i++) {
      cells.push({ d: new Date(m.getFullYear(), m.getMonth(), i), inMonth: true });
    }
    while (cells.length < 42) {
      const last = cells[cells.length-1].d;
      cells.push({ d: new Date(last.getFullYear(), last.getMonth(), last.getDate()+1), inMonth: false });
    }
    return cells;
  };
  const cells = cellsForMonth(view);

  const borderColor = status==='error' ? 'var(--color-error-normal)'
    : open ? 'var(--color-primary-normal)' : 'var(--color-border-base)';

  return h('div', { ref, className, style:{ position:'relative', display:'inline-block', minWidth:200, ...style } },
    h('div', {
      onClick: () => !disabled && setOpen(o => !o),
      style:{
        height: HEIGHT[size], padding:'0 32px 0 var(--spacing-12)',
        background: disabled?'var(--color-bg-hover)':'var(--color-bg-card)',
        border:`1px solid ${borderColor}`, borderRadius:'var(--radius-4)',
        color: disabled?'var(--color-text-disable)':v?'var(--color-text-primary)':'var(--color-text-auxiliary)',
        font: FONT[size], cursor: disabled?'not-allowed':'pointer',
        display:'flex', alignItems:'center',
        boxShadow: open ? `0 0 0 2px ${status==='error'?'rgba(241,53,53,0.12)':'rgba(52,145,250,0.12)'}` : 'none',
        transition:'border-color var(--duration-fast), box-shadow var(--duration-fast)',
        position:'relative',
      }
    },
      h('span', { style:{ flex:1, minWidth:0 } }, display || placeholder),
      h('span', { style:{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
        color:'var(--color-text-auxiliary)', display:'inline-flex', alignItems:'center', gap:4 } },
        allowClear && v && h('span', {
          onClick: e => { e.stopPropagation(); set(undefined); },
          style:{ cursor:'pointer', display:'inline-flex' }, 'aria-label':'clear',
        }, h('svg', { width:12, height:12, viewBox:'0 0 24 24', fill:'none',
          stroke:'currentColor', strokeWidth:2.5, strokeLinecap:'round', strokeLinejoin:'round' },
          h('path', { d:'M6 6l12 12M18 6L6 18' }))),
        h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
          stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round' },
          h('rect', { x:3, y:4, width:18, height:18, rx:2 }),
          h('path', { d:'M16 2v4M8 2v4M3 10h18' }))
      )
    ),
    open && !disabled && h('div', { style:{
      position:'absolute', top:'100%', left:0, marginTop:4, zIndex:1400,
      background:'var(--color-bg-card)', border:'1px solid var(--color-divider-base-1)',
      borderRadius:'var(--radius-8)', boxShadow:'0 6px 20px rgba(11,18,32,0.08)',
      padding:'var(--spacing-12)', width:280,
    } },
      h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 } },
        h('button', { type:'button',
          onClick: () => setView(new Date(view.getFullYear(), view.getMonth()-1, 1)),
          style: navBtn },
          h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
            stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
            h('path', { d:'M15 6l-6 6 6 6' }))),
        h('span', { style:{ font:'500 14px/22px var(--font-sans)' } },
          `${view.getFullYear()} 年 ${view.getMonth()+1} 月`),
        h('button', { type:'button',
          onClick: () => setView(new Date(view.getFullYear(), view.getMonth()+1, 1)),
          style: navBtn },
          h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
            stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
            h('path', { d:'M9 6l6 6-6 6' })))
      ),
      h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2 } },
        WEEKDAYS.map(w => h('div', { key:w, style:{ height:28, display:'flex', alignItems:'center',
          justifyContent:'center', font:'400 12px/20px var(--font-sans)',
          color:'var(--color-text-auxiliary)' } }, w)),
        cells.map((c, i) => {
          const iso = isoOf(c.d);
          const selected = iso === v;
          const isToday = isoOf(today) === iso;
          return h('div', {
            key:i,
            onClick: () => { set(iso); setOpen(false); },
            onMouseEnter: e => !selected && (e.currentTarget.style.background='var(--color-bg-page)'),
            onMouseLeave: e => !selected && (e.currentTarget.style.background='transparent'),
            style:{
              height:28, display:'flex', alignItems:'center', justifyContent:'center',
              borderRadius:'var(--radius-4)', cursor:'pointer',
              color: selected?'var(--color-text-constant-normal)':!c.inMonth?'var(--color-text-disable)':'var(--color-text-primary)',
              background: selected?'var(--color-primary-normal)':'transparent',
              border: !selected && isToday ? '1px solid var(--color-primary-normal)' : '1px solid transparent',
              font:'400 13px/20px var(--font-sans)',
              transition:'all var(--duration-fast)',
            }
          }, c.d.getDate());
        })
      ),
      h('div', { style:{ marginTop:8, paddingTop:8,
        borderTop:'1px solid var(--color-divider-base-1)',
        display:'flex', justifyContent:'flex-end' } },
        h('button', { type:'button',
          onClick: () => { const t = new Date(); set(isoOf(t)); setView(t); setOpen(false); },
          style:{ background:'none', border:'none', color:'var(--color-primary-normal)',
            cursor:'pointer', font:'400 13px/20px var(--font-sans)', padding:0 } }, '今天')
      )
    )
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'row', gap:'var(--spacing-12)', flexWrap:'wrap' } }, children)
);

function App() {
  const [d, setD] = useState('2026-05-09');
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'DatePicker 日期选择框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' },
        h(DatePicker, { value:d, onChange:setD, allowClear:true }),
        h('span', { style:{ color:'var(--color-text-auxiliary)', alignSelf:'center' } }, '当前值：' + (d ?? '未选'))),
      h(Group, { title:'尺寸' },
        h(DatePicker, { size:'sm', placeholder:'小尺寸' }),
        h(DatePicker, { size:'md', placeholder:'默认' }),
        h(DatePicker, { size:'lg', placeholder:'大尺寸' })),
      h(Group, { title:'状态' },
        h(DatePicker, { defaultValue:'2026-01-01', status:'error' }),
        h(DatePicker, { placeholder:'禁用', disabled:true }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
