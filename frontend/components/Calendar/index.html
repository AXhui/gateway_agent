<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const WEEKDAYS = ['一','二','三','四','五','六','日'];
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

const sameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

const cellsForMonth = m => {
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push({ d: new Date(m.getFullYear(), m.getMonth(), -startWeekday + i + 1), inMonth:false });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ d: new Date(m.getFullYear(), m.getMonth(), i), inMonth:true });
  while (cells.length < 42) {
    const last = cells[cells.length-1].d;
    cells.push({ d: new Date(last.getFullYear(), last.getMonth(), last.getDate()+1), inMonth:false });
  }
  return cells;
};

const Selector = ({ value, options, onChange }) => h('select', {
  value, onChange: e => onChange(Number(e.target.value)),
  style:{
    height:28, padding:'0 24px 0 8px',
    background:'var(--color-bg-card)',
    border:'1px solid var(--color-border-base)',
    borderRadius:'var(--radius-4)',
    font:'400 13px/20px var(--font-sans)',
    color:'var(--color-text-primary)', cursor:'pointer',
  }
}, options.map(o => h('option', { key:o.value, value:o.value }, o.label)));

const Calendar = ({ value, defaultValue, onChange, dateCellRender, fullscreen=true, style, className }) => {
  const [inner, setInner] = useState(defaultValue ?? new Date());
  const isControlled = value !== undefined;
  const v = isControlled ? value : inner;
  const [view, setView] = useState(v);
  const today = new Date();
  const set = d => { if (!isControlled) setInner(d); onChange?.(d); };
  const yrs = useMemo(() => {
    const y = view.getFullYear();
    return [y-2,y-1,y,y+1,y+2];
  }, [view]);

  return h('div', { className, style:{
    background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)',
    borderRadius:'var(--radius-8)', overflow:'hidden', ...style,
  } },
    h('div', { style:{ display:'flex', alignItems:'center', gap:'var(--spacing-12)',
      padding:'var(--spacing-16) var(--spacing-20)',
      borderBottom:'1px solid var(--color-divider-base-1)' } },
      h(Selector, { value:view.getFullYear(),
        options: yrs.map(y => ({ value:y, label:`${y} 年` })),
        onChange: y => setView(new Date(y, view.getMonth(), 1)) }),
      h(Selector, { value:view.getMonth(),
        options: MONTHS.map((m,i) => ({ value:i, label:m })),
        onChange: m => setView(new Date(view.getFullYear(), m, 1)) }),
      h('span', { style:{ flex:1 } }),
      h('button', { type:'button', onClick: () => setView(new Date()),
        style:{ background:'transparent', border:'1px solid var(--color-border-base)',
          borderRadius:'var(--radius-4)', padding:'4px 12px',
          font:'400 13px/20px var(--font-sans)', cursor:'pointer', color:'var(--color-text-secondary)' }
      }, '回到今天')
    ),
    h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(7,1fr)',
      background:'var(--color-divider-base-1)', gap:1 } },
      WEEKDAYS.map(w => h('div', { key:w, style:{
        background:'var(--color-bg-card)',
        padding:'var(--spacing-12)',
        font:'500 13px/20px var(--font-sans)',
        color:'var(--color-text-auxiliary)' } }, '周'+w)),
      cellsForMonth(view).map((c, i) => {
        const selected = sameDay(c.d, v);
        const isToday = sameDay(c.d, today);
        return h('div', { key:i, onClick: () => set(c.d), style:{
          background:'var(--color-bg-card)',
          minHeight: fullscreen ? 96 : 56,
          padding:'var(--spacing-8)', cursor:'pointer',
          opacity: c.inMonth ? 1 : 0.45,
          borderTop: selected ? '2px solid var(--color-primary-normal)' : '2px solid transparent',
          boxShadow: selected ? 'inset 0 0 0 9999px rgba(52,145,250,0.04)' : 'none',
        } },
          h('div', { style:{ font:'500 14px/22px var(--font-sans)',
            color: isToday ? 'var(--color-primary-normal)' : c.inMonth ? 'var(--color-text-primary)' : 'var(--color-text-disable)' } },
            c.d.getDate()),
          dateCellRender && c.inMonth && h('div', { style:{ marginTop:4, font:'400 12px/18px var(--font-sans)' } },
            dateCellRender(c.d))
        );
      })
    )
  );
};

function App() {
  const [d, setD] = useState(new Date(2026, 4, 9));
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Calendar 日历'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:1100, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-20)' } },
      h('div', { style:{ color:'var(--color-text-auxiliary)' } },
        `当前选中：${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`),
      h(Calendar, {
        value:d, onChange:setD,
        dateCellRender: date => {
          if (date.getDate() === 12) return h('span', { style:{ color:'var(--color-success-normal)' } }, '● 计费日');
          if (date.getDate() === 28) return h('span', { style:{ color:'var(--color-warm-normal)' } }, '● 维护窗口');
          return null;
        }
      })
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
