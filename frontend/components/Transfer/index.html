<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Transfer 穿梭框 — Milesight IOT Web v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;
const { useState } = React;

function Checkbox({ checked, indeterminate, disabled, onChange }) {
  const on = checked || indeterminate;
  return h('span', {
    onClick: () => !disabled && onChange(),
    style:{
      width:16, height:16, flexShrink:0,
      border:`1px solid ${on ? 'var(--color-primary-normal)' : 'var(--color-border-base)'}`,
      background: on ? 'var(--color-primary-normal)' : 'var(--color-bg-card)',
      borderRadius:2, display:'inline-flex',
      alignItems:'center', justifyContent:'center',
      cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.4 : 1,
      transition:'all 160ms',
    }
  },
    checked && !indeterminate && h('svg', { width:10, height:10, viewBox:'0 0 10 10', fill:'none', stroke:'#fff', strokeWidth:1.5 },
      h('path', { d:'M1.5 5l2.5 2.5L8.5 2.5', strokeLinecap:'round', strokeLinejoin:'round' })
    ),
    indeterminate && h('span', { style:{ width:8, height:2, background:'#fff', display:'block' } })
  );
}

function Panel({ title, items, checkedKeys, showSearch, disabled, onCheck, onCheckAll }) {
  const [query, setQuery] = useState('');
  const filtered = query
    ? items.filter(i => String(i.title).toLowerCase().includes(query.toLowerCase()))
    : items;
  const enabled = filtered.filter(i => !i.disabled);
  const checked = enabled.filter(i => checkedKeys.includes(i.key)).length;
  const allChecked = enabled.length > 0 && checked === enabled.length;
  const someChecked = checked > 0 && checked < enabled.length;

  return h('div', {
    style:{
      width:200, height:280,
      border:'1px solid var(--color-border-base)',
      borderRadius:'var(--radius-4)',
      background:'var(--color-bg-card)',
      display:'flex', flexDirection:'column',
    }
  },
    h('div', {
      style:{
        padding:'8px 12px',
        borderBottom:'1px solid var(--color-divider-base-1)',
        display:'flex', alignItems:'center', gap:8,
        font:'400 14px/22px var(--font-sans)',
        background:'var(--color-bg-page)',
      }
    },
      h(Checkbox, {
        checked: allChecked,
        indeterminate: someChecked,
        disabled: disabled || enabled.length === 0,
        onChange: onCheckAll,
      }),
      h('span', { style:{ color:'var(--color-text-primary)', flex:1 } },
        checked > 0 ? `${checked}/${items.length} 项` : `${items.length} 项`
      ),
      h('span', { style:{ color:'var(--color-text-secondary)', font:'400 12px/20px var(--font-sans)' } }, title)
    ),
    showSearch && h('div', { style:{ padding:8, borderBottom:'1px solid var(--color-divider-base-1)' } },
      h('input', {
        value:query,
        disabled,
        onChange: e => setQuery(e.target.value),
        placeholder:'请输入搜索内容',
        style:{
          width:'100%', height:28, padding:'0 8px',
          border:'1px solid var(--color-border-base)',
          borderRadius:'var(--radius-4)',
          font:'400 13px/26px var(--font-sans)',
          color:'var(--color-text-primary)',
          outline:'none', boxSizing:'border-box',
        }
      })
    ),
    h('div', { style:{ flex:1, overflowY:'auto', padding:4 } },
      filtered.length === 0
        ? h('div', {
            style:{
              display:'flex', alignItems:'center', justifyContent:'center', height:'100%',
              color:'var(--color-text-auxiliary)', font:'400 13px/1.5 var(--font-sans)',
            }
          }, '暂无数据')
        : filtered.map(item => {
            const isChecked = checkedKeys.includes(item.key);
            const rowDisabled = disabled || item.disabled;
            return h('div', {
              key:item.key,
              onClick: () => !rowDisabled && onCheck(item.key),
              style:{
                display:'flex', alignItems:'center', gap:8,
                padding:'4px 8px', borderRadius:'var(--radius-4)',
                cursor: rowDisabled ? 'not-allowed' : 'pointer',
                color: rowDisabled ? 'var(--color-text-auxiliary)' : 'var(--color-text-primary)',
                font:'400 14px/22px var(--font-sans)',
                background: isChecked ? 'var(--color-primary-bg)' : 'transparent',
              },
              onMouseEnter: e => { if (!rowDisabled && !isChecked) e.currentTarget.style.background = 'var(--color-bg-page)'; },
              onMouseLeave: e => { if (!isChecked) e.currentTarget.style.background = 'transparent'; },
            },
              h(Checkbox, { checked:isChecked, disabled:rowDisabled, onChange: () => onCheck(item.key) }),
              h('span', { style:{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, item.title)
            );
          })
    )
  );
}

function ArrowBtn({ direction, disabled, onClick }) {
  return h('button', {
    onClick, disabled,
    style:{
      width:28, height:28, padding:0, border:'none',
      borderRadius:'var(--radius-4)',
      background: disabled ? 'var(--color-bg-hover)' : 'var(--color-primary-normal)',
      color: disabled ? 'var(--color-text-auxiliary)' : '#fff',
      cursor: disabled ? 'not-allowed' : 'pointer',
      display:'inline-flex', alignItems:'center', justifyContent:'center',
      transition:'background 160ms',
    }
  },
    h('svg', {
      width:12, height:12, viewBox:'0 0 12 12', fill:'none',
      stroke:'currentColor', strokeWidth:1.5,
      style:{ transform: direction === 'left' ? 'rotate(180deg)' : 'none' }
    }, h('path', { d:'M4 2l4 4-4 4', strokeLinecap:'round', strokeLinejoin:'round' }))
  );
}

function Transfer({ dataSource=[], targetKeys: tkProp, defaultTargetKeys=[], titles=['源列表','目标列表'], showSearch=false, disabled=false, onChange }) {
  const [internal, setInternal] = useState(defaultTargetKeys);
  const targetKeys = tkProp !== undefined ? tkProp : internal;
  const [leftChecked, setLeftChecked] = useState([]);
  const [rightChecked, setRightChecked] = useState([]);

  const leftItems = dataSource.filter(i => !targetKeys.includes(i.key));
  const rightItems = dataSource.filter(i => targetKeys.includes(i.key));

  const commit = (next, direction, moved) => {
    if (tkProp === undefined) setInternal(next);
    onChange && onChange(next, direction, moved);
  };

  const moveRight = () => {
    const moved = leftChecked.filter(k => {
      const it = dataSource.find(i => i.key === k);
      return it && !it.disabled;
    });
    commit([...targetKeys, ...moved], 'right', moved);
    setLeftChecked([]);
  };

  const moveLeft = () => {
    const moved = rightChecked.filter(k => {
      const it = dataSource.find(i => i.key === k);
      return it && !it.disabled;
    });
    commit(targetKeys.filter(k => !moved.includes(k)), 'left', moved);
    setRightChecked([]);
  };

  const toggleLeft = key => setLeftChecked(leftChecked.includes(key)
    ? leftChecked.filter(k => k !== key) : [...leftChecked, key]);
  const toggleRight = key => setRightChecked(rightChecked.includes(key)
    ? rightChecked.filter(k => k !== key) : [...rightChecked, key]);

  const toggleAllLeft = () => {
    const enabled = leftItems.filter(i => !i.disabled).map(i => i.key);
    setLeftChecked(leftChecked.length === enabled.length ? [] : enabled);
  };
  const toggleAllRight = () => {
    const enabled = rightItems.filter(i => !i.disabled).map(i => i.key);
    setRightChecked(rightChecked.length === enabled.length ? [] : enabled);
  };

  return h('div', { style:{ display:'flex', alignItems:'center', gap:8 } },
    h(Panel, {
      title:titles[0], items:leftItems, checkedKeys:leftChecked,
      showSearch, disabled, onCheck:toggleLeft, onCheckAll:toggleAllLeft,
    }),
    h('div', { style:{ display:'flex', flexDirection:'column', gap:8 } },
      h(ArrowBtn, { direction:'right', disabled: disabled || leftChecked.length === 0, onClick:moveRight }),
      h(ArrowBtn, { direction:'left', disabled: disabled || rightChecked.length === 0, onClick:moveLeft })
    ),
    h(Panel, {
      title:titles[1], items:rightItems, checkedKeys:rightChecked,
      showSearch, disabled, onCheck:toggleRight, onCheckAll:toggleAllRight,
    })
  );
}

const Group = ({ title, children }) =>
  h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
    h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
    h('div', { style:{
      padding:'var(--spacing-20)', background:'var(--color-bg-card)',
      border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
      display:'flex', gap:16, flexWrap:'wrap',
    } }, children)
  );

const DATA = Array.from({ length: 12 }, (_, i) => ({
  key:`item-${i}`,
  title:`选项 ${i + 1}`,
  disabled: i === 2,
}));

function App() {
  const [keys, setKeys] = useState(['item-1', 'item-4']);
  return h('div', { style:{ minHeight:'100vh', background:'var(--color-bg-page)' } },
    h('header', {
      style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)',
        padding:'var(--spacing-20) var(--spacing-24)',
        display:'flex', alignItems:'center', justifyContent:'space-between' }
    },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Transfer 穿梭框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', {
      style:{ maxWidth:720, margin:'0 auto',
        padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
        display:'flex', flexDirection:'column', gap:'var(--spacing-30)' }
    },
      h(Group, { title:'基础' }, h(Transfer, { dataSource:DATA, defaultTargetKeys:['item-0','item-3'] })),
      h(Group, { title:'带搜索' }, h(Transfer, { dataSource:DATA, defaultTargetKeys:['item-5'], showSearch:true })),
      h(Group, { title:'受控' },
        h(Transfer, { dataSource:DATA, targetKeys:keys, onChange:setKeys, titles:['可选项','已选项'] })
      ),
      h(Group, { title:'禁用' }, h(Transfer, { dataSource:DATA, defaultTargetKeys:['item-0'], disabled:true }))
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
