<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Layout 布局 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const Layout = ({ hasSider, style, children, ...rest }) => {
  const auto = hasSider ?? React.Children.toArray(children).some(
    c => React.isValidElement(c) && c.type?.__uink === 'Sider');
  return h('div', {
    style:{ display:'flex', flexDirection:auto?'row':'column', minHeight:'100vh',
      background:'var(--color-bg-page)', ...style }, ...rest
  }, children);
};
const Header = ({ style, ...rest }) => h('header', {
  style:{ height:64, flex:'0 0 64px', padding:'0 var(--spacing-24)',
    background:'var(--color-bg-card)', borderBottom:'1px solid var(--color-divider-base-1)',
    display:'flex', alignItems:'center', ...style }, ...rest
});
function Sider({ width=220, collapsed, collapsedWidth=64, theme='light', style, ...rest }) {
  const w = collapsed ? collapsedWidth : width;
  const dark = theme === 'dark';
  return h('aside', {
    style:{ width:w, flex:`0 0 ${w}px`,
      background: dark?'var(--color-text-primary)':'var(--color-bg-card)',
      color: dark?'var(--color-text-constant-normal)':'var(--color-text-primary)',
      borderRight: dark?'none':'1px solid var(--color-divider-base-1)',
      transition:'width var(--duration-fast) var(--easing-standard)',
      overflow:'hidden', ...style }, ...rest
  });
}
Sider.__uink = 'Sider';
const Content = ({ style, ...rest }) => h('main', {
  style:{ flex:'1 1 auto', padding:'var(--spacing-24)', minWidth:0, ...style }, ...rest
});
const Footer = ({ style, ...rest }) => h('footer', {
  style:{ padding:'var(--spacing-16) var(--spacing-24)', background:'var(--color-bg-card)',
    borderTop:'1px solid var(--color-divider-base-1)', color:'var(--color-text-auxiliary)',
    font:'400 14px/1.5 var(--font-sans)', textAlign:'center', ...style }, ...rest
});

const Logo = ({ dark }) => h('div', {
  style:{ font:'600 18px/1.2 var(--font-sans)',
    color: dark?'var(--color-text-constant-normal)':'var(--color-primary-normal)',
    padding:'var(--spacing-16) var(--spacing-24)' } }, 'Milesight IOT');

const NavItem = ({ active, dark, children }) => h('div', {
  style:{ height:40, display:'flex', alignItems:'center', padding:'0 var(--spacing-24)',
    color: active?(dark?'var(--color-text-constant-normal)':'var(--color-primary-normal)')
                 :(dark?'rgba(255,255,255,0.65)':'var(--color-text-secondary)'),
    background: active?(dark?'var(--color-primary-normal)':'var(--color-primary-bg)'):'transparent',
    font:'400 14px/22px var(--font-sans)', cursor:'pointer' } }, children);

const Card = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    background:'var(--color-bg-card)', overflow:'hidden' } }, children),
);

const DemoBasic = () => h(Layout, { style:{ minHeight:320 } },
  h(Header, null, 'Header'),
  h(Content, { style:{ background:'var(--color-bg-page)' } }, 'Content'),
  h(Footer, null, 'Footer · Milesight IOT ©2026'),
);
const DemoSider = () => h(Layout, { style:{ minHeight:360 } },
  h(Sider, null, h(Logo), h(NavItem, { active:true }, '概览'),
    h(NavItem, null, '云主机'), h(NavItem, null, '对象存储'), h(NavItem, null, '账单')),
  h(Layout, null, h(Header, null, 'Header'), h(Content, null, 'Content'), h(Footer, null, 'Footer')),
);
const DemoDark = () => h(Layout, { style:{ minHeight:360 } },
  h(Sider, { theme:'dark' }, h(Logo, { dark:true }),
    h(NavItem, { dark:true, active:true }, '概览'),
    h(NavItem, { dark:true }, '云主机'),
    h(NavItem, { dark:true }, '对象存储')),
  h(Layout, null, h(Header, null, 'Header'), h(Content, null, 'Content')),
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Layout 布局'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0'),
    ),
    h('main', { style:{ maxWidth:1200, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Card, { title:'基础 — Header / Content / Footer' }, h(DemoBasic)),
      h(Card, { title:'侧边栏 — Sider 220 · Header 64' }, h(DemoSider)),
      h(Card, { title:'深色侧边栏 — theme=dark' }, h(DemoDark)),
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
