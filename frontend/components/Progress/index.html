<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Progress 进度条 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
@keyframes uink-progress-shine { from { background-position: -200% 0 } to { background-position: 200% 0 } }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const STATUS_COLOR = {
  normal:'var(--color-primary-normal)', active:'var(--color-primary-normal)',
  success:'#3491fa', exception:'#f13535',
};
const SIZE_LINE = { sm:4, md:8, lg:12 };
const SIZE_CIRCLE = { sm:64, md:96, lg:128 };

const Progress = ({ percent=0, successPercent, status='normal', type='line', size='md',
  showInfo=true, strokeColor, trailColor='var(--color-divider-base-1)', format, style }) => {
  const p = Math.min(100, Math.max(0, percent));
  const isDone = p >= 100;
  const eff = isDone && status === 'normal' ? 'success' : status;
  const color = strokeColor ?? STATUS_COLOR[eff];
  if (type === 'circle') {
    const dim = typeof size === 'number' ? size : SIZE_CIRCLE[size];
    const stroke = Math.max(4, dim / 14);
    const r = (dim - stroke) / 2;
    const c = 2 * Math.PI * r;
    const dash = c * (p / 100);
    const label = format ? format(p) : (eff === 'success' ? '✓' : eff === 'exception' ? '✕' : `${p}%`);
    return h('div', { style:{ position:'relative', width:dim, height:dim, ...style } },
      h('svg', { width:dim, height:dim, style:{ transform:'rotate(-90deg)' } },
        h('circle', { cx:dim/2, cy:dim/2, r, stroke:trailColor, strokeWidth:stroke, fill:'none' }),
        h('circle', { cx:dim/2, cy:dim/2, r, stroke:color, strokeWidth:stroke, fill:'none',
          strokeLinecap:'round', strokeDasharray:`${dash} ${c}`,
          style:{ transition:'stroke-dasharray 240ms' } })),
      showInfo && h('div', { style:{ position:'absolute', inset:0,
        display:'flex', alignItems:'center', justifyContent:'center',
        font:`500 ${Math.max(12, dim/6)}px/1 var(--font-sans)`,
        color: eff === 'exception' ? '#f13535' : 'var(--color-text-primary)' } }, label)
    );
  }
  const ht = typeof size === 'number' ? size : SIZE_LINE[size];
  const success = successPercent !== undefined ? Math.min(p, Math.max(0, successPercent)) : 0;
  const label = format ? format(p) :
    eff === 'success' ? h('span', { style:{ color:'#3491fa' } }, '✓')
    : eff === 'exception' ? h('span', { style:{ color:'#f13535' } }, '✕')
    : `${p}%`;
  return h('div', { style:{ display:'flex', alignItems:'center', gap:8, ...style } },
    h('div', { style:{ flex:1, height:ht, background:trailColor,
      borderRadius:ht, overflow:'hidden', position:'relative' } },
      h('div', { style:{ width:`${p}%`, height:'100%', background:color,
        borderRadius:ht, transition:'width 240ms cubic-bezier(0.2,0,0,1)',
        ...(eff === 'active' ? { backgroundImage:
          'linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%)',
          backgroundSize:'200% 100%', animation:'uink-progress-shine 1.4s linear infinite' } : null) } }),
      success > 0 && h('div', { style:{ position:'absolute', top:0, left:0, height:'100%',
        width:`${success}%`, background:'#3491fa', borderRadius:ht } })),
    showInfo && h('span', { style:{ font:'400 13px/1 var(--font-sans)',
      color:'var(--color-text-secondary)', minWidth:36, textAlign:'right' } }, label)
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } }, children)
);

function App() {
  const [p, setP] = useState(40);
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Progress 进度条'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础 line' },
        h(Progress, { percent:30 }),
        h(Progress, { percent:70 }),
        h(Progress, { percent:100 }),
        h(Progress, { percent:50, status:'exception' }),
        h(Progress, { percent:60, status:'active' })),
      h(Group, { title:'带 success 段' },
        h(Progress, { percent:75, successPercent:50 })),
      h(Group, { title:'尺寸' },
        h(Progress, { percent:50, size:'sm' }),
        h(Progress, { percent:50, size:'md' }),
        h(Progress, { percent:50, size:'lg' })),
      h(Group, { title:'circle' },
        h('div', { style:{ display:'flex', gap:24, alignItems:'center' } },
          h(Progress, { type:'circle', percent:p }),
          h(Progress, { type:'circle', percent:100 }),
          h(Progress, { type:'circle', percent:70, status:'exception' }),
          h(Progress, { type:'circle', percent:p, size:'sm' })),
        h('div', { style:{ display:'flex', gap:8 } },
          h('button', { onClick:() => setP(v => Math.max(0, v - 10)),
            style:{ height:28, padding:'0 12px', border:'1px solid var(--color-border-base)',
              borderRadius:'var(--radius-4)', background:'var(--color-bg-card)', cursor:'pointer' } }, '−'),
          h('button', { onClick:() => setP(v => Math.min(100, v + 10)),
            style:{ height:28, padding:'0 12px', border:'1px solid var(--color-border-base)',
              borderRadius:'var(--radius-4)', background:'var(--color-bg-card)', cursor:'pointer' } }, '+')))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
