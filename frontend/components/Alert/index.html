<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Alert 警告提示 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const TONE = {
  info:    { bg:'#E7F0FE', bd:'#B7CFF9', fg:'#1A66F2', icon:'M12 8v5m0 3h.01M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  success: { bg:'#f0f9ff', bd:'#A8D8B9', fg:'#3491fa', icon:'M8 12.5l3 3 6-7M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  warning: { bg:'#FFF4E1', bd:'#F5D08A', fg:'#C77700', icon:'M12 8v5m0 3h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.41 0Z' },
  error:   { bg:'#FDECEC', bd:'#F2A8A8', fg:'#f13535', icon:'M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Zm-3-13 6 6m0-6-6 6' },
};

const Alert = ({ type='info', message, description, showIcon, closable, banner,
  action, onClose, style }) => {
  const [hidden, setHidden] = useState(false);
  if (hidden) return null;
  const tone = TONE[type];
  return h('div', { role:'alert', style:{
    display:'flex', alignItems: description ? 'flex-start' : 'center', gap:10,
    padding: description ? '14px 16px' : '8px 14px',
    background:tone.bg, color:'var(--color-text-primary)',
    border: banner ? 'none' : `1px solid ${tone.bd}`,
    borderRadius: banner ? 0 : 'var(--radius-4)', ...style
  } },
    showIcon && h('svg', { width: description ? 20 : 16, height: description ? 20 : 16,
      viewBox:'0 0 24 24', fill:'none', stroke:tone.fg, strokeWidth:1.8,
      strokeLinecap:'round', strokeLinejoin:'round',
      style:{ flexShrink:0, marginTop: description ? 2 : 0 } },
      h('path', { d:tone.icon })),
    h('div', { style:{ flex:1, minWidth:0 } },
      h('div', { style:{ font: description ? '500 14px/22px var(--font-sans)' : '400 13px/20px var(--font-sans)',
        color:'var(--color-text-primary)' } }, message),
      description && h('div', { style:{ marginTop:4, font:'400 13px/20px var(--font-sans)',
        color:'var(--color-text-secondary)' } }, description)),
    action,
    closable && h('span', { onClick:() => { setHidden(true); onClose?.(); },
      style:{ cursor:'pointer', color:'var(--color-text-auxiliary)', display:'inline-flex',
        marginLeft:4, padding:2, flexShrink:0 } },
      h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
        stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round' },
        h('path', { d:'M6 6l12 12M18 6L6 18' })))
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Alert 警告提示'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础 — 四种状态' },
        h(Alert, { type:'info', message:'信息提示 — 当前实例正在维护中' }),
        h(Alert, { type:'success', message:'操作成功 — 实例已成功创建' }),
        h(Alert, { type:'warning', message:'警告 — 账户余额低于阈值' }),
        h(Alert, { type:'error', message:'错误 — 网络异常，请重试' })),
      h(Group, { title:'带图标' },
        h(Alert, { type:'info', showIcon:true, message:'带图标的信息提示' }),
        h(Alert, { type:'success', showIcon:true, message:'带图标的成功提示' }),
        h(Alert, { type:'warning', showIcon:true, message:'带图标的警告提示' }),
        h(Alert, { type:'error', showIcon:true, message:'带图标的错误提示' })),
      h(Group, { title:'带描述' },
        h(Alert, { type:'warning', showIcon:true, message:'余额预警',
          description:'账户余额不足 ¥100，可能影响后续计费。请及时充值。' }),
        h(Alert, { type:'info', showIcon:true, message:'变更通知',
          description:'区域 华东 1 将于 2026-05-15 02:00 进行例行维护，预计 30 分钟。' })),
      h(Group, { title:'可关闭 / 带操作' },
        h(Alert, { type:'info', showIcon:true, closable:true, message:'点击右上 × 即可关闭' }),
        h(Alert, { type:'warning', showIcon:true, message:'发现新版本 v2.0.0',
          action: h('button', { style:{
            height:28, padding:'0 12px', font:'400 13px/1 var(--font-sans)',
            border:'1px solid #C77700', color:'#C77700', background:'transparent',
            borderRadius:'var(--radius-4)', cursor:'pointer'
          } }, '立即升级') })),
      h(Group, { title:'Banner' },
        h(Alert, { banner:true, type:'info', showIcon:true,
          message:'全站公告 — 系统将于今晚 22:00 进行维护' }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
