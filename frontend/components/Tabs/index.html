<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Tabs 标签页 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const SIZE = {
  sm: { font:'400 12px/20px var(--font-sans)', pad:'6px 12px' },
  md: { font:'400 14px/22px var(--font-sans)', pad:'8px 16px' },
  lg: { font:'500 16px/24px var(--font-sans)', pad:'10px 20px' },
};

const Tabs = ({ items, activeKey, defaultActiveKey, onChange,
  variant='line', size='md', position='top', centered, tabBarExtraContent, style }) => {
  const [inner, setInner] = useState(defaultActiveKey ?? items[0]?.key);
  const active = activeKey ?? inner;
  const setActive = k => { if (activeKey === undefined) setInner(k); onChange?.(k); };
  const vertical = position === 'left' || position === 'right';
  const isLine = variant === 'line';
  const isCard = variant === 'card';
  const isSeg = variant === 'segment';
  const s = SIZE[size];

  const barStyle = isSeg
    ? { display:'inline-flex', padding:2, gap:2, background:'var(--color-divider-base-1)', borderRadius:'var(--radius-8)' }
    : { display:'flex', flexDirection: vertical ? 'column' : 'row', gap: isCard ? 4 : 24,
        borderBottom: isLine && !vertical ? '1px solid var(--color-divider-base-1)' : undefined,
        borderRight: isLine && position === 'left' ? '1px solid var(--color-divider-base-1)' : undefined,
        borderLeft: isLine && position === 'right' ? '1px solid var(--color-divider-base-1)' : undefined,
        justifyContent: centered ? 'center' : 'flex-start', position:'relative' };

  const tabStyle = (k, disabled) => {
    const selected = active === k;
    if (isSeg) return { padding:s.pad, font:s.font, borderRadius:'var(--radius-4)',
      cursor: disabled ? 'not-allowed' : 'pointer',
      color: disabled ? 'var(--color-text-disable)' : (selected ? 'var(--color-text-primary)' : 'var(--color-text-secondary)'),
      background: selected ? 'var(--color-bg-card)' : 'transparent',
      boxShadow: selected ? '0 1px 2px rgba(11,18,32,0.08)' : 'none',
      transition:'all 160ms', userSelect:'none' };
    if (isCard) return { padding:s.pad, font:s.font,
      cursor: disabled ? 'not-allowed' : 'pointer',
      color: disabled ? 'var(--color-text-disable)' : (selected ? 'var(--color-primary-normal)' : 'var(--color-text-secondary)'),
      background: selected ? 'var(--color-bg-card)' : 'var(--color-bg-page)',
      border:'1px solid var(--color-divider-base-1)',
      borderBottom: vertical ? '1px solid var(--color-divider-base-1)' : (selected ? '1px solid var(--color-bg-card)' : '1px solid var(--color-divider-base-1)'),
      borderRadius:'var(--radius-4) var(--radius-4) 0 0',
      marginBottom: vertical ? 0 : -1, userSelect:'none' };
    return { padding:s.pad, font:s.font,
      cursor: disabled ? 'not-allowed' : 'pointer',
      color: disabled ? 'var(--color-text-disable)' : (selected ? 'var(--color-primary-normal)' : 'var(--color-text-secondary)'),
      borderBottom: !vertical ? `2px solid ${selected ? 'var(--color-primary-normal)' : 'transparent'}` : 'none',
      borderRight: position === 'left' ? `2px solid ${selected ? 'var(--color-primary-normal)' : 'transparent'}` : 'none',
      borderLeft: position === 'right' ? `2px solid ${selected ? 'var(--color-primary-normal)' : 'transparent'}` : 'none',
      marginBottom: !vertical ? -1 : 0, marginRight: position === 'left' ? -1 : 0,
      transition:'color 160ms', userSelect:'none',
      display:'inline-flex', alignItems:'center', gap:6 };
  };

  const content = items.find(i => i.key === active)?.children;
  return h('div', { style:{ display:'flex',
    flexDirection: position === 'top' ? 'column' : position === 'bottom' ? 'column-reverse'
      : position === 'left' ? 'row' : 'row-reverse',
    gap: vertical ? 24 : 0, ...style } },
    h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:16 } },
      h('div', { style: barStyle },
        items.map(it => h('div', { key:it.key,
          onClick:() => !it.disabled && setActive(it.key),
          style: tabStyle(it.key, it.disabled) }, it.icon, it.label))),
      tabBarExtraContent && h('div', null, tabBarExtraContent)
    ),
    h('div', { style:{ padding:'16px 0', flex:1, minWidth:0 } }, content)
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' } }, children)
);

const items = [
  { key:'1', label:'基础信息', children: h('p', null, '基础信息内容 — 描述实例配置与状态。') },
  { key:'2', label:'监控告警', children: h('p', null, '监控告警内容 — CPU、内存、网络曲线。') },
  { key:'3', label:'安全组', children: h('p', null, '安全组内容 — 入站/出站规则。'), disabled:true },
  { key:'4', label:'操作日志', children: h('p', null, '操作日志内容 — 最近 7 天审计。') },
];

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Tabs 标签页'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础 — line' }, h(Tabs, { items, defaultActiveKey:'1' })),
      h(Group, { title:'卡片 — card' }, h(Tabs, { items, variant:'card', defaultActiveKey:'1' })),
      h(Group, { title:'分段 — segment' }, h(Tabs, { items, variant:'segment', defaultActiveKey:'1' })),
      h(Group, { title:'位置 — left' }, h(Tabs, { items, position:'left', defaultActiveKey:'1' })),
      h(Group, { title:'尺寸 — large + extra' },
        h(Tabs, { items, size:'lg', defaultActiveKey:'1',
          tabBarExtraContent: h('button', { style:{ height:32, padding:'0 12px',
            borderRadius:'var(--radius-4)', border:'1px solid var(--color-primary-normal)',
            color:'var(--color-primary-normal)', background:'transparent', cursor:'pointer' } }, '新增') }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
