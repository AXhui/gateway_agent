<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TimePicker 时间选择框 — Milesight IOT Web v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;
const { useState, useRef, useEffect } = React;

const pad = n => String(n).padStart(2, '0');
const parse = s => {
  const [h=0, m=0, sec=0] = (s||'').split(':').map(n => parseInt(n, 10) || 0);
  return [h, m, sec];
};

function Column({ items, active, onPick }) {
  return h('div', {
    style:{
      width:56, height:224, overflowY:'auto',
      borderRight:'1px solid var(--color-divider-base-1)',
    }
  },
    items.map(n => h('div', {
      key:n,
      onClick: () => onPick(n),
      style:{
        height:28, lineHeight:'28px', textAlign:'center', cursor:'pointer',
        font:'400 14px/28px var(--font-sans)',
        color: n === active ? 'var(--color-primary-normal)' : 'var(--color-text-primary)',
        background: n === active ? 'var(--color-primary-bg)' : 'transparent',
        fontWeight: n === active ? 500 : 400,
      },
      onMouseEnter: e => { if (n !== active) e.currentTarget.style.background = 'var(--color-bg-page)'; },
      onMouseLeave: e => { if (n !== active) e.currentTarget.style.background = 'transparent'; },
    }, pad(n)))
  );
}

function TimePicker({ value: vProp, defaultValue='', placeholder='请选择时间', format='HH:mm:ss', disabled=false, onChange }) {
  const [internal, setInternal] = useState(defaultValue);
  const value = vProp !== undefined ? vProp : internal;
  const [open, setOpen] = useState(false);
  const [hover, setHover] = useState(false);
  const ref = useRef(null);
  const showSec = format === 'HH:mm:ss';
  const [hh, mm, ss] = parse(value);

  useEffect(() => {
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const update = (nh, nm, ns) => {
    const next = showSec ? `${pad(nh)}:${pad(nm)}:${pad(ns)}` : `${pad(nh)}:${pad(nm)}`;
    if (vProp === undefined) setInternal(next);
    onChange && onChange(next);
  };

  const hours = Array.from({ length: 24 }, (_, i) => i);
  const minutes = Array.from({ length: 60 }, (_, i) => i);
  const secs = Array.from({ length: 60 }, (_, i) => i);

  return h('div', { ref, style:{ position:'relative', width:200 } },
    h('div', {
      onClick: () => !disabled && setOpen(o => !o),
      onMouseEnter: () => setHover(true),
      onMouseLeave: () => setHover(false),
      style:{
        height:32, padding:'0 12px',
        border:`1px solid ${(hover || open) ? 'var(--color-primary-normal)' : 'var(--color-border-base)'}`,
        borderRadius:'var(--radius-4)',
        font:'400 14px/30px var(--font-sans)',
        color: value ? 'var(--color-text-primary)' : 'var(--color-text-auxiliary)',
        background: disabled ? 'var(--color-bg-hover)' : 'var(--color-bg-card)',
        cursor: disabled ? 'not-allowed' : 'pointer',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        transition:'border-color 160ms',
      }
    },
      h('span', null, value || placeholder),
      h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.5, style:{ opacity:0.6 } },
        h('circle', { cx:12, cy:12, r:9 }),
        h('path', { d:'M12 7v5l3 2', strokeLinecap:'round' })
      )
    ),
    open && h('div', {
      style:{
        position:'absolute', top:'100%', left:0, marginTop:4,
        background:'var(--color-bg-card)',
        border:'1px solid var(--color-divider-base-1)',
        borderRadius:'var(--radius-4)',
        boxShadow:'var(--shadow-2)',
        zIndex:1000, display:'flex', flexDirection:'column',
      }
    },
      h('div', { style:{ display:'flex' } },
        h(Column, { items:hours, active:hh, onPick:n => update(n, mm, ss) }),
        h(Column, { items:minutes, active:mm, onPick:n => update(hh, n, ss) }),
        showSec && h(Column, { items:secs, active:ss, onPick:n => update(hh, mm, n) })
      ),
      h('div', {
        style:{
          display:'flex', justifyContent:'space-between', alignItems:'center',
          padding:'8px 12px', borderTop:'1px solid var(--color-divider-base-1)',
        }
      },
        h('span', {
          onClick: () => { const d = new Date(); update(d.getHours(), d.getMinutes(), d.getSeconds()); },
          style:{ color:'var(--color-primary-normal)', cursor:'pointer', font:'400 13px/1.4 var(--font-sans)' }
        }, '此刻'),
        h('button', {
          onClick: () => setOpen(false),
          style:{
            height:24, padding:'0 12px', border:'none',
            background:'var(--color-primary-normal)', color:'#fff',
            borderRadius:'var(--radius-4)', cursor:'pointer',
            font:'500 12px/1 var(--font-sans)',
          }
        }, '确定')
      )
    )
  );
}

const Group = ({ title, children }) =>
  h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
    h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
    h('div', { style:{
      padding:'var(--spacing-20)', background:'var(--color-bg-card)',
      border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
      display:'flex', gap:16, flexWrap:'wrap',
    } }, children)
  );

function App() {
  const [v, setV] = useState('14:30:00');
  return h('div', { style:{ minHeight:'100vh', background:'var(--color-bg-page)' } },
    h('header', {
      style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)',
        padding:'var(--spacing-20) var(--spacing-24)',
        display:'flex', alignItems:'center', justifyContent:'space-between' }
    },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'TimePicker 时间选择框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', {
      style:{ maxWidth:720, margin:'0 auto',
        padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
        display:'flex', flexDirection:'column', gap:'var(--spacing-30)' }
    },
      h(Group, { title:'基础' }, h(TimePicker, { placeholder:'请选择时间' })),
      h(Group, { title:'HH:mm 格式' }, h(TimePicker, { format:'HH:mm', defaultValue:'09:00' })),
      h(Group, { title:'受控' },
        h(TimePicker, { value:v, onChange:setV }),
        h('span', { style:{ alignSelf:'center', color:'var(--color-text-secondary)' } }, `当前值：${v}`)
      ),
      h(Group, { title:'禁用' }, h(TimePicker, { defaultValue:'08:30:00', disabled:true }))
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
