<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Avatar 头像 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const SIZE_MAP = { sm:24, md:32, lg:40, xl:64 };
const resolveSize = s => typeof s === 'number' ? s : SIZE_MAP[s];

const Avatar = ({ src, icon, shape='circle', size='md', alt, children, style, className, onClick }) => {
  const px = resolveSize(size);
  const fontSize = Math.max(12, Math.round(px * 0.42));
  return h('span', { className, onClick, style:{
    display:'inline-flex', alignItems:'center', justifyContent:'center',
    width:px, height:px,
    borderRadius: shape==='circle'?'50%':'var(--radius-4)',
    background:'var(--color-border-base)', color:'var(--color-text-constant-normal)',
    overflow:'hidden', verticalAlign:'middle',
    font:`500 ${fontSize}px/1 var(--font-sans)`,
    cursor: onClick?'pointer':'default', flexShrink:0, ...style,
  } },
    src ? h('img', { src, alt, style:{ width:'100%', height:'100%', objectFit:'cover' } })
      : icon ?? children
  );
};

const AvatarGroup = ({ maxCount, size='md', shape='circle', children, style, className }) => {
  const list = React.Children.toArray(children);
  const visible = maxCount ? list.slice(0, maxCount) : list;
  const overflow = maxCount ? list.length - visible.length : 0;
  const px = resolveSize(size);
  return h('div', { className, style:{ display:'inline-flex', ...style } },
    visible.map((child, i) => h('span', { key:i, style:{
      marginLeft: i===0 ? 0 : -Math.round(px*0.25),
      border:'2px solid var(--color-bg-card)',
      borderRadius: shape==='circle'?'50%':'var(--radius-4)',
      display:'inline-flex',
    } }, React.isValidElement(child) ? React.cloneElement(child, { size, shape }) : child)),
    overflow > 0 && h('span', { style:{
      marginLeft:-Math.round(px*0.25),
      border:'2px solid var(--color-bg-card)',
      borderRadius: shape==='circle'?'50%':'var(--radius-4)',
      display:'inline-flex',
    } }, h(Avatar, { size, shape,
      style:{ background:'var(--color-bg-hover)', color:'var(--color-text-secondary)' } }, `+${overflow}`))
  );
};

const UserIcon = () => h('svg', { width:20, height:20, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true },
  h('circle', { cx:12, cy:8, r:4 }),
  h('path', { d:'M4 20c1.5-4 5-6 8-6s6.5 2 8 6' }));

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', gap:'var(--spacing-16)', flexWrap:'wrap', alignItems:'center' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Avatar 头像'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'尺寸 — sm / md / lg / xl' },
        h(Avatar, { size:'sm' }, 'U'),
        h(Avatar, { size:'md' }, 'U'),
        h(Avatar, { size:'lg' }, 'U'),
        h(Avatar, { size:'xl' }, 'U')),
      h(Group, { title:'形状' },
        h(Avatar, { shape:'circle', style:{ background:'var(--color-primary-normal)' } }, '圆'),
        h(Avatar, { shape:'square', style:{ background:'var(--color-primary-normal)' } }, '方')),
      h(Group, { title:'文字 / 图标 / 图片' },
        h(Avatar, { style:{ background:'var(--color-primary-normal)' } }, 'UI'),
        h(Avatar, { icon:h(UserIcon), style:{ background:'var(--color-primary-normal)' } }),
        h(Avatar, { src:'https://avatars.githubusercontent.com/u/1?v=4', alt:'avatar' })),
      h(Group, { title:'组合 — 带溢出' },
        h(AvatarGroup, { maxCount:3 },
          h(Avatar, { style:{ background:'var(--color-primary-normal)' } }, 'A'),
          h(Avatar, { style:{ background:'var(--color-primary-normal)' } }, 'B'),
          h(Avatar, { style:{ background:'var(--color-warm-normal)' } }, 'C'),
          h(Avatar, { style:{ background:'var(--color-error-normal)' } }, 'D'),
          h(Avatar, { style:{ background:'var(--color-remind-normal)' } }, 'E')))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
