<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const IMG = { sm:60, md:100, lg:140 };
const FONT = {
  sm:'400 12px/20px var(--font-sans)',
  md:'400 14px/22px var(--font-sans)',
  lg:'400 16px/24px var(--font-sans)',
};

const Illu = ({ size }) => h('svg', { width:size, height:size*0.7, viewBox:'0 0 200 140',
  fill:'none', 'aria-hidden':true },
  h('ellipse', { cx:100, cy:120, rx:80, ry:8, fill:'var(--color-divider-base-1)' }),
  h('path', { d:'M40 60h120l-20 50H60L40 60Z', fill:'var(--color-bg-page)',
    stroke:'var(--color-border-base-disable)', strokeWidth:1.5, strokeLinejoin:'round' }),
  h('path', { d:'M60 60V40h80v20', stroke:'var(--color-border-base-disable)', strokeWidth:1.5, fill:'none' }),
  h('path', { d:'M85 78c0-4 4-7 15-7s15 3 15 7', stroke:'var(--color-text-disable)',
    strokeWidth:1.5, fill:'none', strokeLinecap:'round' })
);

const Empty = ({ image, description='暂无数据', size='md', children, style, className }) =>
  h('div', { className, style:{
    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
    gap:'var(--spacing-12)', padding:'var(--spacing-20)', ...style,
  } },
    h('div', { style:{ display:'inline-flex' } }, image ?? h(Illu, { size:IMG[size] })),
    description && h('div', { style:{ font:FONT[size], color:'var(--color-text-auxiliary)' } }, description),
    children && h('div', null, children)
  );

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', gap:'var(--spacing-20)', flexWrap:'wrap' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Empty 空状态'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'尺寸' },
        h(Empty, { size:'sm' }),
        h(Empty, { size:'md' }),
        h(Empty, { size:'lg' })),
      h(Group, { title:'自定义文案' },
        h(Empty, { description:'没有匹配的资源' })),
      h(Group, { title:'带操作' },
        h(Empty, { description:'还没有创建任何实例' },
          h('button', { style:{ height:32, padding:'0 16px', border:'none',
            background:'var(--color-bg-page)', color:'var(--color-text-primary)',
            borderRadius:'var(--radius-4)', cursor:'pointer' } }, '立即创建')))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
