<style>

  --color-green-01:#ebfaef; --color-green-02:#beedcc; --color-green-03:#90e0ab;
  --color-green-04:#66d48e; --color-green-05:#40c776; --color-green-06:#1eba62;
  --color-green-07:#10944e; --color-green-08:#076e3a; --color-green-09:#014726;
  --color-green-10:#002113; --color-green-06-transparent:#1eba6221;
  --color-red-01:#fff2f0; --color-red-02:#ffe0db; --color-red-03:#ffbab3;
  --color-red-04:#ff928a; --color-red-05:#ff6661; --color-red-06:#f13535;
  --color-red-07:#cc2328; --color-red-08:#a6141e; --color-red-09:#800915;
  --color-red-10:#590511; --color-red-06-transparent:#f1353521;
  --color-orange-01:#fff7f0; --color-orange-02:#ffead9; --color-orange-03:#ffd1b0;
  --color-orange-04:#ffb587; --color-orange-05:#ff975e; --color-orange-06:#f77234;
  --color-orange-07:#d15321; --color-orange-08:#ab3913; --color-orange-09:#832308;
  --color-orange-10:#5e1505; --color-orange-06-transparent:#f7723421;
  --color-yellow-01:#fffdeb; --color-yellow-02:#fff6c2; --color-yellow-03:#ffec99;
  --color-yellow-04:#ffe070; --color-yellow-05:#ffd147; --color-yellow-06:#f7ba1e;
  --color-yellow-07:#d1940f; --color-yellow-08:#ab7003; --color-yellow-09:#855200;
  --color-yellow-10:#5e3700; --color-yellow-06-transparent:#f7ba1e21;
  --color-gray-01:#f7f8fa; --color-gray-02:#f2f3f5; --color-gray-03:#e5e6eb;
  --color-gray-04:#c9cdd4; --color-gray-05:#a9aeb8; --color-gray-06:#86909c;

  --color-cyan-01:#e6fffe; --color-cyan-02:#b8ffff; --color-cyan-03:#8ffbff;
  --color-cyan-04:#66f5ff; --color-cyan-05:#3ce7fa; --color-cyan-06:#12d1ee;
  --color-cyan-07:#06a7c7; --color-cyan-08:#0081a1; --color-cyan-09:#005e7a;
  --color-cyan-10:#003e54; --color-cyan-06-transparent:#12d1ee21;
  --color-darkblue-01:#e6f6ff; --color-darkblue-02:#b1d8f2; --color-darkblue-03:#83bbe6;
  --color-darkblue-04:#599dd9; --color-darkblue-05:#3380cc; --color-darkblue-06:#1261be;
  --color-darkblue-07:#064699; --color-darkblue-08:#002e73; --color-darkblue-09:#001c4d;
  --color-darkblue-10:#000d26; --color-darkblue-06-transparent:#1261be21;
  --color-text-primary:#272E3B;

  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
input{font-family:inherit}
</style>

<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const HEIGHT = { sm:24, md:32, lg:40 };
const FONT = {
  sm:'400 12px/20px var(--font-sans)',
  md:'400 14px/22px var(--font-sans)',
  lg:'400 16px/24px var(--font-sans)',
};

const ChevronDown = ({ open }) => h('svg', { width:12, height:12, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round',
  style:{ transition:'transform var(--duration-fast) var(--easing-standard)',
    transform: open?'rotate(180deg)':'rotate(0deg)' } },
  h('path', { d:'M6 9l6 6 6-6' }));

const TagX = ({ onClick }) => h('svg', { onClick, width:10, height:10, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:2.5, strokeLinecap:'round', strokeLinejoin:'round',
  style:{ cursor:'pointer', flex:'none' } }, h('path', { d:'M6 6l12 12M18 6L6 18' }));

const Select = ({ options, value, defaultValue, placeholder='请选择',
  size='md', status='default', mode, multiple, tags, showSearch, allowClear,
  open: openProp, defaultOpen, disabled, onOpenChange, onChange, style, className }) => {
  const isMultiple = mode === 'multiple' || mode === 'tags' || multiple || tags;
  const [inner, setInner] = useState(defaultValue ?? (isMultiple ? [] : undefined));
  const [innerOpen, setInnerOpen] = useState(!!defaultOpen);
  const [query, setQuery] = useState('');
  const [hi, setHi] = useState(-1);
  const isControlled = value !== undefined;
  const v = isControlled ? value : inner;
  const ref = useRef(null);

  const open = openProp !== undefined ? openProp : innerOpen;
  const setOpen = o => { if (openProp === undefined) setInnerOpen(o); onOpenChange?.(o); };

  useEffect(() => {
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const set = val => { if (!isControlled) setInner(val); onChange?.(val); };
  const selectedArr = isMultiple ? (v ?? []) : (v ? [v] : []);
  const hasValue = isMultiple ? selectedArr.length > 0 : v !== undefined && v !== null;
  const filtered = showSearch && query
    ? options.filter(o => String(o.label).toLowerCase().includes(query.toLowerCase()))
    : options;

  const pickOption = o => {
    if (o.disabled) return;
    if (isMultiple) {
      const next = selectedArr.includes(o.value)
        ? selectedArr.filter(x => x !== o.value)
        : [...selectedArr, o.value];
      set(next);
      setHi(-1);
    } else { set(o.value); setOpen(false); }
  };

  const borderColor = status==='error' ? 'var(--color-error-normal)'
    : open ? 'var(--color-primary-normal)' : 'var(--color-border-base)';

  return h('div', { ref, className, style:{ position:'relative', display:'inline-block', minWidth:160, ...style } },
    h('div', {
      className,
      tabIndex: disabled ? undefined : 0,
      role: 'combobox',
      'aria-expanded': open,
      'aria-haspopup': 'listbox',
      onClick: () => !disabled && setOpen(o => !o),
      onKeyDown: e => {
        if (disabled) return;
        if (!open && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === ' ')) { e.preventDefault(); setOpen(true); return; }
        if (!open) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setHi(i => (i + 1) % Math.max(filtered.length, 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHi(i => (i - 1 + Math.max(filtered.length, 1)) % Math.max(filtered.length, 1)); }
        else if (e.key === 'Enter') {
          e.preventDefault();
          const o = filtered[hi];
          if (o) pickOption(o);
        }
        else if (e.key === 'Escape') { setOpen(false); }
      },
      style:{
        minHeight: HEIGHT[size],
        padding: isMultiple ? '2px 28px 2px 8px' : `0 28px 0 var(--spacing-12)`,
        background: disabled?'var(--color-bg-hover)':'var(--color-bg-card)',
        border:`1px solid ${borderColor}`,
        borderRadius:'var(--radius-4)',
        color: disabled?'var(--color-text-disable)':'var(--color-text-primary)',
        font: FONT[size],
        cursor: disabled?'not-allowed':'pointer',
        display:'flex', alignItems:'center', flexWrap:'wrap', gap:4,
        boxShadow: open
          ? `0 0 0 2px ${status==='error'?'rgba(241,53,53,0.12)':'rgba(52,145,250,0.12)'}`
          : 'none',
        transition:'border-color var(--duration-fast), box-shadow var(--duration-fast)',
        position:'relative', outline:'none',
      }
    },
      isMultiple && selectedArr.length > 0
        ? selectedArr.map(val => {
            const opt = options.find(o => o.value === val);
            return h('span', { key:val, style:{
              display:'inline-flex', alignItems:'center', gap:4,
              padding:'0 6px', height: HEIGHT[size] - 8,
              background:'var(--color-bg-hover)', borderRadius:'var(--radius-2)',
              font: FONT[size],
            } },
              h('span', null, opt?.label ?? val),
              h(TagX, { onClick: e => { e.stopPropagation(); set(selectedArr.filter(x => x !== val)); } })
            );
          })
        : selectedArr.length === 0
          ? h('span', { style:{ color:'var(--color-text-auxiliary)' } }, placeholder)
          : h('span', null, options.find(o => o.value === selectedArr[0])?.label ?? selectedArr[0]),
      allowClear && hasValue && !disabled && h('svg', {
        width:12, height:12, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
        strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round',
        onClick: e => { e.stopPropagation(); set(isMultiple ? [] : undefined); },
        style:{ position:'absolute', right:24, top:'50%', transform:'translateY(-50%)', color:'var(--color-text-auxiliary)', cursor:'pointer', flex:'none' },
      }, h('path', { d:'M6 6l12 12M18 6L6 18' })),
      h('span', { style:{
        position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
        display:'inline-flex', color:'var(--color-text-auxiliary)',
      } }, h(ChevronDown, { open }))
    ),
    open && !disabled && h('div', { style:{
      position:'absolute', top:'100%', left:0, right:0, marginTop:4, zIndex:1400,
      background:'var(--color-bg-card)', border:'1px solid var(--color-divider-base-1)',
      borderRadius:'var(--radius-8)', boxShadow:'0 6px 20px rgba(11,18,32,0.08)',
      padding:4, maxHeight:256, overflow:'auto',
    } },
      showSearch && h('input', {
        autoFocus:true, value:query, onChange: e => setQuery(e.target.value), placeholder:'搜索',
        style:{ width:'100%', height:28, padding:'0 8px', marginBottom:4,
          border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
          font: FONT.sm, outline:'none' }
      }),
      filtered.length === 0 && h('div', { style:{ padding:12, color:'var(--color-text-auxiliary)', textAlign:'center' } }, '无数据'),
      filtered.map((o, idx) => {
        const active = selectedArr.includes(o.value);
        const highlighted = idx === hi;
        return h('div', {
          key:o.value,
          onClick: () => pickOption(o),
          onMouseEnter: e => { setHi(idx); !o.disabled && !active && (e.currentTarget.style.background='var(--color-bg-page)'); },
          onMouseLeave: e => { !active && (e.currentTarget.style.background='transparent'); },
          style:{
            padding:'6px 12px', borderRadius:'var(--radius-4)',
            cursor: o.disabled?'not-allowed':'pointer', font: FONT[size],
            color: o.disabled?'var(--color-text-disable)':active?'var(--color-primary-normal)':'var(--color-text-primary)',
            background: active ? 'var(--color-primary-bg)' : (highlighted ? 'var(--color-bg-page)' : 'transparent'),
            display:'flex', alignItems:'center', justifyContent:'space-between',
          }
        },
          h('span', null, o.label),
          active && h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
            stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
            h('path', { d:'M5 13l4 4L19 7' }))
        );
      })
    )
  );
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', flexDirection:'row', gap:'var(--spacing-12)', flexWrap:'wrap' } }, children)
);

const regions = [
  { label:'华东 1（上海）', value:'cn-east-1' },
  { label:'华北 2（北京）', value:'cn-north-2' },
  { label:'华南 3（深圳）', value:'cn-south-3' },
  { label:'亚太（新加坡）', value:'ap-sg-1' },
  { label:'海外（暂未开放）', value:'oversea', disabled:true },
];

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Select 选择器'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'尺寸' },
        h(Select, { size:'sm', options:regions, placeholder:'小尺寸', style:{ minWidth:200 } }),
        h(Select, { size:'md', options:regions, placeholder:'默认', style:{ minWidth:200 } }),
        h(Select, { size:'lg', options:regions, placeholder:'大尺寸', style:{ minWidth:200 } })),
      h(Group, { title:'状态' },
        h(Select, { options:regions, defaultValue:'cn-east-1', style:{ minWidth:240 } }),
        h(Select, { options:regions, defaultValue:'cn-east-1', status:'error', style:{ minWidth:240 } }),
        h(Select, { options:regions, placeholder:'禁用', disabled:true, style:{ minWidth:240 } })),
      h(Group, { title:'可搜索' },
        h(Select, { showSearch:true, options:regions, placeholder:'搜索区域', style:{ minWidth:280 } }),
        h(Select, { showSearch:true, allowClear:true, options:regions, placeholder:'可搜索 + 可清空', style:{ minWidth:280 } })),
      h(Group, { title:'多选' },
        h(Select, { multiple:true, options:regions, defaultValue:['cn-east-1','cn-north-2'], style:{ minWidth:320 } }),
        h(Select, { mode:'multiple', allowClear:true, options:regions, defaultValue:['ap-sg-1'], placeholder:'antd mode 多选', style:{ minWidth:320 } })),
      h(Group, { title:'antd 受控 open / onOpenChange' },
        h(Select, { defaultOpen:true, options:regions, defaultValue:'cn-east-1', onOpenChange:o => console.log('open:', o), style:{ minWidth:240 } }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
