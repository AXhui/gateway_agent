<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Form 表单 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
input,button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef, useEffect, useContext, createContext } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

/* -------- Input -------- */
const HEIGHT = { sm:24, md:32, lg:40 };
const FONT = { sm:'400 12px/20px var(--font-sans)', md:'400 14px/22px var(--font-sans)', lg:'400 16px/24px var(--font-sans)' };
const Input = ({ size='md', status='default', disabled, value, defaultValue, onChange, style, ...rest }) => {
  const [focus, setFocus] = useState(false);
  const [inner, setInner] = useState(defaultValue ?? '');
  const isControlled = value !== undefined;
  const v = isControlled ? value : inner;
  const borderColor = status==='error' ? 'var(--color-error-normal)' : focus ? 'var(--color-primary-normal)' : 'var(--color-border-base)';
  return h('input', {
    disabled, value:v,
    onFocus: e => { setFocus(true); rest.onFocus?.(e); },
    onBlur: e => { setFocus(false); rest.onBlur?.(e); },
    onChange: e => { if (!isControlled) setInner(e.target.value); onChange?.(e); },
    style:{
      height: HEIGHT[size], padding:'0 var(--spacing-12)',
      background: disabled?'var(--color-bg-hover)':'var(--color-bg-card)',
      border:`1px solid ${borderColor}`,
      borderRadius:'var(--radius-4)',
      color: disabled?'var(--color-text-disable)':'var(--color-text-primary)',
      font: FONT[size], outline:'none',
      boxShadow: focus ? `0 0 0 2px ${status==='error'?'rgba(217,45,45,0.12)':'rgba(16,129,62,0.12)'}` : 'none',
      transition:'border-color var(--duration-fast), box-shadow var(--duration-fast)',
      width:'100%', ...style,
    }, ...rest,
  });
};

/* -------- Select -------- */
const ChevronDown = ({ open }) => h('svg', { width:12, height:12, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round',
  style:{ transition:'transform var(--duration-fast)', transform: open?'rotate(180deg)':'rotate(0deg)' } },
  h('path', { d:'M6 9l6 6 6-6' }));
const Select = ({ options, value, defaultValue, placeholder='请选择', size='md', status='default', disabled, onChange, style }) => {
  const [inner, setInner] = useState(defaultValue);
  const [open, setOpen] = useState(false);
  const isControlled = value !== undefined;
  const v = isControlled ? value : inner;
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const set = val => { if (!isControlled) setInner(val); onChange?.(val); };
  const label = v ? (options.find(o => o.value === v)?.label ?? v) : null;
  const borderColor = status==='error' ? 'var(--color-error-normal)' : open ? 'var(--color-primary-normal)' : 'var(--color-border-base)';
  return h('div', { ref, style:{ position:'relative', display:'inline-block', ...style } },
    h('div', {
      onClick: () => !disabled && setOpen(o => !o),
      style:{
        height: HEIGHT[size], padding:'0 28px 0 var(--spacing-12)',
        background: disabled?'var(--color-bg-hover)':'var(--color-bg-card)',
        border:`1px solid ${borderColor}`, borderRadius:'var(--radius-4)',
        color: disabled?'var(--color-text-disable)':'var(--color-text-primary)',
        font: FONT[size], cursor: disabled?'not-allowed':'pointer',
        display:'flex', alignItems:'center',
        boxShadow: open ? `0 0 0 2px ${status==='error'?'rgba(217,45,45,0.12)':'rgba(16,129,62,0.12)'}` : 'none',
        position:'relative',
      }
    },
      label || h('span', { style:{ color:'var(--color-text-auxiliary)' } }, placeholder),
      h('span', { style:{ position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
        display:'inline-flex', color:'var(--color-text-auxiliary)' } }, h(ChevronDown, { open }))
    ),
    open && !disabled && h('div', { style:{
      position:'absolute', top:'100%', left:0, right:0, marginTop:4, zIndex:1400,
      background:'var(--color-bg-card)', border:'1px solid var(--color-divider-base-1)',
      borderRadius:'var(--radius-8)', boxShadow:'0 6px 20px rgba(11,18,32,0.08)',
      padding:4, maxHeight:240, overflow:'auto',
    } },
      options.map(o => {
        const active = v === o.value;
        return h('div', {
          key:o.value,
          onClick: () => { set(o.value); setOpen(false); },
          onMouseEnter: e => !active && (e.currentTarget.style.background='var(--color-bg-page)'),
          onMouseLeave: e => !active && (e.currentTarget.style.background='transparent'),
          style:{ padding:'6px 12px', borderRadius:'var(--radius-4)', cursor:'pointer',
            font: FONT[size], color: active?'var(--color-primary-normal)':'var(--color-text-primary)',
            background: active?'rgba(16,129,62,0.08)':'transparent' }
        }, o.label);
      })
    )
  );
};

/* -------- Switch -------- */
const SwitchDim = { default:{ h:22, w:44, knob:18, pad:2 } };
const Switch = ({ checked, defaultChecked, disabled, onChange }) => {
  const [inner, setInner] = useState(!!defaultChecked);
  const isControlled = checked !== undefined;
  const v = isControlled ? checked : inner;
  const dim = SwitchDim.default;
  return h('button', {
    type:'button', role:'switch', 'aria-checked':v,
    onClick: () => { if (disabled) return; const n=!v; if(!isControlled) setInner(n); onChange?.(n); },
    style:{
      position:'relative', display:'inline-flex', alignItems:'center',
      height:dim.h, width:dim.w, padding:0, border:'none', borderRadius:dim.h,
      cursor: disabled?'not-allowed':'pointer', opacity: disabled?0.5:1,
      background: v?'var(--color-primary-normal)':'var(--color-border-base)',
      transition:'background var(--duration-fast)',
    }
  }, h('span', { style:{
    position:'absolute', top:dim.pad, left: v ? dim.w - dim.knob - dim.pad : dim.pad,
    width:dim.knob, height:dim.knob, borderRadius:'50%',
    background:'#FFFFFF', boxShadow:'0 2px 4px rgba(0,0,0,0.16)',
    transition:'left var(--duration-fast)',
  } }));
};

/* -------- Checkbox -------- */
const Checkbox = ({ checked, defaultChecked, disabled, onChange, children }) => {
  const [inner, setInner] = useState(!!defaultChecked);
  const isControlled = checked !== undefined;
  const v = isControlled ? checked : inner;
  const borderColor = v ? 'var(--color-primary-normal)' : 'var(--color-border-base)';
  const bg = disabled?'var(--color-bg-hover)':v?'var(--color-primary-normal)':'var(--color-bg-card)';
  return h('label', { style:{
    display:'inline-flex', alignItems:'center', gap:'var(--spacing-8)',
    cursor: disabled?'not-allowed':'pointer', opacity: disabled?0.6:1,
    color:'var(--color-text-primary)', font:'400 14px/22px var(--font-sans)',
  } },
    h('span', { style:{ position:'relative', display:'inline-flex', flex:'none' } },
      h('input', { type:'checkbox', checked:v, disabled,
        onChange: e => { if (!isControlled) setInner(e.target.checked); onChange?.(e.target.checked, e); },
        style:{ position:'absolute', inset:0, width:16, height:16, margin:0, opacity:0, cursor:'inherit' } }),
      h('span', { 'aria-hidden':true, style:{
        width:16, height:16, borderRadius:'var(--radius-2)',
        border:`1px solid ${borderColor}`, background:bg,
        display:'inline-flex', alignItems:'center', justifyContent:'center',
        color:'var(--color-text-constant-normal)', transition:'all var(--duration-fast)',
      } }, v && h('svg', { width:10, height:10, viewBox:'0 0 24 24', fill:'none',
        stroke:'currentColor', strokeWidth:3.5, strokeLinecap:'round', strokeLinejoin:'round' },
        h('path', { d:'M5 13l4 4L19 7' })))
    ),
    h('span', null, children)
  );
};

/* -------- Form -------- */
const Ctx = createContext({ layout:'horizontal', labelWidth:120, labelAlign:'right', colon:true });
const Form = ({ layout='horizontal', labelWidth=120, labelAlign='right', colon=true, children, style, ...rest }) =>
  h(Ctx.Provider, { value:{ layout, labelWidth, labelAlign, colon } },
    h('form', {
      style:{
        display:'flex',
        flexDirection: layout==='inline'?'row':'column',
        gap: layout==='inline'?'var(--spacing-16)':'var(--spacing-20)',
        flexWrap: layout==='inline'?'wrap':'nowrap', ...style,
      }, ...rest,
    }, children)
  );
const FormItem = ({ label, required, help, error, extra, children, style }) => {
  const { layout, labelWidth, labelAlign, colon } = useContext(Ctx);
  const isHorizontal = layout === 'horizontal';
  return h('div', { style:{
    display:'flex', flexDirection: isHorizontal?'row':'column',
    alignItems: isHorizontal?'flex-start':'stretch',
    width: layout==='inline'?'auto':'100%', ...style,
  } },
    label && h('label', { style:{
      display:'inline-flex', alignItems:'center',
      height: isHorizontal?32:undefined,
      width: isHorizontal?labelWidth:undefined,
      justifyContent: isHorizontal && labelAlign==='right'?'flex-end':'flex-start',
      paddingRight: isHorizontal?'var(--spacing-12)':0,
      paddingBottom: !isHorizontal?'var(--spacing-4)':0,
      font:'400 14px/22px var(--font-sans)', color:'var(--color-text-secondary)', flex:'none',
    } },
      required && h('span', { style:{ color:'var(--color-error-normal)', marginRight:4 } }, '*'),
      h('span', null, label + (colon?'：':''))
    ),
    h('div', { style:{ flex:1, minWidth:0 } },
      children,
      error && h('div', { style:{ marginTop:4, font:'400 12px/20px var(--font-sans)', color:'var(--color-error-normal)' } }, error),
      !error && help && h('div', { style:{ marginTop:4, font:'400 12px/20px var(--font-sans)', color:'var(--color-text-auxiliary)' } }, help),
      extra && h('div', { style:{ marginTop:4, font:'400 12px/20px var(--font-sans)', color:'var(--color-text-auxiliary)' } }, extra)
    )
  );
};

/* -------- Page -------- */
const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-24)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Form 表单'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:800, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'水平布局 — horizontal' },
        h(Form, { layout:'horizontal', labelWidth:100 },
          h(FormItem, { label:'实例名称', required:true, help:'2-32 字符' }, h(Input, { placeholder:'请输入' })),
          h(FormItem, { label:'区域', required:true },
            h(Select, { style:{ minWidth:240 }, options:[
              { label:'华东 1', value:'cn-east-1' },
              { label:'华北 2', value:'cn-north-2' },
            ] })),
          h(FormItem, { label:'密码', error:'密码长度不足 8 位' },
            h(Input, { type:'password', status:'error', defaultValue:'1234' })),
          h(FormItem, { label:'自动续费' }, h(Switch, { defaultChecked:true }))
        )
      ),
      h(Group, { title:'纵向布局 — vertical' },
        h(Form, { layout:'vertical' },
          h(FormItem, { label:'账号', required:true }, h(Input, { placeholder:'请输入账号' })),
          h(FormItem, { label:'备注', extra:'选填，不超过 128 字' }, h(Input, { placeholder:'补充说明' })),
          h(FormItem, null, h(Checkbox, null, '我已阅读并同意《服务协议》'))
        )
      ),
      h(Group, { title:'行内布局 — inline' },
        h(Form, { layout:'inline' },
          h(FormItem, { label:'关键字' }, h(Input, { placeholder:'实例 ID', style:{ width:180 } })),
          h(FormItem, { label:'状态' },
            h(Select, { style:{ minWidth:140 }, options:[
              { label:'全部', value:'all' },
              { label:'运行中', value:'running' },
              { label:'已停止', value:'stopped' },
            ] }))
        )
      )
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
