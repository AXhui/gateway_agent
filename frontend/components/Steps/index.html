<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Steps 步骤条 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const Check = () => h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true },
  h('path', { d:'M5 13l4 4L19 7' }));
const Cross = () => h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
  stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true },
  h('path', { d:'M6 6l12 12M18 6L6 18' }));

const COLOR = {
  wait:    { fg:'var(--color-text-auxiliary)', bg:'var(--color-bg-card)',     border:'var(--color-border-base)', line:'var(--color-divider-base-1)' },
  process: { fg:'var(--color-text-constant-normal)',  bg:'var(--color-primary-normal)', border:'var(--color-primary-normal)', line:'var(--color-divider-base-1)' },
  finish:  { fg:'var(--color-primary-normal)', bg:'var(--color-bg-card)',     border:'var(--color-primary-normal)', line:'var(--color-primary-normal)' },
  error:   { fg:'var(--color-text-constant-normal)',  bg:'var(--color-error-normal)', border:'var(--color-error-normal)',   line:'var(--color-divider-base-1)' },
};

const Steps = ({ items, current=0, direction='horizontal', size='default', status='process' }) => {
  const dot = size === 'small' ? 24 : 32;
  const st = i => {
    const s = items[i].status;
    if (s) return s;
    if (i < current) return 'finish';
    if (i === current) return status;
    return 'wait';
  };
  return h('ol', {
    style:{ listStyle:'none', margin:0, padding:0,
      display:'flex', flexDirection: direction==='vertical'?'column':'row',
      gap:0, width:'100%' }
  }, items.map((it, i) => {
    const s = st(i); const c = COLOR[s]; const isLast = i === items.length - 1;
    return h('li', { key:i, style:{
      flex: direction==='horizontal'?1:'none',
      display:'flex', flexDirection: direction==='vertical'?'row':'column', minWidth:0,
    } },
      h('div', { style:{
        display:'flex', flexDirection: direction==='vertical'?'column':'row',
        alignItems:'center', gap: direction==='vertical'?0:'var(--spacing-8)',
        width: direction==='vertical'?dot:'100%',
      } },
        h('div', { style:{
          width:dot, height:dot, borderRadius:'50%',
          display:'inline-flex', alignItems:'center', justifyContent:'center',
          background:c.bg, color:c.fg, border:`1px solid ${c.border}`,
          font:'500 14px/1 var(--font-sans)', flex:'none',
          transition:'all var(--duration-fast) var(--easing-standard)',
        } }, s==='finish' ? h(Check) : s==='error' ? h(Cross) : (it.icon ?? (i + 1))),
        !isLast && h('div', { style:{
          flex:1,
          ...(direction==='vertical'
            ? { width:1, minHeight:32, background:c.line, marginTop:4 }
            : { height:1, background:c.line })
        } })
      ),
      h('div', { style:{
        padding: direction==='vertical' ? '0 0 var(--spacing-16) var(--spacing-12)' : 'var(--spacing-8) var(--spacing-12) 0 0',
        flex: direction==='vertical'?1:'none', minWidth:0,
      } },
        h('div', { style:{ font:`500 ${size==='small'?13:14}px/22px var(--font-sans)`,
          color: s==='wait'?'var(--color-text-auxiliary)':'var(--color-text-primary)' } }, it.title),
        it.description && h('div', { style:{ font:'400 12px/20px var(--font-sans)',
          color:'var(--color-text-auxiliary)', marginTop:2 } }, it.description)
      )
    );
  }));
};

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-24)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)' } }, children)
);

const items = [
  { title:'配置实例', description:'选择规格、镜像与网络' },
  { title:'设置安全', description:'密码与防火墙' },
  { title:'确认订单', description:'核对配置与价格' },
  { title:'开始使用' },
];

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Steps 步骤条'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:1200, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础 — current=1' }, h(Steps, { items, current:1 })),
      h(Group, { title:'错误 — status=error' }, h(Steps, { items, current:2, status:'error' })),
      h(Group, { title:'小尺寸 — size=small' }, h(Steps, { items, current:1, size:'small' })),
      h(Group, { title:'纵向 — vertical' }, h(Steps, { direction:'vertical', items, current:1 })),
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
