<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Notification 通知提醒框 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
@keyframes uink-notif-in { from { opacity: 0; transform: translateX(20px) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useEffect, Fragment } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const ICONS = {
  info:    { color:'#1A66F2', path:'M12 8v5m0 3h.01M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  success: { color:'#3491fa', path:'M8 12.5l3 3 6-7M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  warning: { color:'#C77700', path:'M12 8v5m0 3h.01M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z' },
  error:   { color:'#f13535', path:'M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Zm-3-13 6 6m0-6-6 6' },
};

let listenerRef = null;
let counter = 0;
const open = (type, title, description, duration = 4.5, placement = 'topRight') => {
  const id = ++counter;
  listenerRef?.({ id, type, title, description, duration, placement });
  return id;
};
const notification = {
  info: a => open('info', a.title, a.description, a.duration, a.placement),
  success: a => open('success', a.title, a.description, a.duration, a.placement),
  warning: a => open('warning', a.title, a.description, a.duration, a.placement),
  error: a => open('error', a.title, a.description, a.duration, a.placement),
};

const NotifView = ({ item, onClose }) => {
  useEffect(() => {
    if (!item.duration) return;
    const t = setTimeout(() => onClose(item.id), item.duration * 1000);
    return () => clearTimeout(t);
  }, [item, onClose]);
  const icon = ICONS[item.type];
  return h('div', { style:{
    width:360, padding:'16px 20px', background:'var(--color-bg-card)',
    borderRadius:'var(--radius-8)', boxShadow:'0 8px 24px rgba(11,18,32,0.16)',
    display:'flex', gap:12, alignItems:'flex-start', pointerEvents:'auto',
    animation:'uink-notif-in 240ms cubic-bezier(0.2,0,0,1)'
  } },
    h('svg', { width:20, height:20, viewBox:'0 0 24 24', fill:'none', stroke:icon.color,
      strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round',
      style:{ flexShrink:0, marginTop:2 } }, h('path', { d:icon.path })),
    h('div', { style:{ flex:1, minWidth:0 } },
      h('div', { style:{ font:'500 15px/22px var(--font-sans)', color:'var(--color-text-primary)' } }, item.title),
      item.description && h('div', { style:{ marginTop:4, color:'var(--color-text-secondary)',
        font:'400 13px/20px var(--font-sans)' } }, item.description)),
    h('span', { onClick:() => onClose(item.id), style:{
      cursor:'pointer', color:'var(--color-text-auxiliary)', display:'inline-flex', padding:2 } },
      h('svg', { width:14, height:14, viewBox:'0 0 24 24', fill:'none',
        stroke:'currentColor', strokeWidth:1.5, strokeLinecap:'round' },
        h('path', { d:'M6 6l12 12M18 6L6 18' })))
  );
};

const placementOf = p => ({
  top: p.startsWith('top') ? 24 : undefined,
  bottom: p.startsWith('bottom') ? 24 : undefined,
  right: p.endsWith('Right') ? 24 : undefined,
  left: p.endsWith('Left') ? 24 : undefined,
  alignItems: p.endsWith('Right') ? 'flex-end' : 'flex-start',
});

const NotificationHost = () => {
  const [items, setItems] = useState([]);
  useEffect(() => {
    listenerRef = m => setItems(prev => [...prev, m]);
    return () => { listenerRef = null; };
  }, []);
  const remove = id => setItems(prev => prev.filter(x => x.id !== id));
  const groups = { topRight:[], topLeft:[], bottomRight:[], bottomLeft:[] };
  items.forEach(i => groups[i.placement].push(i));
  return h(Fragment, null,
    Object.keys(groups).map(p => groups[p].length > 0 && h('div', { key:p, style:{
      position:'fixed', zIndex:1500, display:'flex', flexDirection:'column', gap:12,
      pointerEvents:'none', ...placementOf(p)
    } }, groups[p].map(i => h(NotifView, { key:i.id, item:i, onClose:remove }))))
  );
};

const Btn = ({ onClick, children }) => h('button', { onClick, style:{
  height:32, padding:'0 16px', border:'1px solid var(--color-border-base)',
  borderRadius:'var(--radius-4)', background:'var(--color-bg-card)', cursor:'pointer'
} }, children);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h(NotificationHost),
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Notification 通知提醒框'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', gap:12, flexWrap:'wrap' } },
      h(Btn, { onClick:() => notification.info({ title:'系统通知',
        description:'有新的版本可供升级，前往查看详情。' }) }, 'Info'),
      h(Btn, { onClick:() => notification.success({ title:'操作成功',
        description:'实例 i-bp1234abcd 已成功启动。' }) }, 'Success'),
      h(Btn, { onClick:() => notification.warning({ title:'余额预警',
        description:'账户余额不足 ¥100，请尽快充值。' }) }, 'Warning'),
      h(Btn, { onClick:() => notification.error({ title:'部署失败',
        description:'镜像拉取超时，请检查网络后重试。' }) }, 'Error'),
      h(Btn, { onClick:() => notification.info({ title:'左下角提示',
        description:'位置可配置 — bottomLeft', placement:'bottomLeft' }) }, 'bottomLeft')
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
