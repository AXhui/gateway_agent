<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — DropdownMenu 下拉菜单 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const DropdownMenu = ({ trigger, items, placement='bottomLeft', open: openProp, onOpenChange }) => {
  const [openState, setOpen] = React.useState(false);
  const open = openProp ?? openState;
  const setO = v => { if (openProp === undefined) setOpen(v); onOpenChange?.(v); };
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (!wrapRef.current?.contains(e.target)) setO(false); };
    const onKey = e => { if (e.key === 'Escape') setO(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDoc);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  const triggerEl = React.cloneElement(trigger, {
    onClick: e => { trigger.props.onClick?.(e); setO(!open); },
    'aria-haspopup':'menu', 'aria-expanded': open,
  });

  return h('div', { ref: wrapRef, style:{ position:'relative', display:'inline-block' } },
    triggerEl,
    open && h('div', {
      role:'menu',
      style:{
        position:'absolute', top:'calc(100% + 4px)',
        [placement==='bottomRight'?'right':'left']: 0,
        minWidth:160, background:'var(--color-bg-card)',
        border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
        boxShadow:'0 6px 16px 0 #272e3b1A, 0 3px 6px -4px #272e3b14, 0 9px 28px 8px #272e3b0D',
        padding:'var(--spacing-4) 0', zIndex:1400,
      }
    }, items.map((it, i) => {
      if (it.divider) return h('div', {
        key: it.key || `d${i}`,
        style:{ height:1, background:'var(--color-divider-base-1)', margin:'var(--spacing-4) 0' }
      });
      return h('button', {
        key: it.key,
        role:'menuitem',
        disabled: it.disabled,
        onClick: () => { if (!it.disabled) { it.onSelect?.(); setO(false); } },
        style:{
          width:'100%', display:'flex', alignItems:'center', gap:'var(--spacing-8)',
          padding:'0 var(--spacing-12)', height:32,
          border:'none', background:'transparent',
          color: it.disabled?'var(--color-text-disable)':it.danger?'var(--color-error-normal)':'var(--color-text-primary)',
          font:'400 14px/22px var(--font-sans)',
          cursor: it.disabled?'not-allowed':'pointer',
          textAlign:'left',
          transition:'background-color var(--duration-fast) var(--easing-standard)',
        },
        onMouseEnter: e => { if (it.disabled) return;
          e.currentTarget.style.background = it.danger?'var(--color-error-bg)':'var(--color-bg-page)'; },
        onMouseLeave: e => { e.currentTarget.style.background = 'transparent'; },
      },
        it.icon && h('span', { style:{ display:'inline-flex' } }, it.icon),
        h('span', null, it.label),
      );
    }))
  );
};

const TriggerBtn = React.forwardRef(function TriggerBtn(props, ref) {
  return h('button', {
    ref, ...props,
    style:{ height:32, padding:'0 var(--spacing-16)',
      background:'var(--color-bg-card)', color:'var(--color-text-primary)',
      border:'1px solid var(--color-border-base)', borderRadius:'var(--radius-4)',
      font:'400 14px/22px var(--font-sans)', cursor:'pointer' }
  });
});

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-20)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', gap:'var(--spacing-24)', flexWrap:'wrap' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'DropdownMenu 下拉菜单'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:1200, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'基础' },
        h(DropdownMenu, {
          trigger: h(TriggerBtn, null, '操作 ▾'),
          items:[
            { key:'edit', label:'编辑' },
            { key:'copy', label:'复制' },
            { key:'rename', label:'重命名' },
          ]
        })
      ),
      h(Group, { title:'分组 + 危险项' },
        h(DropdownMenu, {
          trigger: h(TriggerBtn, null, '更多 ▾'),
          items:[
            { key:'view', label:'查看详情' },
            { key:'edit', label:'编辑' },
            { key:'d1', label:'', divider:true },
            { key:'restart', label:'重启' },
            { key:'d2', label:'', divider:true },
            { key:'delete', label:'删除', danger:true },
          ]
        })
      ),
      h(Group, { title:'禁用项 + 右对齐' },
        h(DropdownMenu, {
          placement:'bottomRight',
          trigger: h(TriggerBtn, null, '选项 ▾'),
          items:[
            { key:'a', label:'导出' },
            { key:'b', label:'归档（暂不可用）', disabled:true },
            { key:'c', label:'分享' },
          ]
        })
      ),
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
