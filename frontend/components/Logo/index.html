<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

// 官方 SVG 品牌资产：由上方冻结段（window.MS_BASE_LOGO_SVGS / MS_BASE_LOGO_SVG）提供，
// 输出内联 <svg>，不引用外部文件——任意宿主路径一律出图。

const Logo = ({ variant='full', color='brand', height=32, width, style }) => {
  return h('span', {
    style: { display:'inline-flex', alignItems:'center', ...style },
    dangerouslySetInnerHTML: { __html: window.MS_BASE_LOGO_SVG({ variant, color, height, width }) }
  });
};

const Group = ({ title, bg, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },

    display:'flex', gap:'var(--spacing-20)', flexWrap:'wrap', alignItems:'center' } }, children)
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },

    ),

        h(Logo, { variant:'compact', height:40 })),
