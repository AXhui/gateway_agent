<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — List 列表 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const PAD = {
  small:'var(--spacing-8) var(--spacing-12)',
  default:'var(--spacing-12) var(--spacing-16)',
  large:'var(--spacing-16) var(--spacing-20)',
};

const Avatar = ({ shape='circle', style, children }) => h('span', { style:{
  display:'inline-flex', alignItems:'center', justifyContent:'center',
  width:32, height:32, borderRadius: shape==='circle'?'50%':'var(--radius-4)',
  background:'var(--color-bg-page)', color:'var(--color-text-primary)',
  font:'500 13px/1 var(--font-sans)', ...style,
} }, children);

const ListItem = ({ meta, actions, extra, children, layout='horizontal', style }) => h('div', { style:{
  display:'flex', alignItems: layout==='vertical'?'stretch':'center',
  flexDirection: layout==='vertical'?'column':'row',
  gap:'var(--spacing-12)', ...style,
} },
  meta && h('div', { style:{ display:'flex', gap:'var(--spacing-12)', flex:1, minWidth:0 } },
    meta.avatar && h('div', { style:{ flexShrink:0 } }, meta.avatar),
    h('div', { style:{ flex:1, minWidth:0 } },
      meta.title && h('div', { style:{ font:'500 14px/22px var(--font-sans)', color:'var(--color-text-primary)' } }, meta.title),
      meta.description && h('div', { style:{ font:'400 13px/20px var(--font-sans)', color:'var(--color-text-auxiliary)', marginTop:2 } }, meta.description)
    )
  ),
  children && h('div', { style:{ flex: meta ? 0 : 1 } }, children),
  extra && h('div', { style:{ flexShrink:0 } }, extra),
  actions && actions.length > 0 && h('div', { style:{
    display:'flex', gap:'var(--spacing-12)', flexShrink:0,
    color:'var(--color-primary-normal)', font:'400 13px/20px var(--font-sans)' } },
    actions.map((a, i) => h('span', { key:i, style:{ cursor:'pointer' } }, a)))
);

const List = ({ header, footer, dataSource, renderItem, size='default',
  bordered, split=true, loading, style, className }) =>
  h('div', { className, style:{
    background:'var(--color-bg-card)',
    border: bordered ? '1px solid var(--color-divider-base-1)' : 'none',
    borderRadius:'var(--radius-4)', overflow:'hidden', ...style,
  } },
    header && h('div', { style:{ padding:PAD[size],
      borderBottom:'1px solid var(--color-divider-base-1)',
      font:'500 14px/22px var(--font-sans)' } }, header),
    h('div', null,
      loading ? h('div', { style:{ padding:'var(--spacing-20)', color:'var(--color-text-auxiliary)', textAlign:'center' } }, '加载中…')
        : dataSource.length === 0 ? h('div', { style:{ padding:'var(--spacing-20)', color:'var(--color-text-auxiliary)', textAlign:'center' } }, '暂无数据')
        : dataSource.map((item, i) => h('div', { key:i, style:{
          padding: PAD[size],
          borderTop: split && (header || i > 0) ? '1px solid var(--color-divider-base-1)' : 'none' } },
          renderItem(item, i)))
    ),
    footer && h('div', { style:{ padding:PAD[size],
      borderTop:'1px solid var(--color-divider-base-1)', color:'var(--color-text-auxiliary)' } }, footer)
  );

const data = [
  { name:'i-cloud-web-01', region:'华东 1 · A 区', status:'运行中' },
  { name:'i-cloud-api-02', region:'华北 2 · B 区', status:'运行中' },
  { name:'i-cloud-data-03', region:'华南 1 · A 区', status:'已停止' },
  { name:'i-cloud-cache-04', region:'华东 2 · C 区', status:'创建中' },
];

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  children
);

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'List 列表'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'带边框 / 头尾' },
        h(List, {
          bordered:true, header:'实例列表', footer:`共 ${data.length} 条`,
          dataSource: data,
          renderItem: it => h(ListItem, {
            meta: { avatar:h(Avatar, { shape:'square' }, 'U'), title:it.name, description:it.region },
            actions:['编辑', '删除'],
            extra: h('span', { style:{ color:'var(--color-text-auxiliary)' } }, it.status)
          })
        })),
      h(Group, { title:'简单列表' },
        h(List, {
          dataSource:['控制台','资源列表','账单中心','工单系统'],
          renderItem: t => h(ListItem, null, t)
        })),
      h(Group, { title:'空状态' },
        h(List, { bordered:true, dataSource:[], renderItem: () => null }))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
