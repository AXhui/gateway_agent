<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const Affix = ({ offsetTop, offsetBottom, target, onChange, children, style }) => {
  const useTop = offsetBottom === undefined;
  const off = useTop ? (offsetTop ?? 0) : offsetBottom;
  const wrapRef = React.useRef(null);
  const [affixed, setAffixed] = React.useState(false);
  const [size, setSize] = React.useState({ w:0, h:0 });

  React.useEffect(() => {
    const tgt = target?.() ?? window;
    const onScroll = () => {
      const el = wrapRef.current; if (!el) return;
      const rect = el.getBoundingClientRect();
      const tgtTop = tgt === window ? 0 : tgt.getBoundingClientRect().top;
      const tgtBottom = tgt === window ? window.innerHeight : tgt.getBoundingClientRect().bottom;
      const next = useTop ? rect.top - tgtTop <= off : tgtBottom - rect.bottom <= off;
      if (next !== affixed) {
        setSize({ w: rect.width, h: rect.height });
        setAffixed(next);
        onChange?.(next);
      }
    };
    onScroll();
    tgt.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll);
    return () => {
      tgt.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, [affixed, off, useTop, target, onChange]);

  return h('div', {
    ref: wrapRef,
    style: { ...(affixed ? { width: size.w, height: size.h } : null), ...style },
  }, h('div', {
    style: affixed ? {
      position:'fixed', [useTop?'top':'bottom']: off,
      width: size.w, zIndex: 10,
    } : undefined
  }, children));
};

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Affix 固钉'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:800, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)' } },
      h('p', { style:{ color:'var(--color-text-auxiliary)' } }, '向下滚动观察「保存」按钮固钉效果。'),
      h('div', { style:{ height:600, background:'var(--color-bg-hover)', borderRadius:'var(--radius-8)' } }),
      h('div', { style:{ margin:'var(--spacing-24) 0' } },
        h(Affix, { offsetTop:64 },
          h('button', { style:{
            height:40, padding:'0 var(--spacing-24)',
            background:'var(--color-bg-page)', color:'var(--color-text-primary)',
            border:'none', borderRadius:'var(--radius-4)',
            font:'500 14px/1 var(--font-sans)', cursor:'pointer',
            boxShadow:'0 2px 8px rgba(0,0,0,0.08)',
          } }, '保存（固钉到顶部 64px）')
        )
      ),
      h('div', { style:{ height:1200, background:'var(--color-bg-hover)', borderRadius:'var(--radius-8)' } })
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
