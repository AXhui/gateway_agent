<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web — Popover 气泡卡片 v1.0.0</title>
<style>
:root {
  --color-primary-normal:#3491FA;
  --color-primary-hover:#5EAFFF;
  --color-primary-active:#226FD4;
  --color-primary-disable:#87C7FF;
  --color-primary-bg:#F0F9FF;
  --color-success-normal:#1EBA62;
  --color-success-hover:#40C776;
  --color-success-active:#10944E;
  --color-success-bg:#EBFAEF;
  --color-error-normal:#F13535;
  --color-error-hover:#FF6661;
  --color-error-active:#CC2328;
  --color-error-bg:#FFF2F0;
  --color-warm-normal:#F77234;
  --color-warm-hover:#FF975E;
  --color-warm-active:#D15321;
  --color-warm-bg:#FFF7F0;
  --color-remind-normal:#F7BA1E;
  --color-remind-bg:#FFFDEB;
  --color-text-primary:#272E3B;
  --color-text-secondary:#6B7785;
  --color-text-auxiliary:#A9AEB8;
  --color-text-disable:#C9CDD4;
  --color-text-constant-normal:#FFFFFF;
  --color-text-primary-normal:#3491FA;
  --color-text-success-normal:#1EBA62;
  --color-text-error-normal:#F13535;
  --color-text-warm-normal:#F77234;
  --color-fill-base-normal:#F7F8FA;
  --color-fill-base-hover:#F2F3F5;
  --color-fill-primary:#F0F9FF;
  --color-fill-primary-normal:#3491FA;
  --color-fill-success:#EBFAEF;
  --color-fill-error:#FFF2F0;
  --color-fill-warm:#FFF7F0;
  --color-bg-page:#F7F8FA;
  --color-bg-card:#FFFFFF;
  --color-bg-hover:#F2F3F5;
  --color-border-base:#E5E6EB;
  --color-border-base-disable:#C9CDD4;
  --color-border-primary-normal:#3491FA;
  --color-divider-base-1:#F7F8FA;
  --color-divider-base-2:#E5E6EB;
  --color-icon-normal:#272E3B;
  --color-icon-secondary:#6B7785;
  --color-icon-auxiliary:#A9AEB8;
  --color-icon-primary-normal:#3491FA;
  --color-base-bg:var(--color-bg-page);
  --color-base-hover:var(--color-bg-hover);
  --color-remind:var(--color-remind-normal);
  --ease:cubic-bezier(0.2, 0, 0, 1);
  --font-sans:'PingFang SC',-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,monospace;
  --spacing-2:2px; --spacing-4:4px; --spacing-8:8px; --spacing-12:12px;
  --spacing-16:16px; --spacing-20:20px; --spacing-24:24px; --spacing-30:30px;
  --spacing-40:40px; --spacing-48:48px; --spacing-64:64px;
  --radius-2:2px; --radius-4:4px; --radius-8:8px; --radius-12:12px; --radius-full:9999px;
  --shadow-1:0 1px 2px 0 rgba(0,0,0,0.06);
  --shadow-diffusion-primary:0 0 0 3px rgba(52,145,250,0.25);
  --shadow-diffusion-success:0 0 0 3px rgba(30,186,98,0.25);
  --shadow-diffusion-error:0 0 0 3px rgba(241,53,53,0.25);
  --shadow-diffusion-warm:0 0 0 3px rgba(247,114,52,0.25);
  --duration-fast:160ms; --duration-slow:400ms;
  --easing-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}html,body,#root{margin:0;padding:0}
body{font:400 14px/1.5 var(--font-sans);color:var(--color-text-primary);background:var(--color-base-bg)}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react":"https://esm.sh/react@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client"
} }
</script>
<script type="module">
import React, { useState, useRef, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
const h = React.createElement;

const offset = 8;

const placementStyle = p => {
  switch (p) {
    case 'top': return { bottom:`calc(100% + ${offset}px)`, left:'50%', transform:'translateX(-50%)' };
    case 'topLeft': return { bottom:`calc(100% + ${offset}px)`, left:0 };
    case 'topRight': return { bottom:`calc(100% + ${offset}px)`, right:0 };
    case 'bottom': return { top:`calc(100% + ${offset}px)`, left:'50%', transform:'translateX(-50%)' };
    case 'bottomLeft': return { top:`calc(100% + ${offset}px)`, left:0 };
    case 'bottomRight': return { top:`calc(100% + ${offset}px)`, right:0 };
    case 'left': return { right:`calc(100% + ${offset}px)`, top:'50%', transform:'translateY(-50%)' };
    case 'leftTop': return { right:`calc(100% + ${offset}px)`, top:0 };
    case 'leftBottom': return { right:`calc(100% + ${offset}px)`, bottom:0 };
    case 'right': return { left:`calc(100% + ${offset}px)`, top:'50%', transform:'translateY(-50%)' };
    case 'rightTop': return { left:`calc(100% + ${offset}px)`, top:0 };
    case 'rightBottom': return { left:`calc(100% + ${offset}px)`, bottom:0 };
  }
};

const arrowStyle = p => {
  const base = { position:'absolute', width:10, height:10,
    background:'var(--color-bg-card)',
    borderTop:'1px solid var(--color-divider-base-1)',
    borderLeft:'1px solid var(--color-divider-base-1)' };
  if (p.startsWith('top')) return { ...base, bottom:-6, left:'50%', transform:'translateX(-50%) rotate(225deg)' };
  if (p.startsWith('bottom')) return { ...base, top:-6, left:'50%', transform:'translateX(-50%) rotate(45deg)' };
  if (p.startsWith('left')) return { ...base, right:-6, top:'50%', transform:'translateY(-50%) rotate(135deg)' };
  return { ...base, left:-6, top:'50%', transform:'translateY(-50%) rotate(-45deg)' };
};

const Popover = ({ content, title, trigger='hover', placement='top', open, defaultOpen,
  onOpenChange, arrow=true, children }) => {
  const [inner, setInner] = useState(!!defaultOpen);
  const isControlled = open !== undefined;
  const isOpen = isControlled ? open : inner;
  const ref = useRef(null);
  const set = next => { if (!isControlled) setInner(next); onOpenChange?.(next); };

  useEffect(() => {
    if (trigger !== 'click' || !isOpen) return;
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) set(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [trigger, isOpen]);

  const handlers = trigger === 'hover'
    ? { onMouseEnter: () => set(true), onMouseLeave: () => set(false) }
    : { onClick: () => set(!isOpen) };

  return h('span', { ref, style:{ position:'relative', display:'inline-block' }, ...handlers },
    children,
    isOpen && h('div', { role:'tooltip', style:{
      position:'absolute', zIndex:1500,
      minWidth:160, maxWidth:320,
      background:'var(--color-bg-card)',
      border:'1px solid var(--color-divider-base-1)',
      borderRadius:'var(--radius-8)',
      boxShadow:'0 6px 20px rgba(11,18,32,0.08)',
      ...placementStyle(placement),
    } },
      title && h('div', { style:{
        padding:'var(--spacing-8) var(--spacing-12)',
        borderBottom:'1px solid var(--color-divider-base-1)',
        font:'500 14px/22px var(--font-sans)',
        color:'var(--color-text-primary)',
      } }, title),
      h('div', { style:{
        padding:'var(--spacing-12)',
        color:'var(--color-text-secondary)',
        font:'400 13px/20px var(--font-sans)',
      } }, content),
      arrow && h('span', { style: arrowStyle(placement) })
    )
  );
};

const Btn = ({ children }) => h('button', { style:{
  height:32, padding:'0 16px', border:'1px solid var(--color-border-base)',
  borderRadius:'var(--radius-4)', background:'var(--color-bg-card)',
  color:'var(--color-text-primary)', cursor:'pointer',
} }, children);

const Group = ({ title, children }) => h('section', { style:{ display:'flex', flexDirection:'column', gap:'var(--spacing-12)' } },
  h('h3', { style:{ margin:0, font:'500 16px/1.5 var(--font-sans)' } }, title),
  h('div', { style:{ padding:'var(--spacing-30)', background:'var(--color-bg-card)',
    border:'1px solid var(--color-divider-base-1)', borderRadius:'var(--radius-8)',
    display:'flex', gap:'var(--spacing-30)', flexWrap:'wrap' } }, children)
);

const placements = ['topLeft','top','topRight','leftTop','rightTop','left','right',
  'leftBottom','rightBottom','bottomLeft','bottom','bottomRight'];

function App() {
  return h('div', { style:{ minHeight:'100vh' } },
    h('header', { style:{ background:'var(--color-primary-normal)', color:'var(--color-text-constant-normal)', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'var(--spacing-16) var(--spacing-24)' } },
      h('h1', { style:{ margin:0, font:'600 28px/1.2 var(--font-sans)' } }, 'Popover 气泡卡片'),
      h('span', { style:{ color:'var(--color-text-auxiliary)', fontSize:'12px' } }, 'Milesight IOT Web · v1.0.0')
    ),
    h('main', { style:{ maxWidth:720, margin:'0 auto',
      padding:'var(--spacing-30) var(--spacing-24) var(--spacing-64)',
      display:'flex', flexDirection:'column', gap:'var(--spacing-30)' } },
      h(Group, { title:'位置 — 12 方向' },
        placements.map(p => h(Popover, { key:p, placement:p, title:'提示', content:p },
          h(Btn, null, p)))),
      h(Group, { title:'点击触发' },
        h(Popover, { trigger:'click', title:'确认删除',
          content: h('div', { style:{ display:'flex', gap:8 } },
            h(Btn, null, '取消'),
            h('button', { style:{ height:32, padding:'0 16px', border:'none',
              background:'var(--color-bg-page)', color:'var(--color-text-primary)',
              borderRadius:'var(--radius-4)', cursor:'pointer' } }, '确认'))
        }, h(Btn, null, '删除资源')))
    )
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
