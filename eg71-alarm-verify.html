<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EG71 告警事件页核实页</title>

<!-- 单一源：直接加载 L1 令牌 / L2 基础 / L3 业务 三层真实 CSS，零复制 -->
<link rel="stylesheet" href=".claude/tokens/tokens.css" />
<link rel="stylesheet" href="library/base.css" />
<link rel="stylesheet" href="library/business.css" />

<style>
  /* 组装编排（页面模板层）：表单底部操作栏约束，主体 bottom padding 避免遮挡 */
  .verify-content { padding-bottom: 72px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- 单一源：加载真实实体词典 + 业务组件注册表（含 bc-eg71-alarm） -->
<script src="assets/js/registry-entities.js"></script>
<script src="assets/js/registry-business.js"></script>

<script>
(function () {
  // 告警实体：字段 rule/level/condition/target/time/status + 指标 + 动作 + 状态枚举
  var alarm = window.MS_ENTITIES.alarm;
  var route = '/system-setting/events';

  // 告警内容区：bc-eg71-alarm.render 产出指标卡组 + 筛选栏 + 告警数据表
  var content = window.MS_BIZ_INDEX['bc-eg71-alarm'].render({
    entity: alarm,
    rows: window.MS_DATA.build(alarm, 6),
    route: route
  });

  // 侧-导航栏双重结构（捆绑）：EG71 需求直接调 MS_EG71_SHELL，不再手动拼侧栏/顶栏。
  // 传 { content } 覆盖默认配置页内容，路由 /system-setting/events → 侧栏 Events 选中 + 顶栏通用面包屑。
  var ctx = {
    entity: window.MS_ENTITIES.gateway,
    rows: window.MS_DATA.build(window.MS_ENTITIES.gateway, 1),
    route: route
  };
  document.getElementById('app').innerHTML = window.MS_EG71_SHELL.render(ctx, { content: content });
  window.MS_EG71_SHELL.bind(document.getElementById('app'));
})();
</script>
</body>
</html>
