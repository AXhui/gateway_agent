    },
    {
      id: 'bc-eg71-sidenav', cn: '网关侧边导航', cat: '管理员',
      desc: 'Milesight 网关管理后台侧边导航（220px 深色侧边栏 · Figma 2016:89103）：Logo 区（Milesight 字标 + 白色描边新增按钮）+ 一级导航菜单（Dashboard 选中态 / Data Services / Network / Platform / System Setting / APP 各带 chevron 展开箭头，默认折叠）+ 底部 Admin 账户入口（头像 + 名称 + 更多操作下拉，含 Language 二级语言子菜单），编排 L2 Logo / 导航菜单 / 头像 / 按钮 / 下拉菜单基础组件；深色配色「基本固定」按 Figma 写死（bg #182032 / 选中 #052461·#5eafff / 未选中 #d6d6d8 / 常量白），不绑主题切换。',
      atoms: ['nav-menu', 'dropdown-menu', 'logo', 'avatar', 'button', 'icon'],
      entityHint: 'gateway',
      tags: ['侧边栏', '导航', '菜单', '下拉菜单', '管理员', 'EG71', '网关', '后台'],
      render(ctx) {
        // 一级导航（mode=vertical）：单一路由源 ctx.route 决定选中态；Dashboard 直达 /dashboard，
        // 其余带 chevron 可展开，子条目带各自路由（父级 route 即分组路由，子条目 = 分组路由 + slug）。
        const route = ctx.route || '/dashboard';
        const slug = U.slug;
        const groups = U.navGroups;
        // 子条目 HTML 抽公用：展开态内联 .bc-eg71-sub 与收起态浮窗 .bc-eg71-popup 共用同一份，避免重复维护高亮判定
        const renderChildren = (g) => g.children.map(c => {
          const cr = g.route + '/' + slug(c);
          return `<div class="ms-nav-item ms-nav-item--sub${route === cr ? ' ms-nav-item--active' : ''}" data-sub="${esc(c)}" data-route="${esc(cr)}"><span>${esc(c)}</span></div>`;
        }).join('');
        const navItem = (g) => {
          const has = g.children && g.children.length;
          const active = route === g.route || route.indexOf(g.route + '/') === 0;
          const subActive = has && route.indexOf(g.route + '/') === 0;
          const chevron = has ? `<span class="bc-eg71-chevron">${ico('chevronDown', 16)}</span>` : '';
          const sub = has ? `<div class="bc-eg71-sub"${subActive ? '' : ' hidden'}>${renderChildren(g)}</div>` : '';
          return `<div class="bc-eg71-nav" data-nav="${esc(g.label)}">
            <div class="ms-nav-item${active ? ' ms-nav-item--active' : ''}" data-nav-trigger data-route="${esc(g.route)}"${has ? ` aria-expanded="${subActive}" aria-haspopup="menu"` : ''}>${ico(g.icon, 16)}<span>${esc(g.label)}</span>${chevron}</div>
            ${sub}
          </div>`;
        };
        // 收起态（80px icon-only）容不下 .bc-eg71-sub 文字，点击一级分组改弹浮窗；挂在 .bc-eg71-sidenav 下（非导航区内），
        // 避免被 .ms-sidebar-body 的 overflow 裁切（同类坑见 admin-sidebar skill 变更历史 2026-09-08 补的记录）
        const popups = groups.filter(g => g.children && g.children.length).map(g =>
          `<div class="bc-eg71-popup" data-popup="${esc(g.route)}" role="menu" hidden>
            <div class="bc-eg71-popup-title">${esc(g.label)}</div>
            ${renderChildren(g)}
          </div>`
        ).join('');
        // 账户下拉菜单（trigger=click / placement=topRight）：含危险项 + Language 二级语言子菜单
        const adminItems = [
          { icon: 'user', label: 'Change Account Info' },
          { label: 'Language', children: [{ icon: 'check', label: 'Chinese' }, { label: 'English' }] },
          { type: 'divider' },
          { label: 'Log out', danger: true }
        ];
        const dropdownItem = (it) => {
          if (it.type === 'divider') return `<div class="ms-dropdown-sep"></div>`;
          if (it.children) {
            return `<div class="ms-dropdown-item bc-eg71-lang" data-eg71-lang>
              <span>${esc(it.label)}</span>
              <span class="bc-eg71-chevron">${ico('chevronDown', 16)}</span>
              <div class="ms-dropdown bc-eg71-lang-menu" hidden>
                ${it.children.map((c) => `<div class="ms-dropdown-item">${c.icon ? ico(c.icon, 16) : ''}<span>${esc(c.label)}</span></div>`).join('')}
              </div>
            </div>`;
          }
          return `<div class="ms-dropdown-item${it.danger ? ' ms-dropdown-item--danger' : ''}">${it.icon ? ico(it.icon, 16) : ''}<span>${esc(it.label)}</span></div>`;
        };
        return `<aside class="ms-sidebar bc-eg71-sidenav">
          <div class="ms-sidebar-brand">
            <span class="ms-logo">${window.MS_BASE_LOGO_SVG({ variant: 'full', color: 'white', height: 32 })}</span>
            <button class="ms-btn ms-btn--xs ms-btn--text bc-eg71-collapse" aria-label="收起侧边栏" aria-expanded="true">${ico('arrowLeft', 16)}</button>
          </div>
          <nav class="ms-sidebar-body"><div class="ms-nav">
            ${groups.map(navItem).join('')}
          </div></nav>
          <div class="ms-sidebar-foot">
            <div class="bc-eg71-foot">
              <span class="ms-avatar ms-avatar--lg">${ico('user', 20)}</span>
              <span class="bc-eg71-foot-name">Admin</span>
              <button class="ms-btn ms-btn--xs ms-btn--text bc-eg71-more" aria-label="账户操作菜单" aria-expanded="false">${ico('moreHoriz', 16)}</button>
            </div>
            <div class="ms-dropdown bc-eg71-admin-menu" hidden>
              ${adminItems.map(dropdownItem).join('')}
            </div>
          </div>
          ${popups}
        </aside>`;
      },
      bind(root) {
        const rootEl = root.querySelector('.bc-eg71-sidenav') || root;
        // 展开/收起：点击 collapse 按钮切换 is-collapsed，折叠/展开图标随状态互换（arrowLeft ↔ arrowRight）
        const collapseBtn = rootEl.querySelector('.bc-eg71-collapse');
        if (collapseBtn) {
          collapseBtn.addEventListener('click', () => {
            const collapsed = rootEl.classList.toggle('is-collapsed');
            collapseBtn.innerHTML = ico(collapsed ? 'arrowRight' : 'arrowLeft', 16);
            collapseBtn.setAttribute('aria-expanded', String(!collapsed));
            collapseBtn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
            // Logo 完整↔图形切换：收起态仅 M 图形（compact），展开态完整字标（full）
            const logo = rootEl.querySelector('.ms-logo');
            if (logo && window.MS_BASE_LOGO_SVG) {
              logo.innerHTML = window.MS_BASE_LOGO_SVG({ variant: collapsed ? 'compact' : 'full', color: 'white', height: 32 });
            }
            // 展开回来时收起态浮窗不再适用，全部收掉
            if (!collapsed) closeAllPopups();
          });
        }
        // 收起态浮窗：全部关闭 + 触发按钮 is-open/aria-expanded 复位
        const closeAllPopups = () => {
          rootEl.querySelectorAll('.bc-eg71-popup').forEach(p => { p.hidden = true; });
          rootEl.querySelectorAll('[data-nav-trigger][aria-haspopup]').forEach(x => {
            x.classList.remove('is-open');
            x.setAttribute('aria-expanded', 'false');
          });
        };
        // 一级导航展开/收起：展开态走内联 accordion（chevron 旋转，仅展开当前项）；
        // 收起态（is-collapsed，80px icon-only）改弹浮窗，定位用 getBoundingClientRect 贴在触发项右侧，
        // 不受 .ms-sidebar-body{overflow:auto} 裁切影响（浮窗挂在 .bc-eg71-sidenav 下，非导航滚动区内）
        rootEl.querySelectorAll('[data-nav]').forEach(nav => {
          const t = nav.querySelector('[data-nav-trigger]');
          const sub = nav.querySelector('.bc-eg71-sub');
          if (!t || !sub) return;
          const route = t.getAttribute('data-route');
          const popup = rootEl.querySelector(`.bc-eg71-popup[data-popup="${route}"]`);
          t.addEventListener('click', (e) => {
            if (rootEl.classList.contains('is-collapsed')) {
              if (!popup) return;
              e.stopPropagation(); // 阻止冒泡到 document 的 closeAllPopups，否则刚打开就被同一次点击关掉
              const willOpen = popup.hidden;
              closeAllPopups();
              if (willOpen) {
                const r = t.getBoundingClientRect();
                const railRight = rootEl.getBoundingClientRect().right; // 用侧边栏容器右缘而非触发项右缘：触发项内边距使其右缘落在 80px 收起轨内侧，会导致浮窗与轨道重叠
                popup.style.top = r.top + 'px';
                popup.style.left = (railRight + 8) + 'px'; // 侧边栏右侧 8px 间距，position:fixed 相对视口定位
                popup.hidden = false;
                t.classList.add('is-open');
                t.setAttribute('aria-expanded', 'true');
              }
              return;
            }
            const willOpen = sub.hidden;
            rootEl.querySelectorAll('.bc-eg71-sub').forEach(s => { s.hidden = true; });
            rootEl.querySelectorAll('[data-nav-trigger]').forEach(x => {
              x.classList.remove('is-open');
              x.setAttribute('aria-expanded', 'false');
            });
            if (willOpen) {
              sub.hidden = false;
              t.classList.add('is-open');
              t.setAttribute('aria-expanded', 'true');
            }
          });
        });
        // 点击浮窗内子条目 / 侧边栏外任意处 → 关闭浮窗；不 stopPropagation，让点击继续冒泡到
        // MS_EG71_SHELL 挂在 .bc-eg71-sidenav 上的路由监听（触发 navigate），关闭与导航互不影响
        document.addEventListener('click', () => closeAllPopups());
        // 子条目点击 → 设为主选中态
        rootEl.querySelectorAll('.ms-nav-item--sub').forEach(item => {
          item.addEventListener('click', () => {
            rootEl.querySelectorAll('.ms-nav-item--sub').forEach(x => x.classList.remove('ms-nav-item--active'));
            item.classList.add('ms-nav-item--active');
          });
        });
        // Admin 账户下拉：点击 more 开关，点击空白处关闭
        const more = rootEl.querySelector('.bc-eg71-more');
        const adminMenu = rootEl.querySelector('.bc-eg71-admin-menu');
        const toggleAdmin = (open) => {
          if (!more || !adminMenu) return;
          adminMenu.hidden = !open;
          more.classList.toggle('is-open', open);
          more.setAttribute('aria-expanded', String(open));
        };
        if (more && adminMenu) {
          more.addEventListener('click', (e) => { e.stopPropagation(); toggleAdmin(adminMenu.hidden); });
          adminMenu.addEventListener('click', (e) => e.stopPropagation());
        }
        // Language 二级子菜单：点击展开
        const lang = rootEl.querySelector('[data-eg71-lang]');
        const langMenu = rootEl.querySelector('.bc-eg71-lang-menu');
        if (lang && langMenu) {
          lang.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.hidden = !langMenu.hidden;
            lang.classList.toggle('is-open', !langMenu.hidden);
          });
        }
        // 点击侧边栏外任意处关闭账户下拉 + 语言子菜单
        document.addEventListener('click', () => {
          toggleAdmin(false);
          if (langMenu) langMenu.hidden = true;
          if (lang) lang.classList.remove('is-open');
        });
      }
    },
    {

        // Figma 2016:88258（默认）：56px 骨架，左面包屑 Home > Channel > Users > News（chevron 分隔，非末级 auxiliary、末级 primary），

    {

        const all = rootEl.querySelector('[data-device-check-all]');
        if (all) all.addEventListener('change', () => {
          rootEl.querySelectorAll('[data-device-check]').forEach(c => { c.checked = all.checked; });
          sync();
        });
        const openModal = desc => {
          if (!modal) return;
          if (modalDesc) modalDesc.textContent = desc;
          pendingRows = [];
          modal.hidden = false;
          modal.classList.add('is-open');
        };
        const closeModal = () => {
          if (!modal) return;
          modal.hidden = true;
          modal.classList.remove('is-open');
        };
        rootEl.querySelectorAll('[data-device-op="delete"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tr = btn.closest('tr');
            const nameTd = tr ? tr.querySelector('td:nth-child(3) .ms-text') : null;
            pendingRows = tr ? [tr] : [];
            openModal(nameTd ? `Are you sure you want to delete "${nameTd.textContent.trim()}"? This operation cannot be undone.` : 'Are you sure you want to delete this device? This operation cannot be undone.');
          });
        });
        if (batchBtn) batchBtn.addEventListener('click', () => {
          pendingRows = Array.prototype.slice.call(rootEl.querySelectorAll('[data-device-check]')).filter(c => c.checked).map(c => c.closest('tr'));
          openModal(`Are you sure you want to delete the ${pendingRows.length} selected device(s)? This operation cannot be undone.`);
        });
        if (modal) {
          const ok = modal.querySelector('[data-modal-ok]');
          if (ok) ok.addEventListener('click', () => {
            pendingRows.forEach(tr => tr.remove());
            pendingRows = [];
            closeModal();
            sync();
          });

          const tip = cell.querySelector('.bc-eg71-signal-tip');

          btn.addEventListener('click', () => {
            btn.dispatchEvent(new CustomEvent('eg71-device-add', { bubbles: true, detail: { path: btn.getAttribute('data-device-add') } }));
          });
        });
        rootEl.querySelectorAll('[data-device-op="edit"], [data-device-op="monitor"]').forEach(btn => {
          btn.addEventListener('click', () => {
            btn.dispatchEvent(new CustomEvent('eg71-device-op', { bubbles: true, detail: { op: btn.getAttribute('data-device-op') } }));
          });
        });

  if(S.svc==='bacnet')c.push(`<td>${esc(r.type)}</td>`,`<td>${esc(r.unit)}</td>`,`<td class="bc-num">${r.inst}</td>`);
  if(S.svc==='modbus')c.push(`<td>${esc(r.regType)}</td>`,`<td>${esc(r.regFmt)}</td>`,`<td class="bc-num">${r.regNum}</td>`,`<td class="bc-num">${r.regAddr}</td>`,`<td>—</td>`);
  c.push(`<td class="bc-eg71-table-ops">${editable?`<button class="ms-btn ms-btn--sm" data-edit="${r.uid}" aria-label="编辑对象">${ico('edit',16)}</button>`:''}<button class="ms-btn ms-btn--sm ms-btn--danger" data-del="${r.uid}" aria-label="删除对象">${ico('trash',16)}</button></td>`);
  return `<tr>${c.join('')}</tr>`;
}
function tableHtml(){
  const list=rows(),n=selN();
  const body=list.length?list.map(rowHtml).join(''):`<tr><td colspan="10"><div class="ms-empty"><div class="ms-empty-text">暂无转发对象，点击「添加对象」从 M-Bus 设备选择</div></div></td></tr>`;
  return `<div class="ms-table-wrap bc-eg71-table">
    <div class="ms-table-toolbar">
      <div class="ms-table-title">转发对象<span class="ms-tag ms-tag--round ms-tag--outline bc-count">${list.length}</span></div>
      <div class="ms-space ms-space--12">
        <button class="ms-btn ms-btn--sm ms-btn--filled" data-add>${ico('plus',16)}添加对象</button>
        <button class="ms-btn ms-btn--sm" data-export ${list.length?'':'disabled'}>${ico('download',16)}批量导出</button>
        <button class="ms-btn ms-btn--sm ms-btn--danger" data-batch-del ${n?'':'disabled'}>${ico('trash',16)}批量删除</button>
      </div>
    </div>
    <table class="ms-table"><thead><tr>${headCells()}</tr></thead><tbody>${body}</tbody></table>
    <div class="bc-table-foot req013-foot">
      <span class="ms-text ms-text--sm ms-text--secondary">共 ${list.length} 个对象${n?` · 已选 ${n} 个`:''}</span>
    </div>
  </div>`;
}
function globHtml(){
  if(S.svc!=='mqtt'&&S.svc!=='http')return '';
  const g=S.glob[S.svc];
  return `<div class="bc-eg71-subarea">
    <div class="ms-text ms-text--sm"><b>全局对象</b><span class="ms-text--auxiliary">（勾选后随对象数据一并转发）</span></div>
    <div class="ms-space ms-space--12">
      <label class="ms-checkbox"><input type="checkbox" data-gobj="sn" ${g.sn?'checked':''}><span class="ms-checkbox-box"></span><span>Gateway SN（网关序列号）</span></label>
      <label class="ms-checkbox"><input type="checkbox" data-gobj="status" ${g.status?'checked':''}><span class="ms-checkbox-box"></span><span>Status（设备状态 · alarmState）</span></label>
    </div>
  </div>`;
}
function tabsHtml(){return `<div class="ms-tabs">${SVCS.map(s=>`<span class="ms-tab${s.key===S.svc?' ms-tab--active':''}" data-svc="${s.key}" role="tab" tabindex="0" aria-selected="${s.key===S.svc}">${esc(s.name)}</span>`).join('')}</div>`}

/* ---------- 添加对象抽屉 ---------- */
function devCheckState(key){
  const d=TREE.find(x=>x.key===key);if(!d||!d.objs.length)return{checked:false,ind:false};
  const hit=d.objs.filter(o=>S.add.sel[key+':'+o.oid]).length;
  return{checked:hit===d.objs.length,ind:hit>0&&hit<d.objs.length};
}
function addDrawerHtml(){
  const open=S.add.open;
  const tree=TREE.map(d=>{
    if(!d.objs.length)return `<div class="ms-tree-node req013-dev req013-off">
      <button class="req013-caret" disabled aria-label="无对象不可展开">${ico('chevronRight',16)}</button>
      <label class="ms-checkbox"><input type="checkbox" disabled><span class="ms-checkbox-box"></span><span>${esc(d.name)}</span></label>
      <span class="ms-tag ms-tag--outline">—</span>
      <span class="req013-hover" tabindex="0">${ico('warn',16)}<span class="req013-bubble"><div class="req013-bubble-text">设备下没有对象，请先到【设备数采】菜单添加对象后，再操作</div></span></span>
    </div>`;
    const st=devCheckState(d.key);
    const objs=open[d.key]?`<div>${d.objs.map(o=>{const uid=d.key+':'+o.oid;const added=rows().find(r=>r.uid===uid);return `<label class="ms-tree-node req013-obj${added?' req013-off':''}"><span class="ms-checkbox"><input type="checkbox" data-obj-check="${uid}" ${added?'disabled ':''}${S.add.sel[uid]?'checked':''}><span class="ms-checkbox-box"></span></span><span class="req013-obj-name">${esc(o.name)}</span><span class="ms-tag ms-tag--outline">${esc(o.unit)}</span><span class="req013-obj-dib">DIB ${o.dib} / VIB ${o.vib}</span>${added?'<span class="ms-tag">已添加</span>':''}</label>`}).join('')}</div>`:'';
    return `<div>
      <div class="ms-tree-node req013-dev">
        <button class="req013-caret" data-toggle="${d.key}" aria-expanded="${!!open[d.key]}" aria-label="展开/收起对象">${ico(open[d.key]?'chevronDown':'chevronRight',16)}</button>
        <label class="ms-checkbox"><input type="checkbox" data-dev-check="${d.key}" ${st.checked?'checked':''}><span class="ms-checkbox-box"></span><span>${esc(d.name)}</span></label>
        <span class="ms-tag ms-tag--outline">${esc(d.model)}</span>
        <span class="req013-obj-dib">设备ID ${d.devId}</span>
      </div>${objs}</div>`;
  }).join('');
  const n=Object.keys(S.add.sel).filter(k=>S.add.sel[k]).length;
  return `<div class="req013-drawer"><div class="ms-mask ms-mask--drawer" data-mask-close>
    <div class="ms-drawer ms-drawer--lg" role="dialog" aria-label="添加对象">
      <div class="ms-drawer-head"><div><div class="ms-h4">添加对象</div><div class="ms-text ms-text--sm ms-text--auxiliary">从 M-Bus 设备选择对象加入 ${esc(svc().name)} 转发</div></div><span class="ms-modal-close" data-add-cancel>${ico('close',16)}</span></div>
      <div class="ms-drawer-body ms-stack">
        <div class="ms-alert ms-alert--info">${ico('info',16)}<div class="ms-alert-body">${esc(svc().desc)}</div></div>
        <div class="req013-tree-wrap">${tree}</div>
      </div>
      <div class="ms-drawer-foot"><button class="ms-btn" data-add-cancel>取消</button><button class="ms-btn ms-btn--filled" data-add-ok ${n?'':'disabled'}>确定${n?`（${n}）`:''}</button></div>
    </div></div></div>`;
}

/* ---------- 编辑对象抽屉（仅 BACnet / Modbus） ---------- */
function editDrawerHtml(){
  const e=S.edit,r=rows().find(x=>x.uid===e.uid),f=e.f,err=e.errs||{};
  const nameItem=fi('name',{label:'对象名称',value:f.name,msg:err.name||'',status:err.name?'error':'normal'});
  const unitItem=fi('unit',{label:'单位',value:f.unit,required:false,msg:''});
  const descItem=fi('desc',{label:'描述',value:f.desc,required:false,msg:''});
  let body='';
  if(S.svc==='bacnet')body=nameItem
    +fs('type',{label:'对象类型',options:['Analog-Input','CharacterString-Value'],value:f.type,msg:''})
    +fi('inst',{label:'实例编号',value:f.inst,msg:'实例编号自动分配，可按需调整。'})
    +unitItem+descItem;
  else body=fs('regType',{label:'寄存器类型',options:['Input Register','Holding Register'],value:f.regType,msg:''})
    +fs('regFmt',{label:'数据格式',options:Object.keys(FMT_N),value:f.regFmt,msg:''})
    +fi('regNum',{label:'寄存器数量',value:f.regNum,msg:f.regFmt==='String'?'String 类型可修改为 1–121，其余格式数量固定。':'非 String 格式数量固定，不可修改。'})
    +fi('regAddr',{label:'寄存器地址',value:f.regAddr,msg:'寄存器地址自动分配，可按需调整。'})
    +unitItem+descItem;
  return `<div class="req013-drawer"><div class="ms-mask ms-mask--drawer" data-mask-close>
    <div class="ms-drawer ms-drawer--lg" role="dialog" aria-label="编辑对象">
      <div class="ms-drawer-head"><div><div class="ms-h4">编辑对象</div><div class="ms-text ms-text--sm ms-text--auxiliary">${esc(r?r.devName+' / '+r.name:'')}</div></div><span class="ms-modal-close" data-edit-cancel>${ico('close',16)}</span></div>
      <div class="ms-drawer-body ms-stack">${body}</div>
      <div class="ms-drawer-foot"><button class="ms-btn" data-edit-cancel>取消</button><button class="ms-btn ms-btn--filled" data-edit-save>保存</button></div>
    </div></div></div>`;
}

/* ---------- 页面与壳装配 ---------- */
function fwdPage(){
  return `<div class="bc-eg71-content req013-page">
    ${pageHead()}
    ${tabsHtml()}
    ${globHtml()}
    ${tableHtml()}
    ${S.drawer==='add'?addDrawerHtml():''}
    ${S.drawer==='edit'?editDrawerHtml():''}
    ${modalHtml()}
    ${toastHtml()}
  </div>`;
}
function shellCtx(){return {route:S.route,entity:{cn:'Data Forwarding',metrics:[]},rows:[{name:'EG71-MBus-Gateway',sn:'6603C47B1120',model:'EG71'}]}}
function content(){return fwdPage()}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=window.MS_EG71_SHELL.render(shellCtx(),{content:content(),footer:''});
  window.MS_EG71_SHELL.bind(app);
  arm(app);
  app.querySelectorAll('[data-dev-check]').forEach(c=>{c.indeterminate=devCheckState(c.dataset.devCheck).ind});
  if(S.drawer==='edit'){
    const num=app.querySelector('[data-f="regNum"] input');
    if(num)num.disabled=S.edit.f.regFmt!=='String';
    bindEditFields(app);
  }
  if(S.modal){
    const wrap=app.querySelector('.req013-modal');
    const mw=wrap&&wrap.querySelector('.bc-eg71-modal');
    if(mw){B['bc-eg71-modal'].bind(wrap);
      if(mw.open)mw.open();else{mw.hidden=false;mw.classList.add('is-open')}
      const ok=mw.querySelector('[data-modal-ok]');
      if(ok)ok.addEventListener('click',()=>{const md=S.modal;S.modal=null;if(md&&md.onOk)md.onOk();render()});
      mw.querySelectorAll('[data-modal-close],[data-modal-cancel]').forEach(b=>b.addEventListener('click',()=>{S.modal=null;render()}));
    }
  }
}
function bindEditFields(root){
  onF(root,'name',v=>{S.edit.f.name=v});
  onF(root,'type',v=>{S.edit.f.type=v});
  onF(root,'inst',v=>{S.edit.f.inst=v});
  onF(root,'regType',v=>{S.edit.f.regType=v});
  onF(root,'regFmt',v=>{S.edit.f.regFmt=v;S.edit.f.regNum=String(FMT_N[v]||1);
    const num=root.querySelector('[data-f="regNum"] input');
    if(num){num.value=S.edit.f.regNum;num.disabled=v!=='String'}
    const hint=root.querySelector('[data-f="regNum"] .bc-eg71-form-item-msg');
    if(hint)hint.textContent=v==='String'?'String 类型可修改为 1–121，其余格式数量固定。':'非 String 格式数量固定，不可修改。';
  });
  onF(root,'regNum',v=>{S.edit.f.regNum=v});
  onF(root,'regAddr',v=>{S.edit.f.regAddr=v});
  onF(root,'unit',v=>{S.edit.f.unit=v});
  onF(root,'desc',v=>{S.edit.f.desc=v});
}
function onF(root,attr,fn){root.querySelectorAll(`[data-f="${attr}"] input,[data-f="${attr}"] select`).forEach(el=>el.addEventListener('change',()=>fn(el.value)))}

/* ---------- 事件（#app 级委托，只挂一次） ---------- */
let armed=false;
function arm(app){
  if(armed)return;armed=true;
  app.addEventListener('click',e=>{
    const q=sel=>e.target.closest?e.target.closest(sel):null;
    const tab=q('[data-svc]');
    if(tab){S.svc=tab.dataset.svc;S.sel={};render();return}
    if(q('[data-add]')){S.drawer='add';S.add={open:{hm1:true},sel:{}};render();return}
    if(q('[data-add-cancel]')||q('[data-edit-cancel]')){S.drawer=null;S.edit=null;render();return}
    const mask=q('[data-mask-close]');
    if(mask&&e.target===mask){S.drawer=null;S.edit=null;render();return}
    const tg=q('[data-toggle]');
    if(tg){const k=tg.dataset.toggle;S.add.open[k]=!S.add.open[k];render();return}
    if(q('[data-add-ok]')){addSel();return}
    const ed=q('[data-edit]');
    if(ed){openEdit(ed.dataset.edit);return}
    if(q('[data-edit-save]')){saveEdit();return}
    const del=q('[data-del]');
    if(del){askDelete([del.dataset.del]);return}
    if(q('[data-batch-del]')){askDelete(Object.keys(S.sel).filter(k=>S.sel[k]));return}
    if(q('[data-export]')){toast(`已导出 ${rows().length} 条对象（xlsx，含设备与对象信息）`);return}
  });
  app.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const t=e.target.closest?e.target.closest('[data-svc]'):null;
    if(t){S.svc=t.dataset.svc;S.sel={};render()}
  });
  app.addEventListener('change',e=>{
    const t=e.target;
    const oc=t.closest?t.closest('[data-obj-check]'):null;
    if(oc){S.add.sel[oc.dataset.objCheck]=oc.checked;render();return}
    const dc=t.closest?t.closest('[data-dev-check]'):null;
    if(dc){const d=TREE.find(x=>x.key===dc.dataset.devCheck);d.objs.forEach(o=>S.add.sel[d.key+':'+o.oid]=dc.checked);render();return}
    const rc=t.closest?t.closest('[data-row-check]'):null;
    if(rc){S.sel[rc.dataset.rowCheck]=rc.checked;render();return}
    const ca=t.closest?t.closest('[data-check-all]'):null;
    if(ca){rows().forEach(r=>S.sel[r.uid]=ca.checked);render();return}
    const go=t.closest?t.closest('[data-gobj]'):null;
    if(go){const k=go.dataset.gobj;S.glob[S.svc][k]=go.checked;toast(`全局对象「${k==='sn'?'Gateway SN':'Status'}」已${go.checked?'加入':'移出'} ${svc().name} 转发`);return}
  });
}

/* ---------- 动作 ---------- */
function addSel(){
  let n=0;
  TREE.forEach(d=>d.objs.forEach(o=>{const uid=d.key+':'+o.oid;
    if(S.add.sel[uid]&&!rows().find(r=>r.uid===uid)){rows().push(makeRow(d,o));n++}}));
  S.drawer=null;render();
  toast(`已添加 ${n} 个对象，转发立即生效`);
}
function openEdit(uid){
  const r=rows().find(x=>x.uid===uid);if(!r)return;
  S.drawer='edit';
  S.edit={uid,f:{name:r.name,type:r.type,inst:String(r.inst==null?'':r.inst),regType:r.regType,regFmt:r.regFmt,regNum:String(r.regNum==null?'':r.regNum),regAddr:String(r.regAddr==null?'':r.regAddr),unit:r.unit,desc:''},errs:{}};
  render();
}
function saveEdit(){
  const e=S.edit,r=rows().find(x=>x.uid===e.uid);
  e.errs={};
  if(!e.f.name.trim()){e.errs={name:'对象名称必填'};render();return}
  if(S.svc==='bacnet'){r.name=e.f.name.trim();r.type=e.f.type;r.inst=parseInt(e.f.inst,10)||r.inst;r.unit=e.f.unit}
  else{r.regType=e.f.regType;r.regFmt=e.f.regFmt;r.regNum=e.f.regFmt==='String'?(parseInt(e.f.regNum,10)||64):FMT_N[e.f.regFmt];r.regAddr=parseInt(e.f.regAddr,10)||0;r.unit=e.f.unit}
  S.drawer=null;S.edit=null;render();
  toast('对象已更新，转发立即生效');
}
function askDelete(uids){
  const list=uids.filter(u=>rows().find(r=>r.uid===u));
  if(!list.length)return;
  modal('delete','删除对象确认','您确认要删除所选的对象吗？','删除',()=>{
    S.fwd[S.svc]=rows().filter(r=>!list.includes(r.uid));
    list.forEach(u=>delete S.sel[u]);
    toast(`已删除 ${list.length} 个对象，编号已释放`);
  });
}

document.addEventListener('DOMContentLoaded',render);
})();

</script></body></html>
