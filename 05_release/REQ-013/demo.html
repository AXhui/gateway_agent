/* ---------- Statistic ---------- */
.ms-stat { display: flex; flex-direction: column; gap: var(--spacing-4); }
.ms-stat-title { font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: var(--spacing-4); }
.ms-stat-value { font-size: 28px; line-height: 1.2; font-weight: 600; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
.ms-stat-value--sm { font-size: 20px; }
.ms-stat-suffix { font-size: 14px; font-weight: 400; color: var(--color-text-secondary); margin-left: var(--spacing-4); }
.ms-stat-trend { font-size: 12px; display: inline-flex; align-items: center; gap: var(--spacing-4); }
.ms-stat-trend--up { color: var(--color-success-normal); }
.ms-stat-trend--down { color: var(--color-error-normal); }
.ms-stat-trend--flat { color: var(--color-text-auxiliary); }

/* ---------- Table ---------- */
.ms-table-wrap { background: var(--color-bg-card); border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-12); overflow: hidden; }
.ms-table { width: 100%; border-collapse: collapse; }
.ms-table th, .ms-table td { padding: 12px 16px; text-align: left; font: 400 13px/1.6 var(--font-sans); border-bottom: 1px solid var(--color-divider-base-1); vertical-align: middle; }
.ms-table thead th { background: var(--color-base-bg); font: 600 12px/1.4 var(--font-sans); color: var(--color-text-auxiliary); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.ms-table tbody tr:last-child td { border-bottom: none; }
.ms-table tbody tr:hover { background: var(--color-base-bg); }
.ms-table tbody tr.ms-table-row--active { background: var(--color-primary-bg); }
.ms-table td.ms-table-num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.ms-table td.ms-table-ops { text-align: right; white-space: nowrap; }
.ms-table td.ms-table-ops .ms-btn--link { margin-left: var(--spacing-12); font-size: 13px; }
.ms-table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12); padding: var(--spacing-12) var(--spacing-16); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-table-title { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }

/* ---------- List / Descriptions / Empty ---------- */
.ms-list { display: flex; flex-direction: column; }
.ms-list-item { display: flex; align-items: center; gap: var(--spacing-12); padding: var(--spacing-12) var(--spacing-16); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-list-item:last-child { border-bottom: none; }
.ms-list-item:hover { background: var(--color-base-bg); }
.ms-list-meta { flex: 1; min-width: 0; }
.ms-list-title { font-size: 14px; color: var(--color-text-primary); }
.ms-list-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: var(--spacing-4); }
.ms-list-actions { display: flex; align-items: center; gap: var(--spacing-8); }
.ms-desc { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--spacing-16); }
.ms-desc-item { display: flex; flex-direction: column; gap: var(--spacing-4); min-width: 0; }
.ms-desc-label { font-size: 12px; color: var(--color-text-auxiliary); }
.ms-desc-value { font-size: 14px; color: var(--color-text-primary); word-break: break-all; }
.ms-desc--bordered { border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-12); overflow: hidden; gap: 0; grid-template-columns: 1fr 1fr; }
.ms-desc--bordered .ms-desc-item { padding: var(--spacing-12) var(--spacing-16); border-bottom: 1px solid var(--color-divider-base-1); border-right: 1px solid var(--color-divider-base-1); }
.ms-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--spacing-12); padding: var(--spacing-40) var(--spacing-16); color: var(--color-text-auxiliary); text-align: center; }
.ms-empty-illu { width: 88px; height: 64px; opacity: 0.7; }
.ms-empty-text { font-size: 13px; }

/* ---------- Timeline / Tree / Steps ---------- */
.ms-timeline { display: flex; flex-direction: column; }
.ms-timeline-item { position: relative; padding: 0 0 var(--spacing-20) var(--spacing-24); border-left: 1px solid var(--color-divider-base-2); }
.ms-timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.ms-timeline-dot { position: absolute; left: -5px; top: 4px; width: 9px; height: 9px; border-radius: var(--radius-full); background: var(--color-primary-normal); box-shadow: 0 0 0 3px var(--color-primary-bg); }
.ms-timeline-dot--success { background: var(--color-success-normal); box-shadow: 0 0 0 3px var(--color-success-bg); }
.ms-timeline-dot--error { background: var(--color-error-normal); box-shadow: 0 0 0 3px var(--color-error-bg); }
.ms-timeline-dot--warm { background: var(--color-warm-normal); box-shadow: 0 0 0 3px var(--color-warm-bg); }
.ms-timeline-dot--muted { background: var(--color-text-auxiliary); box-shadow: 0 0 0 3px var(--color-fill-base-normal); }
.ms-timeline-title { font-size: 14px; color: var(--color-text-primary); display: flex; align-items: center; gap: var(--spacing-8); }
.ms-timeline-time { font-size: 12px; color: var(--color-text-auxiliary); font-family: var(--font-mono); }
.ms-timeline-desc { font-size: 13px; color: var(--color-text-secondary); margin-top: var(--spacing-4); }
.ms-tree { font-size: 14px; }
.ms-tree-node { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-4) var(--spacing-8); border-radius: var(--radius-6); cursor: pointer; color: var(--color-text-primary); }
.ms-tree-node:hover { background: var(--color-bg-hover); }
.ms-tree-node--active { background: var(--color-primary-bg); color: var(--color-primary-normal); font-weight: 500; }
.ms-tree-arrow { width: 16px; display: inline-flex; color: var(--color-text-auxiliary); }
.ms-tree-count { margin-left: auto; font-size: 12px; color: var(--color-text-auxiliary); font-family: var(--font-mono); }
.ms-steps { display: flex; align-items: flex-start; }
.ms-step { flex: 1; display: flex; align-items: center; min-width: 0; }
.ms-step-index {
  width: 24px; height: 24px; flex: none; border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  background: var(--color-bg-card); border: 1px solid var(--color-border-base); color: var(--color-text-auxiliary);
}
.ms-step--active .ms-step-index { background: var(--color-primary-normal); border-color: var(--color-primary-normal); color: var(--color-text-constant-normal); }
.ms-step--done .ms-step-index { background: var(--color-primary-bg); border-color: var(--color-primary-normal); color: var(--color-primary-normal); }
.ms-step-body { padding: 0 var(--spacing-8); min-width: 0; }
.ms-step-title { font-size: 13px; color: var(--color-text-secondary); }
.ms-step--active .ms-step-title { color: var(--color-text-primary); font-weight: 600; }
.ms-step-desc { font-size: 12px; color: var(--color-text-auxiliary); }
.ms-step-line { flex: 1; height: 1px; background: var(--color-divider-base-2); margin-top: 12px; }

/* ---------- Progress / Tooltip / Popover ---------- */
.ms-progress { display: flex; align-items: center; gap: var(--spacing-12); }
.ms-progress-line { flex: 1; height: 8px; border-radius: var(--radius-full); background: var(--color-fill-base-hover); overflow: hidden; }
.ms-progress-bar { height: 100%; border-radius: var(--radius-full); background: var(--color-primary-normal); transition: width var(--duration-normal) var(--ease); }
.ms-progress-bar--success { background: var(--color-success-normal); }
.ms-progress-bar--error { background: var(--color-error-normal); }
.ms-progress-bar--warm { background: var(--color-warm-normal); }
.ms-progress-text { font-size: 12px; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.ms-tip { position: relative; display: inline-flex; }
.ms-tip-bubble {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  padding: var(--spacing-8) var(--spacing-8); border-radius: var(--radius-6);
  background: var(--surface-toast-bg); color: var(--surface-toast-fg); font-size: 12px; white-space: nowrap;
  box-shadow: var(--shadow-2); z-index: 20;
}
.ms-tip-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--surface-toast-bg); }
.ms-popover {
  width: 240px; background: var(--color-bg-card); border: 1px solid var(--color-border-base);
  border-radius: var(--radius-12); box-shadow: var(--shadow-3); padding: var(--spacing-12);
}
.ms-popover-title { font-size: 14px; font-weight: 600; margin-bottom: var(--spacing-8); color: var(--color-text-primary); }
.ms-popover-body { font-size: 13px; color: var(--color-text-secondary); }

/* ---------- Alert / Message / Notification / Result ---------- */
.ms-alert {
  display: flex; gap: var(--spacing-8); padding: var(--spacing-8) var(--spacing-12);
  border-radius: var(--radius-8); font-size: 13px; line-height: 1.6;
  background: var(--color-primary-bg); border: 1px solid var(--color-primary-normal); color: var(--color-text-primary);
}
.ms-alert--success { background: var(--color-success-bg); border-color: var(--color-success-normal); }
.ms-alert--error { background: var(--color-error-bg); border-color: var(--color-error-normal); }
.ms-alert--warn { background: var(--color-warm-bg); border-color: var(--color-warm-normal); }
.ms-alert--info { background: var(--color-fill-base-normal); border-color: var(--color-border-base); }
.ms-alert-icon { flex: none; margin-top: 2px; }
.ms-alert--error .ms-alert-icon { color: var(--color-error-normal); }
.ms-alert--success .ms-alert-icon { color: var(--color-success-normal); }
.ms-alert--warn .ms-alert-icon { color: var(--color-warm-normal); }
.ms-alert-body { flex: 1; min-width: 0; }
.ms-alert-title { font-weight: 600; }
.ms-alert-desc { color: var(--color-text-secondary); }
.ms-message-stack { position: fixed; top: var(--spacing-16); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--spacing-8); z-index: 60; }
.ms-message {
  display: inline-flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-8) var(--spacing-16);
  background: var(--color-bg-card); border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-8);
  box-shadow: var(--shadow-3); font-size: 13px; color: var(--color-text-primary);
}
.ms-notification { width: 320px; background: var(--color-bg-card); border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-12); box-shadow: var(--shadow-4); padding: var(--spacing-16); display: flex; gap: var(--spacing-12); }
.ms-notification-title { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.ms-notification-desc { font-size: 13px; color: var(--color-text-secondary); margin-top: var(--spacing-4); }
.ms-result { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-12); padding: var(--spacing-40) var(--spacing-16); text-align: center; }
.ms-result-icon { width: 56px; height: 56px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: var(--color-success-bg); color: var(--color-success-normal); }
.ms-result-icon--error { background: var(--color-error-bg); color: var(--color-error-normal); }
.ms-result-icon--warn { background: var(--color-warm-bg); color: var(--color-warm-normal); }
.ms-result-icon--info { background: var(--color-primary-bg); color: var(--color-primary-normal); }
.ms-result-title { font-size: 18px; font-weight: 600; color: var(--color-text-primary); }
.ms-result-sub { font-size: 13px; color: var(--color-text-secondary); max-width: 420px; }

/* ---------- Modal / Drawer / Popconfirm ---------- */
.ms-mask { position: fixed; inset: 0; background: var(--surface-mask); z-index: 50; display: flex; align-items: center; justify-content: center; padding: var(--spacing-24); }
.ms-modal { width: 520px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; background: var(--color-bg-card); border-radius: var(--radius-16); box-shadow: var(--shadow-4); overflow: hidden; }
.ms-modal--lg { width: 720px; }
.ms-modal--sm { width: 420px; }
.ms-modal-head { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-20) var(--spacing-24); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-modal-title { font-size: 16px; font-weight: 600; color: var(--color-text-primary); }
.ms-modal-close { cursor: pointer; color: var(--color-text-auxiliary); display: inline-flex; }
.ms-modal-body { padding: var(--spacing-24); overflow: auto; }
.ms-modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-8); padding: var(--spacing-12) var(--spacing-24); border-top: 1px solid var(--color-divider-base-1); background: var(--color-base-bg); }
.ms-mask--drawer { justify-content: flex-end; padding: 0; }
.ms-drawer { width: 480px; max-width: 100%; height: 100%; background: var(--color-bg-card); box-shadow: var(--shadow-4); display: flex; flex-direction: column; }
.ms-drawer--lg { width: 640px; }
.ms-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-16) var(--spacing-24); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-drawer-body { flex: 1; padding: var(--spacing-24); overflow: auto; }
.ms-drawer-foot { padding: var(--spacing-12) var(--spacing-24); border-top: 1px solid var(--color-divider-base-1); display: flex; justify-content: flex-end; gap: var(--spacing-8); }
.ms-popconfirm { width: 260px; background: var(--color-bg-card); border: 1px solid var(--color-border-base); border-radius: var(--radius-12); box-shadow: var(--shadow-3); padding: var(--spacing-16); }
.ms-popconfirm-title { display: flex; gap: var(--spacing-8); font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.ms-popconfirm-title .ms-ico { color: var(--color-warm-normal); }
.ms-popconfirm-desc { font-size: 13px; color: var(--color-text-secondary); margin: var(--spacing-8) 0 var(--spacing-12) 24px; }
.ms-popconfirm-foot { display: flex; justify-content: flex-end; gap: var(--spacing-8); }

/* ---------- Spin / Skeleton ---------- */
.ms-spin { display: inline-flex; align-items: center; justify-content: center; color: var(--color-primary-normal); animation: ms-rotate 800ms linear infinite; }
.ms-spin--sm { width: 14px; height: 14px; }
.ms-spin--md { width: 20px; height: 20px; }
.ms-spin--lg { width: 32px; height: 32px; }
.ms-spin-wrap { position: relative; }
.ms-spin-wrap > .ms-spin-mask { position: absolute; inset: 0; background: var(--color-bg-card); opacity: 0.6; display: flex; align-items: center; justify-content: center; }
@keyframes ms-rotate { to { transform: rotate(360deg); } }
.ms-skeleton { display: flex; flex-direction: column; gap: var(--spacing-12); }
.ms-skeleton-bar { height: 14px; border-radius: var(--radius-4); background: linear-gradient(90deg, var(--color-fill-base-normal) 25%, var(--color-bg-hover) 37%, var(--color-fill-base-normal) 63%); background-size: 400% 100%; animation: ms-shimmer 1.4s ease infinite; }
.ms-skeleton-bar--title { height: 20px; width: 40%; }
.ms-skeleton-bar--short { width: 60%; }
@keyframes ms-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ---------- Tabs / Pagination / Breadcrumb / NavMenu / PageHeader / Dropdown / Segmented ---------- */
.ms-tabs { border-bottom: 1px solid var(--color-divider-base-2); display: flex; align-items: center; gap: var(--spacing-24); }
.ms-tab { position: relative; padding: var(--spacing-8) 0; font-size: 14px; color: var(--color-text-secondary); cursor: pointer; white-space: nowrap; }
.ms-tab:hover { color: var(--color-primary-normal); }
.ms-tab--active { color: var(--color-primary-normal); font-weight: 500; }
.ms-tab--active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-primary-normal); border-radius: var(--radius-2); }
.ms-tab-badge { margin-left: var(--spacing-4); }
.ms-tabs--card { border-bottom: 0; gap: var(--spacing-4); background: var(--color-fill-base-normal); padding: var(--spacing-4); border-radius: var(--radius-8); }
.ms-tabs--card .ms-tab { padding: var(--spacing-8) var(--spacing-16); border-radius: var(--radius-6); }
.ms-tabs--card .ms-tab--active { background: var(--color-bg-card); box-shadow: var(--shadow-1); }
.ms-tabs--card .ms-tab--active::after { display: none; }
.ms-pagination { display: flex; align-items: center; gap: var(--spacing-8); font-size: 13px; color: var(--color-text-secondary); }
.ms-page-item { min-width: 30px; height: 30px; padding: 0 var(--spacing-8); display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--color-border-base); border-radius: var(--radius-6); background: var(--color-bg-card); color: var(--color-text-primary); cursor: pointer; font-variant-numeric: tabular-nums; }
.ms-page-item:hover { border-color: var(--color-primary-normal); color: var(--color-primary-normal); }
.ms-page-item--active { background: var(--color-primary-normal); border-color: var(--color-primary-normal); color: var(--color-text-constant-normal); }
.ms-page-item[disabled] { opacity: 0.4; cursor: not-allowed; }
.ms-page-jump { display: inline-flex; align-items: center; gap: var(--spacing-4); margin-left: var(--spacing-8); }
.ms-page-jump input { width: 48px; height: 30px; border: 1px solid var(--color-border-base); border-radius: var(--radius-6); text-align: center; font: 400 13px/1 var(--font-sans); color: var(--color-text-primary); background: var(--color-bg-card); outline: 0; }
.ms-breadcrumb { display: flex; align-items: center; gap: var(--spacing-8); font-size: 13px; color: var(--color-text-auxiliary); }
.ms-breadcrumb a { color: var(--color-text-secondary); text-decoration: none; cursor: pointer; }
.ms-breadcrumb a:hover { color: var(--color-primary-normal); }
.ms-breadcrumb-sep { color: var(--color-text-disable); }
.ms-nav { display: flex; flex-direction: column; gap: var(--spacing-4); }
.ms-nav-group { padding: var(--spacing-12) var(--spacing-12) var(--spacing-4); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-auxiliary); }
.ms-nav-item { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-8) var(--spacing-12); border-radius: var(--radius-8); font-size: 14px; color: var(--color-text-secondary); cursor: pointer; }
.ms-nav-item:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
.ms-nav-item--active { background: var(--color-primary-bg); color: var(--color-primary-normal); font-weight: 500; }
.ms-nav-item .ms-ico { color: currentColor; }
.ms-nav-count { margin-left: auto; font-size: 12px; font-family: var(--font-mono); color: var(--color-text-auxiliary); }
.ms-page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-16); padding-bottom: var(--spacing-16); }
.ms-page-header-main { min-width: 0; }
.ms-page-header-title { display: flex; align-items: center; gap: var(--spacing-8); }
.ms-page-header-desc { font-size: 13px; color: var(--color-text-secondary); margin-top: var(--spacing-4); }
.ms-page-header-extra { display: flex; align-items: center; gap: var(--spacing-8); flex: none; }
.ms-dropdown { min-width: 160px; background: var(--color-bg-card); border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-12); box-shadow: var(--shadow-3); padding: var(--spacing-4); }
.ms-dropdown-item { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-8) var(--spacing-12); border-radius: var(--radius-6); font-size: 13px; color: var(--color-text-primary); cursor: pointer; }
.ms-dropdown-item:hover { background: var(--color-bg-hover); }
.ms-dropdown-item--danger { color: var(--color-error-normal); }
.ms-dropdown-item--danger:hover { background: var(--color-error-bg); }
.ms-dropdown-sep { height: 1px; background: var(--color-divider-base-1); margin: var(--spacing-4) 0; }
.ms-segmented { display: inline-flex; padding: var(--spacing-4); background: var(--color-fill-base-normal); border-radius: var(--radius-8); }
.ms-segmented-item { padding: var(--spacing-4) var(--spacing-12); border-radius: var(--radius-6); font-size: 13px; color: var(--color-text-secondary); cursor: pointer; white-space: nowrap; }
.ms-segmented-item--active { background: var(--color-bg-card); color: var(--color-text-primary); font-weight: 500; box-shadow: var(--shadow-1); }
.ms-anchor { display: flex; flex-direction: column; gap: var(--spacing-8); border-left: 2px solid var(--color-divider-base-2); }
.ms-anchor-item { padding-left: var(--spacing-12); font-size: 13px; color: var(--color-text-secondary); cursor: pointer; }
.ms-anchor-item--active { color: var(--color-primary-normal); border-left: 2px solid var(--color-primary-normal); margin-left: -2px; font-weight: 500; }
.ms-anchor-item:hover { color: var(--color-text-primary); }

/* ---------- Logo ---------- */
/* Logo 直接引用官方 SVG 原图（frontend/components/Logo/assets/），品牌色为官方硬编码色值，
   豁免 token 约束（外部品牌资产）。业务层通过 MS_BASE_LOGO_SVG({ variant, color, height })
   切换完整/图形、标准/反白，渲染为 <img> 而非内联 <svg>。 */
.ms-logo { display: inline-flex; align-items: center; text-decoration: none; }
.ms-logo img, .ms-logo svg { display: block; }

/* ---------- Affix ---------- */
.ms-affix { position: relative; }
.ms-affix-body { width: 100%; }
.ms-affix--fixed > .ms-affix-body { position: fixed; z-index: 90; box-shadow: var(--shadow-2); }
.ms-affix--top > .ms-affix-body { top: 0; }
.ms-affix--bottom > .ms-affix-body { bottom: 0; }
.ms-affix--sticky { position: sticky; z-index: 90; }

/* ---------- BackTop ---------- */
.ms-backtop {
  position: fixed; right: var(--spacing-24); bottom: var(--spacing-40); z-index: 90;
  width: 40px; height: 40px; border-radius: var(--radius-full); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-card); color: var(--color-text-secondary);
  border: 1px solid var(--color-border-base); box-shadow: var(--shadow-2);
  transition: opacity var(--duration-normal) var(--ease), background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
}
.ms-backtop:hover { background: var(--color-primary-normal); border-color: var(--color-primary-normal); color: var(--color-text-constant-normal); }
.ms-backtop--hidden { opacity: 0; pointer-events: none; }
.ms-anchor-wrap { position: sticky; top: var(--spacing-24); z-index: 10; max-height: calc(100vh - var(--spacing-64)); overflow: auto; }

/* ---------- AutoComplete ---------- */
.ms-autocomplete { position: relative; display: block; }
.ms-autocomplete-panel {
  position: absolute; top: calc(100% + var(--spacing-4)); left: 0; right: 0; z-index: 30;
  background: var(--color-bg-card); border: 1px solid var(--color-border-base);
  border-radius: var(--radius-8); box-shadow: var(--shadow-2); padding: var(--spacing-4);
  max-height: 240px; overflow: auto;
}
.ms-autocomplete-item { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-8) var(--spacing-12); border-radius: var(--radius-6); font-size: 13px; color: var(--color-text-primary); cursor: pointer; }
.ms-autocomplete-item:hover, .ms-autocomplete-item--active { background: var(--color-bg-page); }
.ms-autocomplete-item mark { background: transparent; color: var(--color-primary-normal); font-weight: 600; }
.ms-autocomplete-empty { padding: var(--spacing-12); font-size: 13px; color: var(--color-text-auxiliary); text-align: center; }
.ms-autocomplete-group { padding: var(--spacing-6) var(--spacing-12) var(--spacing-4); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-auxiliary); }

/* ---------- TimePicker ---------- */
.ms-timepicker { display: inline-flex; background: var(--color-bg-card); border: 1px solid var(--color-border-base); border-radius: var(--radius-8); overflow: hidden; }
.ms-timepicker-col { width: 56px; max-height: 180px; overflow: auto; border-right: 1px solid var(--color-divider-base-1); padding: var(--spacing-4) 0; }
.ms-timepicker-col:last-child { border-right: 0; }
.ms-timepicker-cell { height: 32px; display: flex; align-items: center; justify-content: center; font: 400 13px/1 var(--font-mono); color: var(--color-text-primary); cursor: pointer; }
.ms-timepicker-cell:hover { background: var(--color-bg-hover); }
.ms-timepicker-cell--active { background: var(--color-primary-normal); color: var(--color-text-constant-normal); font-weight: 600; }
.ms-timepicker-cell--disabled { opacity: 0.4; cursor: not-allowed; }
.ms-timepicker-foot { border-top: 1px solid var(--color-divider-base-1); padding: var(--spacing-8); display: flex; align-items: center; justify-content: space-between; }

/* ---------- Cascader / TreeSelect ---------- */
.ms-cascader { display: inline-flex; background: var(--color-bg-card); border: 1px solid var(--color-border-base); border-radius: var(--radius-8); box-shadow: var(--shadow-2); overflow: hidden; }
.ms-cascader-col { width: 160px; max-height: 220px; overflow: auto; border-right: 1px solid var(--color-divider-base-1); padding: var(--spacing-4) 0; }
.ms-cascader-col:last-child { border-right: 0; }
.ms-cascader-node { display: flex; align-items: center; gap: var(--spacing-6); padding: var(--spacing-6) var(--spacing-12); font-size: 13px; color: var(--color-text-primary); cursor: pointer; }
.ms-cascader-node:hover { background: var(--color-bg-hover); }
.ms-cascader-node--active { background: var(--color-primary-bg); color: var(--color-primary-normal); font-weight: 500; }
.ms-cascader-node--disabled { color: var(--color-text-disable); cursor: not-allowed; }
.ms-cascader-arrow { margin-left: auto; color: var(--color-text-auxiliary); }
.ms-treeselect-panel { width: 280px; background: var(--color-bg-card); border: 1px solid var(--color-border-base); border-radius: var(--radius-8); box-shadow: var(--shadow-2); padding: var(--spacing-8); }
.ms-treeselect-search { margin-bottom: var(--spacing-8); }

/* ---------- Transfer ---------- */
.ms-transfer { display: flex; align-items: stretch; gap: var(--spacing-12); }
.ms-transfer-panel { flex: 1; min-width: 0; border: 1px solid var(--color-border-base); border-radius: var(--radius-8); background: var(--color-bg-card); overflow: hidden; }
.ms-transfer-head { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-8) var(--spacing-12); border-bottom: 1px solid var(--color-divider-base-1); background: var(--color-base-bg); font-size: 13px; font-weight: 600; }
.ms-transfer-head-count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-auxiliary); font-weight: 400; }
.ms-transfer-body { height: 240px; overflow: auto; padding: var(--spacing-4) 0; }
.ms-transfer-item { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-6) var(--spacing-12); font-size: 13px; color: var(--color-text-primary); }
.ms-transfer-item:hover { background: var(--color-bg-hover); }
.ms-transfer-ops { display: flex; flex-direction: column; justify-content: center; gap: var(--spacing-8); }
.ms-transfer-empty { height: 240px; display: flex; align-items: center; justify-content: center; color: var(--color-text-auxiliary); font-size: 13px; }

/* ---------- Calendar ---------- */
.ms-calendar { background: var(--color-bg-card); border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-12); overflow: hidden; }
.ms-calendar-head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12); padding: var(--spacing-12) var(--spacing-16); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.ms-calendar-week { padding: var(--spacing-8) 0; text-align: center; font-size: 12px; color: var(--color-text-auxiliary); background: var(--color-base-bg); }
.ms-calendar-cell { min-height: 84px; padding: var(--spacing-6); border-top: 1px solid var(--color-divider-base-1); border-left: 1px solid var(--color-divider-base-1); font-size: 13px; color: var(--color-text-primary); }
.ms-calendar-cell:nth-child(7n + 1) { border-left: 0; }
.ms-calendar-cell--muted { color: var(--color-text-auxiliary); background: var(--color-base-bg); }
.ms-calendar-cell--selected { background: var(--color-primary-bg); }
.ms-calendar-date { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: var(--radius-full); font-variant-numeric: tabular-nums; }
.ms-calendar-cell--today .ms-calendar-date { background: var(--color-primary-normal); color: var(--color-text-constant-normal); }
.ms-calendar-note { margin-top: var(--spacing-4); display: flex; flex-direction: column; gap: var(--spacing-2); }

/* ---------- Collapse ---------- */
.ms-collapse { border: 1px solid var(--color-border-base); border-radius: var(--radius-8); overflow: hidden; background: var(--color-bg-card); }
.ms-collapse-item + .ms-collapse-item { border-top: 1px solid var(--color-divider-base-1); }
.ms-collapse-head { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-12) var(--spacing-16); font-size: 14px; font-weight: 500; color: var(--color-text-primary); cursor: pointer; transition: background var(--duration-fast) var(--ease); }
.ms-collapse-head:hover { background: var(--color-bg-page); }
.ms-collapse-caret { color: var(--color-text-auxiliary); transition: transform var(--duration-normal) var(--ease); }
.ms-collapse-item--open .ms-collapse-caret { transform: rotate(180deg); }
.ms-collapse-body { padding: 0 var(--spacing-16) var(--spacing-16); font-size: 13px; color: var(--color-text-secondary); line-height: 1.8; }
.ms-collapse-extra { margin-left: auto; display: inline-flex; align-items: center; gap: var(--spacing-8); }
.ms-collapse--ghost { border: 0; border-radius: 0; background: transparent; }
.ms-collapse--ghost .ms-collapse-item + .ms-collapse-item { border-top: 1px solid var(--color-divider-base-2); }
.ms-collapse--ghost .ms-collapse-head { padding-left: 0; padding-right: 0; }

/* ---------- Comment ---------- */
.ms-comment { display: flex; gap: var(--spacing-12); }
.ms-comment-main { flex: 1; min-width: 0; }
.ms-comment-head { display: flex; align-items: center; gap: var(--spacing-8); }
.ms-comment-author { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.ms-comment-time { font-size: 12px; color: var(--color-text-auxiliary); }
.ms-comment-content { font-size: 14px; line-height: 1.75; color: var(--color-text-primary); margin-top: var(--spacing-4); }
.ms-comment-actions { display: flex; align-items: center; gap: var(--spacing-16); margin-top: var(--spacing-8); font-size: 12px; color: var(--color-text-secondary); }
.ms-comment-action { display: inline-flex; align-items: center; gap: var(--spacing-4); cursor: pointer; }
.ms-comment-action:hover { color: var(--color-primary-normal); }
.ms-comment-action--active { color: var(--color-primary-normal); }
.ms-comment-children { margin-top: var(--spacing-12); padding-left: var(--spacing-16); border-left: 2px solid var(--color-divider-base-1); display: flex; flex-direction: column; gap: var(--spacing-12); }

/* ---------- Image ---------- */
.ms-image { position: relative; display: inline-flex; overflow: hidden; border-radius: var(--radius-8); background: var(--color-bg-hover); }
.ms-image > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ms-image--fallback { display: flex; align-items: center; justify-content: center; color: var(--color-text-auxiliary); background: var(--color-fill-base-normal); }
.ms-image-caption { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--spacing-8) var(--spacing-12); background: var(--surface-mask); color: var(--color-text-constant-normal); font-size: 12px; }
.ms-image-group { display: flex; gap: var(--spacing-8); flex-wrap: wrap; }
.ms-image-mask { position: fixed; inset: 0; z-index: 60; background: var(--surface-mask); display: flex; align-items: center; justify-content: center; }
.ms-image-preview { max-width: 80vw; max-height: 80vh; border-radius: var(--radius-12); box-shadow: var(--shadow-4); }

/* ---------- Rate ---------- */
.ms-rate { display: inline-flex; align-items: center; gap: var(--spacing-4); }
.ms-rate-star { width: 20px; height: 20px; color: var(--color-warm-normal); cursor: pointer; display: inline-flex; }
.ms-rate-star--empty { color: var(--color-fill-base-hover); }
.ms-rate--sm .ms-rate-star { width: 16px; height: 16px; }
.ms-rate--lg .ms-rate-star { width: 26px; height: 26px; }
.ms-rate--disabled .ms-rate-star { cursor: default; }
.ms-rate-text { margin-left: var(--spacing-8); font-size: 13px; color: var(--color-text-secondary); }

/* ---------- Watermark ---------- */
.ms-watermark { position: relative; }
.ms-watermark-layer {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--spacing-40);
  align-content: space-around; justify-items: center;
}
.ms-watermark-item { font-size: 14px; color: var(--color-text-auxiliary); opacity: 0.12; transform: rotate(-22deg); white-space: nowrap; user-select: none; }

/* ---------- 布局骨架 ---------- */
.ms-shell { display: flex; height: 100vh; background: var(--color-bg-page); }    /* 锁定视口高度（非 min-height）：内容撑高时侧栏/头像仍贴底常驻，滚动交给 .ms-sidebar-body / .ms-content 内部 */
.ms-sidebar { width: var(--sidebar-w); flex: none; background: var(--color-bg-card); border-right: 1px solid var(--color-divider-base-1); display: flex; flex-direction: column; }
.ms-sidebar-brand { height: var(--header-h); display: flex; align-items: center; gap: var(--spacing-8); padding: 0 var(--spacing-16); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-sidebar-brand-mark { width: 26px; height: 26px; border-radius: var(--radius-8); background: var(--color-primary-normal); color: var(--color-text-constant-normal); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
.ms-sidebar-brand-name { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
.ms-sidebar-body { flex: 1; overflow: auto; padding: var(--spacing-8); }
.ms-sidebar-foot { padding: var(--spacing-12); border-top: 1px solid var(--color-divider-base-1); }
.ms-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ms-header { height: var(--header-h); flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12); padding: 0 var(--spacing-24); background: var(--color-bg-card); border-bottom: 1px solid var(--color-divider-base-1); }
.ms-header-left, .ms-header-right { display: flex; align-items: center; gap: var(--spacing-12); }
.ms-content { flex: 1; padding: var(--spacing-24); overflow: auto; display: flex; flex-direction: column; gap: var(--spacing-16); }
.ms-content--wide { padding: var(--spacing-20); }
.ms-stack { display: flex; flex-direction: column; gap: var(--spacing-16); }
.ms-stack--tight { gap: var(--spacing-8); }
.ms-stack--loose { gap: var(--spacing-24); }
.ms-grid-2, .ms-grid-3, .ms-grid-4 { display: grid; gap: var(--spacing-16); }
.ms-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ms-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ms-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ms-grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--spacing-16); }
@media (max-width: 1180px) {
  .ms-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ms-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ms-grid-2-1 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .ms-grid-2, .ms-grid-3, .ms-grid-4 { grid-template-columns: minmax(0, 1fr); }
  .ms-sidebar { display: none; }
  .ms-content { padding: var(--spacing-16); }
}

/* ==========================================================================
   L3 · 业务组件层样式 (Business Components)
   --------------------------------------------------------------------------
   只允许两件事：
   ① 引用 L1 令牌（颜色 / 间距 / 圆角 / 阴影 / 动效）
   ② 对 L2 基础组件做「布局编排」，不得重新定义基础组件的视觉属性
   ========================================================================== */

/* ---------- 指标卡 ---------- */
.bc-metric { transition: border-color var(--duration-normal) var(--ease), box-shadow var(--duration-normal) var(--ease); }
.bc-metric:hover { border-color: var(--color-border-base); box-shadow: var(--shadow-1); }
.bc-metric-body { display: flex; flex-direction: column; gap: var(--spacing-8); padding: var(--spacing-20); }

/* ---------- 筛选栏 ---------- */
.bc-filter { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-12); }
.bc-filter-search { width: 260px; }
.bc-filter-select { width: 140px; }
.bc-filter-date { width: 220px; }
.bc-filter-actions { margin-left: auto; display: inline-flex; gap: var(--spacing-8); }
@media (max-width: 980px) { .bc-filter-search, .bc-filter-date { width: 100%; } .bc-filter-actions { margin-left: 0; } }

/* ---------- 数据表格 ---------- */
.bc-col-check { width: 44px; }
.bc-count { margin-left: var(--spacing-8); }
.bc-table-foot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12);
  padding: var(--spacing-12) var(--spacing-16); border-top: 1px solid var(--color-divider-base-1);
  background: var(--color-base-bg); flex-wrap: wrap;
}
.bc-bar { display: inline-flex; align-items: center; gap: var(--spacing-8); }
.bc-bar-track {
  display: block; width: 56px; height: 6px; border-radius: var(--radius-full);
  background: var(--color-fill-base-hover); overflow: hidden; flex: none;
}
.bc-bar-track > b { display: block; height: 100%; border-radius: var(--radius-full); }
.bc-bar-track--success > b { background: var(--color-success-normal); }
.bc-bar-track--warm > b { background: var(--color-warm-normal); }
.bc-bar-track--error > b { background: var(--color-error-normal); }
.bc-bar > em { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); }

.bc-code {
  font: 400 12px/1.5 var(--font-mono); color: var(--color-text-primary);
  background: var(--color-primary-bg); padding: 2px 6px; border-radius: var(--radius-4);
}
.bc-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
.bc-num em { font-style: normal; color: var(--color-text-auxiliary); font-size: 12px; margin-left: var(--spacing-4); }
.bc-time { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); }
.bc-user { display: inline-flex; align-items: center; gap: var(--spacing-8); min-width: 0; }
.bc-user .ms-list-desc { display: block; }
.ms-select--inline { width: auto; display: inline-block; }
.ms-select--inline::after { right: var(--spacing-8); }
.ms-select--inline .ms-select-native { height: 28px; font-size: 13px; padding: 0 var(--spacing-24) 0 var(--spacing-8); }

/* ---------- 图表（纯 SVG，无第三方库） ---------- */
.bc-chart-grid { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: var(--spacing-16); align-items: stretch; }
.bc-chart-main { display: flex; flex-direction: column; gap: var(--spacing-8); min-width: 0; }
.bc-chart-svg { width: 100%; height: 200px; display: block; }
.bc-chart-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-auxiliary); font-family: var(--font-mono); }
.bc-chart-side { padding-left: var(--spacing-16); border-left: 1px solid var(--color-divider-base-2); }
.bc-chart-stat { display: flex; align-items: baseline; justify-content: space-between; gap: var(--spacing-8); }
@media (max-width: 980px) {
  .bc-chart-grid { grid-template-columns: minmax(0, 1fr); }
  .bc-chart-side { padding-left: 0; border-left: 0; padding-top: var(--spacing-12); border-top: 1px solid var(--color-divider-base-2); }
}

/* ---------- 拓扑 ---------- */
.bc-topo { width: 100%; height: auto; display: block; }

/* ---------- 抽屉 / 弹窗 的静态预览（生成稿需要「所见即所得」） ---------- */
.bc-drawer-preview, .bc-modal-preview { position: relative; }
.bc-drawer-static {
  position: relative; width: 100%; max-width: 520px; margin-left: auto; height: auto;
  box-shadow: var(--shadow-2); border: 1px solid var(--color-border-base); border-radius: var(--radius-12);
}
.bc-drawer-static .ms-drawer-body { max-height: none; }
.bc-modal-preview .ms-modal { max-width: 100%; box-shadow: var(--shadow-2); border: 1px solid var(--color-border-base); }
.bc-progress-list { display: flex; flex-direction: column; gap: var(--spacing-12); }

/* ---------- 空态 / 快捷操作 ---------- */
.bc-empty-actions { display: inline-flex; gap: var(--spacing-8); flex-wrap: wrap; justify-content: center; }
.bc-empty { padding: var(--spacing-64) var(--spacing-16); }
.bc-empty .ms-empty-illu { width: 146px; height: 96px; opacity: 1; }
.bc-empty .ms-empty-text { font-size: 14px; line-height: 22px; color: var(--color-text-primary); }
.bc-empty-sub { font-size: 12px; line-height: 20px; color: var(--color-text-auxiliary); }
.bc-quick { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-8); }
.bc-quick-label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-auxiliary); }
.bc-quick-spacer { flex: 1; }

/* ---------- 生成稿页面骨架 ---------- */
.bc-page { min-height: 100vh; }
.bc-section { display: flex; flex-direction: column; gap: var(--spacing-12); }
.bc-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--spacing-12); }
.bc-section-title { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
.bc-section-desc { font-size: 12px; color: var(--color-text-secondary); }
.bc-generated-badge {
  display: inline-flex; align-items: center; gap: var(--spacing-4); height: 22px; padding: 0 var(--spacing-8);
  border-radius: var(--radius-full); background: var(--color-primary-bg); color: var(--color-primary-normal);
  font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
}

/* ---------- EG71 侧边导航 ---------- */
/* Figma 2016:89103：220px 深色侧边栏。深色配色「基本固定」按 Figma 写死
   （不随 [data-theme] 切换），仅本组件作用域内覆盖，不动全局 --sidebar-w。 */
.bc-eg71-sidenav {
  width: 220px;
  background: #182032;                              /* Figma color-bg-6 */
  border-right: 1px solid #1c1c1c;
  transition: width var(--duration-normal) var(--ease);
}
.bc-eg71-sidenav .ms-sidebar-brand { border-bottom: 1px solid #1c1c1c; }
.bc-eg71-sidenav .ms-sidebar-foot { border-top: 1px solid #1c1c1c; }
.bc-eg71-sidenav .ms-nav-item { color: #d6d6d8; }
.bc-eg71-sidenav .ms-nav-item:hover { background: #1c1c1c; color: #ffffff; }
.bc-eg71-sidenav .ms-nav-item--active { background: #052461; color: #5eafff; font-weight: 500; }
.bc-eg71-sidenav .ms-nav-item--active:hover { background: #052461; color: #5eafff; }
.bc-eg71-sidenav .ms-avatar { background: #052461; color: #5eafff; }
.bc-eg71-sidenav .bc-eg71-foot-name { color: #ffffff; }
.bc-eg71-sidenav .bc-eg71-chevron { color: #7c7d7e; }                     /* 默认未展开态：对应 icon-auxiliary / gray-05（暗色板 7C7D7E） */
.bc-eg71-sidenav .ms-dropdown { background: #1c1c1c; border-color: #2c2c2c; }
.bc-eg71-sidenav .ms-dropdown-item { color: #d6d6d8; }
.bc-eg71-sidenav .ms-dropdown-item:hover { background: #2c2c2c; color: #ffffff; }
.bc-eg71-sidenav .ms-dropdown-item--danger { color: #f53f3f; }
.bc-eg71-sidenav .ms-dropdown-item--danger:hover { background: #2c2c2c; color: #f53f3f; }
.bc-eg71-sidenav .ms-dropdown-sep { background: #2c2c2c; }

/* 间距对齐 Figma 2016:89103：覆写基础组件默认间距（调用 .ms-sidebar/.ms-nav/.ms-nav-item 基础控件，
   仅本作用域改写封装）。能命中令牌的引令牌；9px / 10px 为 Figma 指定且令牌无命中，写死。 */
.bc-eg71-sidenav .ms-sidebar-brand { position: relative; padding: 10px var(--spacing-12); gap: 10px; }            /* Logo 区 px-12 py-10 gap-10；relative 供 collapse 按钮定位 */
.bc-eg71-sidenav .ms-sidebar-body { padding: var(--spacing-12) 0 0; }                                            /* 菜单区 pt-12 */
.bc-eg71-sidenav .ms-nav { padding: var(--spacing-4) var(--spacing-8); gap: var(--spacing-8); }                  /* arco-menu-inner px-8 py-4 gap-8 */
.bc-eg71-sidenav .ms-nav-item { padding: 9px var(--spacing-12); border-radius: var(--radius-2); gap: var(--spacing-8); } /* 一级项 px-12 py-9 rounded-2 gap-8 */
.bc-eg71-sidenav .ms-sidebar-foot { padding: var(--spacing-20) var(--spacing-12); }                              /* 账户区 px-12 py-20 */
.bc-eg71-sidenav .bc-eg71-foot { gap: 10px; }                                                                    /* 账户区 gap-10 */

.bc-eg71-collapse { flex: none; margin-left: auto; color: #ffffff; border-color: transparent; background: transparent; }
.bc-eg71-collapse:hover { background: #1c1c1c; }
/* 展开态：按钮距右侧 8px（brand 右 padding 12px，按钮靠右 margin-left:auto，再向右贴 4px 使右缘距边 8px） */
.bc-eg71-sidenav:not(.is-collapsed) .bc-eg71-collapse { margin-right: calc(var(--spacing-8) - var(--spacing-12)); }
.bc-eg71-chevron {
  margin-left: auto; display: inline-flex;
  transition: transform var(--duration-normal) var(--ease);
}
/* 交互：导航子菜单 + 下拉开关态（配合 bind() 的 hidden / is-open 切换） */
.bc-eg71-sidenav [hidden] { display: none !important; }
.bc-eg71-nav { display: flex; flex-direction: column; gap: var(--spacing-4); }  /* Figma 菜单组 gap-4 */
.bc-eg71-sub { display: flex; flex-direction: column; gap: var(--spacing-4); padding-left: var(--spacing-24); }
.bc-eg71-sub .ms-nav-item { font-size: 13px; }
.bc-eg71-nav .ms-nav-item.is-open .bc-eg71-chevron { transform: rotate(180deg); color: #5eafff; } /* 展开态：对应 primary-normal / blue-05（5EAFFF） */
.bc-eg71-foot { display: flex; align-items: center; gap: var(--spacing-8); position: relative; }
.bc-eg71-foot-name { flex: 1; min-width: 0; font-weight: 500; }
.bc-eg71-more { flex: none; color: #d6d6d8; }
.bc-eg71-admin-menu { position: absolute; right: 0; bottom: calc(100% + var(--spacing-8)); }
.bc-eg71-lang { position: relative; }
.bc-eg71-lang-menu { position: absolute; right: calc(100% + var(--spacing-4)); top: 0; }

/* 展开/收起态：宽 220px → 80px，logo 文字 / 一级 label / chevron / 子菜单 / 账户名 / more 全隐藏，
   仅留 icon 居中；collapse 按钮图标由 bind() 在 arrowLeft ↔ arrowRight 间互换（点按即变，无需 CSS 旋转）。 */
.bc-eg71-sidenav.is-collapsed { width: 80px; }
.bc-eg71-sidenav.is-collapsed .ms-sidebar-brand { gap: 0; justify-content: center; }
/* 收起态：collapse 按钮 50% 悬浮在侧边栏右缘外，按 Figma basic2Button 加底框，整体方形
   （bg #182032 + 边框 #38393b 为 Figma 指定且无令牌命中，写死；20×20 尺寸与圆角走令牌，
   图标 back-right 颜色 #A9AEB8 → --color-gray-05，固定深色底不随主题切换） */
.bc-eg71-sidenav.is-collapsed .bc-eg71-collapse {
  position: absolute; right: calc(var(--spacing-20) / -2); top: 50%; transform: translateY(-50%);
  margin-left: 0; margin-right: 0;
  width: var(--spacing-20);
  height: var(--spacing-20);
  padding: 0;
  border-radius: var(--radius-4);
  background: #182032;
  border: 1px solid #38393b;
  color: var(--color-gray-05);
}
.bc-eg71-sidenav.is-collapsed .ms-nav-item > span:not(.ms-ico),
.bc-eg71-sidenav.is-collapsed .bc-eg71-chevron,
.bc-eg71-sidenav.is-collapsed .bc-eg71-sub,
.bc-eg71-sidenav.is-collapsed .bc-eg71-foot-name,
.bc-eg71-sidenav.is-collapsed .bc-eg71-more { display: none !important; }
.bc-eg71-sidenav.is-collapsed .ms-nav-item { justify-content: center; padding: 9px 0; }
.bc-eg71-sidenav.is-collapsed .bc-eg71-foot { justify-content: center; gap: 0; }

/* 收起态一级分组浮窗：80px icon-only 时容不下二级文字，点击一级项弹出浮窗列出子条目。
   position:fixed（非 absolute）+ bind() 用 getBoundingClientRect() 算 top/left，跳出
   .ms-sidebar-body{overflow:auto} 的裁切链（同类坑见 admin-sidebar skill 变更历史 2026-09-08 补）。 */
.bc-eg71-popup {
  position: fixed; z-index: 100; min-width: 160px;
  background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: var(--radius-8);
  box-shadow: var(--shadow-3); padding: var(--spacing-4);
}
.bc-eg71-popup-title { padding: var(--spacing-8) var(--spacing-12); font-size: 12px; color: #7c7d7e; }
.bc-eg71-popup .ms-nav-item--sub { padding-left: var(--spacing-12); font-size: 13px; }

/* ---------- EG71 顶部导航（通用版，非 /dashboard） ---------- */
/* Figma 2016:88258（默认）：56px 骨架，px-20、右灰底胶囊 + 40px 更多按钮。
   高度由 .ms-header 绑定 --header-h（56px），此处不覆盖；
   40px 按钮尺寸 / 16px 名称字 / 14px 面包屑字为 Figma 指定，40px 命中 --spacing-40，其余写死。 */
.bc-eg71-topnav--general { padding: 0 var(--spacing-20); }
.bc-eg71-general-crumbs { gap: var(--spacing-4); font-size: 14px; line-height: 22px; }
.bc-eg71-general-crumbs a { color: var(--color-text-auxiliary); }
.bc-eg71-general-crumbs a:hover { color: var(--color-primary-normal); }
.bc-eg71-crumb-sep { display: inline-flex; align-items: center; color: var(--color-text-auxiliary); }
.bc-eg71-crumb-sep .ms-ico { width: var(--spacing-12); height: var(--spacing-12); }
.bc-eg71-crumb-last { color: var(--color-text-primary); }
.bc-eg71-general-right { gap: var(--spacing-20); }
.bc-eg71-general-host {
  display: inline-flex; align-items: center; gap: var(--spacing-16);
  background: var(--color-fill-base-normal);
  padding: var(--spacing-2) var(--spacing-8) var(--spacing-2) var(--spacing-12);
  border-radius: var(--radius-4);
}
.bc-eg71-general-hostname {
  height: auto; padding: 0; gap: 0;
  font-size: 16px; line-height: 24px; font-weight: 500;
  color: var(--color-text-primary);
}
.bc-eg71-general-hostname:hover { color: var(--color-primary-normal); }
.bc-eg71-general-sn { display: inline-flex; align-items: center; gap: var(--spacing-4); }
.bc-eg71-general-sn-text { line-height: 22px; }
.bc-eg71-general-copy { width: auto; height: auto; padding: 0; gap: 0; color: var(--color-text-secondary); }
.bc-eg71-general-more {
  width: var(--spacing-40); height: var(--spacing-40); padding: 0; gap: 0;
  border-radius: var(--radius-4); flex: none;
}

/* ---------- EG71 Dashboard 顶部导航（/dashboard） ---------- */
/* Figma 2016:88209（V3 只读）/ 2016:88233（Variant5 名称可编辑）同骨架：84px 高、灰底、左模块图标 + HostName/序列号 + 右 Guide。 */
/* 写死仅限 Figma 无令牌命中的值：84px 高度、44px 圆形图标、20px/28px 标题字、14px/22px 序列号字（配色走令牌，间距能命中即令牌）。 */
.bc-eg71-topnav--dashboard {
  height: 84px;
  padding: 0 var(--spacing-20);
  background: var(--color-bg-page);
}
.bc-eg71-topnav--dashboard .ms-header-left { gap: var(--spacing-16); }
.bc-eg71-dash-left { flex: 1; min-width: 0; }
.bc-eg71-dash-logo {
  width: 44px; height: 44px; flex: none;
  border-radius: var(--radius-full);
  background: var(--color-bg-card); color: var(--color-primary-normal);
  display: flex; align-items: center; justify-content: center;
}
.bc-eg71-dash-title { display: flex; flex-direction: column; justify-content: center; gap: var(--spacing-4); }
.bc-eg71-dash-host { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; }
.bc-eg71-dash-sn { display: inline-flex; align-items: center; gap: var(--spacing-4); }
.bc-eg71-dash-sn-text { line-height: 22px; }
.bc-eg71-dash-copy { width: auto; height: auto; padding: 0; gap: 0; color: var(--color-text-secondary); }
.bc-eg71-dash-guide { border-radius: var(--radius-4); gap: var(--spacing-4); font-weight: 400; }

/* ---------- EG71 表单底部操作栏 ---------- */
/* 吸底由 .ms-affix--fixed > .ms-affix-body（fixed + bottom:0）承担，此处不重定义 */
.bc-eg71-formfooter {
  display: flex; align-items: center; justify-content: flex-end;
  padding: var(--spacing-12) var(--spacing-24);
  background: var(--color-bg-card); border-top: 1px solid var(--color-divider-base-2);
}
.bc-eg71-formfooter-spacer { flex-grow: 1; }

/* ---------- EG71 内容容器 ---------- */
/* 区块卡本体复用 .ms-card（白底/边框/圆角），此处只编排「竖排堆叠 + 栅格 + 内嵌区」 */
.bc-eg71-content { display: flex; flex-direction: column; gap: var(--spacing-20); }
.bc-eg71-formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-16) var(--spacing-24); }
.bc-eg71-options { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-16); }
.bc-eg71-subarea {
  display: flex; flex-direction: column; gap: var(--spacing-12); padding: var(--spacing-16);
  background: var(--color-fill-base-normal); border: 1px solid var(--color-divider-base-1); border-radius: var(--radius-8);
}
@media (max-width: 980px) { .bc-eg71-formgrid { grid-template-columns: 1fr; } }

/* ---------- EG71 Dashboard 协议连接状态卡 ---------- */
/* 卡本体复用 .ms-card（白底/圆角），此处只编排「灰边→蓝边过渡 + 悬浮箭头 + 子项蓝链接」结构态 */
.bc-eg71-dashboard { }
.bc-eg71-protocol-card {
  display: flex; align-items: flex-start; gap: var(--spacing-12);
  padding: var(--spacing-16) var(--spacing-16);
  border-color: var(--color-border-base);
  text-decoration: none; color: inherit;
  transition: border-color var(--duration-normal) var(--ease);
}
.bc-eg71-protocol-card--clickable { cursor: pointer; }
.bc-eg71-protocol-card--clickable:hover { border-color: var(--color-border-primary-normal); }
.bc-eg71-protocol-card-icon { flex: none; display: flex; align-items: center; color: var(--color-icon-primary-normal); }
.bc-eg71-protocol-card-body { display: flex; flex-direction: column; gap: var(--spacing-4); flex: 1 1 auto; min-width: 0; }
.bc-eg71-protocol-card-title { font-size: 16px; color: var(--color-text-primary); }
.bc-eg71-protocol-card-value { font-size: 18px; font-weight: 600; }
.bc-eg71-protocol-card-value--success { color: var(--color-text-success-normal); }
.bc-eg71-protocol-card-value--muted { color: var(--color-text-auxiliary); }
.bc-eg71-protocol-card-value--plain { color: var(--color-text-primary); }
.bc-eg71-protocol-card-arrow {
  flex: none; opacity: 0; transform: translateX(-4px);
  color: var(--color-icon-primary-normal);
  transition: opacity var(--duration-normal) var(--ease), transform var(--duration-normal) var(--ease);
}
.bc-eg71-protocol-card--clickable:hover .bc-eg71-protocol-card-arrow { opacity: 1; transform: translateX(0); }
.bc-eg71-protocol-card-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-8) var(--spacing-16); }
.bc-eg71-protocol-card-item { display: flex; align-items: center; gap: var(--spacing-8); }
.bc-eg71-protocol-card-item-tag { flex: none; }
.bc-eg71-protocol-card-item-value { font-size: 18px; font-weight: 600; text-decoration: none; }
.bc-eg71-protocol-card-item-value--success { color: var(--color-text-success-normal); }
.bc-eg71-protocol-card-item-value--muted { color: var(--color-text-auxiliary); }
.bc-eg71-protocol-card-item-value--plain { color: var(--color-text-primary); }
.bc-eg71-protocol-card-item-value--link { color: var(--color-text-link-normal); cursor: pointer; }
.bc-eg71-protocol-card-item-value--link:hover { color: var(--color-text-link-hover); text-decoration: underline; }
@media (max-width: 640px) { .bc-eg71-protocol-card-items { grid-template-columns: 1fr; } }

/* ---------- EG71 表单输入项（FormItem input） ---------- */
/* 标签行：必填星号/标签/单位/info 图标靠左，字数统计靠右；错误态文案走 error-normal 令牌 */
.bc-eg71-form-item-labelrow { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8); }
.bc-eg71-form-item-labelrow .ms-form-label { color: var(--color-text-secondary); font-weight: 400; }
.bc-eg71-form-item-unit { color: var(--color-text-auxiliary); }
.bc-eg71-form-item-count { font-size: 14px; line-height: 22px; color: var(--color-text-auxiliary); white-space: nowrap; }
.bc-eg71-form-item-msg { font-size: 14px; line-height: 22px; color: var(--color-text-auxiliary); }
.bc-eg71-form-item-msg--error { color: var(--color-text-error-normal); }

/* ---------- EG71 表单下拉项（FormItem select） ---------- */
/* L2 无 .ms-select--lg，此处仅做尺寸编排：40px 高 + 16px 字，错误态边框走 ms-select--error 令牌 */
.bc-eg71-form-item-select > select { height: var(--spacing-40); font-size: 16px; }

/* ---------- EG71 表单「输入 + 按钮」行 ---------- */
/* 下拉框与主/次按钮组横向排列，间距用 L1 令牌 */
.bc-eg71-form-item-btnrow { display: flex; align-items: center; gap: var(--spacing-8); }
.bc-eg71-form-item-btnrow .ms-select { flex: 1; min-width: 0; }
.bc-eg71-form-item-btnrow .ms-btn-group { flex: none; }

/* ---------- EG71 表单日期范围项（FormItem date-picker range） ---------- */
/* 起始/结束输入与分隔符、日历图标横排，复用 .ms-input--lg 外壳 */
.bc-eg71-form-item-range { display: flex; align-items: center; gap: var(--spacing-8); }
.bc-eg71-form-item-range > input { flex: 1; min-width: 0; border: 0; padding: 0; height: auto; background: transparent; }
.bc-eg71-form-item-range .ms-ico { flex: none; color: var(--color-text-auxiliary); }

/* ---------- EG71 业务弹窗（Modal 调度：删除/禁用/确认/选择） ---------- */
/* 图标+内容横排；图标本体复用 .ms-result-icon（L2 已含配色令牌），此处只编排布局 */
.bc-eg71-modal-body-row { display: flex; gap: var(--spacing-12); align-items: flex-start; }
.bc-eg71-modal-body-row .ms-result-icon { flex: none; }
.bc-eg71-modal-body-content { flex: 1; min-width: 0; }

/* ---------- EG71 表单单选按钮组（FormItem radio group） ---------- */
/* 线框单选按钮组占满宽度，横向排布互斥选项；视觉由 L2 .ms-radio-btn 承担，此处仅编排布局 */
.bc-eg71-form-item-radio-group { width: 100%; }
.bc-eg71-form-item-radio-group .ms-radio-btn { flex: 1; }

/* ---------- 标题（跨产品线通用 B_ComTitle） ---------- */
/* 视觉（字号/字重/色）全部由 L2 原子承担（.ms-h4/.ms-h5/.ms-form-section-title），
   此处仅编排布局与层级间距，不写视觉常量 */
.bc-com-title { display: flex; flex-direction: column; gap: var(--spacing-8); }
.bc-com-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12); }
.bc-com-title-main { display: flex; align-items: center; gap: var(--spacing-8); min-width: 0; }
.bc-com-title-extra { display: flex; align-items: center; gap: var(--spacing-8); flex: none; }
.bc-com-title-desc { display: block; }

/* 层级间距：标题到下方内容（表格/表单/字段组）的固定间距 */
.bc-com-title--page { margin-bottom: var(--spacing-24); }
.bc-com-title--tab { margin-bottom: var(--spacing-16); }
.bc-com-title--card { margin-bottom: var(--spacing-16); }
.bc-com-title--group { margin-bottom: var(--spacing-12); }

/* 对齐方式（默认左对齐 = space-between 两端布局） */
.bc-com-title--center .bc-com-title-row { justify-content: center; }
.bc-com-title--right .bc-com-title-row { justify-content: flex-end; }

/* ---------- EG71 Dashboard 接入设备面板（Access devices） ---------- */
/* 三段式进度条：视觉（色/圆角/高度）全由 .ms-progress-bar 系列承担，此处仅编排图例布局 */
.bc-eg71-dashboard-devices-progress .ms-progress-line { display: flex; }
.bc-eg71-dashboard-devices-seg { border-radius: 0; flex: none; }
.bc-eg71-dashboard-devices-seg:first-child { border-radius: var(--radius-full) 0 0 var(--radius-full); }
.bc-eg71-dashboard-devices-seg:last-child { border-radius: 0 var(--radius-full) var(--radius-full) 0; }
/* L2 .ms-progress-bar 无灰态修饰符，业务层按铁律一「仅令牌引用」新增 --muted 变体 */
.ms-progress-bar--muted { background: var(--color-icon-auxiliary); }
.bc-eg71-dashboard-devices-legend { display: flex; align-items: center; gap: var(--spacing-16); margin-top: var(--spacing-12); flex-wrap: wrap; }
.bc-eg71-dashboard-devices-legend-item { display: flex; align-items: center; gap: var(--spacing-4); }
.bc-eg71-dashboard-devices-legend-value { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.bc-eg71-dashboard-devices-legend-total { margin-left: auto; }
.bc-eg71-dashboard-devices-dot { width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; }
.bc-eg71-dashboard-devices-dot--success { background: var(--color-success-normal); }
.bc-eg71-dashboard-devices-dot--error { background: var(--color-error-normal); }
.bc-eg71-dashboard-devices-dot--muted { background: var(--color-icon-auxiliary); }

/* ---------- EG71 Dashboard 数据转发面板（Data forwarding） ---------- */
.bc-eg71-dashboard-forwarding-row { display: flex; align-items: center; gap: var(--spacing-12); padding: var(--spacing-12) 0; border-bottom: 1px solid var(--color-divider-base-1); cursor: pointer; }
.bc-eg71-dashboard-forwarding-row:last-child { border-bottom: 0; }
.bc-eg71-dashboard-forwarding-row:hover { color: var(--color-primary-normal); }
.bc-eg71-dashboard-forwarding-icon { display: inline-flex; color: var(--color-text-auxiliary); flex: none; }
.bc-eg71-dashboard-forwarding-row:hover .bc-eg71-dashboard-forwarding-icon { color: var(--color-primary-normal); }
.bc-eg71-dashboard-forwarding-title { flex: 1; min-width: 0; font-size: 14px; color: var(--color-text-primary); }
.bc-eg71-dashboard-forwarding-arrow { display: inline-flex; color: var(--color-text-auxiliary); flex: none; }

/* ---------- EG71 Dashboard 系统信息面板（System information） ---------- */
/* Descriptions 非 bordered 摘要态，视觉全由 .ms-desc 承担，本面板零编排样式 */

/* ---------- EG71 协议接口详情抽屉（bc-eg71-protocol-detail） ---------- */
/* 头部图标卡：横排图标+标题+标签，复用 .ms-card 外壳，内部布局编排 */
.bc-eg71-protocol-detail-headcard { display: flex; align-items: center; gap: var(--spacing-16); padding: var(--spacing-16); }
.bc-eg71-protocol-detail-headcard-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-4); background: var(--color-primary-normal); color: var(--color-text-constant-normal); flex: none; }
.bc-eg71-protocol-detail-headcard-title { font-size: 18px; font-weight: 600; color: var(--color-text-primary); }
.bc-eg71-protocol-detail-headcard--sub { margin-bottom: var(--spacing-16); }
.bc-eg71-protocol-detail-section { display: flex; flex-direction: column; gap: var(--spacing-16); }
.bc-eg71-protocol-detail-section-head { display: flex; align-items: center; gap: var(--spacing-8); }
.bc-eg71-protocol-detail-table-empty { text-align: center; color: var(--color-text-auxiliary); }
/* Figma 详情态字段行是纯横排 label(117px)+value，非 .ms-desc--bordered 的边框表格形态；
   作用域内覆写为单列纵向排列，每行内部改横排（label 定宽 117px） */
.bc-eg71-protocol-detail .ms-desc { grid-template-columns: 1fr; gap: var(--spacing-12); }
.bc-eg71-protocol-detail .ms-desc-item { flex-direction: row; align-items: center; gap: var(--spacing-24); }
.bc-eg71-protocol-detail .ms-desc-label { flex: none; width: 117px; color: var(--color-text-secondary); font-size: 14px; }
.bc-eg71-protocol-detail .ms-desc-value { font-size: 14px; }

/* ---------- EG71 设备列表（B_Eg71DeviceList · 数据服务） ---------- */
/* Figma 2016:89755「设备」列表实测：工具栏 + 复选列 8 数据列 + 行操作 + 表尾分页；
   视觉全部由 L2 .ms-table/.ms-btn/.ms-tag 等承担，此处仅编排布局与信号条/气泡 */
.bc-eg71-device-list { display: flex; flex-direction: column; gap: var(--spacing-12); }
/* 信号列 hover 气泡需越出表格卡片边界（作用域内覆写，不改基础组件本体） */
.bc-eg71-device-list .ms-table-wrap { overflow: visible; }
.bc-eg71-device-list .bc-eg71-th-filter { display: inline-flex; align-items: center; gap: var(--spacing-4); }
.bc-eg71-device-list .bc-eg71-th-filter .ms-ico { color: var(--color-text-auxiliary); }
/* 信号强度条：4 根递增竖条，按 level 点亮（good=4 绿 / medium=3 蓝 / poor=2 橙），未点亮走分隔线灰 */
.bc-eg71-device-list .bc-eg71-signal-cell { position: relative; display: inline-flex; align-items: center; gap: var(--spacing-4); }
.bc-eg71-device-list .bc-eg71-signal { display: inline-flex; align-items: flex-end; gap: var(--spacing-2); }
.bc-eg71-device-list .bc-eg71-signal i { display: block; width: var(--spacing-2); border-radius: var(--radius-2); background: var(--color-divider-base-2); }
.bc-eg71-device-list .bc-eg71-signal i:nth-child(1) { height: var(--spacing-4); }
.bc-eg71-device-list .bc-eg71-signal i:nth-child(2) { height: var(--spacing-6); }
.bc-eg71-device-list .bc-eg71-signal i:nth-child(3) { height: var(--spacing-8); }
.bc-eg71-device-list .bc-eg71-signal i:nth-child(4) { height: var(--spacing-12); }
.bc-eg71-device-list .bc-eg71-signal i.bc-eg71-signal-bar--good { background: var(--color-success-normal); }
.bc-eg71-device-list .bc-eg71-signal i.bc-eg71-signal-bar--medium { background: var(--color-primary-normal); }
.bc-eg71-device-list .bc-eg71-signal i.bc-eg71-signal-bar--poor { background: var(--color-warm-normal); }
/* 信号气泡：SF/SNR/RSSI 三行，hover 信号格时上浮显示 */
.bc-eg71-device-list .bc-eg71-signal-tip {
  position: absolute; bottom: calc(100% + var(--spacing-8)); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: var(--spacing-2); padding: var(--spacing-8);
  background: var(--color-bg-card); border: 1px solid var(--color-divider-base-1);
  border-radius: var(--radius-6); box-shadow: var(--shadow-3); white-space: nowrap;
}

/* ---------- 确定性造数：同一实体永远产出同一批样例数据，便于回归比对 ---------- */
window.MS_DATA = (function () {
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let s = seed || 1; return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

  const NAMES = ['星海园区', '云谷工厂', '临江仓库', '南山基站', '滨江楼宇', '西溪实验室', '钱塘泵站', '运河管廊', '未来城 A 区', '太湖渔场', '钟楼变电站', '石桥冷链'];
  const MODELS = ['VS121', 'VS133', 'WS202', 'WS301', 'EM300-TH', 'AM107', 'UC500', 'SG50'];
  const GROUPS = ['默认分组', '生产车间', '仓储物流', '办公区', '室外环境', '能源计量'];
  const PEOPLE = ['陈亦然', '林见川', '苏若彤', '周砚青', '何知远', '许清和', '罗砚书', '沈南枝'];
  const ROLES = ['超级管理员', '组织管理员', '运维人员', '只读成员'];
  const MAIL = ['chenyr', 'linjc', 'surt', 'zhouyq', 'hezy', 'xuqh', 'luoys', 'shennz'];

  function pick(arr, r) { return arr[Math.floor(r() * arr.length) % arr.length]; }

  function build(entity, n) {
    const r = rng(hash(entity.key) + 7);
    const list = [];
    for (let i = 0; i < (n || 6); i++) {
      const st = entity.statuses[Math.floor(r() * entity.statuses.length) % entity.statuses.length];
      const row = { _status: st, _name: pick(NAMES, r) + ' ' + (i + 1) + ' 号' };
      entity.fields.forEach(f => {
        switch (f.type) {
          case 'code': row[f.key] = f.key === 'eui' || f.key === 'sn' ? ('24E1' + Math.floor(r() * 1e12).toString(16).toUpperCase().padStart(12, '0').slice(0, 12)) : ('v' + (1 + Math.floor(r() * 4)) + '.' + Math.floor(r() * 10) + '.' + Math.floor(r() * 10)); break;
          case 'status': row[f.key] = st.cn; break;
          case 'level': row[f.key] = ['紧急', '重要', '提示', '配置变更', '登录', '下发'][Math.floor(r() * 6)]; break;
          case 'num': row[f.key] = f.key === 'rssi' ? '-' + (60 + Math.floor(r() * 60)) : (1 + Math.floor(r() * 900)); break;
          case 'percent': row[f.key] = 20 + Math.floor(r() * 80); break;
          case 'time': row[f.key] = '2026-08-3' + Math.floor(r() * 9) + ' ' + String(8 + Math.floor(r() * 12)).padStart(2, '0') + ':' + String(Math.floor(r() * 60)).padStart(2, '0'); break;
          case 'user': row[f.key] = pick(PEOPLE, r); break;
          case 'role': row[f.key] = pick(ROLES, r); break;
          default:
            if (f.key === 'model') row[f.key] = pick(MODELS, r);
            else if (f.key === 'group') row[f.key] = pick(GROUPS, r);
            else if (f.key === 'email') row[f.key] = pick(MAIL, r) + '@milesight.com';
            else if (f.key === 'condition') row[f.key] = ['温度 > 45℃', '湿度 < 20%', '电量 < 15%', '离线超过 30 分钟', 'CO₂ > 1200ppm'][Math.floor(r() * 5)];
            else row[f.key] = pick(NAMES, r) + (f.key === 'metric' ? '' : ' 对象') + (i + 1);
        }
      });
      list.push(row);
    }
    return list;
  }

  /* 生成稳定的遥测序列（用于 SVG 图表，不使用任何第三方图表库） */
  function series(seedText, points, base, amp) {
    const r = rng(hash(String(seedText)) + 3);
    const out = []; let v = base;
    for (let i = 0; i < points; i++) { v = Math.max(0, v + (r() - 0.5) * amp); out.push(Math.round(v * 10) / 10); }
    return out;
  }
  return { build, series, rng, hash };
})();

window.MS_BIZ_UTIL = (function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ico = (name, size) => `<span class="ms-ico ms-ico--${size || 16}">${MS_ICONS[name] || MS_ICONS.info}</span>`;
  const TONE = { success: 'ms-tag--success', error: 'ms-tag--error', warm: 'ms-tag--warm', primary: 'ms-tag--primary', muted: 'ms-tag' };
  const DOT = { success: 'ms-timeline-dot--success', error: 'ms-timeline-dot--error', warm: 'ms-timeline-dot--warm', muted: 'ms-timeline-dot--muted' };

  function statusTag(st, size) {
    if (!st) return '';
    const cls = TONE[st.tone] || 'ms-tag';
    return `<span class="ms-tag ${cls}${size === 'sm' ? ' ms-tag--round' : ''}"><i class="ms-tag-dot"></i>${esc(st.cn)}</span>`;
  }
  function statusOf(entity, name) {
    return entity.statuses.find(s => s.cn === name) || entity.statuses[0];
  }
  function cellHtml(field, row, entity) {
    const v = row[field.key];
    switch (field.type) {
      case 'status': return statusTag(statusOf(entity, v));
      case 'level': {
        const tone = v === '紧急' ? 'ms-tag--error' : (v === '重要' ? 'ms-tag--warm' : 'ms-tag--primary');
        return `<span class="ms-tag ${tone}">${esc(v)}</span>`;
      }
      case 'percent': {
        const p = Math.max(4, Math.min(100, Number(v) || 0));
        const tone = p < 20 ? 'error' : (p < 50 ? 'warm' : 'success');
        return `<span class="bc-bar"><i class="bc-bar-track bc-bar-track--${tone}"><b style="width:${p}%"></b></i><em>${esc(v)}%</em></span>`;
      }
      case 'code': return `<code class="bc-code">${esc(v)}</code>`;
      case 'user': return `<span class="bc-user"><span class="ms-avatar ms-avatar--sm">${esc(String(v).slice(0, 1))}</span>${esc(v)}</span>`;
      case 'role': return `<span class="ms-select ms-select--inline"><select class="ms-select-native"><option>${esc(v)}</option></select></span>`;
      case 'num': return `<span class="bc-num">${esc(v)}${field.unit ? '<em>' + esc(field.unit) + '</em>' : ''}</span>`;
      case 'time': return `<span class="bc-time">${esc(v)}</span>`;
      default: return `<span class="ms-text">${esc(v)}</span>`;
    }
  }
  function svgLine(seed, opts) {
    const o = Object.assign({ w: 640, h: 180, base: 50, amp: 22, points: 32, color: 'var(--color-primary-normal)', fill: true }, opts || {});
    const data = MS_DATA.series(seed, o.points, o.base, o.amp);
    const max = Math.max.apply(null, data) * 1.15, min = Math.min.apply(null, data) * 0.85;
    const stepX = o.w / (data.length - 1);
    const y = v => o.h - ((v - min) / (max - min || 1)) * o.h;
    const pts = data.map((v, i) => [i * stepX, y(v)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ` L${o.w} ${o.h} L0 ${o.h} Z`;
    const last = pts[pts.length - 1];
    return `<svg class="bc-chart-svg" viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="none" role="img" aria-label="${esc(seed)} 趋势图">
      <defs><linearGradient id="g-${MS_DATA.hash(String(seed))}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${o.color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${o.color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${[0.25, 0.5, 0.75].map(t => `<line x1="0" y1="${(o.h * t).toFixed(1)}" x2="${o.w}" y2="${(o.h * t).toFixed(1)}" stroke="var(--color-divider-base-2)" stroke-width="1" stroke-dasharray="3 4"/>`).join('')}
      ${o.fill ? `<path d="${area}" fill="url(#g-${MS_DATA.hash(String(seed))})"/>` : ''}
      <path d="${line}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="var(--color-bg-card)" stroke="${o.color}" stroke-width="2"/>
    </svg>`;
  }
  function svgBars(seed, opts) {
    const o = Object.assign({ w: 640, h: 180, base: 60, amp: 30, points: 16, color: 'var(--color-primary-normal)' }, opts || {});
    const data = MS_DATA.series(seed, o.points, o.base, o.amp);
    const max = Math.max.apply(null, data) * 1.1;
    const bw = (o.w / data.length) * 0.6, gap = o.w / data.length;
    return `<svg class="bc-chart-svg" viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="none" role="img" aria-label="${esc(seed)} 分布图">
      ${data.map((v, i) => `<rect x="${(i * gap + (gap - bw) / 2).toFixed(1)}" y="${(o.h - (v / max) * o.h).toFixed(1)}" width="${bw.toFixed(1)}" height="${((v / max) * o.h).toFixed(1)}" rx="3" fill="${o.color}" fill-opacity="0.82"/>`).join('')}
    </svg>`;
  }
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  // EG71 一级侧边导航分组（侧栏与顶栏面包屑共享的唯一源，避免两处各写一份）
  const navGroups = [
    { label: 'Dashboard', icon: 'dashboard', route: '/dashboard' },
    { label: 'Data Services', icon: 'data', route: '/data-services', children: ['Data Acquisition', 'Data Forwarding', 'Data Library', 'Data Stream'] },
    { label: 'Network', icon: 'topology', route: '/network', children: ['Network Interface', 'Firewall Management', 'DHCP', 'DDNS', 'Link Failover', 'VPN'] },
    { label: 'Platform', icon: 'layers', route: '/platform', children: ['Location Rules'] },
    { label: 'System Setting', icon: 'settings', route: '/system-setting', children: ['General', 'User', 'Server', 'Maintenance', 'Log', 'SNMP', 'Events'] },
    { label: 'APP', icon: 'app', route: '/app', children: ['Python', 'Node-RED'] }
  ];
  return { esc, ico, statusTag, statusOf, cellHtml, svgLine, svgBars, DOT, slug, navGroups };
})();

        const titleCls = level === 'group'

          : (variant === 'sub' ? 'ms-h5' : 'ms-h4');
        // 左组：标题 + Tag（紧邻小间距）+ 提示图标（紧邻小间距）
        const main = [`<span class="${titleCls}">${esc(ctx.title || '')}</span>`];
        if (ctx.showTag && ctx.tag) main.push(`<span class="ms-tag">${esc(ctx.tag)}</span>`);
        if (ctx.showTip) {
          const tipText = (ctx.describeMode === 'tip' && ctx.describe) ? ctx.describe : (ctx.tip || '');

        }
        // 右组：开关（两端对齐）+ 按钮组
        const extra = [];

          const sw = `<label class="ms-switch ms-switch--xs"><input type="checkbox"${ctx.switchChecked ? ' checked' : ''}><span class="ms-switch-track"></span><span class="ms-switch-thumb"></span></label>`;

        if (ctx.showButton && Array.isArray(ctx.buttons) && ctx.buttons.length) {

            const kind = b.kind === 'filled' ? ' ms-btn--filled' : (b.kind === 'text' ? ' ms-btn--text' : '');
            return `<button class="ms-btn ms-btn--sm${kind}">${esc(b.t)}</button>`;

        const mainEl = `<div class="bc-com-title-main">${main.join('')}</div>`;

        return `<div class="bc-com-title bc-com-title--${level}${alignCls}">${row}${descEl}</div>`;
