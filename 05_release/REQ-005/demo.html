/* 视觉（字号/字重/色）全部由 L2 原子承担（.ms-h4/.ms-h5/.ms-form-section-title），
   此处仅编排布局与层级间距，不写视觉常量 */
.bc-com-title { display: flex; flex-direction: column; gap: var(--spacing-8); }
.bc-com-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12); }
.bc-com-title-main { display: flex; align-items: center; gap: var(--spacing-8); min-width: 0; }
.bc-com-title-extra { display: flex; align-items: center; gap: var(--spacing-8); flex: none; }
.bc-com-title-desc { display: block; }

/* 层级间距：标题到下方内容（表格/表单/字段组）的固定间距 */
.bc-com-title--page { margin-bottom: var(--spacing-24); }
.bc-com-title--tab { margin-bottom: var(--spacing-16); }
.bc-com-title--card { margin-bottom: var(--spacing-16); }
.bc-com-title--group { margin-bottom: var(--spacing-12); }

/* 对齐方式（默认左对齐 = space-between 两端布局） */
.bc-com-title--center .bc-com-title-row { justify-content: center; }
.bc-com-title--right .bc-com-title-row { justify-content: flex-end; }

/* ---------- EG71 Dashboard 接入设备面板（Access devices） ---------- */
/* 三段式进度条：视觉（色/圆角/高度）全由 .ms-progress-bar 系列承担，此处仅编排图例布局 */
.bc-eg71-dashboard-devices-progress .ms-progress-line { display: flex; }
.bc-eg71-dashboard-devices-seg { border-radius: 0; flex: none; }
.bc-eg71-dashboard-devices-seg:first-child { border-radius: var(--radius-full) 0 0 var(--radius-full); }
.bc-eg71-dashboard-devices-seg:last-child { border-radius: 0 var(--radius-full) var(--radius-full) 0; }
/* L2 .ms-progress-bar 无灰态修饰符，业务层按铁律一「仅令牌引用」新增 --muted 变体 */
.ms-progress-bar--muted { background: var(--color-icon-auxiliary); }
.bc-eg71-dashboard-devices-legend { display: flex; align-items: center; gap: var(--spacing-16); margin-top: var(--spacing-12); flex-wrap: wrap; }
.bc-eg71-dashboard-devices-legend-item { display: flex; align-items: center; gap: var(--spacing-4); }
.bc-eg71-dashboard-devices-legend-value { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.bc-eg71-dashboard-devices-legend-total { margin-left: auto; }
.bc-eg71-dashboard-devices-dot { width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; }
.bc-eg71-dashboard-devices-dot--success { background: var(--color-success-normal); }
.bc-eg71-dashboard-devices-dot--error { background: var(--color-error-normal); }
.bc-eg71-dashboard-devices-dot--muted { background: var(--color-icon-auxiliary); }

/* ---------- EG71 Dashboard 数据转发面板（Data forwarding） ---------- */
.bc-eg71-dashboard-forwarding-row { display: flex; align-items: center; gap: var(--spacing-12); padding: var(--spacing-12) 0; border-bottom: 1px solid var(--color-divider-base-1); cursor: pointer; }
.bc-eg71-dashboard-forwarding-row:last-child { border-bottom: 0; }
.bc-eg71-dashboard-forwarding-row:hover { color: var(--color-primary-normal); }
.bc-eg71-dashboard-forwarding-icon { display: inline-flex; color: var(--color-text-auxiliary); flex: none; }
.bc-eg71-dashboard-forwarding-row:hover .bc-eg71-dashboard-forwarding-icon { color: var(--color-primary-normal); }
.bc-eg71-dashboard-forwarding-title { flex: 1; min-width: 0; font-size: 14px; color: var(--color-text-primary); }
.bc-eg71-dashboard-forwarding-arrow { display: inline-flex; color: var(--color-text-auxiliary); flex: none; }

/* ---------- EG71 Dashboard 系统信息面板（System information） ---------- */
/* Descriptions 非 bordered 摘要态，视觉全由 .ms-desc 承担，本面板零编排样式 */

/* ---------- EG71 协议接口详情抽屉（bc-eg71-protocol-detail） ---------- */
/* 头部图标卡：横排图标+标题+标签，复用 .ms-card 外壳，内部布局编排 */
.bc-eg71-protocol-detail-headcard { display: flex; align-items: center; gap: var(--spacing-16); padding: var(--spacing-16); }
.bc-eg71-protocol-detail-headcard-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-4); background: var(--color-primary-normal); color: var(--color-text-constant-normal); flex: none; }
.bc-eg71-protocol-detail-headcard-title { font-size: 18px; font-weight: 600; color: var(--color-text-primary); }
.bc-eg71-protocol-detail-headcard--sub { margin-bottom: var(--spacing-16); }
.bc-eg71-protocol-detail-section { display: flex; flex-direction: column; gap: var(--spacing-16); }
.bc-eg71-protocol-detail-section-head { display: flex; align-items: center; gap: var(--spacing-8); }
.bc-eg71-protocol-detail-table-empty { text-align: center; color: var(--color-text-auxiliary); }
/* Figma 详情态字段行是纯横排 label(117px)+value，非 .ms-desc--bordered 的边框表格形态；
   作用域内覆写为单列纵向排列，每行内部改横排（label 定宽 117px） */
.bc-eg71-protocol-detail .ms-desc { grid-template-columns: 1fr; gap: var(--spacing-12); }
.bc-eg71-protocol-detail .ms-desc-item { flex-direction: row; align-items: center; gap: var(--spacing-24); }
.bc-eg71-protocol-detail .ms-desc-label { flex: none; width: 117px; color: var(--color-text-secondary); font-size: 14px; }
.bc-eg71-protocol-detail .ms-desc-value { font-size: 14px; }

/* ---------- EG71 设备列表（B_Eg71DeviceList · 数据服务） ---------- */

/* ==========================================================================
   L2 · 品牌 Logo 图形资源（S_Logo 唯一权威源）
   --------------------------------------------------------------------------
   直接引用公司官方 Logo SVG 原图文件（frontend/components/Logo/assets/），
   不再用 token 拼色的内联 path 数据。字符串渲染器 MS_BASE_LOGO_SVG（供
   registry-business.js 等 innerHTML 替换场景使用）与 React 演示
   （frontend/components/Logo）共用同一份资产文件。

   资产路径锚定本脚本自身位置（document.currentScript.src），不锚定宿主页面
   路径：宿主页面可能在仓库根（index.html）也可能在任意子目录（output/*.html），
   若用相对路径拼字符串，宿主页面深度一变就会 404。用 URL 解析绝对定位，
   保证任何深度的宿主页面调用 MS_BASE_LOGO_SVG() 都能正确出图。
   ========================================================================== */
window.MS_BASE_LOGO_ASSET_BASE = (function () {
  var scriptEl = document.currentScript;
  if (scriptEl && scriptEl.src) {
    // registry-base.js 固定位于 assets/js/ 下，向上两级回到仓库根
    return new URL('../../frontend/components/Logo/assets/', scriptEl.src).href;
  }
  return 'frontend/components/Logo/assets/';
})();
window.MS_BASE_LOGO_ASSETS = {
  'full:brand': 'Type=Logo, Color=Default.svg',
  'full:white': 'Type=Logo, Color=White.svg',
  'compact:brand': 'Type=Logo M, Color=Default.svg',
  'compact:white': 'Type=Logo M, Color=White.svg'
};
window.MS_BASE_LOGO_SVG = function (opts) {
  opts = opts || {};
  var variant = opts.variant === "compact" ? "compact" : "full";
  var color = opts.color === "white" ? "white" : "brand";
  var height = opts.height || 32;
  var viewW = variant === "full" ? 120 : 32;
  var width = opts.width || Math.round(height * viewW / 32);
  var file = window.MS_BASE_LOGO_ASSETS[variant + ':' + color];
  var src = window.MS_BASE_LOGO_ASSET_BASE + encodeURI(file);
  return '<img src="' + src + '" width="' + width + '" height="' + height + '" alt="Milesight" draggable="false" style="display:block" />';
};

window.MS_BASE_INDEX = Object.fromEntries(window.MS_BASE_COMPONENTS.map(c => [c.id, c]));

  function svgLine(seed, opts) {
    const o = Object.assign({ w: 640, h: 180, base: 50, amp: 22, points: 32, color: 'var(--color-primary-normal)', fill: true }, opts || {});
    const data = MS_DATA.series(seed, o.points, o.base, o.amp);
    const max = Math.max.apply(null, data) * 1.15, min = Math.min.apply(null, data) * 0.85;
    const stepX = o.w / (data.length - 1);
    const y = v => o.h - ((v - min) / (max - min || 1)) * o.h;
    const pts = data.map((v, i) => [i * stepX, y(v)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ` L${o.w} ${o.h} L0 ${o.h} Z`;
    const last = pts[pts.length - 1];
    return `<svg class="bc-chart-svg" viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="none" role="img" aria-label="${esc(seed)} 趋势图">
      <defs><linearGradient id="g-${MS_DATA.hash(String(seed))}" x1="0" y1="0" x2="0" y2="1">

      ${o.fill ? `<path d="${area}" fill="url(#g-${MS_DATA.hash(String(seed))})"/>` : ''}
      <path d="${line}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="var(--color-bg-card)" stroke="${o.color}" stroke-width="2"/>
    </svg>`;
  }
  function svgBars(seed, opts) {
    const o = Object.assign({ w: 640, h: 180, base: 60, amp: 30, points: 16, color: 'var(--color-primary-normal)' }, opts || {});
    const data = MS_DATA.series(seed, o.points, o.base, o.amp);
    const max = Math.max.apply(null, data) * 1.1;
    const bw = (o.w / data.length) * 0.6, gap = o.w / data.length;
    return `<svg class="bc-chart-svg" viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="none" role="img" aria-label="${esc(seed)} 分布图">
      ${data.map((v, i) => `<rect x="${(i * gap + (gap - bw) / 2).toFixed(1)}" y="${(o.h - (v / max) * o.h).toFixed(1)}" width="${bw.toFixed(1)}" height="${((v / max) * o.h).toFixed(1)}" rx="3" fill="${o.color}" fill-opacity="0.82"/>`).join('')}

        const titleCls = level === 'group'
          ? 'ms-form-section-title'
          : (variant === 'sub' ? 'ms-h5' : 'ms-h4');
        // 左组：标题 + Tag（紧邻小间距）+ 提示图标（紧邻小间距）
        const main = [`<span class="${titleCls}">${esc(ctx.title || '')}</span>`];
        if (ctx.showTag && ctx.tag) main.push(`<span class="ms-tag">${esc(ctx.tag)}</span>`);
        if (ctx.showTip) {
          const tipText = (ctx.describeMode === 'tip' && ctx.describe) ? ctx.describe : (ctx.tip || '');
          main.push(`<span class="ms-tip">${ico('info', 14)}<span class="ms-tip-bubble">${esc(tipText)}</span></span>`);
        }
        // 右组：开关（两端对齐）+ 按钮组
        const extra = [];

          const sw = `<label class="ms-switch ms-switch--xs"><input type="checkbox"${ctx.switchChecked ? ' checked' : ''}><span class="ms-switch-track"></span><span class="ms-switch-thumb"></span></label>`;

        if (ctx.showButton && Array.isArray(ctx.buttons) && ctx.buttons.length) {

            const kind = b.kind === 'filled' ? ' ms-btn--filled' : (b.kind === 'text' ? ' ms-btn--text' : '');
            return `<button class="ms-btn ms-btn--sm${kind}">${esc(b.t)}</button>`;

        const mainEl = `<div class="bc-com-title-main">${main.join('')}</div>`;

        return `<div class="bc-com-title bc-com-title--${level}${alignCls}">${row}${descEl}</div>`;

    },
    {
      id: 'bc-eg71-sidenav', cn: '网关侧边导航', cat: '管理员',
      desc: 'Milesight 网关管理后台侧边导航（220px 深色侧边栏 · Figma 2016:89103）：Logo 区（Milesight 字标 + 白色描边新增按钮）+ 一级导航菜单（Dashboard 选中态 / Data Services / Network / Platform / System Setting / APP 各带 chevron 展开箭头，默认折叠）+ 底部 Admin 账户入口（头像 + 名称 + 更多操作下拉，含 Language 二级语言子菜单），编排 L2 Logo / 导航菜单 / 头像 / 按钮 / 下拉菜单基础组件；深色配色「基本固定」按 Figma 写死（bg #182032 / 选中 #052461·#5eafff / 未选中 #d6d6d8 / 常量白），不绑主题切换。',
      atoms: ['nav-menu', 'dropdown-menu', 'logo', 'avatar', 'button', 'icon'],
      entityHint: 'gateway',
      tags: ['侧边栏', '导航', '菜单', '下拉菜单', '管理员', 'EG71', '网关', '后台'],
      render(ctx) {
        // 一级导航（mode=vertical）：单一路由源 ctx.route 决定选中态；Dashboard 直达 /dashboard，
        // 其余带 chevron 可展开，子条目带各自路由（父级 route 即分组路由，子条目 = 分组路由 + slug）。
        const route = ctx.route || '/dashboard';
        const slug = U.slug;
        const groups = U.navGroups;
        // 子条目 HTML 抽公用：展开态内联 .bc-eg71-sub 与收起态浮窗 .bc-eg71-popup 共用同一份，避免重复维护高亮判定
        const renderChildren = (g) => g.children.map(c => {
          const cr = g.route + '/' + slug(c);
          return `<div class="ms-nav-item ms-nav-item--sub${route === cr ? ' ms-nav-item--active' : ''}" data-sub="${esc(c)}" data-route="${esc(cr)}"><span>${esc(c)}</span></div>`;
        }).join('');
        const navItem = (g) => {
          const has = g.children && g.children.length;
          const active = route === g.route || route.indexOf(g.route + '/') === 0;
          const subActive = has && route.indexOf(g.route + '/') === 0;
          const chevron = has ? `<span class="bc-eg71-chevron">${ico('chevronDown', 16)}</span>` : '';
          const sub = has ? `<div class="bc-eg71-sub"${subActive ? '' : ' hidden'}>${renderChildren(g)}</div>` : '';
          return `<div class="bc-eg71-nav" data-nav="${esc(g.label)}">
            <div class="ms-nav-item${active ? ' ms-nav-item--active' : ''}" data-nav-trigger data-route="${esc(g.route)}"${has ? ` aria-expanded="${subActive}" aria-haspopup="menu"` : ''}>${ico(g.icon, 16)}<span>${esc(g.label)}</span>${chevron}</div>
            ${sub}
          </div>`;
        };
        // 收起态（80px icon-only）容不下 .bc-eg71-sub 文字，点击一级分组改弹浮窗；挂在 .bc-eg71-sidenav 下（非导航区内），
        // 避免被 .ms-sidebar-body 的 overflow 裁切（同类坑见 admin-sidebar skill 变更历史 2026-09-08 补的记录）
        const popups = groups.filter(g => g.children && g.children.length).map(g =>
          `<div class="bc-eg71-popup" data-popup="${esc(g.route)}" role="menu" hidden>
            <div class="bc-eg71-popup-title">${esc(g.label)}</div>
            ${renderChildren(g)}
          </div>`
        ).join('');
        // 账户下拉菜单（trigger=click / placement=topRight）：含危险项 + Language 二级语言子菜单
        const adminItems = [
          { icon: 'user', label: 'Change Account Info' },
          { label: 'Language', children: [{ icon: 'check', label: 'Chinese' }, { label: 'English' }] },
          { type: 'divider' },
          { label: 'Log out', danger: true }
        ];
        const dropdownItem = (it) => {
          if (it.type === 'divider') return `<div class="ms-dropdown-sep"></div>`;
          if (it.children) {
            return `<div class="ms-dropdown-item bc-eg71-lang" data-eg71-lang>
              <span>${esc(it.label)}</span>
              <span class="bc-eg71-chevron">${ico('chevronDown', 14)}</span>
              <div class="ms-dropdown bc-eg71-lang-menu" hidden>
                ${it.children.map((c) => `<div class="ms-dropdown-item">${c.icon ? ico(c.icon, 14) : ''}<span>${esc(c.label)}</span></div>`).join('')}
              </div>
            </div>`;
          }
          return `<div class="ms-dropdown-item${it.danger ? ' ms-dropdown-item--danger' : ''}">${it.icon ? ico(it.icon, 14) : ''}<span>${esc(it.label)}</span></div>`;
        };
        return `<aside class="ms-sidebar bc-eg71-sidenav">
          <div class="ms-sidebar-brand">
            <span class="ms-logo">${window.MS_BASE_LOGO_SVG({ variant: 'full', color: 'white', height: 32 })}</span>
            <button class="ms-btn ms-btn--xs ms-btn--text bc-eg71-collapse" aria-label="收起侧边栏" aria-expanded="true">${ico('arrowLeft', 16)}</button>
          </div>
          <nav class="ms-sidebar-body"><div class="ms-nav">
            ${groups.map(navItem).join('')}
          </div></nav>
          <div class="ms-sidebar-foot">
            <div class="bc-eg71-foot">
              <span class="ms-avatar ms-avatar--lg">${ico('user', 20)}</span>
              <span class="bc-eg71-foot-name">Admin</span>
              <button class="ms-btn ms-btn--xs ms-btn--text bc-eg71-more" aria-label="账户操作菜单" aria-expanded="false">${ico('moreHoriz', 16)}</button>
            </div>
            <div class="ms-dropdown bc-eg71-admin-menu" hidden>
              ${adminItems.map(dropdownItem).join('')}
            </div>
          </div>
          ${popups}
        </aside>`;
      },
      bind(root) {
        const rootEl = root.querySelector('.bc-eg71-sidenav') || root;
        // 展开/收起：点击 collapse 按钮切换 is-collapsed，折叠/展开图标随状态互换（arrowLeft ↔ arrowRight）
        const collapseBtn = rootEl.querySelector('.bc-eg71-collapse');
        if (collapseBtn) {
          collapseBtn.addEventListener('click', () => {
            const collapsed = rootEl.classList.toggle('is-collapsed');
            collapseBtn.innerHTML = ico(collapsed ? 'arrowRight' : 'arrowLeft', 16);
            collapseBtn.setAttribute('aria-expanded', String(!collapsed));
            collapseBtn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
            // Logo 完整↔图形切换：收起态仅 M 图形（compact），展开态完整字标（full）
            const logo = rootEl.querySelector('.ms-logo');
            if (logo && window.MS_BASE_LOGO_SVG) {
              logo.innerHTML = window.MS_BASE_LOGO_SVG({ variant: collapsed ? 'compact' : 'full', color: 'white', height: 32 });
            }
            // 展开回来时收起态浮窗不再适用，全部收掉
            if (!collapsed) closeAllPopups();
          });
        }
        // 收起态浮窗：全部关闭 + 触发按钮 is-open/aria-expanded 复位
        const closeAllPopups = () => {
          rootEl.querySelectorAll('.bc-eg71-popup').forEach(p => { p.hidden = true; });
          rootEl.querySelectorAll('[data-nav-trigger][aria-haspopup]').forEach(x => {
            x.classList.remove('is-open');
            x.setAttribute('aria-expanded', 'false');
          });
        };
        // 一级导航展开/收起：展开态走内联 accordion（chevron 旋转，仅展开当前项）；
        // 收起态（is-collapsed，80px icon-only）改弹浮窗，定位用 getBoundingClientRect 贴在触发项右侧，
        // 不受 .ms-sidebar-body{overflow:auto} 裁切影响（浮窗挂在 .bc-eg71-sidenav 下，非导航滚动区内）
        rootEl.querySelectorAll('[data-nav]').forEach(nav => {
          const t = nav.querySelector('[data-nav-trigger]');
          const sub = nav.querySelector('.bc-eg71-sub');
          if (!t || !sub) return;
          const route = t.getAttribute('data-route');
          const popup = rootEl.querySelector(`.bc-eg71-popup[data-popup="${route}"]`);
          t.addEventListener('click', (e) => {
            if (rootEl.classList.contains('is-collapsed')) {
              if (!popup) return;
              e.stopPropagation(); // 阻止冒泡到 document 的 closeAllPopups，否则刚打开就被同一次点击关掉
              const willOpen = popup.hidden;
              closeAllPopups();
              if (willOpen) {
                const r = t.getBoundingClientRect();
                const railRight = rootEl.getBoundingClientRect().right; // 用侧边栏容器右缘而非触发项右缘：触发项内边距使其右缘落在 80px 收起轨内侧，会导致浮窗与轨道重叠
                popup.style.top = r.top + 'px';
                popup.style.left = (railRight + 8) + 'px'; // 侧边栏右侧 8px 间距，position:fixed 相对视口定位
                popup.hidden = false;
                t.classList.add('is-open');
                t.setAttribute('aria-expanded', 'true');
              }
              return;
            }
            const willOpen = sub.hidden;
            rootEl.querySelectorAll('.bc-eg71-sub').forEach(s => { s.hidden = true; });
            rootEl.querySelectorAll('[data-nav-trigger]').forEach(x => {
              x.classList.remove('is-open');
              x.setAttribute('aria-expanded', 'false');
            });
            if (willOpen) {
              sub.hidden = false;
              t.classList.add('is-open');
              t.setAttribute('aria-expanded', 'true');
            }
          });
        });
        // 点击浮窗内子条目 / 侧边栏外任意处 → 关闭浮窗；不 stopPropagation，让点击继续冒泡到
        // MS_EG71_SHELL 挂在 .bc-eg71-sidenav 上的路由监听（触发 navigate），关闭与导航互不影响
        document.addEventListener('click', () => closeAllPopups());
        // 子条目点击 → 设为主选中态
        rootEl.querySelectorAll('.ms-nav-item--sub').forEach(item => {
          item.addEventListener('click', () => {
            rootEl.querySelectorAll('.ms-nav-item--sub').forEach(x => x.classList.remove('ms-nav-item--active'));
            item.classList.add('ms-nav-item--active');
          });
        });
        // Admin 账户下拉：点击 more 开关，点击空白处关闭
        const more = rootEl.querySelector('.bc-eg71-more');
        const adminMenu = rootEl.querySelector('.bc-eg71-admin-menu');
        const toggleAdmin = (open) => {
          if (!more || !adminMenu) return;
          adminMenu.hidden = !open;
          more.classList.toggle('is-open', open);
          more.setAttribute('aria-expanded', String(open));
        };
        if (more && adminMenu) {
          more.addEventListener('click', (e) => { e.stopPropagation(); toggleAdmin(adminMenu.hidden); });
          adminMenu.addEventListener('click', (e) => e.stopPropagation());
        }
        // Language 二级子菜单：点击展开
        const lang = rootEl.querySelector('[data-eg71-lang]');
        const langMenu = rootEl.querySelector('.bc-eg71-lang-menu');
        if (lang && langMenu) {
          lang.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.hidden = !langMenu.hidden;
            lang.classList.toggle('is-open', !langMenu.hidden);
          });
        }
        // 点击侧边栏外任意处关闭账户下拉 + 语言子菜单
        document.addEventListener('click', () => {
          toggleAdmin(false);
          if (langMenu) langMenu.hidden = true;
          if (lang) lang.classList.remove('is-open');
        });
      }
    },
    {

    {

        const all = rootEl.querySelector('[data-device-check-all]');
        if (all) all.addEventListener('change', () => {
          rootEl.querySelectorAll('[data-device-check]').forEach(c => { c.checked = all.checked; });
          sync();
        });
        const openModal = desc => {
          if (!modal) return;
          if (modalDesc) modalDesc.textContent = desc;
          pendingRows = [];
          modal.hidden = false;
          modal.classList.add('is-open');
        };
        const closeModal = () => {
          if (!modal) return;
          modal.hidden = true;
          modal.classList.remove('is-open');
        };
        rootEl.querySelectorAll('[data-device-op="delete"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tr = btn.closest('tr');
            const nameTd = tr ? tr.querySelector('td:nth-child(3) .ms-text') : null;
            pendingRows = tr ? [tr] : [];
            openModal(nameTd ? `Are you sure you want to delete "${nameTd.textContent.trim()}"? This operation cannot be undone.` : 'Are you sure you want to delete this device? This operation cannot be undone.');
          });
        });
        if (batchBtn) batchBtn.addEventListener('click', () => {
          pendingRows = Array.prototype.slice.call(rootEl.querySelectorAll('[data-device-check]')).filter(c => c.checked).map(c => c.closest('tr'));
          openModal(`Are you sure you want to delete the ${pendingRows.length} selected device(s)? This operation cannot be undone.`);
        });
        if (modal) {
          const ok = modal.querySelector('[data-modal-ok]');
          if (ok) ok.addEventListener('click', () => {
            pendingRows.forEach(tr => tr.remove());
            pendingRows = [];
            closeModal();
            sync();
          });

          const tip = cell.querySelector('.bc-eg71-signal-tip');

          btn.addEventListener('click', () => {
            btn.dispatchEvent(new CustomEvent('eg71-device-add', { bubbles: true, detail: { path: btn.getAttribute('data-device-add') } }));
          });
        });
        rootEl.querySelectorAll('[data-device-op="edit"], [data-device-op="monitor"]').forEach(btn => {
          btn.addEventListener('click', () => {
            btn.dispatchEvent(new CustomEvent('eg71-device-op', { bubbles: true, detail: { op: btn.getAttribute('data-device-op') } }));
          });
        });

  /* ---------- EG71 业务弹窗：按 ctx.action 做业务匹配（不同业务 → 不同弹窗规则） ----------
     ctx.action 取值：
       'delete'  删除确认（危险，需二次确认，Result--error 图标，danger 按钮）
       'disable' 禁用/停用确认（警示，Result--warn 图标，filled 按钮）
       'confirm' 信息确认（普通提示，Result--info 图标，filled 按钮）
       'select'  设备选择（信息 + 单选按钮组，用于「选择设备」类场景）
     未命中时兜底为 'confirm'。 */
  function eg71ModalVariant(action) {
    if (action === 'delete') return { status: 'error', size: '', okClass: 'ms-btn--filled ms-btn--danger', okText: '删除' };
    if (action === 'disable') return { status: 'warn', size: '', okClass: 'ms-btn--filled', okText: '禁用' };
    if (action === 'select') return { status: 'info', size: '--lg', okClass: 'ms-btn--filled', okText: '确定' };
    return { status: 'info', size: '', okClass: 'ms-btn--filled', okText: '确定' };
  }

  function eg71ModalBody(ctx, variant) {
    const desc = ctx.desc != null ? ctx.desc : '';
    if (ctx.action === 'select') {
      const options = ctx.options || [];
      const opts = options.map((o, i) => `<button type="button" class="ms-radio-btn${i === 0 ? ' ms-radio-btn--checked' : ''}" role="radio" aria-checked="${i === 0 ? 'true' : 'false'}" data-value="${esc(o.value != null ? o.value : o.label)}">${esc(o.label)}</button>`).join('');
      return `<div class="ms-stack">
        ${desc ? `<div class="ms-text ms-text--secondary">${esc(desc)}</div>` : ''}
        <div class="ms-radio-btn-group bc-eg71-form-item-radio-group" role="radiogroup" aria-label="${esc(ctx.optionLabel || '设备')}">${opts}</div>
      </div>`;
    }
    if (ctx.action === 'delete' && ctx.confirmKeyword) {
      return `<div class="ms-stack">
        ${desc ? `<div class="ms-text ms-text--secondary">${esc(desc)}</div>` : ''}
        <div class="ms-alert ms-alert--error">${ico('warn', 16)}<div class="ms-alert-body">${esc(ctx.warnText || '此操作不可撤销，请谨慎确认。')}</div></div>
        <div class="ms-form-item">
          <label class="ms-form-label">请输入「${esc(ctx.confirmKeyword)}」以确认</label>
          <input class="ms-input bc-eg71-modal-confirm-input" type="text" placeholder="${esc(ctx.confirmKeyword)}" data-keyword="${esc(ctx.confirmKeyword)}" />
        </div>
      </div>`;
    }
    return desc ? `<div class="ms-text ms-text--secondary">${esc(desc)}</div>` : '';
  }

  function renderEg71Modal(ctx) {
    const variant = eg71ModalVariant(ctx.action);
    const title = ctx.title || (ctx.action === 'delete' ? '删除确认' : ctx.action === 'disable' ? '禁用确认' : ctx.action === 'select' ? '选择设备' : '操作确认');
    const cancelText = ctx.cancelText || '取消';
    const okText = ctx.okText || variant.okText;
    const needKeyword = ctx.action === 'delete' && ctx.confirmKeyword;
    return `<div class="bc-eg71-modal" hidden>
      <div class="ms-mask">
        <div class="ms-modal${variant.size ? ' ms-modal' + variant.size : ''}" role="dialog" aria-modal="true" aria-labelledby="bc-eg71-modal-title">
          <div class="ms-modal-head">
            <span class="ms-modal-title" id="bc-eg71-modal-title">${esc(title)}</span>
            <span class="ms-modal-close" data-modal-close aria-label="关闭">${ico('close', 16)}</span>
          </div>
          <div class="ms-modal-body">
            <div class="bc-eg71-modal-body-row">
              <span class="ms-result-icon ms-result-icon--${variant.status}">${ico(variant.status === 'error' ? 'trash' : variant.status === 'warn' ? 'warn' : 'info', 24)}</span>
              <div class="bc-eg71-modal-body-content">${eg71ModalBody(ctx, variant)}</div>
            </div>
          </div>
          <div class="ms-modal-foot">
            <button type="button" class="ms-btn" data-modal-cancel>${esc(cancelText)}</button>
            <button type="button" class="ms-btn ${variant.okClass}" data-modal-ok${needKeyword ? ' disabled' : ''}>${esc(okText)}</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function bindEg71Modal(root) {
    const scope = (root && root.querySelector && root.querySelector('.bc-eg71-modal')) || root;
    if (!scope) return;
    const wrap = scope.classList && scope.classList.contains('bc-eg71-modal') ? scope : scope.querySelector('.bc-eg71-modal');
    if (!wrap) return;
    const open = () => { wrap.hidden = false; wrap.classList.add('is-open'); };
    const close = () => { wrap.hidden = true; wrap.classList.remove('is-open'); };
    const okBtn = wrap.querySelector('[data-modal-ok]');
    const keywordInput = wrap.querySelector('.bc-eg71-modal-confirm-input');
    if (keywordInput && okBtn) {
      keywordInput.addEventListener('input', () => {
        okBtn.disabled = keywordInput.value !== keywordInput.dataset.keyword;
      });
    }
    wrap.querySelectorAll('.ms-radio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.ms-radio-btn').forEach(b => { b.classList.remove('ms-radio-btn--checked'); b.setAttribute('aria-checked', 'false'); });
        btn.classList.add('ms-radio-btn--checked');
        btn.setAttribute('aria-checked', 'true');
      });
    });
    wrap.querySelector('.ms-mask').addEventListener('click', e => { if (e.target === wrap.querySelector('.ms-mask')) close(); });
    wrap.querySelector('.ms-modal').addEventListener('click', e => e.stopPropagation());
    const closeBtn = wrap.querySelector('[data-modal-close]');
    const cancelBtn = wrap.querySelector('[data-modal-cancel]');
    if (closeBtn) closeBtn.addEventListener('click', close);
    if (cancelBtn) cancelBtn.addEventListener('click', close);
    if (okBtn) okBtn.addEventListener('click', () => { close(); });
    const triggers = (root.querySelectorAll ? root.querySelectorAll('[data-modal-trigger="bc-eg71-modal"]') : []);
    triggers.forEach(t => t.addEventListener('click', open));
    wrap.open = open;
    wrap.close = close;
  }

  /* ---------- EG71 侧-导航栏双重结构（L5 页面模板 · 捆绑） ----------
     规则：路由是唯一源。侧边栏（bc-eg71-sidenav）+ 顶栏（bc-eg71-topnav）捆绑为
     双重结构：每次侧边栏点击 → 读 data-route → 以新路由同源重渲染顶栏并同步侧边栏
     选中态。顶栏只在「Dashboard」与「通用面包屑」两种形态间切换（其余路由都走通用版）。
     调用方式（EG71 需求直接调双重结构，不再手动拼侧栏/顶栏）：
       const html = window.MS_EG71_SHELL.render(ctx);
       app.innerHTML = html;
       window.MS_EG71_SHELL.bind(app); */
  window.MS_EG71_SHELL = (function () {
    const BIZ = () => window.MS_BIZ_INDEX;
    let ctx = null, opts = {};

    function render(c, o) {
      ctx = Object.assign({}, c || {});
      ctx.route = ctx.route || '/dashboard';
      opts = o || {};
      const B = BIZ();
      const content = opts.content !== undefined ? opts.content
        : (B['bc-eg71-content'] ? B['bc-eg71-content'].render(ctx) : '');
      const footer = opts.footer !== undefined ? opts.footer
        : (B['bc-eg71-form-footer'] ? B['bc-eg71-form-footer'].render(ctx) : '');
      return '<div class="ms-shell">'
        + B['bc-eg71-sidenav'].render(ctx)
        + '<div class="ms-main">'
        + B['bc-eg71-topnav'].render(ctx)
        + '<div class="ms-content">' + content + '</div>'
        + '</div>'
        + footer
        + '</div>';
    }

    // 路由切换：只换顶栏 .ms-header，再原地同步侧边栏选中态（不重渲染、不重 bind）
    function navigate(route, root) {
      if (!route || route === ctx.route) return;
      ctx = Object.assign({}, ctx, { route });
      const rootEl = (root && root.querySelector) ? root : document.getElementById('app');
      const main = rootEl && rootEl.querySelector('.ms-main');
      const header = main && main.querySelector('.ms-header');
      const html = BIZ()['bc-eg71-topnav'].render(ctx);
      if (header) header.outerHTML = html;
      else if (main) main.insertAdjacentHTML('afterbegin', html);
      syncSidebar(rootEl, route);
    }

    // 侧边栏选中态：一级项前缀匹配（Dashboard 直达 /dashboard），子项精确匹配，路由所属分组展开
    function syncSidebar(rootEl, route) {
      const side = (rootEl && rootEl.querySelector('.bc-eg71-sidenav')) || rootEl;
      if (!side) return;
      side.querySelectorAll('[data-nav-trigger]').forEach(t => {
        const r = t.getAttribute('data-route');
        const active = route === r || route.indexOf(r + '/') === 0;
        t.classList.toggle('ms-nav-item--active', active);
      });
      side.querySelectorAll('.ms-nav-item--sub').forEach(s => {
        s.classList.toggle('ms-nav-item--active', s.getAttribute('data-route') === route);
      });
      side.querySelectorAll('[data-nav]').forEach(nav => {
        const t = nav.querySelector('[data-nav-trigger]');
        const sub = nav.querySelector('.bc-eg71-sub');
        if (!t || !sub) return;
        const r = t.getAttribute('data-route');
        const inGroup = route === r || route.indexOf(r + '/') === 0;
        sub.hidden = !inGroup;
        t.classList.toggle('is-open', inGroup);
        t.setAttribute('aria-expanded', String(inGroup));
      });
    }

    function bind(root) {
      const B = BIZ();
      const rootEl = (root && root.querySelector) ? root : document.getElementById('app');
      if (!rootEl) return;
      // 1) 侧边栏自身交互（手风琴 + Admin 账户下拉 + 语言子菜单）
      if (typeof B['bc-eg71-sidenav'].bind === 'function') B['bc-eg71-sidenav'].bind(rootEl);
      // 2) 双重结构捆绑：侧边栏点击 [data-route] → 路由导航 → 顶栏切换 + 选中态同步
      const side = rootEl.querySelector('.bc-eg71-sidenav') || rootEl;
      side.addEventListener('click', (e) => {
        const t = e.target && e.target.closest ? e.target.closest('[data-route]') : null;
        if (!t) return;
        const nav = t.closest('.bc-eg71-nav');
        // 仅「叶子导航」触发路由切换：无子菜单的一级项（Dashboard）或 .ms-nav-item--sub。
        // 带子菜单的一级项（Data Services / Network / …）点击只做手风琴展开，不导航。
        const isLeafTrigger = nav && !nav.querySelector('.bc-eg71-sub');
        const isSub = t.classList.contains('ms-nav-item--sub');
        if (isLeafTrigger || isSub) navigate(t.getAttribute('data-route'), rootEl);
      });
    }

    return { render, navigate, bind, get route() { return ctx && ctx.route; } };
  })();

  window.MS_BIZ_INDEX = Object.fromEntries(window.MS_BIZ_COMPONENTS.map(c => [c.id, c]));
})();

  </script>

  if (d.primConflict) w.push('一次地址与其他已纳管设备重复，可能导致通信失败，请修改设备地址。');
  if (d.secConflict) w.push('二次地址与总线上其他未纳管设备重复，可能导致通信失败，建议移除冲突设备或更换设备。');
  return w;
}

  const map = { online: ['mb-status--online', '在线'], offline: ['mb-status--offline', '离线'], never: ['mb-status--never', '从未上线'] };

/* B_Eg71Modal 通用接线：删除确认 / 型号切换确认（同一时刻只存在一个 bc-eg71-modal） */
function wireEg71BModal() {
  const bmodal = $app.querySelector('.bc-eg71-modal');
  if (!bmodal) return;
  bmodal.hidden = false;
  bmodal.classList.add('is-open');
  const dismiss = () => { state.delDev = null; state.modelConfirm = false; state.objLimit = null; renderList(); };
  bmodal.querySelectorAll('[data-modal-close],[data-modal-cancel]').forEach(b => b.addEventListener('click', dismiss));
  const mask = bmodal.querySelector('.ms-mask');
  if (mask) mask.addEventListener('click', e => { if (e.target === mask) dismiss(); });
  const okBtn = bmodal.querySelector('[data-modal-ok]');
  if (!okBtn) return;
  if (state.delDev) {
    okBtn.addEventListener('click', () => {
      addedDevices = addedDevices.filter(x => x.id !== state.delDev);
      state.delDev = null;
      renderList();
      toast('设备已删除', 'success');
    });
  } else if (state.modelConfirm) {
    okBtn.addEventListener('click', () => {
      state.modelConfirm = false;
      applyDrawerSave(true);
    });
  } else if (state.objLimit) {
    okBtn.addEventListener('click', () => { state.objLimit = null; renderList(); });
  }
}

/* ================= 手动添加 + 编辑抽屉共享逻辑（PRD 5.3 / 5.4） ================= */

/* 校验矩阵（PRD 5.3.4.3）：name 必填/唯一/≤127；一次地址 1-250 整数+唯一；二次地址 16 位 hex+唯一；采集间隔 60-86400 */
function validateDeviceFields(f, opts) {
  opts = opts || {};
  const errors = {};
  const name = (f.name || '').trim();
  if (!name) errors.name = '此字段为必填项。';
  else if (name.length > 127) errors.name = '最多 127 个字符。';
  else if (addedDevices.some(x => x.name === name && x.id !== opts.selfId)) errors.name = '设备名称已存在。';

  // 地址：手动添加（needAddr）必填；编辑抽屉选填，非空才校验
  if (opts.needAddr || (f.addr || '').trim() !== '') {
    const addr = (f.addr || '').trim();
    if (!addr) {
      errors.addr = '此字段为必填项。';
    } else if (f.addrMode === 'sec') {
      if (!/^[0-9A-Fa-f]{16}$/.test(addr)) errors.addr = '请输入 16 位十六进制字符。';
      else {
        const up = addr.toUpperCase();
        const other = addedDevices.find(x => x.sec && x.sec.replace(/\s/g, '').toUpperCase() === up && x.id !== opts.selfId);
        if (other) errors.addr = `该地址已被设备 ${other.name} 使用。`;
      }
    } else {
      const p = Number(addr);
      if (!/^\d+$/.test(addr) || p < 1 || p > 250) errors.addr = '请输入有效值，范围：1 到 250。';
      else {
        const other = addedDevices.find(x => x.prim === p && x.id !== opts.selfId);
        if (other) errors.addr = `该地址已被设备 ${other.name} 使用。`;
      }
    }
  }

  const interval = (f.interval || '').trim();
  if (!interval) errors.interval = '此字段为必填项。';
  else {
    const n = Number(interval);
    if (!/^\d+$/.test(interval) || n < 60 || n > 86400) errors.interval = '请输入有效值，范围：60 到 86400。';
  }
  return errors;
}

/* 失焦校验必须原地更新错误（不能重渲染：focusout 先于 click，重渲染会把按钮打掉） */
function showFieldError(input, msg) {
  if (!input) return;
  const item = input.closest('.ms-form-item');
  if (!item) return;
  const box = input.closest('.ms-input');
  let err = item.querySelector(':scope > .ms-form-error');
  if (msg) {
    if (box) box.classList.add('ms-input--error');
    if (!err) {
      err = document.createElement('span');
      err.className = 'ms-form-error';
      const help = item.querySelector(':scope > .ms-form-help');
      item.insertBefore(err, help || null);
    }
    err.innerHTML = `${ico('warn', 12)}${esc(msg)}`;
  } else {
    if (box) box.classList.remove('ms-input--error');
    if (err) err.remove();
  }
}

function nowStr() {
  const p = n => String(n).padStart(2, '0');
  const t = new Date();
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;
}

/* 异步上线（PRD 5.3.4.4）：创建后静默验证，never→online 不打扰用户；只原地刷新行，避免砸开着的弹窗 */
function simulateVerify(devId, ok) {
  setTimeout(() => {
    const d = addedDevices.find(x => x.id === devId);
    if (!d) return;
    if (ok !== false) { d.status = 'online'; d.updated = nowStr(); }
    updateRowInPlace(devId);
  }, 3000);
}

function updateRowInPlace(devId) {
  const d = addedDevices.find(x => x.id === devId);
  const tr = $app.querySelector(`tr[data-dev="${devId}"]`);
  if (!d || !tr) return;
  const s = tr.querySelector('[data-cell="status"]'); if (s) s.innerHTML = statusCell(d);
  const o = tr.querySelector('[data-cell="objects"]'); if (o) o.textContent = String(d.objects != null ? d.objects : 0);
  const u = tr.querySelector('[data-cell="updated"]'); if (u) u.textContent = d.updated || '—';
}

let manualSeq = 0;

function createManualDevice(objCount) {
  const m = state.manualAdd;
  const isMBus = m.proto.indexOf('M-Bus') === 0;
  const dev = {
    id: 'man' + (++manualSeq),
    name: (m.name || '').trim(),
    model: m.model || 'None',
    proto: isMBus ? 'M-Bus / M-Bus' : m.proto,
    status: 'never',
    objects: objCount,
    updated: '—',
    interval: parseInt(m.interval, 10) || 600,
    desc: (m.desc || '').trim()
  };
  if (isMBus) {
    if (m.addrMode === 'sec') dev.sec = (m.addr || '').trim().toUpperCase();
    else dev.prim = parseInt(m.addr, 10);
  }
  addedDevices.push(dev);
  state.justAddedIds.push(dev.id);
  simulateVerify(dev.id);
  return dev;
}

/* Step1 → 下一步：校验矩阵 → 设备数量上限（网关 2000 / M-Bus 250，⚠️ toast）→ None 直接建档 / 其他进 Step2 */
function manualNext() {
  readManualInputs();
  const m = state.manualAdd;
  const isMBus = m.proto.indexOf('M-Bus') === 0;
  const errors = validateDeviceFields(m, { needAddr: isMBus });
  if (Object.keys(errors).length) { m.errors = errors; renderList(); return; }
  m.errors = {};
  if (addedDevices.length >= 2000) { toast('已达网关设备数量上限（2000），无法继续添加。', 'error'); return; }
  if (isMBus && addedDevices.filter(x => x.proto && x.proto.indexOf('M-Bus') === 0).length >= 250) {
    toast('已达 M-Bus 总线设备数量上限（250），无法继续添加。', 'error'); return;
  }
  m.name = (m.name || '').trim();
  if ((m.model || 'None') === 'None') {
    createManualDevice(0);
    state.manualAdd = null;
    renderList();
    toast('设备添加成功', 'success');
  } else {
    m.step = 2;
    if (!m.selInit) {
      m.sel = {};
      (MODEL_OBJECTS[m.model] || []).forEach((o, i) => { m.sel[i] = true; });
      m.selInit = true;
    }
    renderList();
  }
}

/* Step2 → 完成：对象数量上限（单设备 100 / 网关 20000）命中走 B_Eg71Modal 拦截 */
function manualFinish(andMore) {
  const m = state.manualAdd;
  const objs = MODEL_OBJECTS[m.model] || [];
  const selCount = objs.reduce((n, o, i) => n + (m.sel[i] ? 1 : 0), 0);
  const totalAfter = addedDevices.reduce((n, x) => n + (x.objects || 0), 0) + selCount;
  if (selCount > 100 || totalAfter > 20000) {
    state.objLimit = { selCount, overDevice: selCount > 100, overGateway: totalAfter > 20000 };
    renderList();
    return;
  }
  createManualDevice(selCount);
  toast('设备添加成功', 'success');
  state.manualAdd = andMore
    ? { step: 1, proto: m.proto, model: m.model, addrMode: m.addrMode, name: '', addr: '', desc: '', interval: m.interval, errors: {}, sel: {}, selInit: false }
    : null;
  renderList();
}

/* 对象数量超出限制：B_Eg71Modal（action='confirm'） */
function objLimitHtml() {
  const o = state.objLimit || {};
  const parts = [];
  if (o.overDevice) parts.push('单个设备可创建的数据对象数量不能超过 100 个');
  if (o.overGateway) parts.push('网关可创建的数据对象总数不能超过 20000 个');
  return window.MS_BIZ_INDEX && window.MS_BIZ_INDEX['bc-eg71-modal']
    ? window.MS_BIZ_INDEX['bc-eg71-modal'].render({
        action: 'confirm',
        title: '对象数量超出限制',
        desc: `已选 ${o.selCount} 个数据对象，${parts.join('；')}。`,
        okText: '确认'
      })
    : '';
}

/* 把弹窗内已输入的值同步回 state（切步/切换协议/下一步前调用） */
function readManualInputs() {
  const m = state.manualAdd;
  if (!m) return;

/* 编辑抽屉保存（PRD 5.4.4）：校验矩阵 → 型号变更先走 B_Eg71Modal 二次确认（确认后 objects=0）→ 应用并验证通信（状态在线） */
function applyDrawerSave(confirmed) {
  const d = addedDevices.find(x => x.id === state.drawerDev);
  if (!d) { state.drawerDev = null; state.drawerDraft = null; renderList(); return; }
  const draft = state.drawerDraft || {};
  const f = {
    name: draft.name != null ? draft.name : d.name,
    addr: draft.prim != null ? draft.prim : (d.prim != null ? String(d.prim) : ''),
    addrMode: 'prim',
    interval: draft.interval != null ? draft.interval : (d.interval != null ? String(d.interval) : ''),
    desc: draft.desc != null ? draft.desc : (d.desc || '')
  };
  const errors = validateDeviceFields(f, { selfId: d.id });
  if (Object.keys(errors).length) {
    state.drawerErrors = { name: errors.name || '', prim: errors.addr || '', interval: errors.interval || '' };
    renderList();
    return;
  }
  const oldModel = d.model || 'None';
  const newModel = draft.model != null ? draft.model : oldModel;
  const modelChanged = newModel !== oldModel;
  if (modelChanged && !confirmed) { state.modelConfirm = true; renderList(); return; }
  d.name = f.name.trim();
  d.desc = (f.desc || '').trim();
  d.interval = parseInt(f.interval, 10);
  const isMBus = d.proto && d.proto.indexOf('M-Bus') === 0;
  if (isMBus) { if (f.addr === '') delete d.prim; else d.prim = parseInt(f.addr, 10); }
  if (isMBus) { delete d.primConflict; delete d.secConflict; } // 新地址验证成功，冲突告警随地址更新清除
  if (modelChanged) { d.model = newModel; d.objects = 0; }
  d.status = 'online';
  d.updated = nowStr();
  state.drawerDev = null;
  state.modelConfirm = false;
  state.drawerErrors = {};
  state.drawerDraft = null;
  renderList();
  toast(modelChanged ? '设备型号已切换，设备下对象及转发引用已清除；保存成功，已验证设备通信' : '保存成功，已使用新地址验证设备通信', 'success');
}

/* 掩码输入：仅更新单元格样式，不重绘 */
function bindMaskInputs() {
  const box = document.getElementById('mask-cells');
  if (!box) return;
  box.querySelectorAll('.mb-mask-cell:not(.mb-mask-cell--fixed)').forEach(cell => {
    cell.addEventListener('input', () => {
      const v = cell.value.toUpperCase().replace(/[^0-9F]/g, '');
      cell.value = v;
      cell.classList.remove('mb-mask-cell--error');
      const err = document.getElementById('mask-error');
      err.style.display = 'none';
      const idx = +cell.dataset.idx;
      state.cfg.mask = state.cfg.mask.substring(0, idx) + (v || '_') + state.cfg.mask.substring(idx + 1);
      if (v && cell.nextElementSibling) cell.nextElementSibling.focus();
    });
    cell.addEventListener('blur', () => validateMask(false));
  });
}

function readMaskVal() {
  let raw = 'F';
  document.querySelectorAll('#mask-cells .mb-mask-cell:not(.mb-mask-cell--fixed)').forEach(c => {
    raw += c.value.toUpperCase() || '_';
  });
  return raw;
}

function validateMask(showEmpty) {
  const raw = readMaskVal();
  const err = document.getElementById('mask-error');
  const cells = document.querySelectorAll('#mask-cells .mb-mask-cell:not(.mb-mask-cell--fixed)');
  let msg = '';
  if (/[^F_0-9]/.test(raw)) msg = '仅允许 0-9 或 F。';
  else if (raw.includes('_')) {
    if (showEmpty) msg = '序列号前缀为必填项，每一位都需要输入。';
    else { cells.forEach(c => { if (!c.value) c.classList.add('mb-mask-cell--error'); }); msg = 'F = 匹配任意数字（0-9）；填写已知位，其余位留 F。此字段为必填项。'; }
  } else if (!/[0-9]/.test(raw)) msg = '请至少填写一位具体数字，或切换为“完整扫描”。';
  if (msg) {
    err.textContent = msg;
    err.style.display = 'flex';
    cells.forEach(c => { if (!c.value && !msg.startsWith('仅允许')) c.classList.add('mb-mask-cell--error'); });
    return false;
  }
  err.style.display = 'none';
  state.cfg.mask = raw;
  return true;
}

/* ================= 扫描进度 ================= */

function startScan() {
  state.scan.active = true;
  state.scan.progress = 0;
  state.scan.found = 0;
  state.scan.objects = 0;
  state.scan.entered = [];
  renderScanModal();
  state.scan.timer = setInterval(tickScan, 110);
}

function tickScan() {
  const s = state.scan;
  // 设备密集号段（30%-55%）增长慢，稀疏号段增长快
  const dense = s.progress > 28 && s.progress < 56;
  s.progress = Math.min(100, s.progress + (dense ? 0.55 : 1.35) + Math.random() * 0.9);
  const hits = DISCOVER_TIMELINE.filter(t => t.p <= s.progress && !s.entered.includes(t.dev));
  hits.forEach(t => {
    s.entered.push(t.dev);
    s.found += 1;
    s.objects += deviceById(t.dev).objects.length;
  });
  updateScanModal();
  if (s.progress >= 100) {
    clearInterval(s.scan_safe);
    clearInterval(s.timer);
    s.timer = null;
    setTimeout(() => { closeScanModal(); buildResult(); }, 500);
  }
}

function deviceById(id) {
  for (const g of GROUP_TPL) {
    const d = g.devices.find(x => x.id === id);
    if (d) return { ...d, objects: g.objects, group: g };
  }
  if (id === 'old1') return { id: 'old1', objects: GROUP_TPL[0].objects, added: true };
  if (id === 'old2') return { id: 'old2', objects: GROUP_TPL[2].objects, added: true };
  return null;
}

/* ================= 步骤二：选择设备与对象 ================= */

function buildResult() {
  const entered = state.scan.entered;
  const foundOld = entered.filter(id => id.startsWith('old'));
  const newIds = entered.filter(id => !id.startsWith('old'));
  // 按分组模板裁剪出已发现的设备
  const groups = GROUP_TPL.map(g => {
    const devs = g.devices.filter(d => newIds.includes(d.id)).map(d => ({ ...d }));
    return devs.length ? { ...g, devices: devs } : null;
  }).filter(Boolean);
  state.result = {
    groups,
    totalFound: entered.length,
    addedCount: foundOld.length,
    newCount: newIds.length,
    objTotal: groups.reduce((a, g) => a + g.devices.length * g.objects.length, 0),
  };
  // 默认全选设备与对象（VIB 不可解析除外）
  state.sel = {};
  groups.forEach(g => g.devices.forEach(d => { state.sel[d.id] = true; }));
  state.objSel = {};
  groups.forEach(g => { state.objSel[g.id] = g.objects.map(o => !o.vibUnparsed); });
  state.activeGroup = groups.length ? groups[0].id : '';
  state.conflictOpen = { primary: false, secondary: false };
  state.devSearch = '';
  state.scanStep = 2;
  state.view = 'scan';
  renderScan2();
}

function groupTitle(g) {
  const base = `${g.manufCode} ${g.manuf} ${g.medium}`;
  const label = g.hasGroups > 1 ? `${base} Group ${g.gno}` : base;
  const objCount = g.objects.filter(o => !o.vibUnparsed).length;
  return { label, count: `${g.devices.length} 台 × ${objCount} 个对象` };
}

function hasDupDibVib(g) {
  const seen = new Set();
  return g.objects.some(o => { const k = o.dib + '|' + o.vib; if (seen.has(k)) return true; seen.add(k); return false; });
}

/* ---------------- 步骤二事件绑定（输入类，避免重绘丢焦点） ---------------- */

function bindScan2Events() {
  syncGroupChecks();
  const search = document.getElementById('dev-search');
  if (search) {
    search.addEventListener('input', () => {
      state.devSearch = search.value;
      // 局部刷新：仅左侧列表 + 全选态
      refreshGroupList();
    });

}

function refreshGroupList() {
  // 重绘左列（搜索过滤时保持搜索框焦点：只替换列表容器）
  const R = state.result;
  const g = R.groups.find(x => x.id === state.activeGroup) || R.groups[0];
  const kw = state.devSearch.trim().toLowerCase();
  const html = R.groups.map(gr => {
    const t = groupTitle(gr);
    const shownDevs = gr.devices.filter(d => !kw || d.name.toLowerCase().includes(kw));
    const allChecked = shownDevs.length > 0 && shownDevs.every(d => state.sel[d.id]);
    return `<div class="mb-group ${gr.id === g.id ? 'mb-group--active' : ''}">
      <div class="mb-group-head" data-action="pick-group" data-id="${gr.id}">
        <label class="ms-checkbox" data-action="toggle-group" data-id="${gr.id}">
          <input type="checkbox" ${allChecked ? 'checked' : ''}><span class="ms-checkbox-box"></span>
        </label>
        <span class="mb-group-head-label">${esc(t.label)}<span class="mb-group-count">${esc(t.count)}</span></span>
        <span class="mb-conflict-arrow">${ico('right', 12)}</span>

  const ca = document.getElementById('dev-checkall');
  if (ca) ca.checked = isAllShownChecked();

function syncGroupChecks() {
  state.result.groups.forEach(gr => {
    const head = document.querySelector(`.mb-group-head[data-action="pick-group"][data-id="${gr.id}"] input[type="checkbox"]`);
    if (head) head.indeterminate = gr.devices.some(d => state.sel[d.id]) && !gr.devices.every(d => state.sel[d.id]);
  });
}

function updateSelCount() {
  const el = document.getElementById('sel-count');
  const n = Object.values(state.sel).filter(Boolean).length;
  if (el) el.textContent = n;
  const finish = document.querySelector('[data-action="finish-add"]');
  if (finish) finish.disabled = n === 0;
}

/* ---------------- 确认添加 ---------------- */

function finishAdd() {
  state.adding = true;
  renderScan2();
  setTimeout(() => {
    state.adding = false;
    // 模拟：1 台待分配设备一次地址分配失败
    const fails = [];
    state.result.groups.forEach(g => g.devices.forEach(d => {
      if (state.sel[d.id] && d.prim == null) {
        // 演示：第一台待分配成功，后续待分配失败
        if (fails.length === 0 && d.id === 'g1d3') { d.prim = 21; return; }
        fails.push(d.name);
      }
    }));
    if (fails.length) state.resultModal = { fails };
    else commitDevices([]);
    renderScan2();
  }, 1500);
}

function commitDevices() {
  const R = state.result;
  const newDevs = [];
  const now = '2026-09-15 10:26:0' + Math.floor(Math.random() * 9);
  R.groups.forEach(g => {
    const objN = state.objSel[g.id] ? state.objSel[g.id].filter((v, i) => v && !g.objects[i].vibUnparsed).length : 0;
    g.devices.forEach(d => {
      if (!state.sel[d.id]) return;
      newDevs.push({
        id: d.id, name: d.name, model: 'None', proto: 'M-Bus / M-Bus',
        status: 'online', objects: objN, updated: now,
        prim: d.prim != null ? d.prim : null, sec: d.sec,
        ...(d.primConflict ? { primConflict: true } : {}), ...(d.secConflict ? { secConflict: true } : {}),
      });
    });
  });
  addedDevices = addedDevices.concat(newDevs);
  state.justAddedIds = newDevs.map(d => d.id);
  state.view = 'list';
  state.scanStep = 1;
  state.resultModal = null;
  state.editTarget = null;
  renderList();
  toast(newDevs.length + ' 台设备添加成功', 'success');
}

function downloadReport() {
  const rows = [
    ['Conflict Type', 'Conflict Address', 'Device Name', 'Detection Time', 'Suggestion'],
  ];
  const ts = new Date().toISOString();
  PRIMARY_CONFLICT.rows.forEach(r => rows.push(['Primary Address Conflict', String(PRIMARY_CONFLICT.addr), r.name, ts, 'Please modify the primary address of this device to ensure uniqueness on the bus.']));
  rows.push(['Primary Address Conflict', String(PRIMARY_CONFLICT.addr), 'Kamstrup Multical 302', ts, 'Please modify the primary address of this device to ensure uniqueness on the bus.']);
  SECONDARY_CONFLICT.masks.forEach(m => rows.push(['Secondary Address Conflict', m, '—', ts, 'Secondary address conflict prevents unique device identification. Please investigate and resolve on-site then re-scan.']));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const fname = `EG71-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}-71.0.0.4-conflict_address_details.csv`;
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('冲突报告已下载：' + fname);
}

/* ---------------- 全局事件委托 ---------------- */

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const act = t.dataset.action;

  // 阻止冒泡类：组内 checkbox / 设备 checkbox 点击不应触发行为
  if (act === 'toggle-dev' || act === 'toggle-group' || act === 'edit-name' || act === 'toggle-obj' || act === 'noop-stop' || act === 'download-report' || act === 'unit-sel' || act === 'edit-objname') e.stopPropagation();

  switch (act) {
    case 'open-scan':
      state.view = 'scan'; state.scanStep = 1;
      renderScan1();
      break;
    case 'back-list':
      state.view = 'list'; state.scanStep = 1;
      renderList();
      break;
    case 'back-step1':
      state.view = 'scan'; state.scanStep = 1;
      renderScan1();
      break;
    case 'set-mode':
      // radio change 也走这里
      break;
    case 'toggle-adv': {
      e.preventDefault();
      const box = document.getElementById('adv-box');
      const body = box.querySelector('.mb-advanced-body');
      state.cfg.advOpen = !state.cfg.advOpen;
      box.classList.toggle('is-open', state.cfg.advOpen);
      body.style.display = state.cfg.advOpen ? '' : 'none';
      break;
    }
    case 'scan-next': {
      if (state.cfg.mode === 'mask' && !validateMask(true)) break;
      const to = document.getElementById('cfg-timeout');
      const re = document.getElementById('cfg-retry');
      if (to) {
        const v = parseInt(to.value, 10);
        if (isNaN(v) || v < 100 || v > 60000) { to.closest('.ms-input').classList.add('ms-input--error'); toast('请输入有效值，范围：100 到 60000。', 'error'); break; }
        to.closest('.ms-input').classList.remove('ms-input--error');
        state.cfg.timeout = v;
      }
      if (re) {
        const v = parseInt(re.value, 10);
        if (isNaN(v) || v < 0 || v > 30) { re.closest('.ms-input').classList.add('ms-input--error'); toast('请输入有效值，范围：0 到 30。', 'error'); break; }
        re.closest('.ms-input').classList.remove('ms-input--error');
        state.cfg.retry = v;
      }
      startScan();
      break;
    }
    case 'stop-scan':
      stopScan();
      break;
    case 'pick-group': {
      state.activeGroup = t.dataset.id;
      renderScan2();
      break;
    }
    case 'toggle-conflict': {
      const k = t.dataset.key;
      state.conflictOpen[k] = !state.conflictOpen[k];
      renderScan2();
      break;
    }
    case 'download-report':
      downloadReport();
      break;
    case 'edit-name':
      state.editTarget = t.dataset.id;
      renderScan2();
      setTimeout(() => { const i = document.getElementById('devname-input'); if (i) { i.focus(); i.select(); } }, 0);
      break;
    case 'close-editname':
      state.editTarget = null;
      renderScan2();
      break;
    case 'save-editname': {
      const input = document.getElementById('devname-input');
      const err = document.getElementById('devname-error');
      const v = input.value.trim();
      const dev = state.result.groups.flatMap(g => g.devices).find(d => d.id === state.editTarget);
      if (!v) { err.textContent = '此字段为必填项。'; err.style.display = 'flex'; break; }
      if (v.length > 127) { err.textContent = '最多 127 个字符。'; err.style.display = 'flex'; break; }
      const dupName = addedDevices.some(d => d.name === v) || state.result.groups.flatMap(g => g.devices).some(d => d.name === v && d.id !== dev.id);
      if (dupName) { err.textContent = '设备名称已存在。'; err.style.display = 'flex'; break; }
      dev.name = v;
      state.editTarget = null;
      renderScan2();
      toast('设备名称已更新');
      break;
    }
    case 'toggle-dev':
    case 'toggle-group':
    case 'toggle-obj':
    case 'check-all':
      // checkbox 逻辑统一在 change 事件中处理
      break;
    case 'check-all-obj': {
      const g = state.result.groups.find(x => x.id === t.dataset.id);
      const target = t.checked;
      g.objects.forEach((o, i) => {
        if (o.vibUnparsed && !o.name) return; // 未配置名称的不可选
        state.objSel[g.id][i] = target;
      });
      renderScan2();
      break;
    }
    case 'finish-add':
      finishAdd();
      break;
    case 'copy-fails': {
      const txt = (state.resultModal ? state.resultModal.fails : []).join('\n');
      navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast('已复制失败设备信息')).catch(() => toast('复制失败'));
      break;
    }
    case 'confirm-result':
      commitDevices();
      break;
    case 'edit-dev':
      state.drawerDev = t.dataset.id;
      state.drawerErrors = {};
      state.drawerDraft = null;
      renderList();
      break;
    case 'close-drawer':
      state.drawerDev = null;
      state.modelConfirm = false;
      state.drawerErrors = {};
      state.drawerDraft = null;
      renderList();
      break;
    case 'save-drawer': {
      const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      state.drawerDraft = { name: g('ed-name'), prim: g('ed-prim'), desc: g('ed-desc'), interval: g('ed-interval'), model: g('ed-model') };
      applyDrawerSave(false);
      break;
    }
    case 'del-dev':
      state.delDev = t.dataset.id;
      renderList();
      break;
    case 'open-manual':
      state.manualAdd = { step: 1, proto: 'M-Bus', model: 'None', addrMode: 'prim', name: '', addr: '', desc: '', interval: '600', errors: {}, sel: {} };
      renderList();
      break;
    case 'close-manual':
      state.manualAdd = null;
      state.objLimit = null;
      renderList();
      break;
    case 'manual-next':
      manualNext();
      break;
    case 'manual-prev':
      readManualInputs();
      state.manualAdd.step = 1;
      renderList();
      break;
    case 'manual-finish':
      manualFinish(false);
      break;
    case 'manual-finish-more':
      manualFinish(true);
      break;
    case 'manual-addrmode':
      // radio 切换走 change 委托
      break;
    case 'noop-close':
      break;
  }
});

/* radio / checkbox / select 的 change 委托 */
document.addEventListener('change', e => {
  const t = e.target.closest('[data-action]');
  const act = t ? t.dataset.action : '';
  if (act === 'set-mode') {
    state.cfg.mode = t.value;
    renderScan1();
  }
  if (act === 'toggle-dev') {
    state.sel[t.dataset.id] = e.target.checked;
    refreshGroupList();
    updateSelCount();
  }
  if (act === 'toggle-group') {
    const g = state.result.groups.find(x => x.id === t.dataset.id);
    if (g) {
      g.devices.forEach(d => state.sel[d.id] = e.target.checked);
      refreshGroupList();
      updateSelCount();
    }
  }
  if (act === 'toggle-obj') {
    const gid = t.dataset.group;
    if (state.objSel[gid]) state.objSel[gid][+t.dataset.idx] = e.target.checked;
  }
  if (act === 'check-all') {
    const kw = state.devSearch.trim().toLowerCase();
    state.result.groups.flatMap(g => g.devices)
      .filter(d => !kw || d.name.toLowerCase().includes(kw))
      .forEach(d => state.sel[d.id] = e.target.checked);
    refreshGroupList();
    updateSelCount();
  }
  if (e.target.id === 'auto-assign') {
    state.cfg.autoAssign = e.target.checked;
    // 步骤二「待分配/未分配」标签随之切换
    if (state.view === 'scan' && state.scanStep === 2) renderScan2();
  }
  if (act === 'unit-sel') {
    const g = state.result.groups.find(x => x.id === t.dataset.group);
    const o = g.objects[+t.dataset.idx];
    o.unit = t.value === '—' ? '' : t.value;
  }
  /* ---- 手动添加向导 ---- */
  if (act === 'manual-addrmode') {
    readManualInputs();
    state.manualAdd.addrMode = t.value;
    state.manualAdd.addr = '';
    if (state.manualAdd.errors) state.manualAdd.errors.addr = '';
    renderList();
  }
  if (act === 'manual-proto') {
    readManualInputs();
    state.manualAdd.proto = t.value;
    renderList();
  }
  if (act === 'manual-model') {
    state.manualAdd.model = t.value;
  }
  if (act === 'manual-obj') {
    state.manualAdd.sel[+t.dataset.idx] = e.target.checked;
    syncManualSelUI();
  }
  if (act === 'manual-obj-all') {
    const m = state.manualAdd;
    const objs = MODEL_OBJECTS[m.model] || [];
    objs.forEach((o, i) => { m.sel[i] = e.target.checked; });
    $app.querySelectorAll('input[data-action="manual-obj"]').forEach(c => { c.checked = e.target.checked; });
    syncManualSelUI();
  }
});

/* 对象名称编辑（失焦校验设备内唯一） */
document.addEventListener('focusout', e => {
  const t = e.target.closest('[data-action="edit-objname"]');
  if (!t) return;
  const g = state.result.groups.find(x => x.id === t.dataset.group);
  if (!g) return;
  const o = g.objects[+t.dataset.idx];
  const v = t.value.trim();
  if (v && g.objects.some((x, i) => i !== +t.dataset.idx && x.name === v)) {
    t.value = o.name;
    toast('该设备下对象名称已存在。', 'error');
    return;
  }
  const hadName = !!o.name;
  o.name = v;
  // VIB 不可解析对象：配置名称后解禁勾选框
  if (o.vibUnparsed && v && !hadName) {
    state.objSel[g.id][+t.dataset.idx] = true;
    renderScan2();
  }
});

/* Step2 勾选数原地同步（不重渲染，保住滚动位置） */
function syncManualSelUI() {
  const m = state.manualAdd;
  if (!m) return;
  const objs = MODEL_OBJECTS[m.model] || [];
  const n = objs.reduce((s, o, i) => s + (m.sel[i] ? 1 : 0), 0);
  const cnt = document.getElementById('ma-sel-count');
  if (cnt) cnt.textContent = String(n);
  const all = document.getElementById('ma-obj-all');
  if (all) all.checked = objs.length > 0 && n === objs.length;
}

/* 手动添加 / 编辑抽屉字段失焦校验：原地显错（PRD 5.3.4.3 校验矩阵） */
document.addEventListener('focusout', e => {
  const t = e.target.closest('[data-check]');
  if (!t) return;
  const key = t.dataset.check;
  let f, opts, errObj, errKey;
  if (key.indexOf('ma-') === 0 && state.manualAdd) {
    readManualInputs();
    const m = state.manualAdd;
    f = m;
    opts = { needAddr: m.proto.indexOf('M-Bus') === 0 };
    errObj = m.errors = m.errors || {};
    errKey = key.slice(3);
  } else if (key.indexOf('ed-') === 0 && state.drawerDev) {
    const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    f = { name: g('ed-name'), addr: g('ed-prim'), addrMode: 'prim', interval: g('ed-interval'), desc: g('ed-desc') };
    opts = { selfId: state.drawerDev };
    errObj = state.drawerErrors;
    errKey = key === 'ed-prim' ? 'prim' : key.slice(3);
  } else return;
  const errors = validateDeviceFields(f, opts);
  const msg = errors[errKey === 'prim' ? 'addr' : errKey] || '';
  showFieldError(t, msg);
  if (errObj) errObj[errKey] = msg;
});

/* 首屏 */
render();
</script>
