<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Milesight IOT Web · 组件文档 v1.0.0</title>
<script>
/* SSR 首屏防闪烁：必须在 <style> 前执行，给 <html> 提前打 data-theme */
(function () {
  try {
    var t = localStorage.getItem('milesight-theme');
    if (!t || t === 'system') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

* { box-sizing:border-box }
html, body { margin:0; padding:0 }
body {
  font:400 14px/1.55 var(--font-sans);
  color:var(--color-text-primary);
  background:var(--color-bg-page);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a { color:inherit; text-decoration:none }
button { font-family:inherit; cursor:pointer }
::selection { background:var(--color-primary-bg); color:var(--color-primary-normal) }
::-webkit-scrollbar { width:8px; height:8px }
::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:4px }
::-webkit-scrollbar-thumb:hover { background:var(--gray-300) }
::-webkit-scrollbar-track { background:transparent }

/* ===== App shell ===== */
.shell { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh }
.sidebar {
  position:sticky; top:0; align-self:start; height:100vh; overflow:hidden;
  background:var(--color-bg-card); border-right:1px solid var(--color-divider-base-1);
  display:flex; flex-direction:column;
}
.sidebar-header {
  padding:18px 18px 14px; border-bottom:1px solid var(--color-divider-base-1);
  background:var(--color-bg-card);
}
.brand { display:flex; align-items:center; gap:10px }
.brand .logo { width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center }
.brand .name { font:600 15px/1.2 var(--font-sans) }
.brand .ver { font:400 11px/1 var(--font-mono); color:var(--color-text-auxiliary); margin-top:2px }

.kbd-trigger {
  margin:12px 14px 0; padding:8px 12px;
  display:flex; align-items:center; gap:8px;
  background:var(--color-bg-card); border:1px solid var(--color-border-base);
  border-radius:var(--radius-8); cursor:pointer;
  color:var(--color-text-auxiliary); font:400 13px/1 var(--font-sans);
  transition:all 160ms var(--ease);
}
.kbd-trigger:hover { border-color:var(--color-primary-normal); color:var(--color-text-primary) }
.kbd-trigger .kbd {
  margin-left:auto; padding:2px 6px; background:var(--color-base-hover);
  border-radius:4px; font:500 11px/1.4 var(--font-mono); color:var(--color-text-secondary);
}

.nav { flex:1; overflow-y:auto; padding:8px 8px 24px }
.nav-group { margin-top:14px }
.nav-group-title {
  padding:6px 12px; font:600 11px/1.4 var(--font-sans);
  color:var(--text-quaternary); letter-spacing:0.06em; text-transform:uppercase;
  display:flex; justify-content:flex-start; align-items:center; gap:6px;
}
.nav-group-title .num {
  font:500 11px/1 var(--font-mono); color:var(--color-text-auxiliary);
  background:var(--color-base-hover); padding:2px 6px; border-radius:8px;
  letter-spacing:0;
}
.nav-item {
  display:flex; align-items:center; justify-content:flex-start; gap:6px;
  padding:6px 12px; margin:1px 0; border-radius:var(--radius-6);
  color:var(--color-text-secondary); font:400 13px/1.4 var(--font-sans); cursor:pointer;
  transition:all 120ms var(--ease);
}
.nav-item:hover { background:var(--color-base-hover); color:var(--color-text-primary) }
.nav-item.active {
  background:var(--color-fill-primary); color:var(--color-primary-normal); font-weight:500;
  box-shadow:var(--shadow-1);
}
.nav-item .cn { color:var(--color-text-auxiliary); font-size:11px; opacity:0; transition:opacity 120ms var(--ease) }
.nav-item:hover .cn { opacity:1 }
.nav-item.active .cn { color:var(--color-primary-normal) }

.sidebar-footer {
  padding:12px 16px; border-top:1px solid var(--color-divider-base-1);
  background:var(--color-bg-card); font:400 11px/1.4 var(--font-mono);
  color:var(--color-text-auxiliary); display:flex; justify-content:space-between; align-items:center;
}

/* ===== Main ===== */
.content { min-width:0; display:flex; flex-direction:column }

.topbar {
  position:sticky; top:0; z-index:30;
  height:var(--header-h);
  display:flex; align-items:center; gap:14px;
  padding:0 28px;
  background:var(--surface-glass); backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--color-divider-base-1);
  transition:background 200ms var(--ease), border-color 200ms var(--ease);
}
.crumbs {
  display:flex; align-items:center; gap:6px; min-width:0;
  font:400 13px/1.4 var(--font-sans); color:var(--color-text-auxiliary);
}
.crumbs .cur { color:var(--color-text-primary); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.crumbs .sep { opacity:0.4 }
.crumb-btn {
  background:transparent; border:none; color:inherit; padding:0;
  font:inherit; cursor:pointer; transition:color 120ms;
}
.crumb-btn:hover { color:var(--color-primary-normal) }

.topbar-actions { margin-left:auto; display:flex; gap:8px; align-items:center }
.icon-btn {
  width:32px; height:32px; padding:0; border:1px solid var(--color-border-base);
  background:var(--color-bg-card); color:var(--color-text-secondary); border-radius:var(--radius-6);
  display:inline-flex; align-items:center; justify-content:center;
  transition:all 160ms var(--ease);
}
.icon-btn:hover { border-color:var(--color-primary-normal); color:var(--color-primary-normal); background:var(--color-primary-bg) }
.icon-btn.copied { border-color:var(--color-primary-normal); color:var(--color-primary-normal); background:var(--color-primary-bg) }

/* ===== Hero (overview page) ===== */
.hero {
  padding:56px 56px 40px; background:linear-gradient(180deg, var(--color-base-bg) 0%, var(--color-bg-card) 100%);
  border-bottom:1px solid var(--color-divider-base-1);
}
.hero h1 { margin:0 0 12px; font:600 36px/1.2 var(--font-sans); letter-spacing:-0.02em }
.hero .lead {
  margin:0; max-width:680px; font:400 16px/1.6 var(--font-sans); color:var(--color-text-secondary);
}
.hero .meta {
  margin-top:24px; display:flex; gap:8px; flex-wrap:wrap;
}
.hero .stat {
  background:var(--color-bg-card); border:1px solid var(--color-divider-base-1); padding:12px 18px;
  border-radius:var(--radius-10); display:flex; flex-direction:column; gap:2px;
  min-width:120px; box-shadow:var(--shadow-1);
}
.hero .stat .n { font:600 22px/1.2 var(--font-sans); color:var(--color-text-primary); letter-spacing:-0.01em }
.hero .stat .l { font:400 12px/1.4 var(--font-sans); color:var(--color-text-auxiliary) }

.overview { padding:32px 40px 64px }
.cat-block { margin-bottom:48px }
.cat-block h2 {
  margin:0 0 18px; font:600 18px/1.4 var(--font-sans);
  display:flex; align-items:baseline; gap:10px;
}
.cat-block h2 .num { font:400 13px/1.4 var(--font-sans); color:var(--color-text-auxiliary) }
.grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px;
}
.card {
  background:var(--color-bg-card); border:1px solid var(--color-divider-base-1); border-radius:var(--radius-12);
  overflow:hidden; cursor:pointer; transition:all 200ms var(--ease);
  display:flex; flex-direction:column;
}
.card:hover {
  border-color:var(--color-primary-normal); box-shadow:var(--shadow-3);
  transform:translateY(-2px);
}
.card-thumb {
  position:relative; height:160px; background:var(--color-base-bg); overflow:hidden;
}
.card-thumb iframe {
  border:0; width:240%; height:384px;
  transform:scale(0.42); transform-origin:top left; pointer-events:none;
}
.card-thumb .ph {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--text-quaternary); font:400 12px/1.4 var(--font-sans);
}
.card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px }
.card-title { display:flex; align-items:baseline; justify-content:space-between; gap:8px }
.card-title .en { font:600 15px/1.3 var(--font-sans); color:var(--color-text-primary) }
.card-title .cn { font:400 12px/1.4 var(--font-sans); color:var(--color-text-auxiliary) }
.card-title .arrow { color:var(--text-quaternary); transition:transform 200ms var(--ease) }
.card:hover .card-title .arrow { transform:translateX(2px); color:var(--color-primary-normal) }
.card-summary {
  font:400 12px/1.55 var(--font-sans); color:var(--color-text-secondary);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ===== Detail page ===== */
.detail { display:flex; flex-direction:column; padding:0 0 80px }

.detail-hero {
  padding:36px 56px 28px; border-bottom:1px solid var(--color-divider-base-1);
  background:linear-gradient(180deg, var(--color-base-bg) 0%, var(--color-bg-card) 100%);
}
.detail-hero .eyebrow {
  display:inline-flex; align-items:center; gap:6px; margin-bottom:10px;
  padding:3px 10px; background:var(--color-primary-bg); color:var(--color-primary-normal);
  border-radius:9999px; font:500 11px/1.4 var(--font-sans); letter-spacing:0.04em;
}
.detail-hero h1 {
  margin:0; font:600 36px/1.2 var(--font-sans);
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
.detail-hero h1 .cn { color:var(--color-text-auxiliary); font:400 18px/1.3 var(--font-sans) }
.detail-hero .summary {
  margin:14px 0 0; max-width:780px;
  font:400 15px/1.7 var(--font-sans); color:var(--color-text-secondary);
}
.detail-hero .meta { margin-top:22px; display:flex; flex-wrap:wrap; gap:10px }
.meta-chip {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--color-bg-card); border:1px solid var(--color-divider-base-1);
  padding:6px 12px; border-radius:9999px;
  font:500 12px/1 var(--font-mono); color:var(--color-text-secondary);
}
.meta-chip strong { color:var(--color-text-auxiliary); font:600 11px/1 var(--font-sans); letter-spacing:0.04em }
.copy-skill-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:var(--radius-4);
  background:var(--color-primary-normal); color:var(--color-text-constant-normal); border:none;
  font:500 13px/1 var(--font-sans); cursor:pointer;
  transition:background 160ms;
}
.copy-skill-btn:hover { background:var(--color-primary-hover) }
.copy-skill-btn.copied { background:var(--color-success-normal) }

.detail-body {
  display:grid; grid-template-columns:minmax(0, 1fr) 240px; gap:48px;
  padding:40px 56px 0;
}
.section { margin-bottom:48px; scroll-margin-top:80px }
.section h2 {
  margin:0 0 16px; font:600 20px/1.4 var(--font-sans);
  letter-spacing:-0.01em; padding-bottom:10px; border-bottom:1px solid var(--color-divider-base-1);
}
.section h2 .anchor {
  margin-left:8px; opacity:0; transition:opacity 120ms;
  color:var(--text-quaternary); font:400 16px/1 var(--font-mono);
}
.section h2:hover .anchor { opacity:1 }

/* preview frame */
.preview-frame {
  background:var(--color-bg-card); border:1px solid var(--color-divider-base-1);
  border-radius:var(--radius-12); overflow:hidden; box-shadow:var(--shadow-1);
}
.preview-stage {
  background:repeating-linear-gradient(45deg, var(--color-base-bg), var(--color-base-bg) 10px, var(--color-bg-card) 10px, var(--color-bg-card) 20px);
  background-size:auto; padding:24px; min-height:480px;
  display:flex; align-items:flex-start; justify-content:center;
  transition:padding 200ms var(--ease);
}
.preview-stage iframe {
  border:0; background:var(--color-bg-card); border-radius:var(--radius-8);
  box-shadow:var(--shadow-2); width:100%; max-width:1280px; height:auto; min-height:480px;
}

/* api table */
.api {
  width:100%; border-collapse:collapse; background:var(--color-bg-card);
  border:1px solid var(--color-divider-base-1); border-radius:var(--radius-12); overflow:hidden;
}
.api th, .api td {
  padding:12px 16px; text-align:left; font:400 13px/1.6 var(--font-sans);
  border-bottom:1px solid var(--color-divider-base-1); vertical-align:top;
}
.api thead th {
  background:var(--color-base-bg); font:600 12px/1.4 var(--font-sans);
  color:var(--color-text-auxiliary); letter-spacing:0.04em; text-transform:uppercase;
}
.api tbody tr:last-child td { border-bottom:none }
.api tbody tr:hover { background:var(--color-base-bg) }
.api td.name code {
  font:600 13px/1.4 var(--font-mono); color:var(--color-text-primary);
  background:transparent; padding:0;
}
.api td.type code {
  font:400 12px/1.5 var(--font-mono); color:var(--color-primary-normal);
  background:var(--color-primary-bg); padding:2px 6px; border-radius:var(--radius-4);
  display:inline-block;
}
.api td.def code {
  font:400 12px/1.5 var(--font-mono); color:var(--color-text-secondary);
  background:var(--color-base-bg); padding:2px 6px; border-radius:var(--radius-4);
}
.api td.desc { color:var(--color-text-secondary) }

/* tokens */
.tokens-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px }
.token-row {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; border:1px solid var(--color-divider-base-1); border-radius:var(--radius-8);
  background:var(--color-bg-card); cursor:pointer; transition:all 160ms var(--ease);
}
.token-row:hover { border-color:var(--color-primary-normal); background:var(--color-primary-bg) }
.swatch {
  width:32px; height:32px; border-radius:var(--radius-6); flex-shrink:0;
  border:1px solid var(--color-divider-base-1); background-clip:padding-box;
}
.token-info { flex:1; min-width:0 }
.token-name {
  font:600 12px/1.3 var(--font-mono); color:var(--color-text-primary);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.token-value { font:400 11px/1.3 var(--font-mono); color:var(--color-text-auxiliary) }
.token-action { color:var(--text-quaternary); transition:color 160ms }
.token-row:hover .token-action { color:var(--color-primary-normal) }

/* code block */
.code {
  background:var(--surface-code-bg); color:var(--surface-code-fg); border-radius:var(--radius-12);
  padding:16px 20px; font:400 13px/1.7 var(--font-mono); overflow-x:auto;
  position:relative;
}
.code .k { color:#FFC857 }
.code .s { color:#A6E3A1 }
.code .c { color:#7C8492; font-style:italic }
.code-copy {
  position:absolute; top:10px; right:10px;
  background:var(--surface-code-btn-bg); color:var(--surface-code-fg); border:none;
  padding:5px 10px; border-radius:var(--radius-4);
  font:500 11px/1 var(--font-sans); cursor:pointer; transition:background 160ms;
  display:inline-flex; align-items:center; gap:4px;
}
.code-copy:hover { background:var(--surface-code-btn-bg-hover) }
.code-copy.copied { background:var(--color-primary-normal); color:var(--color-text-constant-normal) }

/* guidance card */
.guidance {
  display:flex; gap:14px; padding:16px 18px;
  background:linear-gradient(to right, var(--color-primary-bg), transparent 60%);
  border-left:3px solid var(--color-primary-normal);
  border-radius:var(--radius-8);
}
.guidance .ic { color:var(--color-primary-normal); flex-shrink:0; margin-top:2px }
.guidance .body { font:400 13px/1.7 var(--font-sans); color:var(--color-text-secondary) }
.guidance .body strong { color:var(--color-text-primary) }

/* on-this-page */
.on-this-page {
  position:sticky; top:calc(var(--header-h) + 24px); align-self:start;
  padding:16px 0;
}
.on-this-page .label {
  font:600 11px/1.4 var(--font-sans); color:var(--color-text-auxiliary);
  letter-spacing:0.06em; text-transform:uppercase; margin-bottom:8px;
}
.on-this-page a {
  display:block; padding:5px 10px; border-left:2px solid transparent;
  font:400 12px/1.5 var(--font-sans); color:var(--color-text-auxiliary);
  transition:all 120ms; cursor:pointer;
}
.on-this-page a:hover { color:var(--color-text-primary) }
.on-this-page a.active { color:var(--color-primary-normal); border-left-color:var(--color-primary-normal); font-weight:500 }

/* prev/next */
.pager {
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  margin:48px 56px 0; padding-top:32px; border-top:1px solid var(--color-divider-base-1);
}
.pager-card {
  display:flex; flex-direction:column; gap:4px; padding:14px 16px;
  border:1px solid var(--color-divider-base-1); border-radius:var(--radius-10);
  background:var(--color-bg-card); cursor:pointer; transition:all 200ms var(--ease);
}
.pager-card:hover { border-color:var(--color-primary-normal); box-shadow:var(--shadow-2); transform:translateY(-1px) }
.pager-card.next { text-align:right }
.pager-card .label { font:400 12px/1 var(--font-sans); color:var(--color-text-auxiliary) }
.pager-card .name { font:600 14px/1.4 var(--font-sans); color:var(--color-text-primary) }

/* ===== Command palette (Cmd+K) ===== */
.kbar-overlay {
  position:fixed; inset:0; z-index:100; background:var(--surface-mask);
  backdrop-filter:blur(4px); display:none; align-items:flex-start; justify-content:center;
  padding:88px 16px 16px;
  animation:fadeIn 200ms var(--ease);
}
.kbar-overlay.open { display:flex }
.kbar {
  width:100%; max-width:640px; background:var(--color-bg-card);
  border-radius:var(--radius-12); box-shadow:var(--shadow-4); overflow:hidden;
  display:flex; flex-direction:column; max-height:540px;
}
.kbar-input {
  display:flex; align-items:center; gap:12px; padding:16px 20px;
  border-bottom:1px solid var(--color-divider-base-1);
}
.kbar-input input {
  flex:1; border:0; outline:0; background:transparent;
  font:400 16px/1.4 var(--font-sans); color:var(--color-text-primary);
}
.kbar-input .esc {
  padding:3px 8px; background:var(--color-base-hover);
  border-radius:4px; font:500 11px/1.4 var(--font-mono); color:var(--color-text-auxiliary);
}
.kbar-list { flex:1; overflow-y:auto; padding:8px }
.kbar-section-title {
  padding:8px 12px 4px; font:600 11px/1.4 var(--font-sans);
  color:var(--color-text-auxiliary); letter-spacing:0.06em; text-transform:uppercase;
}
.kbar-item {
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  border-radius:var(--radius-6); cursor:pointer;
  transition:background 120ms;
}
.kbar-item.active { background:var(--color-primary-bg) }
.kbar-item .ic {
  width:28px; height:28px; border-radius:6px; flex-shrink:0;
  background:var(--color-base-bg); color:var(--color-text-auxiliary);
  display:inline-flex; align-items:center; justify-content:center;
}
.kbar-item.active .ic { background:var(--color-primary-normal); color:var(--color-text-constant-normal) }
.kbar-item .info { flex:1; min-width:0 }
.kbar-item .info .nm {
  font:600 14px/1.4 var(--font-sans); color:var(--color-text-primary);
  display:flex; gap:6px; align-items:baseline;
}
.kbar-item .info .nm .cn { font:400 12px/1.4 var(--font-sans); color:var(--color-text-auxiliary) }
.kbar-item .info .meta { font:400 11px/1.4 var(--font-sans); color:var(--color-text-auxiliary) }
.kbar-item .arrow { color:var(--text-quaternary); opacity:0; transition:opacity 120ms }
.kbar-item.active .arrow { opacity:1; color:var(--color-primary-normal) }
.kbar-empty { padding:48px; text-align:center; color:var(--color-text-auxiliary); font:400 13px/1.4 var(--font-sans) }
.kbar-footer {
  padding:8px 16px; border-top:1px solid var(--color-divider-base-1);
  display:flex; gap:14px; font:400 11px/1.4 var(--font-sans); color:var(--color-text-auxiliary);
}
.kbar-footer .kbd {
  display:inline-block; padding:2px 6px; background:var(--color-base-hover);
  border-radius:4px; font:500 10px/1.2 var(--font-mono); color:var(--color-text-secondary);
  margin-right:4px;
}

/* ===== Toast ===== */
.toast {
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  background:var(--surface-toast-bg); color:var(--surface-toast-fg); padding:11px 18px;
  border-radius:var(--radius-8); font:500 13px/1.4 var(--font-mono);
  box-shadow:var(--shadow-4); z-index:200;
  display:none; align-items:center; gap:8px; max-width:80vw;
  animation:fadeUp 220ms var(--ease);
}
.toast.show { display:inline-flex }

@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes fadeUp { from{opacity:0;transform:translate(-50%,8px)} to{opacity:1;transform:translate(-50%,0)} }

/* ===== responsive ===== */
@media (max-width: 1180px) {
  .detail-body { grid-template-columns:1fr; padding:32px 32px 0 }
  .on-this-page { display:none }
  .pager { margin:48px 32px 0 }
  .detail-hero { padding:32px 32px 24px }
  .hero { padding:40px 32px 32px }
  .overview { padding:24px 32px 64px }
}
@media (max-width: 880px) {
  .shell { grid-template-columns:1fr }
  .sidebar {
    position:fixed; top:0; left:0; width:280px; z-index:80;
    transform:translateX(-100%); transition:transform 240ms var(--ease);
    box-shadow:var(--shadow-3);
  }
  .sidebar.open { transform:translateX(0) }
  .sidebar-mask { position:fixed; inset:0; background:var(--surface-mask); z-index:70; display:none }
  .sidebar-mask.open { display:block }
  .menu-toggle { display:inline-flex !important }
}
.menu-toggle { display:none }

/* ===== Skill / Guide pages ===== */
.skill-body { padding:32px 40px 80px; max-width:1100px }
.skill-layout { display:grid; grid-template-columns:200px 1fr; gap:0; min-height:calc(100vh - var(--header-h)) }
.skill-sidenav {
  position:sticky; top:var(--header-h); align-self:start; height:calc(100vh - var(--header-h));
  overflow-y:auto; padding:16px 0; border-right:1px solid var(--color-divider-base-1);
  background:var(--color-base-bg); scrollbar-width:thin; scrollbar-color:var(--gray-200) transparent;
}
.skill-sidenav::-webkit-scrollbar{width:4px}
.skill-sidenav::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}
.snav-sec { padding:4px 12px 2px; font:600 10px/1 var(--font-sans); color:var(--gray-400);
  text-transform:uppercase; letter-spacing:.08em; margin-top:14px }
.snav-sec:first-child { margin-top:4px }
.snav-link { display:block; padding:6px 14px; border-radius:var(--radius-6); margin:1px 8px;
  font:400 12.5px/1.4 var(--font-sans); color:var(--color-text-secondary); cursor:pointer;
  transition:all 120ms var(--ease) }
.snav-link:hover { background:var(--color-bg-card); color:var(--color-text-primary) }
.snav-link.on { background:var(--color-primary-bg); color:var(--color-primary-normal); font-weight:500 }

.skill-main { padding:32px 40px 80px; overflow-y:auto }
.sk { margin-bottom:40px; scroll-margin-top:80px }
.sk-title { font:700 19px/1.2 var(--font-sans); color:var(--color-text-primary); padding-bottom:12px;
  border-bottom:1px solid var(--color-divider-base-1); margin-bottom:16px;
  display:flex; align-items:center; gap:10px }
.sk-title .badge { font:500 10px/1 var(--font-sans); padding:3px 8px; border-radius:var(--radius-4);
  background:var(--color-primary-bg); color:var(--color-primary-normal) }
.sk-sub { font:600 14px/1.4 var(--font-sans); color:var(--color-text-primary); margin:18px 0 10px;
  display:flex; align-items:center; gap:8px }
.sk-sub::before { content:''; width:3px; height:13px; background:var(--color-primary-normal); border-radius:2px; flex:none }

.sk-swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin:10px 0 }
.sk-sw { border:1px solid var(--color-divider-base-1); border-radius:var(--radius-8); overflow:hidden; background:var(--color-bg-card) }
.sk-sw-color { height:36px }
.sk-sw-info { padding:6px 9px }
.sk-sw-name { font:500 11px/1.3 var(--font-mono); color:var(--color-text-secondary) }
.sk-sw-desc { font:400 10.5px/1.3 var(--font-sans); color:var(--color-text-auxiliary); margin-top:2px }

.sk-tbl { width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0 }
.sk-tbl th { background:var(--color-base-bg); font:600 11px/1.4 var(--font-sans); color:var(--color-text-auxiliary);
  text-transform:uppercase; letter-spacing:.04em; padding:8px 12px; border-bottom:1px solid var(--color-border-base); text-align:left }
.sk-tbl td { padding:8px 12px; border-bottom:1px solid var(--color-divider-base-1); vertical-align:top; color:var(--color-text-secondary); line-height:1.5 }
.sk-tbl tr:last-child td { border-bottom:none }
.sk-tbl tr:hover td { background:var(--color-base-bg) }

.sk-callout { display:flex; gap:10px; border-radius:var(--radius-8); padding:12px 14px; font-size:12.5px; line-height:1.65; margin:10px 0 }
.sk-callout svg { flex:none; margin-top:1px }
.sk-callout.tip { background:var(--color-primary-bg); border:1px solid var(--callout-tip-border); color:var(--callout-tip-fg) }
.sk-callout.ok  { background:var(--color-primary-bg); border:1px solid var(--brand-100); color:var(--brand-600) }
.sk-callout.warn{ background:var(--callout-warn-bg); border:1px solid var(--callout-warn-border); color:var(--callout-warn-fg) }

.sk-copy-wrap { position:relative; margin:10px 0 }
.sk-cpbtn { position:absolute; top:8px; right:8px; background:var(--surface-code-btn-bg);
  border:1px solid var(--surface-code-btn-bg-hover); color:var(--surface-code-fg); border-radius:var(--radius-4);
  padding:4px 9px; font:500 11px/1.4 var(--font-sans); cursor:pointer; transition:all 160ms }
.sk-cpbtn:hover { background:var(--surface-code-btn-bg-hover); color:var(--surface-code-fg) }
.sk-cpbtn.ok { background:var(--brand-500); border-color:var(--brand-500); color:var(--color-text-constant-normal) }

.sk-patterns { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px }
.sk-pattern { border:1px solid var(--brand-100); border-radius:var(--radius-8); overflow:hidden }
.sk-pattern-head { padding:9px 14px; background:var(--color-primary-bg); font:600 12.5px/1 var(--font-sans); color:var(--color-primary-normal) }
.sk-pattern-body { padding:12px 14px; font:400 12px/1.85 var(--font-sans); color:var(--color-text-secondary); background:var(--color-bg-card) }

.sk-principles { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px }
.sk-principle { border:1px solid var(--color-divider-base-1); border-radius:var(--radius-8); padding:15px; background:var(--color-bg-card) }
.sk-principle-title { font:700 12.5px/1 var(--font-sans); color:var(--color-primary-normal); margin-bottom:7px }

/* Guide page */
.guide-body { padding:32px 48px 80px; max-width:760px }
.guide-section { margin-bottom:44px; scroll-margin-top:80px }
.guide-section-title { font:700 19px/1.2 var(--font-sans); color:var(--color-text-primary); margin-bottom:16px;
  padding-bottom:12px; border-bottom:1px solid var(--color-divider-base-1) }
.guide-cards3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0 }
.guide-card { border:1px solid var(--color-divider-base-1); border-radius:var(--radius-8); padding:15px; background:var(--color-bg-card); text-align:center }
.guide-card .icon { font-size:26px; margin-bottom:9px }
.guide-card .label { font:600 12.5px/1.4 var(--font-sans); margin-bottom:5px }
.guide-card .desc { font:400 11.5px/1.6 var(--font-sans); color:var(--color-text-auxiliary) }

.guide-tool-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px }
.guide-ttab { padding:6px 13px; border:1px solid var(--color-border-base); border-radius:var(--radius-4);
  font:500 12.5px/1 var(--font-sans); color:var(--color-text-secondary); cursor:pointer;
  transition:all 140ms; background:var(--color-bg-card) }
.guide-ttab:hover { border-color:var(--color-primary-normal); color:var(--color-primary-normal) }
.guide-ttab.on { background:var(--color-primary-normal); color:var(--color-text-constant-normal); border-color:var(--color-primary-normal) }
.guide-tpanel { display:none }
.guide-tpanel.on { display:block }

.guide-step-list { display:flex; flex-direction:column }
.guide-step { display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--color-divider-base-1) }
.guide-step:last-child { border-bottom:none; padding-bottom:0 }
.guide-step-num { width:22px; height:22px; border-radius:50%; background:var(--color-primary-normal); color:var(--color-text-constant-normal);
  font:700 11px/22px var(--font-sans); text-align:center; flex:none; margin-top:2px }
.guide-step-body h4 { font:600 13.5px/1.4 var(--font-sans); margin:0 0 5px; color:var(--color-text-primary) }
.guide-step-body p { font:400 12.5px/1.65 var(--font-sans); color:var(--color-text-secondary); margin:0 }

.guide-cmp { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0 }
.guide-cmp-bad { border:1px solid var(--callout-bad-border); border-radius:var(--radius-8); overflow:hidden }
.guide-cmp-good { border:1px solid var(--brand-100); border-radius:var(--radius-8); overflow:hidden }
.guide-cmp-head { padding:7px 13px; font:600 11.5px/1 var(--font-sans); display:flex; align-items:center; gap:5px }
.guide-cmp-bad .guide-cmp-head { background:var(--callout-bad-bg); color:var(--callout-bad-fg) }
.guide-cmp-good .guide-cmp-head { background:var(--color-primary-bg); color:var(--color-primary-normal) }
.guide-cmp-body { padding:11px 13px; font:400 12.5px/1.7 var(--font-sans); color:var(--color-text-secondary); background:var(--color-bg-card) }

.guide-case { border:1px solid var(--color-divider-base-1); border-radius:var(--radius-10); overflow:hidden; margin-bottom:14px }
.guide-case-head { padding:11px 18px; background:var(--color-primary-bg); border-bottom:1px solid var(--brand-100);
  display:flex; align-items:center; gap:10px }
.guide-case-type { padding:3px 9px; border-radius:var(--radius-4); font:600 11px/1 var(--font-sans); background:var(--color-primary-normal); color:var(--color-text-constant-normal); flex:none }
.guide-case-title { font:600 13.5px/1.4 var(--font-sans) }
.guide-case-sub { font:400 11.5px/1 var(--font-sans); color:var(--color-text-auxiliary) }
.guide-case-cols { display:grid; grid-template-columns:1fr 1fr }
.guide-case-col { padding:14px 18px }
.guide-case-col + .guide-case-col { border-left:1px solid var(--color-divider-base-1) }
.guide-case-col h4 { font:600 10.5px/1 var(--font-sans); color:var(--color-text-auxiliary); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px }
.guide-case-col pre { font-size:11.5px; padding:11px 13px; margin:0; border-radius:var(--radius-8); background:var(--surface-code-bg); color:var(--surface-code-fg) }

.guide-tips { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px }
.guide-tip-card { border:1px solid var(--color-divider-base-1); border-radius:var(--radius-10); overflow:hidden; background:var(--color-bg-card) }
.guide-tip-head { padding:10px 16px; background:var(--color-base-bg); border-bottom:1px solid var(--color-divider-base-1);
  font:600 12.5px/1.4 var(--font-sans); color:var(--color-text-primary) }
.guide-tip-body { padding:14px 16px }

.guide-faq-item { border-bottom:1px solid var(--color-divider-base-1) }
.guide-faq-item:last-child { border-bottom:none }
.guide-faq-q { padding:13px 0; font:600 13.5px/1.4 var(--font-sans); color:var(--color-text-primary);
  cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; user-select:none }
.guide-faq-q svg { flex:none; transition:transform 200ms; color:var(--color-text-auxiliary) }
.guide-faq-item.open .guide-faq-q svg { transform:rotate(45deg); color:var(--color-primary-normal) }
.guide-faq-a { padding-bottom:13px; font:400 12.5px/1.75 var(--font-sans); color:var(--color-text-secondary); display:none }
.guide-faq-item.open .guide-faq-a { display:block }

.tmpl-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 }
.tmpl-field { border:1px solid var(--color-border-base); border-radius:var(--radius-8); overflow:hidden }
.tmpl-field-head { padding:7px 11px; background:var(--color-base-bg); border-bottom:1px solid var(--color-divider-base-1);
  font:600 11.5px/1 var(--font-sans); color:var(--color-text-secondary); display:flex; gap:5px; align-items:center }
.tmpl-field-body { padding:9px 11px; font:400 12px/1.7 var(--font-sans); color:var(--color-text-secondary) }
.req-tag { color:var(--color-error-normal); font:700 10px/1 var(--font-sans) }

/* sidebar shortcut pills for skill/guide */
.skill-entry { display:flex; gap:6px; padding:10px 12px 6px; flex-direction:column }
.skill-pill {
  display:flex; align-items:center; gap:8px; padding:7px 10px;
  border:1px solid var(--color-border-base); border-radius:var(--radius-6);
  background:var(--color-bg-card); color:var(--color-text-secondary); font:500 12.5px/1 var(--font-sans);
  cursor:pointer; transition:all 140ms var(--ease);
}
.skill-pill:hover { border-color:var(--color-primary-normal); color:var(--color-primary-normal); background:var(--color-primary-bg) }
.skill-pill.on { background:var(--color-primary-normal); color:var(--color-text-constant-normal); border-color:var(--color-primary-normal) }
.skill-pill svg { flex:none }

/* ===== Theme switcher (Segmented，Light / Dark / 系统) ===== */
.theme-seg {
  display:inline-flex; align-items:center; gap:2px; padding:3px;
  background:var(--color-base-hover); border-radius:var(--radius-8);
  height:32px;
}
.theme-seg-btn {
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:26px; padding:0; border:0; background:transparent;
  border-radius:var(--radius-6); color:var(--color-text-auxiliary);
  cursor:pointer; transition:all 160ms var(--ease);
}
.theme-seg-btn:hover:not(.on) { color:var(--color-text-primary) }
.theme-seg-btn.on {
  background:var(--color-bg-card); color:var(--color-primary-normal); box-shadow:var(--shadow-1);
}
.theme-seg-btn svg { width:15px; height:15px }
@media (max-width: 880px) {
  .theme-seg-btn { width:28px }
}
</style>
</head>
